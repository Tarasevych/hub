/* ── einde gegenereerd blok ── */
/* stijl/basis.css */
/* basis.css — скидання, типографіка, ритм, сітка, щільність. Кольори — лише var(--…) із блока токенів (hv-tokens.json).
   Уся адаптивність полотна — контейнерними запитами (@container doek …): профілі пульта не залежать від ширини вікна. */

/* ── Сторінка макета (поза полотном) ── */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--mq-bg);
  color: var(--mq-tekst);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.mq-wortel, .mq-wortel *, .mq-wortel *::before, .mq-wortel *::after { box-sizing: border-box; }
:where(.mq-wortel) :where(button, select, input) { font: inherit; color: inherit; }
:where(.mq-wortel) :where(button) { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:where(.mq-wortel) :where(svg) { display: block; flex: none; }

/* ── Полотно: корінь продукту ── */
.hv-doek {
  /* ритм платформи (src/ontwerp/tokens.css): без кольорів, тому тут */
  --ruimte-1: 4px; --ruimte-2: 8px; --ruimte-3: 12px; --ruimte-4: 16px; --ruimte-5: 24px; --ruimte-6: 32px;
  --straal-s: 10px; --straal-m: 14px; --straal-l: 20px; --straal-xl: 26px;
  --tekst-basis: 16px; --tekst-klein: 14px; --tekst-mini: 12px;
  --hv-kop-h: var(--hv-kop-hoogte-telefoon);
  --hv-onder-h: var(--hv-onderbalk-hoogte);

  position: relative;
  overflow: hidden;
  isolation: isolate;
  container-type: size;
  container-name: doek;
  transform-origin: 0 0;
  background: var(--bg);
  color: var(--text);
  font-size: var(--tekst-basis);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  text-align: start;
}
:where(.hv-doek) :where(h1, h2, h3, p, ul, ol, dl, dd, figure) { margin: 0; padding: 0; }
:where(.hv-doek) :where(ul, ol) { list-style: none; }
:where(.hv-doek) :where(button) { background: none; border: 0; padding: 0; margin: 0; text-align: inherit; }
.hv-doek :focus { outline: none; }
.hv-doek [tabindex="-1"]:focus-visible { outline: none; }
.hv-doek :focus-visible { outline: var(--hv-focus-rand) solid var(--focus); outline-offset: var(--hv-focus-afstand); }
.hv-doek [aria-disabled="true"] { cursor: not-allowed; }
.hv-doek code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }

/* ── Iconen ── */
.hv-ic { inline-size: var(--hv-icoon-m); block-size: var(--hv-icoon-m); fill: none; stroke: currentColor; stroke-width: var(--hv-icoon-streep); stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hv-ic--s { inline-size: var(--hv-icoon-s); block-size: var(--hv-icoon-s); }
.hv-ic--l { inline-size: var(--hv-icoon-l); block-size: var(--hv-icoon-l); }
.hv-ic--xl { inline-size: var(--hv-icoon-xl); block-size: var(--hv-icoon-xl); }
.hv-ic--maker { inline-size: var(--hv-maker); block-size: var(--hv-maker); stroke-width: var(--hv-maker-streep); }
.hv-ic--merk { inline-size: var(--hv-merk); block-size: var(--hv-merk); stroke-width: 1.5; }
.hv-ic--risico { inline-size: var(--hv-risico-merk); block-size: var(--hv-risico-merk); }
.hv-ic--vol .hv-ic__vlak { fill: currentColor; stroke: none; }
.hv-ic--vol .hv-ic__glyph { stroke: var(--text-on-vlak); stroke-width: 2.4; fill: none; }

/* ── Kleine hulpklassen ── */
.hv-vo { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.hv-punt { color: var(--muted); padding-inline: 0.15em; }
.hv-naar { color: var(--muted); }
.hv-maat { white-space: nowrap; }
.hv-maat__eenheid { font-size: max(0.5em, var(--tekst-mini)); font-weight: 500; color: var(--muted); letter-spacing: 0; }
.hv-tekst { font-size: var(--tekst-klein); display: flex; gap: var(--ruimte-2); align-items: flex-start; }
.hv-tekst .hv-ic { margin-block-start: 2px; }
.hv-tekst--zacht { color: var(--muted); }
.hv-link { display: inline-flex; align-items: center; min-block-size: var(--hv-tik); font-size: var(--tekst-klein); font-weight: 600; color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
.hv-later { display: inline-flex; align-items: center; gap: var(--ruimte-1); padding: 2px var(--ruimte-2); border: var(--hv-streep) dashed var(--hv-omtrek); border-radius: 999px; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); vertical-align: middle; white-space: nowrap; }

/* ── Tonen: пара «тон / м'яка підкладка» для знака, рівня, чипа й ряду графіка ── */
.hv-doek .hv-toon-aan { --toon: var(--hv-aan); --toon-zacht: var(--hv-aan-zacht); --teken-vlak: var(--hv-aan-vlak); --teken-icoon: var(--hv-op-aan); --niveau: var(--hv-aan-vlak); }
.hv-doek .hv-toon-warm { --toon: var(--hv-warm); --toon-zacht: var(--hv-warm-zacht); --teken-vlak: var(--hv-warm-zacht); --teken-icoon: var(--hv-warm); --niveau: var(--hv-warm); }
.hv-doek .hv-toon-koud { --toon: var(--hv-koud); --toon-zacht: var(--hv-koud-zacht); --teken-vlak: var(--hv-koud-zacht); --teken-icoon: var(--hv-koud); --niveau: var(--hv-koud); }
.hv-doek .hv-toon-zon { --toon: var(--hv-zon); --toon-zacht: var(--hv-zon-zacht); --teken-vlak: var(--hv-zon-zacht); --teken-icoon: var(--hv-zon); --niveau: var(--hv-zon); }
.hv-doek .hv-toon-net-in { --toon: var(--hv-net-in); --toon-zacht: var(--hv-net-in-zacht); --teken-vlak: var(--hv-net-in-zacht); --teken-icoon: var(--hv-net-in); --niveau: var(--hv-net-in); }
.hv-doek .hv-toon-net-uit { --toon: var(--hv-net-uit); --toon-zacht: var(--hv-net-uit-zacht); --teken-vlak: var(--hv-net-uit-zacht); --teken-icoon: var(--hv-net-uit); --niveau: var(--hv-net-uit); }
.hv-doek .hv-toon-batterij { --toon: var(--hv-batterij); --toon-zacht: var(--hv-batterij-zacht); --teken-vlak: var(--hv-batterij-zacht); --teken-icoon: var(--hv-batterij); --niveau: var(--hv-batterij); }
.hv-doek .hv-toon-auto { --toon: var(--hv-auto); --toon-zacht: var(--hv-auto-zacht); --teken-vlak: var(--hv-auto-zacht); --teken-icoon: var(--hv-auto); --niveau: var(--hv-auto); }
.hv-doek .hv-toon-neutraal { --toon: var(--text); --toon-zacht: var(--surface); --teken-vlak: var(--surface2); --teken-icoon: var(--text); --niveau: var(--text); }
.hv-doek .hv-toon-ok, .hv-doek .hv-toon-rust { --toon: var(--ok); --toon-zacht: var(--ok-zacht); --teken-vlak: var(--ok-zacht); --teken-icoon: var(--ok); }
.hv-doek .hv-toon-let-op { --toon: var(--warn); --toon-zacht: var(--warn-zacht); --teken-vlak: var(--panel); --teken-icoon: var(--warn); }
.hv-doek .hv-toon-alarm { --toon: var(--fout); --toon-zacht: var(--fout-zacht); --teken-vlak: var(--fout-zacht); --teken-icoon: var(--fout); }
.hv-doek .hv-toon-sim { --toon: var(--info); --toon-zacht: var(--info-zacht); --teken-vlak: var(--info-zacht); --teken-icoon: var(--info); }
.hv-doek .hv-toon-oud { --toon: var(--muted); --toon-zacht: var(--surface); }

/* ── Knoppen ── */
.hv-knop {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ruimte-2);
  min-block-size: var(--hv-tik); padding: 0 var(--ruimte-4);
  border: 1px solid var(--line); border-radius: var(--straal-m);
  background: var(--panel); color: var(--text);
  font-size: var(--tekst-klein); font-weight: 600; line-height: 1.2; text-align: center;
  transition: background var(--hv-duur-1), transform var(--hv-duur-1);
}
.hv-knop--hoofd { background: var(--accent); border-color: var(--accent); color: var(--accentText); }
.hv-knop--stil { background: transparent; border-color: transparent; padding-inline: var(--ruimte-2); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
.hv-knop--klein { padding-inline: var(--ruimte-3); }
.hv-knop--breed { inline-size: 100%; }
.hv-knop:active { transform: scale(0.98); background: var(--surface2); }
.hv-knop--hoofd:active { background: var(--accent); }
.hv-knop[aria-disabled="true"] { color: var(--muted); background: var(--surface); border-style: dashed; }
.hv-knop.is-aftel { border: 2px solid var(--text); }
.hv-knoppen { display: flex; flex-wrap: wrap; gap: var(--hv-doel-kier); margin-block-start: var(--ruimte-3); }
.hv-knoppen:first-child { margin-block-start: 0; }

.hv-icoonknop { position: relative; display: inline-grid; place-items: center; inline-size: var(--hv-tik); block-size: var(--hv-tik); border-radius: var(--straal-m); color: var(--text); flex: none; transition: background var(--hv-duur-1); }
.hv-icoonknop:active { background: var(--surface2); }
.hv-icoonknop__teller { position: absolute; inset-block-start: 4px; inset-inline-end: 2px; min-inline-size: 18px; block-size: 18px; padding-inline: 4px; display: grid; place-items: center; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: var(--tekst-mini); font-weight: 600; line-height: 1; }

.hv-stap { display: inline-grid; place-items: center; inline-size: var(--hv-tik); block-size: var(--hv-tik); border-radius: var(--straal-m); flex: none; position: relative; color: var(--text); }
.hv-stap::before { content: ""; position: absolute; inset: 4px; border-radius: var(--straal-s); background: var(--surface); border: 1px solid var(--line); transition: background var(--hv-duur-1); }
.hv-stap > * { position: relative; }
.hv-stap:active::before { background: var(--surface2); }
.hv-stapper { display: inline-flex; align-items: center; gap: var(--ruimte-1); }
.hv-stapper__getal { min-inline-size: 4.2em; text-align: center; font-weight: 600; font-size: var(--hv-getal-m); letter-spacing: -0.02em; line-height: 1; }

/* ── Папір: картка, рядки, поля ── */
.hv-kaart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); padding: var(--ruimte-4); min-inline-size: 0; }
.hv-kaart + .hv-kaart { margin-block-start: var(--hv-kier); }
.hv-kaart > * + .hv-grafiek, .hv-kaart > .hv-grafiek + *, .hv-kaart > .hv-getal + * { margin-block-start: var(--ruimte-4); }
.hv-kaart__titel { display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-2); font-size: var(--tekst-basis); font-weight: 600; margin-block-end: var(--ruimte-3); }
.hv-kaart--onbereikbaar { border: var(--hv-streep) dashed var(--hv-omtrek); box-shadow: none; }
.hv-stappen { list-style: decimal; padding-inline-start: 1.4em; margin-block: var(--ruimte-3); font-size: var(--tekst-klein); display: grid; gap: var(--ruimte-1); }

.hv-rijen { display: grid; }
.hv-rijen--kaart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); padding-inline: var(--ruimte-4); }
.hv-rij { display: flex; align-items: center; gap: var(--ruimte-3); min-block-size: var(--hv-tik); padding-block: var(--ruimte-2); inline-size: 100%; border-block-start: 1px solid var(--line); font-size: var(--tekst-klein); color: var(--text); }
.hv-rijen > .hv-rij:first-child { border-block-start: 0; }
.hv-rij__teken { color: var(--muted); display: grid; place-items: center; inline-size: 24px; flex: none; }
.hv-rij__naam { flex: 1 1 auto; min-inline-size: 0; font-weight: 600; display: grid; }
.hv-rij__sub { font-weight: 400; color: var(--muted); font-size: var(--tekst-mini); }
.hv-rij__waarde { flex: none; display: inline-flex; align-items: center; gap: var(--ruimte-1); font-weight: 600; text-align: end; }
.hv-rij__pijl { color: var(--muted); }
button.hv-rij:active { background: var(--surface2); }

.hv-veld { display: grid; gap: var(--ruimte-2); padding-block: var(--ruimte-3); border-block-start: 1px solid var(--line); }
.hv-veld__label { display: flex; align-items: center; gap: var(--ruimte-2); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }

.hv-getallen { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--ruimte-3); padding-block: var(--ruimte-3); border-block-start: 1px solid var(--line); }
.hv-getal { display: grid; gap: 2px; align-content: start; }
.hv-getal__label { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-getal__waarde { font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; white-space: nowrap; }
.hv-getal--xl .hv-getal__waarde { font-size: var(--hv-getal-xl); }
.hv-getal--l .hv-getal__waarde { font-size: var(--hv-getal-l); }
.hv-getal--m .hv-getal__waarde { font-size: var(--hv-getal-m); }
.hv-getal__sub { font-size: var(--tekst-mini); color: var(--muted); }

/* ── Tabel (текстовий відповідник графіка, розрізу) ── */
.hv-tabel__rol { overflow-x: auto; max-inline-size: 100%; }
.hv-tabel { border-collapse: collapse; inline-size: 100%; font-size: var(--tekst-klein); }
.hv-tabel th, .hv-tabel td { padding: var(--ruimte-2) var(--ruimte-3) var(--ruimte-2) 0; border-block-end: 1px solid var(--line); text-align: start; font-weight: 400; vertical-align: top; }
.hv-tabel thead th { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-tabel tbody th { font-weight: 600; }
.hv-tabel td { text-align: end; white-space: nowrap; }

@media (hover: hover) {
  .hv-knop:hover, .hv-icoonknop:hover, button.hv-rij:hover { background: var(--surface); }
  .hv-knop--hoofd:hover { background: var(--accent); filter: brightness(1.06); }
  .hv-knop--stil:hover { background: var(--surface); }
  .hv-stap:hover::before { background: var(--panel); }
}

/* stijl/schil.css */
/* schil.css — оболонка: пульт макета й сцена (поза полотном), скляна шапка, нижня панель, вкладки, сторінка. */

/* ───────────── Пульт і сцена (поза полотном; кольори --mq-*) ───────────── */
.mq-wortel {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  gap: 16px;
  block-size: 100vh; block-size: 100dvh;
  min-block-size: 480px;
  padding-block: 12px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
.mq-wortel.is-pult-dicht, .mq-wortel.is-smal { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.mq-pult { display: flex; flex-direction: column; gap: 12px; min-block-size: 0; overflow-y: auto; padding: 14px; background: var(--mq-vlak); border: 1px solid var(--mq-lijn); border-radius: 18px; scrollbar-width: thin; }
.is-pult-dicht .mq-pult { padding: 6px 6px 6px 14px; border-radius: 14px; overflow: visible; }
.is-smal:not(.is-pult-dicht) .mq-pult { max-block-size: 52dvh; }
.mq-pult__kop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mq-pult__merk { display: grid; line-height: 1.2; }
.is-pult-dicht .mq-pult__merk { display: flex; gap: 8px; align-items: baseline; }
.mq-pult__merk strong { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.mq-pult__merk span { font-size: 12px; color: var(--mq-zacht); }
.mq-pult__wissel { min-block-size: 36px; padding: 0 12px; border: 1px solid var(--mq-lijn); border-radius: 10px; background: var(--mq-bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.mq-pult__lijf { display: grid; gap: 12px; }
.is-smal .mq-pult__lijf { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.mq-veld { display: grid; gap: 5px; min-inline-size: 0; }
.mq-veld__label { font-size: 12px; font-weight: 600; color: var(--mq-zacht); }
.mq-keuze { display: flex; flex-wrap: wrap; gap: 4px; }
.mq-keuze__knop { flex: 1 1 auto; min-block-size: 34px; padding: 0 10px; border: 1px solid var(--mq-lijn); border-radius: 9px; background: var(--mq-bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.mq-keuze__knop.is-gekozen { background: var(--mq-tekst); border-color: var(--mq-tekst); color: var(--mq-vlak); font-weight: 600; }
.mq-lijst { inline-size: 100%; min-block-size: 36px; padding: 0 10px; border: 1px solid var(--mq-lijn); border-radius: 9px; background: var(--mq-bg); font-size: 13px; }
.mq-pult__noot { margin: 0; font-size: 12px; line-height: 1.4; color: var(--mq-zacht); }
.mq-pult :focus-visible, .mq-toneel :focus-visible { outline: 2px solid var(--mq-focus); outline-offset: 2px; }

.mq-toneel { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-inline-size: 0; min-block-size: 0; }
.mq-adres { display: flex; align-items: center; gap: 10px; min-block-size: 34px; padding: 4px 12px; background: var(--mq-vlak); border: 1px solid var(--mq-lijn); border-radius: 12px; font-size: 12px; min-inline-size: 0; }
.mq-adres__label { color: var(--mq-zacht); white-space: nowrap; flex: none; }
.mq-adres__pad { flex: 1 1 auto; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--mq-tekst); }
.mq-adres__maat { color: var(--mq-zacht); white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.is-smal .mq-adres__label { display: none; }
.mq-podium { display: grid; place-items: center; min-inline-size: 0; min-block-size: 0; overflow: hidden; }
.mq-schaal { position: relative; overflow: hidden; border-radius: 22px; box-shadow: var(--mq-schaduw); outline: 1px solid var(--mq-lijn); background: var(--mq-put); }
.is-venster .mq-schaal { border-radius: 16px; }

/* ───────────── Полотно: шари ───────────── */
.hv-inhoud { position: absolute; inset: 0; z-index: 1; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding-block: var(--hv-kop-h) calc(var(--hv-onder-h) + var(--ruimte-5)); scrollbar-width: thin; scrollbar-color: var(--hv-omtrek) transparent; }
.hv-pagina { inline-size: 100%; max-inline-size: 1560px; margin-inline: auto; padding: var(--ruimte-3) var(--hv-rand) var(--ruimte-5); display: grid; gap: var(--ruimte-4); align-content: start; min-inline-size: 0; }
.hv-pagina__lijf { min-inline-size: 0; }
.hv-spring { position: absolute; inset-block-start: 4px; inset-inline-start: 4px; z-index: 30; padding: var(--ruimte-2) var(--ruimte-3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-s); font-weight: 600; font-size: var(--tekst-klein); transform: translateY(-200%); }
.hv-spring:focus-visible { transform: none; }

/* ── Скляна шапка ── */
.hv-kop { position: absolute; inset-block-start: 0; inset-inline: 0; z-index: var(--hv-z-glas); block-size: var(--hv-kop-h); background: var(--hv-glas); -webkit-backdrop-filter: var(--hv-glas-filter); backdrop-filter: var(--hv-glas-filter); border-block-end: 1px solid var(--hv-glas-rand); transition: box-shadow var(--hv-duur-2); }
.is-gerold .hv-kop { box-shadow: var(--schaduw-2); }
.hv-kop__binnen { block-size: 100%; max-inline-size: 1560px; margin-inline: auto; padding-inline: var(--hv-rand); display: flex; align-items: center; gap: var(--ruimte-2); }
.hv-kop__huis { display: grid; align-content: center; min-block-size: var(--hv-tik); min-inline-size: 0; line-height: 1.15; flex: 0 1 auto; border-radius: var(--straal-s); }
.hv-kop__naam { font-weight: 650; font-size: var(--tekst-basis); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hv-kop__stand { display: inline-flex; align-items: center; gap: 2px; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-kop__zin { display: none; flex: 1 1 auto; min-inline-size: 0; font-size: var(--tekst-klein); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hv-kop__nav { display: none; align-items: stretch; align-self: stretch; gap: var(--ruimte-1); margin-inline-start: var(--ruimte-4); min-inline-size: 0; }
.hv-nav__punt { position: relative; display: inline-flex; align-items: center; gap: var(--ruimte-2); padding-inline: var(--ruimte-3); min-inline-size: var(--hv-tik); color: var(--muted); font-size: var(--tekst-klein); font-weight: 600; white-space: nowrap; border-radius: var(--straal-s); transition: color var(--hv-duur-1); }
.hv-nav__punt.is-actief { color: var(--text); }
.hv-nav__punt.is-actief::after { content: ""; position: absolute; inset-inline: var(--ruimte-3); inset-block-end: 0; block-size: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
.hv-kop__rechts { margin-inline-start: auto; display: flex; align-items: center; gap: var(--ruimte-1); flex: none; }
.hv-kop__opdracht { display: none; align-items: center; gap: var(--ruimte-2); min-block-size: var(--hv-tik); padding-inline: var(--ruimte-3) var(--ruimte-4); position: relative; isolation: isolate; font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-kop__opdracht::before { content: ""; position: absolute; inset: 4px 0; z-index: -1; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.hv-kop__risico { display: inline-flex; align-items: center; gap: 2px; min-block-size: var(--hv-tik); min-inline-size: var(--hv-tik); justify-content: center; font-weight: 600; font-size: var(--tekst-klein); color: var(--warn-vlak); }
.hv-kop__risico span { color: var(--text); }
.hv-kop__tandwiel { display: none; }
.hv-kop__tandwiel.is-actief { color: var(--text); background: var(--surface2); }

/* чипи стану в шапці: число й слово — на папері */
.hv-sim { display: inline-flex; align-items: center; gap: 4px; min-block-size: var(--hv-tik); padding-inline: var(--ruimte-3); position: relative; isolation: isolate; font-size: var(--tekst-mini); font-weight: 600; color: var(--info); white-space: nowrap; }
.hv-sim::before { content: ""; position: absolute; inset: calc((100% - 28px) / 2) 0; z-index: -1; border-radius: 999px; background: var(--info-zacht); }
.hv-sim .hv-punt { color: var(--info); }
.hv-versheid { display: inline-flex; align-items: center; gap: 6px; padding: 5px var(--ruimte-3); border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: var(--tekst-mini); font-weight: 600; white-space: nowrap; }
.hv-versheid__stip { inline-size: 8px; block-size: 8px; border-radius: 50%; background: var(--ok-vlak); }
.hv-versheid.is-geen { border: var(--hv-streep) dashed var(--hv-omtrek); color: var(--text); }
.hv-versheid.is-verversing { color: var(--muted); }

/* ── Нижня панель телефона й кнопка «Команда» ── */
.hv-onderbalk { position: absolute; inset-block-end: 0; inset-inline: 0; z-index: var(--hv-z-glas); background: var(--hv-glas); -webkit-backdrop-filter: var(--hv-glas-filter); backdrop-filter: var(--hv-glas-filter); border-block-start: 1px solid var(--hv-glas-rand); }
.hv-onderbalk__rij { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; block-size: var(--hv-onder-h); }
.hv-onderbalk__punt { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: var(--tekst-mini); font-weight: 600; line-height: 1.1; min-inline-size: 0; }
.hv-onderbalk__punt.is-actief { color: var(--text); }
.hv-onderbalk__punt.is-actief::before { content: ""; position: absolute; inset-block-start: 0; inset-inline: 30%; block-size: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
.hv-opdrachtknop { position: absolute; inset-inline-end: var(--hv-rand); inset-block-end: calc(100% + var(--hv-kier)); inline-size: var(--hv-opdracht-knop); block-size: var(--hv-opdracht-knop); display: grid; place-items: center; border-radius: var(--straal-m); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--schaduw-2); color: var(--text); transition: transform var(--hv-duur-1); }
.hv-opdrachtknop:active { transform: scale(0.96); background: var(--surface2); }

/* ── Заголовок сторінки й вкладки другого рівня (на небі: лише --text і --muted) ── */
.hv-pagina__kop { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-1) var(--ruimte-5); min-inline-size: 0; }
.hv-pagina__titel { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.hv-pagina__zin { font-size: var(--tekst-klein); color: var(--muted); font-weight: 500; }
.hv-terug { display: inline-flex; align-items: center; gap: var(--ruimte-1); min-block-size: var(--hv-tik); padding-inline-end: var(--ruimte-3); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); border-radius: var(--straal-s); }
.hv-tabs { display: flex; gap: var(--ruimte-1); min-inline-size: 0; max-inline-size: 100%; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--hv-rand) * -1); padding-inline: var(--hv-rand); }
.hv-tabs::-webkit-scrollbar { display: none; }
.hv-tab { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; min-block-size: var(--hv-tik); min-inline-size: var(--hv-tik); padding-inline: var(--ruimte-3); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); white-space: nowrap; flex: none; }
.hv-tab::before { content: ""; position: absolute; inset: calc((100% - var(--hv-chip-hoogte)) / 2) 0; z-index: -1; border-radius: 999px; transition: background var(--hv-duur-1); }
.hv-tab.is-actief { color: var(--text); }
.hv-tab.is-actief::before { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--schaduw-1); }

/* ── Смуга зв'язку під шапкою ── */
.hv-verbinding { display: flex; align-items: center; gap: var(--ruimte-2); padding: var(--ruimte-2) var(--ruimte-3); border-radius: var(--straal-m); background: var(--panel); border: var(--hv-streep) dashed var(--hv-omtrek); font-size: var(--tekst-klein); font-weight: 600; }
.hv-verbinding span { flex: 1 1 auto; min-inline-size: 0; }
.hv-verbinding.is-gestopt { border-style: solid; border-color: var(--warn); }

/* ── Заглушка «збирається» ── */
.hv-stomp { display: grid; gap: var(--ruimte-3); max-inline-size: 760px; }
.hv-stomp__kaart { display: flex; gap: var(--ruimte-4); padding: var(--ruimte-5); background: var(--panel); border: var(--hv-streep) dashed var(--hv-omtrek); border-radius: var(--straal-l); }
.hv-stomp__teken { inline-size: 48px; block-size: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--muted); flex: none; }
.hv-stomp__tekst { display: grid; gap: var(--ruimte-2); min-inline-size: 0; }
.hv-stomp__tekst h2 { font-size: var(--hv-tekst-kop); font-weight: 650; display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-2); }
.hv-stomp__tekst p { color: var(--muted); max-inline-size: 60ch; }
.hv-stomp__adres { font-size: var(--tekst-mini); }
.hv-stomp__delen { list-style: disc; padding-inline-start: 1.2em; color: var(--muted); font-size: var(--tekst-klein); }

/* ───────────── Адаптивність оболонки: контейнер, не вікно ───────────── */
@container doek (max-width: 429px) {
  /* вузький телефон: «крапка й колба»; слово лишається для зчитувача */
  .hv-kop .hv-versheid span:not(.hv-versheid__stip) { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
  .hv-kop .hv-versheid { padding: 5px; }
}
@container doek (max-width: 699px) {
  .hv-profiel-telefoon.is-gerold .hv-kop__zin, .hv-doek.is-gerold .hv-kop__zin { display: block; }
  .is-gerold .hv-kop__huis { display: none; }
  .hv-stomp__kaart { flex-direction: column; padding: var(--ruimte-4); }
}
@container doek (min-width: 700px) {
  /* контейнер не може стилізувати сам себе: змінні отримують його діти */
  .hv-doek:not(.is-speciaal) > * { --hv-kop-h: var(--hv-kop-hoogte); --hv-onder-h: 0px; }
  .hv-onderbalk { display: none; }
  .hv-kop__nav { display: flex; }
  .hv-kop__tandwiel { display: inline-grid; }
  .hv-kop__huis .hv-kop__stand { display: none; }
  .hv-kop__huis { min-inline-size: auto; }
  .hv-pagina { padding-block-start: var(--ruimte-4); }
}
@container doek (min-width: 700px) and (max-width: 1099px) {
  /* настінна панель: іконка над словом, як у нижній панелі телефона — шість розділів уміщаються поруч із чипами стану */
  .hv-nav__punt { flex-direction: column; justify-content: center; gap: 1px; padding-inline: 6px; min-inline-size: 60px; font-size: var(--tekst-mini); line-height: 1.1; }
  .hv-nav__punt.is-actief::after { inset-inline: 30%; }
  .hv-kop__nav { margin-inline-start: 0; gap: 0; flex: 1 1 auto; justify-content: flex-start; }
  .hv-kop__rechts { gap: 0; }
  .hv-kop__huis { display: none; }
  .hv-versheid span:not(.hv-versheid__stip) { display: none; }
  .hv-versheid { padding: 5px; }
  .hv-kop__opdracht { display: inline-flex; padding-inline: var(--ruimte-3); }
  .hv-kop__opdracht span { display: none; }
}
@container doek (min-width: 1100px) {
  .hv-kop__opdracht { display: inline-flex; }
  .hv-nav__punt .hv-ic { inline-size: 18px; block-size: 18px; }
}

/* спеціальні профілі: без шапки, навігації й прокручування */
.hv-doek.is-speciaal { --hv-kop-h: 0px; --hv-onder-h: 0px; }
.is-speciaal .hv-kop, .is-speciaal .hv-onderbalk, .is-speciaal .hv-spring { display: none; }
.is-speciaal .hv-inhoud { overflow: hidden; padding: 0; }
.is-speciaal .hv-pagina { block-size: 100%; max-inline-size: none; padding: 0; gap: 0; align-content: stretch; grid-template-rows: minmax(0, 1fr); }

@media (hover: hover) {
  .hv-nav__punt:hover, .hv-tab:hover, .hv-terug:hover, .hv-onderbalk__punt:hover { color: var(--text); }
  .mq-keuze__knop:hover:not(.is-gekozen), .mq-pult__wissel:hover { background: var(--mq-gekozen); }
}

/* stijl/onderdelen.css */
/* onderdelen.css — компоненти hv-* (§9 дизайн-мови). Форма кодує дію: коло перемикає, прямокутник веде вглиб,
   рейка з подвійною рамкою означає небезпеку. Стан — кольором, іконкою і словом. */

/* ── hv-chip: паперова пігулка; ціль дотику 44, видима висота 36 ── */
.hv-chip { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; min-block-size: var(--hv-chip-hoogte); padding-inline: var(--ruimte-3); font-size: var(--tekst-klein); font-weight: 600; color: var(--text); white-space: nowrap; flex: none; }
.hv-chip::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); transition: background var(--hv-duur-1); }
button.hv-chip { min-block-size: var(--hv-tik); }
button.hv-chip::before { inset: calc((100% - var(--hv-chip-hoogte)) / 2) 0; }
.hv-chip > .hv-ic { color: var(--muted); }
.hv-chip--toon::before { background: var(--toon-zacht); border-color: transparent; }
.hv-chip--toon > .hv-ic { color: var(--toon); }
.hv-chip__sub { font-weight: 500; color: var(--muted); font-size: var(--tekst-mini); }
.hv-chip--filter.is-gekozen::before { background: var(--surface2); border: 2px solid var(--text); }
.hv-chip.is-verouderd::before { border-style: dashed; border-color: var(--hv-omtrek); }
button.hv-chip:active::before { background: var(--surface2); }
.hv-filter { display: flex; flex-wrap: wrap; gap: 0 var(--hv-doel-kier); }
.hv-personen { display: inline-flex; }
.hv-persoon { inline-size: 22px; block-size: 22px; margin-inline-start: -6px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); border: 1.5px solid var(--panel); font-size: 11px; font-weight: 700; line-height: 1; }
.hv-persoon:first-child { margin-inline-start: 0; }
.hv-persoon.is-waarschijnlijk { border: 1.5px dashed var(--hv-omtrek); }

/* ── hv-maker, hv-stempel, hv-risico ── */
.hv-maker { display: inline-flex; align-items: center; gap: 4px; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); white-space: nowrap; }
.hv-stempel { display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-stempel__bron { display: inline-flex; align-items: center; gap: 4px; color: var(--info); }
.hv-stempel.is-verouderd .hv-stempel__oud, .hv-stempel.is-onbereikbaar .hv-stempel__oud { color: var(--text); font-weight: 700; }
.hv-risico { display: inline-flex; align-items: center; gap: 4px; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); white-space: nowrap; }
.hv-risico--gevaarlijk { color: var(--warn); }
.hv-risico--kritiek { color: var(--fout); }

/* ── hv-uitleg: «i» та «!» — квадрат 24 px, ціль 44; hv-gevolg — паперова картка-підказка ── */
.hv-uitleg { position: relative; display: inline-grid; place-items: center; inline-size: var(--hv-tik); block-size: var(--hv-tik); color: var(--muted); flex: none; vertical-align: middle; }
.hv-uitleg--uitroep { color: var(--text); }
.hv-uitleg--uitroep::before { content: ""; position: absolute; inset: calc((100% - var(--hv-knop-uitleg)) / 2); border: var(--hv-streep) solid var(--hv-omtrek); border-radius: var(--hv-straal-rail); }
.hv-uitleg--vast::before { display: none; }
.hv-uitleg--vast { color: var(--warn-vlak); }
.is-altijd-zwaar .hv-risico--kritiek ~ .hv-uitleg--vast { color: var(--fout-vlak); }
.hv-gevolg { position: absolute; z-index: var(--hv-z-gevolg); inset-inline-start: var(--x); inset-block-start: var(--y); inline-size: min(var(--hv-gevolg-breedte), calc(100cqw - 32px)); padding: var(--ruimte-3) var(--ruimte-4) var(--ruimte-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-2); animation: hv-op var(--hv-duur-2) var(--hv-kromme-in); }
.hv-gevolg__kop { display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-2); margin-inline-end: calc(var(--ruimte-3) * -1); }
.hv-gevolg__kop h3 { font-size: var(--tekst-klein); font-weight: 650; }
.hv-gevolg__rijen { display: grid; gap: var(--ruimte-2); font-size: var(--tekst-klein); }
.hv-gevolg__rijen dt { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-gevolg__rijen dd { line-height: 1.4; }
@keyframes hv-op { from { opacity: 0; transform: translateY(6px); } }

/* ── hv-schakel: коло 40 px, ціль ≥ 44 ── */
.hv-schakel { position: relative; display: inline-grid; place-items: center; inline-size: var(--hv-tik); block-size: var(--hv-tik); border-radius: 50%; flex: none; --toon: var(--text); --teken-vlak: var(--surface2); --teken-icoon: var(--text); }
.hv-schakel__teken { position: relative; display: grid; place-items: center; inline-size: var(--hv-teken); block-size: var(--hv-teken); border-radius: 50%; background: var(--surface); border: var(--hv-streep) solid var(--hv-omtrek); color: var(--muted); transition: background var(--hv-duur-1), border-color var(--hv-duur-1), color var(--hv-duur-1), transform var(--hv-duur-1); }
.hv-schakel__ic { inline-size: var(--hv-teken-icoon); block-size: var(--hv-teken-icoon); }
.hv-schakel.is-aan .hv-schakel__teken { background: var(--teken-vlak); border: 2px solid var(--toon); color: var(--teken-icoon); }
button.hv-schakel:active .hv-schakel__teken { transform: scale(0.93); }
.hv-schakel.is-passief .hv-schakel__teken { background: transparent; }
.hv-schakel.is-passief.is-aan .hv-schakel__teken { background: var(--teken-vlak); }
.hv-schakel.is-wacht .hv-schakel__teken { border-style: dashed; border-width: 2px; border-color: var(--text); animation: hv-puls var(--hv-duur-puls) ease-in-out infinite; }
.hv-schakel.is-verondersteld .hv-schakel__teken { border-style: dotted; border-width: 2px; }
.hv-schakel.is-onbereikbaar .hv-schakel__teken { border: var(--hv-streep) dashed var(--hv-omtrek); background: transparent; color: var(--muted); }
.hv-schakel.is-slaapt .hv-schakel__teken { border-style: dashed; }
/* критичне — восьмикутник, не перемикач */
.hv-schakel--kritiek .hv-schakel__teken { border: 0; border-radius: 0; background: var(--hv-omtrek); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); color: var(--text); }
.hv-schakel--kritiek .hv-schakel__teken::before { content: ""; position: absolute; inset: 1.5px; background: var(--panel); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.hv-schakel--kritiek.is-aan .hv-schakel__teken { background: var(--warn); }
.hv-schakel--kritiek .hv-schakel__ic { position: relative; }
@keyframes hv-puls { 50% { opacity: 0.45; } }
.hv-aftel__ring { position: absolute; inset: -3px; inline-size: calc(100% + 6px); block-size: calc(100% + 6px); transform: rotate(-90deg); fill: none; stroke: var(--text); stroke-width: 2; pointer-events: none; }
.hv-aftel { display: inline-flex; align-items: center; gap: var(--ruimte-2); }
.hv-aftel__tekst { font-size: var(--tekst-klein); font-weight: 600; }
.hv-aftelrij { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-2) var(--ruimte-3); }
.hv-aftelrij__om { font-size: var(--tekst-klein); color: var(--muted); }

/* ── hv-segment, hv-werkmodus, hv-stand ── */
.hv-segment { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--ruimte-1); padding: var(--ruimte-1); border-radius: var(--straal-m); background: var(--surface); border: 1px solid var(--line); min-inline-size: 0; }
.hv-segment__deel { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-block-size: var(--hv-tik); padding-inline: var(--ruimte-2); border-radius: var(--straal-s); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); text-align: center; line-height: 1.15; transition: background var(--hv-duur-1), color var(--hv-duur-1); }
.hv-segment__deel.is-gekozen { background: var(--panel); color: var(--text); box-shadow: var(--schaduw-1); outline: var(--hv-streep) solid var(--hv-omtrek); outline-offset: -1px; }
.hv-segment__deel.is-gekozen:focus-visible { outline: var(--hv-focus-rand) solid var(--focus); outline-offset: var(--hv-focus-afstand); }
.hv-segment--rol { display: flex; overflow-x: auto; scrollbar-width: none; background: none; border: 0; padding: 0; gap: var(--hv-doel-kier); }
.hv-segment--rol::-webkit-scrollbar { display: none; }
.hv-segment--rol .hv-segment__deel { flex: none; min-block-size: var(--hv-tik); padding-inline: var(--ruimte-3); position: relative; isolation: isolate; white-space: nowrap; background: none; box-shadow: none; outline: 0; }
.hv-segment--rol .hv-segment__deel::before { content: ""; position: absolute; inset: calc((100% - var(--hv-chip-hoogte)) / 2) 0; z-index: -1; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.hv-segment--rol .hv-segment__deel.is-gekozen::before { background: var(--surface2); border: 2px solid var(--text); }
.hv-segment--rol .hv-segment__deel.is-gekozen:focus-visible { outline: var(--hv-focus-rand) solid var(--focus); }

.hv-stand { display: grid; gap: var(--ruimte-2); padding-block: var(--ruimte-3); border-block-start: 1px solid var(--line); }
.hv-stand__kop { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--ruimte-2); min-block-size: var(--hv-tik); }
.hv-stand__naam { font-weight: 600; margin-inline-end: auto; }
.hv-stand__segmenten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ruimte-1); }
.hv-stand__deel { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-block-size: var(--hv-tik); padding-inline: var(--ruimte-2); border-radius: var(--straal-s); background: var(--panel); border: var(--hv-streep) solid var(--hv-omtrek); font-size: var(--tekst-klein); font-weight: 600; text-align: center; }
.hv-stand__deel.is-gekozen { background: var(--surface2); border: 2px solid var(--text); }
.hv-stand__lees { display: flex; align-items: center; gap: var(--ruimte-2); font-size: var(--tekst-klein); color: var(--muted); }
.hv-stand__lees strong { color: var(--text); }
.hv-stand__kaders .hv-chip { font-weight: 500; color: var(--muted); }

/* ── hv-schuif: доріжка 8 px, бігунок 24 px, «−/+» і число ── */
.hv-schuif { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: var(--ruimte-1); --niveau: var(--text); --toon: var(--text); --toon-zacht: var(--surface); }
.hv-schuif__baan { position: relative; block-size: var(--hv-tik); min-inline-size: 72px; touch-action: none; cursor: pointer; border-radius: var(--straal-s); margin-inline: calc(var(--hv-schuif-knop) / 2); }
.hv-schuif__spoor { position: absolute; inset-inline: calc(var(--hv-schuif-knop) / -2); inset-block-start: calc(50% - var(--hv-schuif-baan) / 2); block-size: var(--hv-schuif-baan); border-radius: 999px; background: var(--toon-zacht); border: 1px solid var(--hv-omtrek); overflow: hidden; }
.hv-schuif__vulling { display: block; block-size: 100%; background: var(--niveau); border-inline-end: 2px solid var(--toon); margin-inline-start: 0; inline-size: 0; box-sizing: content-box; padding-inline-start: calc(var(--hv-schuif-knop) / 2); transition: inline-size var(--hv-duur-2); }
.hv-schuif__knop { position: absolute; inset-block-start: 50%; inline-size: var(--hv-schuif-knop); block-size: var(--hv-schuif-knop); margin: calc(var(--hv-schuif-knop) / -2) 0 0 calc(var(--hv-schuif-knop) / -2); border-radius: 50%; background: var(--panel); border: 2px solid var(--toon); box-shadow: var(--schaduw-1); transition: inset-inline-start var(--hv-duur-2), transform var(--hv-duur-1); }
.hv-schuif__gewenst { position: absolute; inset-block-start: calc(50% - 10px); block-size: 20px; inline-size: 2px; margin-inline-start: -1px; background: var(--text); }
.hv-schuif.is-sleept .hv-schuif__vulling, .hv-schuif.is-sleept .hv-schuif__knop { transition: none; }
.hv-schuif.is-sleept .hv-schuif__knop { transform: scale(1.12); }
.hv-schuif__getal { min-inline-size: 3.6em; text-align: end; font-weight: 600; font-size: var(--tekst-basis); }
.hv-schuif.is-uit { color: var(--muted); }
.hv-schuif.is-uit .hv-schuif__knop { border-color: var(--hv-omtrek); }
.hv-schuif.is-uit .hv-schuif__baan { cursor: not-allowed; }
/* температура світла: тепле → холодне — тонами стану, без власних кольорів */
.hv-schuif--warmkoud .hv-schuif__spoor { background: linear-gradient(90deg, var(--hv-aan-vlak), var(--panel) 55%, var(--hv-koud-zacht)); }
.hv-schuif--warmkoud .hv-schuif__vulling { background: transparent; border-inline-end-color: transparent; }

/* ── hv-wijzer: диск термостата ── */
.hv-wijzer { display: grid; justify-items: center; gap: var(--ruimte-2); }
.hv-wijzer__schijf { position: relative; inline-size: var(--hv-wijzer); block-size: var(--hv-wijzer); max-inline-size: 100%; border-radius: 50%; touch-action: none; cursor: pointer; }
.hv-wijzer__schijf svg { inline-size: 100%; block-size: 100%; }
.hv-wijzer__baan { fill: none; stroke: var(--toon-zacht); stroke-width: 12; stroke-linecap: round; }
.hv-wijzer__vulling { fill: none; stroke: var(--toon); stroke-width: 12; stroke-linecap: round; opacity: 0.35; }
.is-bezig .hv-wijzer__vulling { opacity: 1; }
.hv-wijzer__knop { fill: var(--panel); stroke: var(--toon); stroke-width: 3; }
.hv-wijzer__gemeten { fill: var(--text); }
.hv-wijzer__midden { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none; }
.hv-wijzer__getal { font-size: var(--hv-getal-l); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.hv-wijzer__woord { font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-wijzer__doel { display: flex; align-items: center; gap: var(--ruimte-2); }
.hv-wijzer__doelgetal { min-inline-size: 6.5em; text-align: center; font-weight: 600; font-size: var(--hv-tekst-kop); }
.hv-wijzer__doellabel { font-size: var(--tekst-mini); color: var(--muted); }

/* ── hv-kleur ── */
.hv-kleur { display: grid; gap: var(--ruimte-3); }
.hv-kleur__rooster { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: var(--ruimte-2); }
.hv-kleur__staal { display: grid; justify-items: center; gap: 4px; min-block-size: var(--hv-tik); padding: var(--ruimte-2) var(--ruimte-1); border-radius: var(--straal-s); border: 1px solid transparent; }
.hv-kleur__vlak { inline-size: 36px; block-size: 36px; border-radius: 50%; border: var(--hv-streep) solid var(--hv-omtrek); }
.hv-kleur__naam { font-size: var(--tekst-mini); font-weight: 600; text-align: center; line-height: 1.15; }
.hv-kleur__staal.is-gekozen { background: var(--surface2); border: 2px solid var(--text); }
.hv-kleur__cirkel { inline-size: min(240px, 100%); justify-self: center; overflow: visible; }
.hv-kleur__sector { stroke: var(--panel); stroke-width: 2; cursor: pointer; }
.hv-kleur__sector.is-gekozen { stroke: var(--text); stroke-width: 3; }
.hv-kleur__sector:focus-visible { outline: none; stroke: var(--focus); stroke-width: 4; }
/* колір світла — дані, не колір інтерфейсу: градієнт доріжки приходить з onderdelen.js через --hv-spoor */
.hv-schuif--tint .hv-schuif__spoor, .hv-schuif--verzadiging .hv-schuif__spoor { background: var(--hv-spoor, var(--surface)); }
.hv-schuif--tint .hv-schuif__vulling, .hv-schuif--verzadiging .hv-schuif__vulling { background: transparent; border-inline-end-color: transparent; }

/* ── hv-tegel ── */
.hv-tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); grid-auto-rows: minmax(var(--hv-rij), auto); grid-auto-flow: dense; gap: var(--hv-kier); }
.hv-tegel { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: var(--ruimte-1); min-block-size: var(--hv-rij); padding: var(--ruimte-1) var(--ruimte-3) var(--ruimte-1) var(--ruimte-1); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); overflow: hidden; --toon: var(--text); --toon-zacht: var(--surface); --niveau: var(--text); }
.hv-tegel__lijf { display: grid; align-content: center; gap: 1px; min-block-size: var(--hv-tik); min-inline-size: 0; padding-block: var(--ruimte-1); border-radius: var(--straal-s); align-self: stretch; }
.hv-tegel__naam { font-size: var(--tekst-basis); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.hv-tegel__kamer { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); line-height: 1.2; }
.hv-tegel__waarde { display: flex; flex-wrap: wrap; align-items: baseline; font-size: var(--tekst-klein); color: var(--muted); line-height: 1.3; }
.hv-tegel__getal { color: var(--text); font-weight: 600; }
.hv-tegel__staat, .hv-tegel__oud { font-weight: 600; color: var(--text); }
.hv-tegel__maker { position: absolute; inset-block-start: var(--ruimte-2); inset-inline-end: var(--ruimte-2); }
.hv-tegel__altijd { position: absolute; inset-block-start: 2px; inset-inline-start: 2px; z-index: 1; color: var(--warn-vlak); }
.hv-tegel__niveau { position: absolute; inset-inline: 0; inset-block-end: 0; block-size: var(--hv-tegel-niveau); background: var(--toon-zacht); }
.hv-tegel__niveau i { display: block; block-size: 100%; background: var(--niveau); border-inline-end: 2px solid var(--toon); box-sizing: border-box; transition: inline-size var(--hv-duur-2); }
.hv-tegel__niveau b { position: absolute; inset-block: -4px 0; inline-size: 2px; background: var(--text); }
.hv-tegel--2x2 { grid-row: span 2; grid-template-rows: auto minmax(0, 1fr); align-items: start; padding-block: var(--ruimte-2) var(--ruimte-3); }
.hv-tegel--2x2 .hv-tegel__lijf { align-content: start; padding-block-start: var(--ruimte-2); }
.hv-tegel--2x2 .hv-stapper { grid-column: 1 / -1; justify-self: end; align-self: end; margin-inline-end: calc(var(--ruimte-2) * -1); }
.hv-tegel--2x2 .hv-tegel__getal { font-size: var(--hv-tekst-kop); letter-spacing: -0.02em; line-height: 1.1; }
.hv-tegel.is-wacht { border: var(--hv-streep) dashed var(--text); }
.hv-tegel.is-onbereikbaar { border: var(--hv-streep) dashed var(--hv-omtrek); background: var(--panel); }
.hv-tegel.is-onbereikbaar .hv-tegel__naam { color: var(--muted); }
.hv-tegel.is-verouderd .hv-tegel__getal, .hv-tegel.is-verouderd .hv-tegel__woord { color: var(--muted); font-weight: 400; }
/* штрих застарілого — лише у вільній частині поля, ніколи під текстом */
.hv-tegel.is-verouderd::after, .hv-kamerkaart__temp.is-verouderd::after { content: ""; position: absolute; inset-block: 0; inset-inline-end: 0; inline-size: 28%; pointer-events: none; background: repeating-linear-gradient(var(--hv-arcering-hoek), color-mix(in srgb, var(--hv-arcering) 22%, transparent) 0 var(--hv-arcering-dikte), transparent var(--hv-arcering-dikte) var(--hv-arcering-stap)); -webkit-mask-image: linear-gradient(90deg, transparent, var(--text)); mask-image: linear-gradient(90deg, transparent, var(--text)); }
.hv-tegel.is-verondersteld .hv-tegel__staat { font-weight: 600; }
.hv-tegel--kritiek .hv-tegel__lijf { padding-inline-start: var(--ruimte-1); }
.hv-tegel__lijf:active { background: var(--surface2); }

/* ── hv-kamerkaart ── */
.hv-kamers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: var(--hv-kier); }
.hv-kamerkaart { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--ruimte-2); align-items: start; padding: var(--ruimte-3) var(--ruimte-2) var(--ruimte-2) var(--ruimte-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); }
.hv-kamerkaart__lijf { display: grid; gap: 2px; min-block-size: var(--hv-tik); min-inline-size: 0; border-radius: var(--straal-s); }
.hv-kamerkaart__kop { display: flex; align-items: center; gap: var(--ruimte-2); color: var(--muted); }
.hv-kamerkaart__naam { font-size: var(--tekst-basis); font-weight: 600; color: var(--text); }
.hv-kamerkaart__temp { position: relative; font-size: var(--hv-getal-m); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.hv-kamerkaart__temp.is-verouderd { color: var(--muted); }
.hv-kamerkaart__temp.is-leeg { color: var(--muted); }
.hv-kamerkaart__sub { font-size: var(--tekst-klein); color: var(--muted); }
.hv-kamerkaart__chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--ruimte-1); margin-block-start: var(--ruimte-2); }
.hv-kamerkaart__chips .hv-chip { white-space: normal; flex: 0 1 auto; max-inline-size: 100%; line-height: 1.2; padding-block: 5px; font-size: var(--tekst-mini); min-block-size: 28px; padding-inline: var(--ruimte-2); }
.hv-kamerkaart__chips .hv-chip::before { border-radius: var(--straal-s); }
.hv-kamerkaart__doel { grid-column: 2; grid-row: 2; align-self: end; }
.hv-kamerkaart > .hv-schakel { grid-column: 2; grid-row: 1; }
.hv-kamerkaart__lijf { grid-row: 1 / span 2; }
.hv-kamerkaart__doel .hv-stapper { gap: 0; }

/* ── hv-telemetrie ── */
.hv-telemetrie { --niveau: var(--toon); }
.hv-telemetrie__lijf { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--ruimte-1) var(--ruimte-3); inline-size: 100%; padding-block: var(--ruimte-2); border-radius: var(--straal-s); text-align: start; }
.hv-telemetrie__kop { display: grid; }
.hv-telemetrie__naam { font-weight: 600; }
.hv-telemetrie__stand { font-size: var(--tekst-klein); color: var(--muted); }
.hv-telemetrie__silhouet { grid-row: span 2; align-self: center; color: var(--hv-omtrek); }
.hv-telemetrie__lading { display: flex; align-items: baseline; gap: var(--ruimte-2); }
.hv-telemetrie__getal { font-size: var(--hv-getal-l); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.hv-telemetrie__bereik { font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-telemetrie__balk { position: relative; grid-column: 1 / -1; block-size: 8px; border-radius: 999px; background: var(--toon-zacht); border: 1px solid var(--hv-omtrek); }
.hv-telemetrie__balk i { display: block; block-size: 100%; border-radius: 999px; background: var(--toon); transition: inline-size var(--hv-duur-2); }
.hv-telemetrie__balk b { position: absolute; inset-block: -4px; inline-size: 2px; background: var(--text); }
.hv-telemetrie__rij { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--ruimte-1) var(--ruimte-5); }
.hv-telemetrie__rij > span { display: grid; }
.hv-telemetrie__label { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-telemetrie__waarde { font-weight: 600; }

/* ── hv-scene: коло запускає; стоїть на небі, тому підпис — --text ── */
.hv-scenes { display: flex; gap: var(--ruimte-2); overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--hv-rand) * -1); padding-inline: var(--hv-rand); padding-block: 2px; }
.hv-scenes::-webkit-scrollbar { display: none; }
.hv-scene { display: grid; justify-items: center; align-content: start; gap: 6px; min-inline-size: 76px; max-inline-size: 104px; padding: var(--ruimte-1); border-radius: var(--straal-m); flex: 1 0 auto; }
.hv-scene__teken { inline-size: 52px; block-size: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--schaduw-1); color: var(--text); transition: transform var(--hv-duur-1), background var(--hv-duur-1); }
.hv-scene:active .hv-scene__teken { transform: scale(0.93); background: var(--surface2); }
.hv-scene.is-actief .hv-scene__teken { border: 2px solid var(--text); }
.hv-scene__naam { font-size: var(--tekst-klein); font-weight: 600; text-align: center; line-height: 1.2; }
.hv-scene__actief { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); line-height: 1; }

/* ── hv-blok: заголовок на небі, лічильник у паперовому чипі ── */
.hv-blok { display: grid; gap: var(--ruimte-1); min-inline-size: 0; align-content: start; }
.hv-blok__kop { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--ruimte-1); min-inline-size: 0; }
.hv-blok__titel { display: inline-flex; align-items: center; gap: var(--ruimte-2); min-block-size: var(--hv-tik); border-radius: var(--straal-s); min-inline-size: 0; }
.hv-blok__naam { font-size: var(--hv-tekst-kop); font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.hv-blok__teller { min-inline-size: 26px; padding: 2px var(--ruimte-2); border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: var(--tekst-mini); font-weight: 600; text-align: center; line-height: 1.5; white-space: nowrap; }
.hv-blok__pijl { color: var(--muted); transition: transform var(--hv-duur-2); }
.hv-blok.is-dicht .hv-blok__pijl { transform: rotate(-90deg); }
.hv-blok__extra { margin-inline-start: auto; display: inline-flex; align-items: center; }
.hv-blok__extra .hv-knop { white-space: nowrap; }
.hv-blok__inhoud { min-inline-size: 0; display: grid; gap: var(--hv-kier); animation: hv-op var(--hv-duur-2) var(--hv-kromme-in); }
.hv-blok__samenvatting { font-size: var(--tekst-klein); color: var(--muted); font-weight: 500; padding-block-end: var(--ruimte-2); }

/* ── hv-nu: «Зараз важливо» ── */
.hv-nu { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); padding-inline: var(--ruimte-3); }
.hv-nu__rij { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--ruimte-1) var(--ruimte-3); padding-block: var(--ruimte-3); border-block-start: 1px solid var(--line); }
.hv-nu__rij:first-child { border-block-start: 0; }
.hv-nu__teken { inline-size: var(--hv-teken); block-size: var(--hv-teken); border-radius: 50%; display: grid; place-items: center; border: var(--hv-streep) solid var(--hv-omtrek); color: var(--text); }
.hv-nu__rij--aandacht .hv-nu__teken { border: 2px solid var(--warn); color: var(--warn); }
.hv-nu__rij--alarm .hv-nu__teken { border: 2px solid var(--fout); color: var(--fout); background: var(--fout-zacht); border-radius: var(--hv-straal-rail); }
.hv-nu__rij--verzoek .hv-nu__teken { border: 2px solid var(--info); color: var(--info); border-radius: var(--straal-s); }
.hv-nu__tekst { font-weight: 600; line-height: 1.3; }
.hv-nu__meta { display: flex; align-items: center; flex-wrap: wrap; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); margin-block-start: 2px; }
.hv-nu__acties { display: flex; flex-wrap: wrap; gap: var(--hv-doel-kier); justify-content: flex-end; }
.hv-nu__meer { border-block-start: 1px solid var(--line); }

/* ── hv-leeg, hv-skelet ── */
.hv-leeg { display: grid; justify-items: start; gap: var(--ruimte-2); padding: var(--ruimte-5); background: var(--panel); border: var(--hv-streep) dashed var(--hv-omtrek); border-radius: var(--straal-l); }
.hv-leeg__teken { inline-size: 48px; block-size: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--muted); }
.hv-leeg__titel { font-size: var(--tekst-basis); font-weight: 650; }
.hv-leeg__tekst { font-size: var(--tekst-klein); color: var(--muted); max-inline-size: 56ch; }
.hv-skelet { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: var(--hv-kier); }
.hv-skelet__deel { block-size: var(--hv-rij); border-radius: var(--straal-l); background: var(--surface); border: 1px solid var(--line); }
.hv-skelet__deel--rijen { grid-column: 1 / -1; block-size: var(--hv-tik); border-radius: var(--straal-s); }
.hv-skelet__deel--blok { grid-column: 1 / -1; block-size: 140px; }
.hv-skelet__tekst { grid-column: 1 / -1; font-size: var(--tekst-klein); color: var(--muted); opacity: 0; animation: hv-toon 1ms linear var(--hv-duur-skelet) forwards; }
@keyframes hv-toon { to { opacity: 1; } }

/* ── hv-bericht (Журнал) ── */
.hv-berichten { display: grid; }
.hv-bericht { border-block-start: 1px solid var(--line); }
.hv-bericht:first-child { border-block-start: 0; }
.hv-bericht__kop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "tijd wat pijl" ". wie pijl"; align-items: baseline; column-gap: var(--ruimte-3); inline-size: 100%; min-block-size: var(--hv-tik); padding-block: var(--ruimte-2); font-size: var(--tekst-klein); border-radius: var(--straal-s); }
.hv-bericht__tijd { grid-area: tijd; font-weight: 600; color: var(--muted); }
.hv-bericht__wat { grid-area: wat; font-weight: 600; line-height: 1.3; }
.hv-bericht.is-ongelezen .hv-bericht__wat::before { content: ""; display: inline-block; inline-size: 7px; block-size: 7px; margin-inline-end: 6px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
.hv-bericht__delta { font-weight: 500; color: var(--muted); white-space: nowrap; }
.hv-bericht__wie { grid-area: wie; display: flex; align-items: center; gap: var(--ruimte-2); }
.hv-bericht__sim { color: var(--info); }
.hv-bericht__pijl { grid-area: pijl; align-self: center; color: var(--muted); transition: transform var(--hv-duur-2); }
.hv-bericht.is-open .hv-bericht__pijl { transform: rotate(180deg); }
.hv-bericht--alarm .hv-bericht__wat { color: var(--fout); }
.hv-bericht__details { display: grid; gap: var(--ruimte-1); padding: 0 0 var(--ruimte-3) calc(3.2em + var(--ruimte-3)); font-size: var(--tekst-klein); }
.hv-bericht__details > div { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr); gap: var(--ruimte-2); }
.hv-bericht__details dt { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }

/* ── hv-toost ── */
.hv-toosten { position: absolute; z-index: var(--hv-z-toost); inset-inline: var(--hv-rand); inset-block-end: calc(var(--hv-onder-h) + var(--hv-opdracht-knop) + 2 * var(--hv-kier)); display: grid; gap: var(--ruimte-2); pointer-events: none; justify-items: end; }
.hv-toost { pointer-events: auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: var(--ruimte-2); inline-size: min(100%, var(--hv-toost-breedte)); padding: var(--ruimte-2) var(--ruimte-1) var(--ruimte-2) var(--ruimte-3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-2); animation: hv-op var(--hv-duur-3) var(--hv-kromme-in); }
.hv-toost__teken { inline-size: 32px; block-size: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); }
.hv-toost--belangrijk { border: 2px solid var(--warn); }
.hv-toost--alarm { border: 2px solid var(--fout-vlak); background: var(--fout-zacht); }
.hv-toost__titel { font-size: var(--tekst-klein); font-weight: 650; line-height: 1.25; }
.hv-toost__regel { font-size: var(--tekst-klein); color: var(--muted); line-height: 1.3; }
.hv-toost__maker { margin-block-start: 2px; }
.hv-toost__terug { position: relative; overflow: hidden; }
.hv-toost__tijd { position: absolute; inset-inline: 0; inset-block-end: 0; block-size: 3px; background: var(--text); transform-origin: 0 50%; animation: hv-leeg var(--hv-duur-terug) linear forwards; }
@keyframes hv-leeg { to { transform: scaleX(0); } }
/* поки відкрито діалог чи аркуш унизу, сповіщення стоять угорі й не закривають органи */
.heeft-dialoog .hv-toosten { inset-block: calc(var(--hv-kop-h) + var(--ruimte-2)) auto; }

/* ── hv-grafiek ── */
.hv-grafiek { display: grid; gap: var(--ruimte-2); min-inline-size: 0; }
.hv-grafiek__kop { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ruimte-2); }
.hv-grafiek__titel { font-size: var(--tekst-klein); font-weight: 650; }
.hv-grafiek__eenheid { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-grafiek__veld { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--ruimte-2); padding-block-end: 20px; }
.hv-grafiek__as { position: relative; min-inline-size: 30px; }
.hv-grafiek__y { position: absolute; inset-inline-end: 0; transform: translateY(-50%); font-size: var(--tekst-mini); color: var(--muted); white-space: nowrap; }
.hv-grafiek__doek { position: relative; min-inline-size: 0; }
.hv-grafiek__doek svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; overflow: visible; }
.hv-grafiek__raster { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hv-grafiek__nul { stroke: var(--hv-omtrek); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hv-grafiek__lijn { fill: none; stroke: var(--toon); stroke-width: var(--hv-grafiek-lijn); vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.hv-grafiek__lijn.is-dik { stroke-width: 2.5px; }
.hv-grafiek__vlak { fill: var(--toon-zacht); stroke: none; }
.hv-grafiek__naam { position: absolute; transform: translate(-50%, -50%); color: var(--toon); background: var(--panel); border-radius: 50%; padding: 2px; }
.hv-grafiek__x { position: absolute; inset-block-start: calc(100% + 4px); transform: translateX(-50%); font-size: var(--tekst-mini); color: var(--muted); white-space: nowrap; }
.hv-grafiek__xas { position: absolute; inset: 0; pointer-events: none; }
.hv-grafiek__nu { position: absolute; inset-block: 0; inline-size: 2px; margin-inline-start: -1px; background: var(--accent); pointer-events: none; z-index: 1; }
.hv-grafiek__nu span { position: absolute; inset-block-end: 100%; inset-inline-start: 50%; transform: translateX(-50%); padding: 0 4px; border-radius: 4px; background: var(--panel); font-size: var(--tekst-mini); font-weight: 600; white-space: nowrap; }
.hv-grafiek__streep { position: absolute; inset-inline: 0; block-size: 1px; background: var(--line); }
.hv-grafiek__streep.is-nul { background: var(--hv-omtrek); }
.hv-grafiek__staaf { position: absolute; display: block; }
.hv-grafiek__staaf i { display: block; block-size: 100%; margin-inline: 14%; border-radius: 3px 3px 0 0; background: var(--toon); }
.hv-grafiek__staaf.is-negatief i { border-radius: 0 0 3px 3px; background: var(--hv-net-uit); }
.hv-grafiek__staaf.is-geschat i { background: var(--toon-zacht); outline: 1px dashed var(--toon); outline-offset: -1px; }
.hv-grafiek__staaf.is-nu i { outline: 2px solid var(--accent); outline-offset: 1px; }
.hv-grafiek__vink { position: absolute; inset-block-end: calc(100% + 2px); inset-inline-start: 50%; transform: translateX(-50%); color: var(--text); }
.hv-grafiek__legenda { display: flex; flex-wrap: wrap; gap: var(--ruimte-1) var(--ruimte-4); font-size: var(--tekst-klein); }
.hv-grafiek__legenda li { display: inline-flex; align-items: center; gap: 6px; }
.hv-grafiek__legenda .hv-ic { color: var(--toon); }
.hv-grafiek__legenda strong { font-weight: 600; }
.hv-grafiek__geschat { color: var(--muted); font-size: var(--tekst-mini); }
.hv-grafiek__zin { font-size: var(--tekst-klein); color: var(--muted); line-height: 1.4; }
.hv-grafiek__wissel { justify-self: start; font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-grafiek--ring .hv-grafiek__legenda { display: grid; gap: var(--ruimte-1); align-content: center; flex: 1 1 140px; }
.hv-grafiek--ring .hv-grafiek__legenda li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--ruimte-2); }
.hv-grafiek__ringrij { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-3) var(--ruimte-5); }
.hv-ring { position: relative; inline-size: var(--hv-ring); block-size: var(--hv-ring); flex: none; }
.hv-ring--klein { inline-size: 132px; block-size: 132px; }
.hv-ring svg { inline-size: 100%; block-size: 100%; }
.hv-ring__baan { fill: none; stroke: var(--surface); stroke-width: 7.5; }
.hv-ring__boog { fill: none; stroke: var(--toon); stroke-width: 7.5; stroke-linecap: butt; transition: stroke-dasharray var(--hv-duur-2), stroke-dashoffset var(--hv-duur-2); }
.hv-ring__boog.is-geschat { opacity: 0.55; }
.hv-ring__midden { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; }
.hv-ring__getal { font-size: var(--hv-getal-m); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
.hv-ring__label { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-vonk { inline-size: 64px; block-size: 24px; }
.hv-vonk path { fill: none; stroke: var(--toon); stroke-width: 2; vector-effect: non-scaling-stroke; }

/* смуги станів і стрічка доби */
.hv-grafiek__banen { display: grid; gap: 3px; padding-block-end: 20px; }
.hv-baan, .hv-grafiek__banenas { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: var(--ruimte-2); }
.hv-baan__naam { font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hv-baan__spoor { position: relative; block-size: var(--hv-dagstrook-baan); border-radius: 4px; background: var(--surface); }
.hv-baan__stuk { position: absolute; inset-block: 0; background: var(--toon, var(--text)); border-radius: 3px; }
.hv-baan__stuk.hv-toon-neutraal { background: var(--muted); }
.hv-baan__punt { position: absolute; inset-block-start: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; min-inline-size: 4px; min-block-size: 10px; color: var(--text); }
.hv-baan__punt:empty { inline-size: 3px; block-size: 12px; border-radius: 2px; background: var(--text); }
.hv-baan--fase .hv-baan__spoor { block-size: var(--hv-dagstrook-fase); overflow: hidden; border: 1px solid var(--line); border-radius: 6px; }
.hv-baan--fase .hv-baan__stuk, .hv-baan--prijs .hv-baan__stuk, .hv-baan--stand .hv-baan__stuk { border-radius: 0; }
.hv-fase--nacht { background: var(--hv-hemel-nacht-onder); }
.hv-fase--dageraad { background: var(--hv-hemel-dageraad-onder); }
.hv-fase--dag { background: var(--hv-hemel-dag-onder); }
.hv-fase--schemer { background: var(--hv-hemel-schemer-onder); }
.hv-baan--prijs .hv-baan__spoor, .hv-baan--stand .hv-baan__spoor { overflow: hidden; }
.hv-warmte--1 { background: var(--hv-warmte-1); }
.hv-warmte--2 { background: var(--hv-warmte-2); }
.hv-warmte--3 { background: var(--hv-warmte-3); }
.hv-warmte--4 { background: var(--hv-warmte-4); }
.hv-warmte--5 { background: var(--hv-warmte-5); }
.hv-warmte--min { background: var(--hv-net-uit); }
.hv-stand--thuis { background: var(--muted); }
.hv-stand--afwezig { background: repeating-linear-gradient(90deg, var(--hv-omtrek) 0 2px, transparent 2px 6px); }
.hv-stand--nacht { background: var(--text); }
.hv-stand--vakantie, .hv-stand--gasten { background: var(--hv-omtrek); }
.hv-grafiek__banenas .hv-baan__spoor { background: none; block-size: 0; }
.hv-grafiek__banen { position: relative; padding-block-start: 20px; }
.hv-grafiek__nu--banen { inset-block: 18px 18px; inset-inline-start: calc(56px + var(--ruimte-2) + (100% - 56px - var(--ruimte-2)) * var(--x)); }
.hv-warmtekaart { border-collapse: separate; border-spacing: 2px; inline-size: 100%; font-size: var(--tekst-mini); }
.hv-warmtekaart th { font-weight: 600; color: var(--muted); text-align: start; padding: 2px 4px; white-space: nowrap; }
.hv-warmte { text-align: center; padding: 6px 4px; border-radius: 4px; color: var(--text); font-weight: 600; min-inline-size: 30px; }
.hv-warmte--0 { background: repeating-linear-gradient(var(--hv-arcering-hoek), color-mix(in srgb, var(--hv-arcering) 30%, transparent) 0 var(--hv-arcering-dikte), transparent var(--hv-arcering-dikte) var(--hv-arcering-stap)); }

/* ── Зведення на «Домі» ── */
.hv-zomen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: var(--hv-kier); align-items: start; }
.hv-som { display: grid; gap: var(--ruimte-2); align-content: start; padding: var(--ruimte-3) var(--ruimte-4) var(--ruimte-3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); min-inline-size: 0; }
.hv-som__kop { display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-2); min-block-size: 32px; }
.hv-som__kop h3 { display: inline-flex; align-items: center; gap: var(--ruimte-2); font-size: var(--tekst-klein); font-weight: 650; color: var(--muted); }
.hv-som__kop .hv-knop { margin-block: -8px; margin-inline-end: calc(var(--ruimte-2) * -1); }
.hv-som__voet { margin-block-start: calc(var(--ruimte-1) * -1); }

/* ── Тема чорнила: тон замінюють іконка, слово й малюнок ── */
.theme-inkt .hv-schakel.is-aan .hv-schakel__teken { background: var(--text); color: var(--panel); border-color: var(--text); }
.theme-inkt .hv-tegel__niveau, .theme-inkt .hv-schuif__spoor { border: 1px solid var(--text); }
.theme-inkt .hv-kaart, .theme-inkt .hv-tegel, .theme-inkt .hv-nu, .theme-inkt .hv-som, .theme-inkt .hv-kamerkaart { border-width: 1.5px; }

@media (prefers-reduced-motion: reduce) {
  .hv-schakel.is-wacht .hv-schakel__teken { animation: none; }
  .hv-blok__inhoud, .hv-gevolg, .hv-toost { animation: none; }
}
@media (hover: hover) {
  button.hv-chip:hover::before, .hv-segment--rol .hv-segment__deel:hover::before { background: var(--surface); }
  .hv-tegel__lijf:hover, .hv-kamerkaart__lijf:hover, .hv-blok__titel:hover, .hv-bericht__kop:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
  button.hv-schakel:hover .hv-schakel__teken { border-color: var(--text); }
  .hv-scene:hover .hv-scene__teken { background: var(--surface); }
  .hv-stand__deel:hover:not(.is-gekozen), .hv-segment__deel:hover:not(.is-gekozen) { background: var(--surface2); color: var(--text); }
}

/* ── Щільність і вузькі екрани ── */
@container doek (max-width: 699px) {
  .hv-nu__rij { grid-template-columns: auto minmax(0, 1fr); }
  .hv-nu__acties { grid-column: 2; justify-content: flex-start; }
  .hv-gevolg { inset-inline: var(--hv-rand); inset-block-start: auto; inset-block-end: calc(var(--hv-onder-h) + var(--hv-kier)); inline-size: auto; }
  .hv-kamers { grid-template-columns: minmax(0, 1fr); }
  .hv-bericht__details { padding-inline-start: 0; }
}
@container doek (max-width: 359px) {
  .hv-tegels { grid-template-columns: minmax(0, 1fr); }
}
@container doek (min-width: 700px) {
  .hv-tegels { grid-template-columns: repeat(auto-fill, minmax(min(100%, 184px), 1fr)); }
  .hv-toosten { inset-inline: auto var(--hv-rand); inset-block-end: var(--hv-rand); inline-size: var(--hv-toost-breedte); }
}

/* stijl/hemel.css */
/* hemel.css — небо (hv-hemel), герой (hv-held), розріз дому (hv-doorsnede) і компонування «Дому».
   Небо несе контекст, а не дані: градієнт із трьох точок фази й нерухомий штрих опадів; без хмаринок і зірок. */

/* ── hv-hemel: нерухомий шар на всю видиму область ── */
.hv-doek { transition: --hv-hemel-boven var(--hv-duur-hemel) linear, --hv-hemel-onder var(--hv-duur-hemel) linear, --hv-hemel-gloed var(--hv-duur-hemel) linear; }
.hv-doek.is-sprong { transition: none; }
.hv-hemel { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, var(--hv-hemel-boven) 0%, var(--hv-hemel-onder) 100%); }
.hv-hemel__gloed { position: absolute; inset: 0; background: radial-gradient(120% 80% at 78% 100%, var(--hv-hemel-gloed) 0%, transparent 60%); opacity: var(--hv-hemel-gloed-dekking, 1); }
/* штрих опадів: риски 6/10 під кутом 15°, лише у верхній третині, ніколи під текстом */
.hv-hemel__neerslag { position: absolute; inset: 0 0 66% 46%; display: none; opacity: 0.55; -webkit-mask-image: linear-gradient(90deg, transparent, var(--text) 45%), linear-gradient(180deg, var(--text) 35%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, var(--text) 45%), linear-gradient(180deg, var(--text) 35%, transparent); mask-composite: intersect; }
.is-regen .hv-hemel__neerslag { display: block; background-image: repeating-linear-gradient(105deg, transparent 0 21px, var(--hv-hemel-neerslag) 21px 22px); -webkit-mask-image: repeating-linear-gradient(15deg, var(--text) 0 6px, transparent 6px 16px), linear-gradient(90deg, transparent, var(--text) 45%), linear-gradient(180deg, var(--text) 35%, transparent); mask-image: repeating-linear-gradient(15deg, var(--text) 0 6px, transparent 6px 16px), linear-gradient(90deg, transparent, var(--text) 45%), linear-gradient(180deg, var(--text) 35%, transparent); }
.is-sneeuw .hv-hemel__neerslag { display: block; background-image: radial-gradient(circle, var(--hv-hemel-neerslag) 1px, transparent 1.4px); background-size: 12px 12px; }
/* тихе небо: градієнт без сяйва й штриха; вимкнене — рівний --bg */
.hv-hemel--stil .hv-hemel__gloed, .hv-hemel--stil .hv-hemel__neerslag, .hv-hemel--geen .hv-hemel__gloed, .hv-hemel--geen .hv-hemel__neerslag, .is-licht .hv-hemel__gloed { display: none; }
.hv-hemel--geen .hv-hemel { background: var(--bg); }

/* ── hv-held: речення дому на небі ── */
.hv-held { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ruimte-4); align-items: end; min-inline-size: 0; }
.hv-held__tekst { display: grid; gap: var(--ruimte-2); min-inline-size: 0; align-content: start; }
.hv-held__datum { display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-held__tijd { color: var(--text); }
.hv-held__huistijd { display: none; align-items: center; gap: 4px; margin-inline-start: var(--ruimte-2); font-size: var(--tekst-mini); }
.hv-held__zin { font-size: clamp(24px, 3cqw, 44px); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; max-inline-size: 22em; }
.hv-held__vol { display: none; }
.hv-held__kort { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.hv-zinlink { display: inline; padding-block: 10px; font: inherit; letter-spacing: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.16em; border-radius: 6px; cursor: pointer; }
.hv-held__chips { display: flex; gap: var(--ruimte-2); overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--hv-rand) * -1); padding-inline: var(--hv-rand); }
.hv-held__chips::-webkit-scrollbar { display: none; }
.hv-held__chips > span { display: inline-flex; flex: none; }
.hv-held__beeld { display: none; justify-self: end; inline-size: 100%; max-inline-size: var(--hv-doorsnede-breedte-max); }

/* ── hv-doorsnede: поверх — рядок, кімната — кнопка; вікно світиться лише за підтвердженого світла ── */
.hv-doorsnede { display: grid; gap: var(--ruimte-1); inline-size: 100%; max-inline-size: var(--hv-doorsnede-breedte-max); color: var(--text); }
.hv-doorsnede__tekening { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 2fr) auto; grid-template-rows: auto; align-items: end; border-block-end: var(--hv-streep) solid var(--hv-omtrek); }
.hv-doorsnede__huis { display: grid; }
.hv-doorsnede__zolder { position: relative; padding: 14px 25% 0; }
.hv-doorsnede__dak { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; overflow: visible; }
.hv-doorsnede__dak path { fill: none; stroke: var(--hv-omtrek); stroke-width: var(--hv-streep); vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.hv-doorsnede__laag { border: var(--hv-streep) solid var(--hv-omtrek); border-block-end: 0; }
.hv-doorsnede__rij { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.hv-doorsnede__kamer { position: relative; display: grid; place-items: center; min-block-size: var(--hv-tik); min-inline-size: 0; border-inline-start: var(--hv-streep) solid var(--hv-omtrek); transition: background var(--hv-duur-1); }
.hv-doorsnede__rij > .hv-doorsnede__kamer:first-child { border-inline-start: 0; }
.hv-doorsnede__zolder .hv-doorsnede__kamer { border-inline-start: 0; }
.hv-doorsnede__kamer:active { background: color-mix(in srgb, var(--surface2) 60%, transparent); }
.hv-doorsnede__naam { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
.hv-venster { display: grid; place-items: center; inline-size: var(--hv-venster-breedte); block-size: var(--hv-venster-hoogte); border: var(--hv-streep) solid var(--hv-omtrek); border-radius: 2px; transition: background var(--hv-duur-2), box-shadow var(--hv-duur-2); }
.is-aan > .hv-venster, .is-verondersteld > .hv-venster { background: var(--hv-aan-vlak); border: 2px solid var(--hv-aan); box-shadow: 0 0 14px 3px color-mix(in srgb, var(--hv-aan-vlak) 55%, transparent); }
.is-verondersteld > .hv-venster { border-style: dashed; }
.is-geen > .hv-venster { border-style: dotted; opacity: 0.6; }
.is-onbereikbaar > .hv-venster { inline-size: 18px; block-size: 18px; border: var(--hv-streep) dashed var(--hv-omtrek); color: var(--muted); }
.is-verouderd > .hv-venster { background: repeating-linear-gradient(var(--hv-arcering-hoek), var(--hv-arcering) 0 var(--hv-arcering-dikte), transparent var(--hv-arcering-dikte) 4px); }
.hv-doorsnede__erf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; }
.hv-doorsnede__garage { border: var(--hv-streep) solid var(--hv-omtrek); border-block-end: 0; border-inline-start: 0; }
.hv-doorsnede__garage .hv-doorsnede__kamer, .hv-doorsnede__tuin .hv-doorsnede__kamer { border-inline-start: 0; inline-size: 100%; }
.hv-doorsnede__ding { color: var(--hv-omtrek); display: grid; place-items: center; }
.hv-doorsnede__ding[class*="hv-toon-"] { color: var(--toon); }
.is-aan > .hv-doorsnede__ding { color: var(--hv-aan); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--hv-aan-vlak) 70%, transparent)); }
.hv-doorsnede__labels { display: grid; grid-template-rows: repeat(3, var(--hv-tik)); align-content: end; padding-inline-start: var(--ruimte-2); font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); line-height: 1.15; }
.hv-doorsnede__labels span { display: flex; align-items: center; max-inline-size: 76px; }
.hv-doorsnede__labels span:first-child { align-items: end; padding-block-end: 12px; }
.hv-doorsnede__wissel { justify-self: start; font-size: var(--tekst-mini); color: var(--muted); }
.hv-doorsnede--lijst { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); padding: var(--ruimte-2) var(--ruimte-4); }
.hv-kaart--doorsnede { display: grid; justify-items: center; padding-block: var(--ruimte-3) var(--ruimte-1); }

/* ── Компонування «Дому» ── */
.hv-thuis { display: grid; gap: var(--ruimte-4); min-inline-size: 0; }
.hv-thuis__rooster { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ruimte-3); min-inline-size: 0; align-items: start; }
.hv-thuis__rooster > div { display: grid; gap: var(--ruimte-3); min-inline-size: 0; align-content: start; }
.hv-thuis__rooster > div:empty { display: none; }
.hv-dagstrook { min-inline-size: 0; }

@container doek (max-width: 699px) {
  /* телефон: герой не вищий за чверть екрана; коротке речення у два рядки; розріз — окремий блок нижче */
  .hv-held { max-block-size: var(--hv-held-max); overflow: hidden; }
  /* вузько: шість клітинок по ≥ 44 px важливіші за підписи поверхів (вони є в списку й у назвах кнопок) */
  .hv-doorsnede__labels { display: none; }
