  .hv-doorsnede__tekening { grid-template-columns: minmax(0, 4fr) minmax(0, 2fr); }
  .hv-hemel .hv-hemel__neerslag { display: none; } /* на телефоні верхню третину займає текст: факт опадів несе чип погоди */
  .hv-held__tekst { gap: var(--ruimte-1); }
}
@container doek (max-width: 699px) and (max-height: 640px) {
  .hv-held__datum { display: none; }
}
@container doek (min-width: 700px) {
  .hv-held { grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--ruimte-6); padding-block: var(--ruimte-3) var(--ruimte-2); }
  .hv-held__vol { display: inline; }
  .hv-held__kort { display: none; }
  .hv-held__beeld { display: block; inline-size: var(--hv-doorsnede-breedte-max); max-inline-size: 42cqw; }
  .hv-held__huistijd { display: inline-flex; }
  .hv-held__chips { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
  .hv-thuis__rooster > .hv-thuis__doorsnede { display: none; }
  .hv-thuis { gap: var(--ruimte-5); }
}
@container doek (min-width: 1100px) {
  .hv-thuis__rooster { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: var(--ruimte-5); row-gap: var(--ruimte-4); }
  .hv-thuis__nu, .hv-thuis__breed { grid-column: 1 / -1; }
  .hv-thuis__rechts .hv-kamers { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .hv-held { padding-block: var(--ruimte-5) var(--ruimte-3); }
  .hv-blok--nu .hv-nu { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); column-gap: var(--ruimte-5); }
  .hv-blok--nu .hv-nu__rij { border-block-start: 0; }
}
@container doek (min-width: 1800px) {
  .hv-thuis__rooster { grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); }
}

/* stijl/bladen.css */
/* bladen.css — шари над сторінкою: аркуш керування (hv-laag), діалог небезпечної дії (hv-gevaar) з рейкою (hv-rail),
   Команда (hv-opdracht), центр сповіщень, аварійний шар (hv-nood). Скляна лише оболонка; вміст — на папері. */

.hv-lagen { position: absolute; inset: 0; z-index: var(--hv-z-laag); pointer-events: none; }
.hv-lagen > * { pointer-events: none; }
.hv-lagen > * > * { pointer-events: auto; }
.hv-lagen > .hv-toosten > * { pointer-events: auto; }
.hv-dek { position: absolute; inset: 0; background: var(--overlay); animation: hv-vervaag var(--hv-duur-2) linear; }
.hv-dek--dialoog { z-index: var(--hv-z-opdracht); }
@keyframes hv-vervaag { from { opacity: 0; } }

/* ── hv-laag: знизу на телефоні (до 90 % висоти), праворуч на комп'ютері ── */
.hv-laag { position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 1; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; max-block-size: var(--hv-laag-hoogte-max); min-block-size: 40cqh; background: var(--hv-glas); -webkit-backdrop-filter: var(--hv-glas-filter); backdrop-filter: var(--hv-glas-filter); border: 1px solid var(--hv-glas-rand); border-block-end: 0; border-radius: var(--straal-xl) var(--straal-xl) 0 0; box-shadow: var(--schaduw-3); animation: hv-laag-op var(--hv-duur-3) var(--hv-kromme-in); }
@keyframes hv-laag-op { from { transform: translateY(32px); opacity: 0; } }
@keyframes hv-laag-zij { from { transform: translateY(12px); opacity: 0; } }
.hv-laag__greep { justify-self: center; inline-size: 40px; block-size: 4px; margin-block-start: var(--ruimte-2); border-radius: 999px; background: var(--hv-omtrek); }
.hv-laag__kop { display: flex; align-items: center; gap: var(--ruimte-3); padding: var(--ruimte-2) var(--ruimte-2) var(--ruimte-1) var(--ruimte-4); min-inline-size: 0; }
.hv-laag__teken { inline-size: var(--hv-teken); block-size: var(--hv-teken); border-radius: var(--straal-s); display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); flex: none; }
.hv-laag__naam { flex: 1 1 auto; min-inline-size: 0; display: grid; }
.hv-laag__naam h2 { font-size: var(--hv-tekst-kop); font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.hv-laag__naam p { font-size: var(--tekst-klein); color: var(--muted); font-weight: 500; }
.hv-tabs--laag { margin-inline: 0; padding-inline: var(--ruimte-3); }
.hv-laag__inhoud { overflow-y: auto; overscroll-behavior: contain; padding: var(--ruimte-2) var(--ruimte-3) var(--ruimte-4); scrollbar-width: thin; scrollbar-color: var(--hv-omtrek) transparent; min-block-size: 0; }
.hv-laag__paneel { display: grid; gap: var(--hv-kier); align-content: start; }
.hv-laag__paneel > .hv-kaart + .hv-kaart { margin-block-start: 0; }
.hv-laag__voet { display: grid; gap: 2px; padding: var(--ruimte-2) var(--ruimte-4) calc(var(--ruimte-3) + env(safe-area-inset-bottom, 0px)); border-block-start: 1px solid var(--hv-glas-rand); }
.hv-laag__voet .hv-stempel { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px var(--ruimte-3); justify-self: start; }
.hv-laag__maker { display: flex; align-items: center; gap: var(--ruimte-1); font-size: var(--tekst-mini); color: var(--muted); }
.hv-laag__noot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-2); font-size: var(--tekst-mini); color: var(--muted); padding-inline: var(--ruimte-1); }

/* вміст аркуша */
.hv-bediening__hoofd { display: flex; align-items: center; gap: var(--ruimte-3); padding-block-end: var(--ruimte-3); }
.hv-bediening__hoofd .hv-schakel { --hv-teken: 56px; inline-size: 60px; block-size: 60px; }
.hv-bediening__hoofd .hv-schakel__ic { inline-size: var(--hv-icoon-l); block-size: var(--hv-icoon-l); }
.hv-bediening__woord { font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-bediening__getal { font-size: var(--hv-getal-l); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
.hv-waarom { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruimte-1); padding: var(--ruimte-2) var(--ruimte-3); border-radius: var(--straal-m); background: var(--panel); border: 1px solid var(--line); font-size: var(--tekst-klein); font-weight: 600; }
.hv-huisstand { display: grid; }
.hv-huisstand__rij { display: flex; align-items: center; gap: var(--ruimte-1); border-block-start: 1px solid var(--line); }
.hv-huisstand__rij:first-child { border-block-start: 0; }
.hv-huisstand__knop { flex: 1 1 auto; display: flex; align-items: center; gap: var(--ruimte-3); min-block-size: calc(var(--hv-tik) + var(--ruimte-2)); font-weight: 600; border-radius: var(--straal-s); }
.hv-huisstand__knop span { flex: 1 1 auto; }
.hv-huisstand__rij.is-gekozen .hv-huisstand__knop { color: var(--text); }
.hv-huisstand__rij:not(.is-gekozen) .hv-huisstand__knop > .hv-ic:first-child { color: var(--muted); }
.hv-meldingen { display: grid; gap: var(--ruimte-1); }
.hv-meldingen .hv-filter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--ruimte-3) * -1); padding-inline: var(--ruimte-3); }
.hv-meldingen .hv-filter::-webkit-scrollbar { display: none; }
.hv-meldingen .hv-berichten { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); padding-inline: var(--ruimte-3); margin-block-start: var(--ruimte-2); }

/* сторінка кімнати */
.hv-kamer, .hv-kamerlijst { display: grid; gap: var(--ruimte-3); min-inline-size: 0; }
.hv-kamerkop { display: flex; align-items: center; gap: var(--ruimte-3); }
.hv-kamerkop__teken { inline-size: 52px; block-size: 52px; border-radius: var(--straal-m); display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--schaduw-1); flex: none; }
.hv-kamerkop__sub { font-size: var(--tekst-klein); color: var(--muted); font-weight: 500; }
.hv-kamerkop__chips { display: flex; gap: 0 var(--ruimte-2); overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--hv-rand) * -1); padding-inline: var(--hv-rand); }
.hv-kamerkop__chips::-webkit-scrollbar { display: none; }

/* ── hv-gevaar: діалог на папері; hv-rail: рейка утримання з подвійною рамкою ── */
.hv-gevaar { position: absolute; z-index: var(--hv-z-gevaar); inset-inline: var(--hv-rand); inset-block-end: calc(var(--hv-rand) + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--ruimte-3); max-block-size: calc(100cqh - 2 * var(--hv-rand)); overflow-y: auto; padding: var(--ruimte-5) var(--ruimte-4) var(--ruimte-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-xl); box-shadow: var(--schaduw-3); animation: hv-laag-op var(--hv-duur-3) var(--hv-kromme-in); }
.hv-gevaar__kop { display: grid; gap: var(--ruimte-1); }
.hv-gevaar__kop h2 { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
.hv-gevaar__kop .hv-risico { font-size: var(--tekst-klein); }
.hv-gevaar__doel { font-size: var(--tekst-klein); color: var(--muted); }
.hv-gevaar__doel span:first-child { font-weight: 600; }
.hv-gevaar__knoppen { display: flex; flex-wrap: wrap; gap: var(--hv-doel-kier); justify-content: flex-end; }
.hv-gevaar__knoppen .hv-knop { flex: 1 1 140px; }
.hv-gevaar__noot { font-size: var(--tekst-mini); color: var(--muted); }
.hv-rail { --rail: var(--warn); --rail-zacht: var(--warn-zacht); position: relative; isolation: isolate; display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-3); min-block-size: var(--hv-rail-hoogte); padding: var(--ruimte-2) var(--ruimte-4); border: var(--hv-rail-rand) solid var(--rail); border-radius: var(--hv-straal-rail); outline: var(--hv-rail-rand) solid var(--rail); outline-offset: var(--hv-rail-rand); margin: calc(var(--hv-rail-rand) * 2); background: var(--panel); font-weight: 600; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; }
.hv-rail--kritiek { --rail: var(--fout-vlak); --rail-zacht: var(--fout-zacht); }
.hv-rail:focus-visible { outline: var(--hv-rail-rand) solid var(--rail); box-shadow: 0 0 0 calc(var(--hv-rail-rand) * 2 + var(--hv-focus-rand) + 2px) var(--focus); }
.hv-rail__vulling { position: absolute; inset-block: 0; inset-inline-start: 0; z-index: -1; inline-size: 0; background: var(--rail-zacht); }
.hv-rail.is-houdt .hv-rail__vulling { inline-size: 100%; transition: inline-size var(--hv-duur-houd) linear; }
.hv-rail__tekst { line-height: 1.25; }
.hv-rail__tel { font-variant-numeric: tabular-nums; font-size: var(--tekst-klein); color: var(--muted); min-inline-size: 3.2em; text-align: end; }
.hv-herbevestig { display: flex; gap: var(--ruimte-3); padding: var(--ruimte-3); border-radius: var(--straal-m); background: var(--surface); }
.hv-herbevestig__teken { inline-size: 44px; block-size: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); flex: none; }
.hv-herbevestig__tekst { font-weight: 600; }
.hv-herbevestig__noot { font-size: var(--tekst-klein); color: var(--muted); margin-block-start: 2px; }

/* ── hv-opdracht: скляний діалог, рядки на папері ── */
.hv-opdracht { position: absolute; z-index: var(--hv-z-opdracht); inset-inline: var(--ruimte-2); inset-block: calc(var(--hv-kop-h) + var(--ruimte-2)) var(--ruimte-2); display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--hv-glas); -webkit-backdrop-filter: var(--hv-glas-filter); backdrop-filter: var(--hv-glas-filter); border: 1px solid var(--hv-glas-rand); border-radius: var(--straal-xl); box-shadow: var(--schaduw-3); overflow: hidden; animation: hv-laag-op var(--hv-duur-3) var(--hv-kromme-in); }
.hv-opdracht__zoek { display: flex; align-items: center; gap: var(--ruimte-2); padding: var(--ruimte-2) var(--ruimte-2) var(--ruimte-2) var(--ruimte-4); border-block-end: 1px solid var(--hv-glas-rand); color: var(--muted); }
.hv-opdracht__zoek input { flex: 1 1 auto; min-inline-size: 0; min-block-size: var(--hv-tik); border: 0; background: transparent; font-size: 18px; font-weight: 500; color: var(--text); }
.hv-opdracht__zoek input::placeholder { color: var(--muted); opacity: 1; }
.hv-opdracht__lijf { overflow-y: auto; padding: var(--ruimte-3); }
.hv-opdracht__lijf > .hv-rijen, .hv-opdracht__gevolg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); padding: var(--ruimte-1) var(--ruimte-4); }
.hv-opdracht__gevolg { display: grid; gap: var(--ruimte-3); padding-block: var(--ruimte-4); }
.hv-opdracht__gevolg h3 { font-size: var(--hv-tekst-kop); font-weight: 650; }
.hv-opdracht__gevolg .hv-knoppen { justify-content: flex-end; }
.hv-opdracht__werkwoorden { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--hv-kier); }
.hv-opdracht__werkwoord { display: grid; gap: var(--ruimte-2); align-content: space-between; justify-items: start; min-block-size: 96px; padding: var(--ruimte-3) var(--ruimte-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); font-weight: 600; line-height: 1.2; }
.hv-opdracht__werkwoord .hv-ic { color: var(--muted); }
.hv-opdracht__werkwoord:active { background: var(--surface2); }

/* ── hv-nood: суцільний аварійний шар, рамка 4 px; неба й скла під ним немає ── */
.hv-nood { position: absolute; inset: 0; z-index: var(--hv-z-nood); display: grid; place-items: center; padding: var(--hv-rand); background: var(--fout-zacht); border: var(--hv-nood-rand) solid var(--fout-vlak); overflow-y: auto; }
.hv-nood__binnen { display: grid; gap: var(--ruimte-3); inline-size: min(100%, 560px); }
.hv-nood__teken { inline-size: 64px; block-size: 64px; border-radius: var(--hv-straal-rail); display: grid; place-items: center; background: var(--fout-vlak); color: var(--text-on-vlak); }
.hv-nood h2 { font-size: clamp(28px, 6cqw, 44px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.hv-nood__wat { font-size: 18px; font-weight: 600; }
.hv-nood__thuis { font-size: var(--tekst-basis); color: var(--muted); }
.hv-nood__knoppen { display: grid; gap: var(--ruimte-2); margin-block-start: var(--ruimte-2); }
.hv-nood__knop { min-block-size: var(--hv-nood-knop); padding: var(--ruimte-2) var(--ruimte-4); border-radius: var(--straal-m); background: var(--panel); border: 2px solid var(--text); font-size: 18px; font-weight: 650; text-align: center; }
.hv-nood__knop--hoofd { background: var(--fout-vlak); border-color: var(--fout-vlak); color: var(--text-on-vlak); }
.hv-nood__sim { display: flex; gap: var(--ruimte-2); font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }

@container doek (max-width: 899px) {
  .heeft-laag .hv-toosten { inset-block: calc(var(--hv-kop-h) + var(--ruimte-2)) auto; }
}
@container doek (min-width: 700px) {
  .hv-gevaar { inset-inline: auto; inset-block: auto; inset-inline-start: 50%; inset-block-start: 50%; transform: translate(-50%, -50%); inline-size: min(520px, calc(100cqw - 2 * var(--hv-rand))); animation-name: hv-vervaag; }
  .hv-gevaar__knoppen .hv-knop { flex: 0 1 auto; }
  .hv-opdracht { inset-inline: auto; inset-block: 12cqh auto; inset-inline-start: 50%; transform: translateX(-50%); inline-size: min(var(--hv-opdracht-breedte), calc(100cqw - 2 * var(--hv-rand))); max-block-size: 70cqh; animation-name: hv-vervaag; }
  .hv-opdracht__werkwoorden { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hv-nood__knoppen { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
}
/* настінна панель від 900 px — аркуш праворуч 360 px; комп'ютер — 400 px; вміст сторінки зсувається, затемнення немає */
@container doek (min-width: 900px) {
  .hv-laag { inset-inline: auto var(--ruimte-3); inset-block: calc(var(--hv-kop-h) + var(--ruimte-3)) var(--ruimte-3); inline-size: var(--hv-laag-breedte-wand); max-block-size: none; min-block-size: 0; border-block-end: 1px solid var(--hv-glas-rand); border-radius: var(--straal-xl); box-shadow: var(--schaduw-2); animation-name: hv-laag-zij; }
  .hv-laag__greep { display: none; }
  .hv-laag__kop { padding-block-start: var(--ruimte-3); }
  .hv-dek--laag { display: none; }
  .heeft-laag .hv-pagina { margin-inline: 0; max-inline-size: none; padding-inline-end: calc(var(--hv-laag-breedte-wand) + var(--ruimte-3) + var(--hv-rand)); }
  .heeft-laag .hv-toosten { inset-inline-end: calc(var(--hv-laag-breedte-wand) + var(--ruimte-3) + var(--hv-rand)); }
}
@container doek (min-width: 1100px) {
  .hv-laag { inline-size: var(--hv-laag-breedte); }
  .hv-laag--breed { inline-size: calc(var(--hv-laag-breedte) + 80px); }
  .heeft-laag .hv-pagina { padding-inline-end: calc(var(--hv-laag-breedte) + var(--ruimte-3) + var(--hv-rand)); }
  .heeft-laag .hv-toosten { inset-inline-end: calc(var(--hv-laag-breedte) + var(--ruimte-3) + var(--hv-rand)); }
  .heeft-laag .hv-thuis__rooster { grid-template-columns: minmax(0, 1fr); }
  .heeft-laag .hv-held__beeld { display: none; }
}
@container doek (min-width: 1800px) {
  .heeft-laag .hv-thuis__rooster { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
  .heeft-laag .hv-held__beeld { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  .hv-laag, .hv-gevaar, .hv-opdracht, .hv-dek { animation: none; }
}
@media (hover: hover) {
  .hv-opdracht__werkwoord:hover, .hv-huisstand__knop:hover { background: var(--surface); }
}

/* stijl/gezichten.css */
/* gezichten.css — «обличчя» спеціальних профілів (§7 дизайн-мови): horloge, strook, vierkant, rond, klein, deur, inkt, tv.
   Без навігації й прокручування; небо тихе (градієнт без сяйва) або вимкнене; скла немає. */

.hv-gezicht { position: relative; block-size: 100%; inline-size: 100%; display: grid; align-content: center; gap: var(--ruimte-1); padding: var(--hv-gezicht-vulling); min-block-size: 0; overflow: hidden; }
.hv-gezicht__kop { display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-2); }
.hv-gezicht__bijschrift { display: inline-flex; align-items: center; gap: var(--ruimte-1); font-size: var(--tekst-mini); font-weight: 600; color: var(--muted); }
.hv-gezicht__getal { font-size: var(--hv-getal-xl); font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--text); }
.hv-gezicht__toestand { font-size: var(--tekst-klein); font-weight: 600; line-height: 1.25; color: var(--text); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.hv-gezicht__actie { inline-size: 100%; margin-block-start: var(--ruimte-1); }
.hv-gezicht__rij { display: flex; align-items: center; justify-content: space-between; gap: var(--ruimte-2); }
.hv-gezicht__sim { display: inline-flex; align-items: center; gap: 4px; font-size: var(--tekst-mini); font-weight: 600; color: var(--info); white-space: nowrap; }
.hv-gezicht__blader { position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; block-size: var(--hv-tik); }
.hv-gezicht__stippen { display: inline-flex; gap: 6px; }
.hv-gezicht__stippen i { inline-size: var(--hv-gezicht-stip); block-size: var(--hv-gezicht-stip); border-radius: 50%; border: 1px solid var(--text); }
.hv-gezicht__stippen i.is-actief { background: var(--text); }
.is-speciaal .hv-versheid { padding: 2px var(--ruimte-2); }

/* horloge 200–400 */
.hv-profiel-horloge .hv-gezicht { padding: var(--ruimte-3) var(--ruimte-3) calc(var(--hv-tik) + var(--ruimte-1)); align-content: start; }
.hv-profiel-horloge .hv-gezicht__getal { font-size: var(--hv-getal-l); }
.hv-profiel-horloge .hv-gezicht__actie { min-block-size: var(--hv-tik); }
.hv-profiel-horloge .hv-toosten { inset: var(--ruimte-1); inline-size: auto; align-content: start; }
.hv-profiel-horloge .hv-toost { grid-template-columns: minmax(0, 1fr) auto; padding: var(--ruimte-1) var(--ruimte-1) var(--ruimte-1) var(--ruimte-2); }
.hv-profiel-horloge .hv-toost__teken, .hv-profiel-horloge .hv-toost__maker, .hv-profiel-horloge .hv-toost__regel { display: none; }

/* strook 1920×480 / 1280×400: п'ять зон і стрічка доби внизу */
.hv-profiel-strook .hv-gezicht { padding: 0; grid-template-rows: minmax(0, 1fr) auto; align-content: stretch; gap: 0; }
.hv-strook { display: grid; grid-template-columns: 3fr 3fr 3fr 3fr 4fr; align-items: stretch; min-block-size: 0; }
.hv-strook > section { display: grid; align-content: center; gap: var(--ruimte-1); padding: var(--ruimte-4) var(--ruimte-5); border-inline-start: 1px solid var(--line); background: var(--panel); min-inline-size: 0; min-block-size: 0; overflow: hidden; }
.hv-strook > section:first-child { border-inline-start: 0; background: transparent; }
.hv-strook__klok { font-size: 88px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; }
.hv-strook__datum { display: flex; flex-wrap: wrap; gap: 0 var(--ruimte-2); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-strook__zin { font-size: var(--hv-tekst-kop); font-weight: 600; line-height: 1.2; text-wrap: balance; }
.hv-strook__label { font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-strook__getal { font-size: var(--hv-getal-xl); font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.hv-strook__prijs { font-size: var(--hv-getal-m); font-weight: 600; letter-spacing: -0.02em; }
.hv-strook__prijs span { font-size: var(--tekst-mini); color: var(--muted); letter-spacing: 0; }
.hv-strook__stromen ul, .hv-strook__uitz ul { display: grid; gap: var(--ruimte-2); }
.hv-strook__stromen li { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ruimte-2); font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); border-inline-start: 3px solid var(--toon); padding-inline-start: var(--ruimte-2); }
.hv-strook__stromen strong { font-size: var(--hv-tekst-kop); color: var(--text); }
.hv-strook__uitz li { display: flex; gap: var(--ruimte-2); font-size: var(--tekst-klein); font-weight: 600; line-height: 1.3; }
.hv-strook__uitz li span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.hv-strook__fav { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ruimte-2) !important; align-content: center; }
.hv-profiel-strook .hv-dagstrook { background: var(--panel); border-block-start: 1px solid var(--line); padding: 6px var(--ruimte-5) 0; block-size: var(--hv-dagstrook-strook, 76px); overflow: hidden; }
.hv-profiel-strook .hv-dagstrook .hv-grafiek__banen { padding-block-start: 0; gap: 2px; }
.hv-profiel-strook .hv-dagstrook .hv-grafiek__wissel, .hv-profiel-strook .hv-dagstrook .hv-grafiek__nu span { display: none; }
.hv-profiel-strook .hv-toosten { inset-block-end: 88px; }
@container doek (max-width: 1599px) {
  .hv-strook { grid-template-columns: 3fr 3fr 2fr 3fr 3fr; }
  .hv-strook > section { padding: var(--ruimte-3) var(--ruimte-4); }
  .hv-strook__klok { font-size: 64px; }
  .hv-strook__fav { grid-template-columns: minmax(0, 1fr); }
  .hv-strook__getal { font-size: var(--hv-getal-l); }
}

/* vierkant і rond 480–720 */
.hv-profiel-vierkant .hv-gezicht, .hv-profiel-rond .hv-gezicht { padding: 0; place-items: center; }
.hv-gezicht__binnen { display: grid; gap: var(--ruimte-2); inline-size: min(76%, 420px); }
.hv-profiel-vierkant .hv-gezicht__binnen { inline-size: min(84%, 520px); padding: var(--ruimte-5); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-xl); box-shadow: var(--schaduw-1); }
.hv-profiel-vierkant .hv-gezicht__getal, .hv-profiel-rond .hv-gezicht__getal { font-size: 80px; }
.hv-profiel-rond .hv-gezicht__binnen { inline-size: 62%; text-align: center; justify-items: center; }
.hv-profiel-rond .hv-gezicht__kop { justify-content: center; }
.hv-profiel-rond .hv-gezicht__rij { gap: var(--ruimte-4); }
.hv-gezicht__boog { position: absolute; inset: 10px; inline-size: calc(100% - 20px); block-size: calc(100% - 20px); }
.hv-gezicht__boog .hv-ring__baan { stroke: var(--toon-zacht); stroke-width: 2.6; stroke-linecap: round; }
.hv-gezicht__boog .hv-ring__boog { stroke-width: 2.6; stroke-linecap: round; }
.hv-doek.hv-profiel-rond { border-radius: 50%; }

/* klein 800×480: два обличчя поруч і ряд кнопок */
.hv-profiel-klein .hv-gezicht { padding: var(--ruimte-4); align-content: stretch; }
.hv-klein { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) auto; gap: var(--ruimte-3); block-size: 100%; }
.hv-klein__vlak { display: grid; align-content: center; gap: var(--ruimte-2); padding: var(--ruimte-5); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-xl); min-inline-size: 0; }
.hv-klein__vlak .hv-gezicht__getal { font-size: 80px; }
.hv-klein__vlak .hv-gezicht__toestand { font-size: var(--tekst-basis); }
.hv-klein__knoppen { grid-column: 1 / -1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--ruimte-2); }
.hv-klein__knoppen .hv-knop { min-block-size: 56px; }

/* deur 480×800 */
.hv-profiel-deur .hv-gezicht { padding: var(--ruimte-5); align-content: stretch; }
.hv-deur { display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto auto; gap: var(--ruimte-3); block-size: 100%; }
.hv-deur .hv-gezicht__getal { font-size: 112px; letter-spacing: -0.05em; margin-block-start: var(--ruimte-5); }
.hv-deur .hv-gezicht__toestand { font-size: var(--hv-tekst-kop); }
.hv-deur__weer { display: flex; align-items: center; gap: var(--ruimte-2); font-size: var(--hv-tekst-kop); font-weight: 600; }
.hv-deur__bel { align-self: center; min-block-size: 112px; font-size: 24px; border-radius: var(--straal-xl); }
.hv-deur__code { display: grid; gap: var(--ruimte-2); padding: var(--ruimte-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); }
.hv-deur__knoppen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ruimte-2); }
.hv-deur__knoppen .hv-knop { min-block-size: 64px; font-size: var(--tekst-basis); }

/* inkt: чорне й біле, кнопки-номери */
.hv-profiel-inkt .hv-gezicht { padding: var(--ruimte-5); align-content: stretch; }
.hv-inkt { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: var(--ruimte-3); block-size: 100%; }
.hv-inkt__zin { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.hv-inkt__uitz { display: grid; gap: var(--ruimte-1); font-size: var(--tekst-basis); font-weight: 600; }
.hv-inkt__uitz li { padding-inline-start: var(--ruimte-3); border-inline-start: 4px solid var(--text); }
.hv-inkt__tegels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ruimte-2); align-content: end; }
.hv-inkt__tegel { position: relative; display: grid; gap: 2px; padding: var(--ruimte-2) var(--ruimte-3) var(--ruimte-2) calc(var(--hv-inkt-nummer) + var(--ruimte-4)); border: 1.5px solid var(--text); border-radius: var(--straal-s); min-block-size: 64px; align-content: center; }
.hv-inkt__tegel.is-aan { background: var(--text); color: var(--panel); }
.hv-inkt__nummer { position: absolute; inset-block-start: var(--ruimte-2); inset-inline-start: var(--ruimte-2); inline-size: var(--hv-inkt-nummer); block-size: var(--hv-inkt-nummer); display: grid; place-items: center; background: var(--text); color: var(--panel); font-size: var(--tekst-klein); font-weight: 700; border-radius: 4px; }
.hv-inkt__tegel.is-aan .hv-inkt__nummer { background: var(--panel); color: var(--text); }
.hv-inkt__naam { font-size: var(--tekst-klein); font-weight: 700; line-height: 1.15; }
.hv-inkt__woord { font-size: var(--tekst-mini); font-weight: 600; }
.hv-inkt__voet { font-size: var(--tekst-mini); font-weight: 600; }

/* tv 1920×1080 (логічно 1280×720, масштаб 1,5): небо на весь екран, ряд карток */
.hv-profiel-tv .hv-gezicht { padding: 5cqh 5cqw; align-content: stretch; }
.hv-tv { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--ruimte-4); block-size: 100%; }
.hv-tv__datum { display: flex; align-items: center; gap: var(--ruimte-3); font-size: var(--hv-tekst-kop); font-weight: 600; color: var(--muted); }
.hv-tv__zin { align-self: center; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; max-inline-size: 16em; }
.hv-tv__rij { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--ruimte-4); }
.hv-tv__kaart { display: grid; gap: var(--ruimte-1); align-content: start; padding: var(--ruimte-4) var(--ruimte-5); background: var(--panel); border: 1px solid var(--line); border-radius: var(--straal-l); box-shadow: var(--schaduw-1); min-inline-size: 0; }
.hv-tv__kaart:focus-visible { outline-width: 3px; outline-offset: 4px; }
.hv-tv__kaart .hv-ic { color: var(--muted); }
.hv-tv__naam { font-size: var(--tekst-klein); font-weight: 600; color: var(--muted); }
.hv-tv__waarde { font-size: var(--hv-getal-l); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
.hv-tv__woord { font-size: var(--hv-getal-m); }
.hv-tv__sub { font-size: var(--tekst-klein); font-weight: 600; }

</style>

      if (ruw) geheugen = JSON.parse(ruw) || {};
    } catch (e) { geheugen = {}; }

    lees: function (naam, standaard) { var v = laad()[naam]; return v === undefined ? standaard : v; },

    geen: ['без ефекту', 'geen effect'], kaars: ['свічка', 'kaars'], adem: ['дихання', 'ademen'], regenboog: ['веселка', 'regenboog'], stroboscoop: ['стробоскоп', 'stroboscoop'],
    uit: ['вимкнено', 'uit'], verwarmen: ['обігрів', 'verwarmen'], auto: ['авто', 'auto'], koelen: ['охолодження', 'koelen'], drogen: ['осушення', 'drogen'], boiler: ['лише вода', 'alleen water'],
    pauze: ['пауза', 'pauze'], slim: ['розумно', 'slim'], snel: ['швидко', 'snel'], hdmi1: ['вхід 1', 'ingang 1'], hdmi2: ['вхід 2', 'ingang 2'], tv: ['ефір', 'tv-kijken']
  };
  HV.waardeNaam = WAARDE_NAAM;
  HV.beschrijf = beschrijf;
  /** Бажане значення під час очікування підтвердження, інакше спостережене. */
  HV.gewenst = function (a, mogelijkheid) { return a.wacht && a.wacht.mogelijkheid === mogelijkheid ? a.wacht.waarde : huidige(a, mogelijkheid); };

  function huidige(a, mogelijkheid) {
    var st = a.st;
    switch (mogelijkheid) {
      case 'aan': return HV.kijk.isAan(a);
      case 'afspelen': return !!st.speelt;
      case 'laden': return !!st.laadt;
      case 'alarmstand': return st.stand;
      case 'kleur': return { tint: st.tint, verzadiging: st.verzadiging };
      case 'helderheid': return a.leden ? HV.kijk.groepHelderheid(a) : st.helderheid;
      case 'programma': return st.loopt ? 'start' : 'stop';
      case 'robot': return st.stand === 'bezig' ? 'start' : st.stand;
      default: return st[mogelijkheid];
    }
  }
  HV.huidige = huidige;

  /** Спостережений стан змінюється тут — після «підтверджено». */
  function pasToe(a, mogelijkheid, v, w) {
    var st = a.st;
    if (a.leden && (mogelijkheid === 'aan' || mogelijkheid === 'helderheid' || mogelijkheid === 'afspelen' || mogelijkheid === 'volume')) {
      a.leden.forEach(function (id) {
        var lid = w.apparaten[id];
        if (lid.beschikbaar === 'onbereikbaar') return;
        if (mogelijkheid === 'helderheid' && !('helderheid' in lid.st)) return;
        pasToe(lid, mogelijkheid, v, w);
      });
      if (mogelijkheid === 'afspelen') st.speelt = v;
      if (mogelijkheid === 'volume') st.volume = v;
      return;
    }
    switch (mogelijkheid) {
      case 'aan': st.aan = v; if (v) st.sinds = w.tijd; else st.uitOm = null; break;
      case 'afspelen': st.speelt = v; break;
      case 'laden': st.laadt = v; break;
      case 'open': st.open = v; st.sinds = w.tijd; break;
      case 'vergrendeld': st.vergrendeld = v; break;
      case 'alarmstand': st.stand = v; break;
      case 'helderheid': st.helderheid = Math.max(1, Math.min(100, v)); if (!st.aan && 'aan' in st) st.aan = true; break;
      case 'kleurtemp': st.kleurtemp = v; st.verzadiging = 0; if ('aan' in st && !st.aan) st.aan = true; break;
      case 'kleur': st.tint = Number(v.tint); st.verzadiging = Number(v.verzadiging); if ('aan' in st && !st.aan) st.aan = true; break;
      case 'programma': st.loopt = v === 'start'; st.rest = st.loopt ? 95 : 0; st.vermogen = st.loopt ? 560 : 0; break;
      case 'robot': st.stand = v === 'start' ? 'bezig' : v === 'pauze' ? 'pauze' : 'dock'; break;
      case 'herstart': st.herstart = w.tijd; break;
      case 'signaal': st.laatst = v; break;
      case 'aftel': st.uitOm = v; break;
      default: st[mogelijkheid] = v;
    }
  }

  function kopie(x) { return JSON.parse(JSON.stringify(x)); }

  // ── Niet-apparaatdoelen: режим дому, сцена, кімната, усе світло ──
  var STAND_NAAM = { thuis: ['Вдома', 'Thuis'], afwezig: ['Не вдома', 'Afwezig'], nacht: ['Ніч', 'Nacht'], vakantie: ['Відпустка', 'Vakantie'], gasten: ['Гості', 'Gasten'] };
  HV.huisstanden = STAND_NAAM;

  function lampenUit(w, filter) {
    var n = 0, over = 0;
    HV.kijk.alle(function (a) { return a.soort === 'licht' && (!filter || filter(a)); }).forEach(function (a) {
      if (a.beschikbaar === 'onbereikbaar') { over++; return; }
      if (a.st.aan) { a.st.aan = false; n++; }
    });
    return { n: n, over: over };
  }

  /** Виконує складену дію над світом і повертає { wat, was, werd, tekst, betrokken:[ids] }. */
  function samengesteld(d, mogelijkheid, v, w, door) {
    var A = w.apparaten;
    if (d.soort === 'huis' && mogelijkheid === 'stand') {
      var was = w.huisstand;
      w.huisstand = v;
      var extra = ['', ''];
      if (v === 'afwezig' || v === 'vakantie') {
        var r = lampenUit(w);
        ['tv', 'speakerkeuken', 'speakerwoon'].forEach(function (id) { if ('aan' in A[id].st) A[id].st.aan = false; A[id].st.speelt = false; });
        A.thermostaat.st.doel = v === 'vakantie' ? 15 : 17;
        extra = ['світло й медіа вимкнено (' + r.n + '), опалення ' + HV.getal(A.thermostaat.st.doel) + ' °C', 'licht en media uit (' + r.n + '), verwarming ' + HV.getal(A.thermostaat.st.doel) + ' °C'];
      } else if (v === 'nacht') {
        var r2 = lampenUit(w, function (a) { return a.id !== 'kinderlicht' && a.id !== 'slaaplicht'; });
        A.thermostaat.st.doel = 17.5; A.tv.st.aan = false;
        extra = ['світло внизу вимкнено (' + r2.n + '), опалення 17,5 °C', 'licht beneden uit (' + r2.n + '), verwarming 17,5 °C'];
      } else if (v === 'thuis') {
        A.thermostaat.st.doel = 21;
        extra = ['опалення 21 °C', 'verwarming 21 °C'];
      }
      return { wat: ['Режим дому: «' + STAND_NAAM[v][0] + '»', 'Huisstand: ‘' + STAND_NAAM[v][1] + '’'], was: STAND_NAAM[was], werd: STAND_NAAM[v], tekst: extra, soort: 'huis.systeem' };
    }
    if (d.soort === 'scene') {
      var scene = w.scenes.filter(function (s) { return s.id === d.id; })[0];
      var gedaan = 0, overgeslagen = 0, geweigerd = 0;
      var sceneDoor = { soort: 'scene', id: 'scene', naam: scene.naam };
      scene.stappen.forEach(function (stap) {
        var a = A[stap.doel];
        if (!a || a.beschikbaar === 'onbereikbaar') { overgeslagen++; return; }
        var actie = HV.gevaar.vind(a, stap.mogelijkheid, stap.waarde);
        // небезпечний чи критичний крок сцена виконує лише за дозволом hv-stand «Завжди»
        if (HV.gevaar.isZwaar(actie) && HV.gevaar.stand('scene', actie.sleutel) !== 'altijd') { geweigerd++; return; }
        pasToe(a, stap.mogelijkheid, stap.waarde, w);
        a.maker = { soort: 'scene', naam: scene.naam, tijd: w.tijd, echt: Date.now() };
        gedaan++;
      });
      w.sceneActief = scene.id;
      var totaal = scene.stappen.length;
      var tekst = gedaan === totaal ? [gedaan + ' із ' + totaal + ' кроків виконано', gedaan + ' van ' + totaal + ' stappen uitgevoerd']
        : [gedaan + ' із ' + totaal + (overgeslagen ? ', недоступних: ' + overgeslagen : '') + (geweigerd ? ', без дозволу: ' + geweigerd : ''), gedaan + ' van ' + totaal + (overgeslagen ? ', niet bereikbaar: ' + overgeslagen : '') + (geweigerd ? ', zonder toestemming: ' + geweigerd : '')];
      void sceneDoor; void door;
      return { wat: ['Сцена «' + scene.naam[0] + '»', 'Scène ‘' + scene.naam[1] + '’'], tekst: tekst, soort: 'huis.automatisering' };
    }
    if (d.soort === 'kamer') {
      var kamer = HV.staat.kamer(d.id);
      if (mogelijkheid === 'doel') {
        var oud = kamer.doel;
        kamer.doel = v;
        return { wat: [kamer.naam[0] + ': ціль температури', kamer.naam[1] + ': doeltemperatuur'], was: oud == null ? null : [HV.getal(oud, 1) + ' °C', HV.getal(oud, 1) + ' °C'], werd: [HV.getal(v, 1) + ' °C', HV.getal(v, 1) + ' °C'], soort: 'huis.apparaat' };
      }
      if (mogelijkheid === 'licht') {
        var n = 0;
        HV.kijk.lampen(d.id).forEach(function (a) { if (a.beschikbaar !== 'onbereikbaar' && a.st.aan !== v) { a.st.aan = v; n++; a.maker = { soort: door.soort, naam: door.naam, tijd: w.tijd, echt: Date.now() }; } });
        return { wat: [kamer.naam[0] + ': світло ' + (v ? 'увімкнено' : 'вимкнено'), kamer.naam[1] + ': licht ' + (v ? 'aan' : 'uit')], tekst: [n + ' ' + HV.meervoud(n, ['лампа', 'лампи', 'ламп'], ['lamp', 'lampen']), n + ' ' + (n === 1 ? 'lamp' : 'lampen')], soort: 'huis.apparaat' };
      }
    }
    if (d.soort === 'alle' && mogelijkheid === 'licht') {
      var r3 = lampenUit(w);
      return { wat: ['Усе світло вимкнено', 'Alle lampen uit'], tekst: ['вимкнено: ' + r3.n + (r3.over ? '; недоступних пропущено: ' + r3.over : ''), 'uitgezet: ' + r3.n + (r3.over ? '; niet bereikbaar, overgeslagen: ' + r3.over : '')], soort: 'huis.apparaat' };
    }
    if (d.soort === 'alle' && mogelijkheid === 'alles') {
      var r4 = lampenUit(w);
      ['tv', 'speakerkeuken', 'speakerwoon', 'stekkermedia', 'stekkerbureau', 'koffie', 'oven', 'computer', 'printer'].forEach(function (id) { var s = A[id].st; if ('aan' in s) s.aan = false; if ('speelt' in s) s.speelt = false; });
      ['wasmachine', 'droger', 'vaatwasser'].forEach(function (id) { A[id].st.loopt = false; A[id].st.vermogen = 0; });
      return { wat: ['Усе в домі вимкнено', 'Alles in huis uit'], tekst: ['світло (' + r4.n + '), медіа, розетки й техніка', 'licht (' + r4.n + '), media, stekkers en apparaten'], soort: 'huis.apparaat', gewicht: 'belangrijk' };
    }
    return null;
  }

  // ── Uitvoeren ──
  function weiger(reden, titel, tekst, door) {
    if (!door || door.soort === 'mens') HV.meld({ gewicht: 'belangrijk', icoon: reden === 'rol' ? 'lock' : 'circle-x', titel: titel, tekst: tekst });
    return Promise.resolve({ ok: false, reden: reden });
  }

  function voerUit(o, d, actie, door, toegestaan) {
    var w = HV.staat.w;
    var v = norm(o.mogelijkheid, o.waarde);

    // складені цілі: одна операція зі знімком для «Повернути»
    if (d.soort !== 'apparaat') {
      var voor = kopie({ apparaten: w.apparaten, huisstand: w.huisstand, kamers: w.kamers, sceneActief: w.sceneActief });
      var uitkomst = null;
      HV.staat.wijzig(function (x) { uitkomst = samengesteld(d, o.mogelijkheid, v, x, door); });
      if (!uitkomst) return Promise.resolve({ ok: false, reden: 'onbekend' });
      var regel = HV.logboek.voegToe({ maker: door, wat: uitkomst.wat, waarom: o.waarom || null, was: uitkomst.was, werd: uitkomst.werd, toegestaan: toegestaan, soort: uitkomst.soort, gewicht: uitkomst.gewicht });
      HV.klok.stap(0);
      if (!o.stil) {
        HV.meld({
          maker: door, titel: HV.p(uitkomst.wat), tekst: uitkomst.tekst ? HV.p(uitkomst.tekst) : '',
          terug: function () {
            HV.staat.wijzig(function (x) { x.apparaten = voor.apparaten; x.huisstand = voor.huisstand; x.kamers = voor.kamers; x.sceneActief = voor.sceneActief; });
            HV.logboek.voegToe({ maker: door, wat: ['Повернуто: ' + regel.wat[0], 'Ongedaan gemaakt: ' + regel.wat[1]], soort: regel.soort });
            HV.klok.stap(0);
          }
        });
      }
      return Promise.resolve({ ok: true });
    }

    var a = d.a;
    var wasWaarde = huidige(a, o.mogelijkheid);
    var was = wasWaarde === undefined ? null : beschrijf(a, o.mogelijkheid, wasWaarde);
    var werd = beschrijf(a, o.mogelijkheid, v);
    var echt = Date.now();
    HV.staat.wijzig(function () { a.wacht = { mogelijkheid: o.mogelijkheid, waarde: v, fase: 'verzonden', sinds: echt }; });

    return new Promise(function (klaar) {
      var slaapt = a.beschikbaar === 'slaapt';
      var mislukt = !!(w.sim && w.sim.geenBevestiging);
      setTimeout(function () { if (a.wacht && a.wacht.sinds === echt) HV.staat.wijzig(function () { a.wacht.fase = 'aangenomen'; }); }, VERTRAGING.aangenomen);
      setTimeout(function () {
        if (!a.wacht || a.wacht.sinds !== echt) { klaar({ ok: true, vervangen: true }); return; } // нова команда замінила цю
        if (mislukt) {
          HV.staat.wijzig(function () { a.wacht = null; });
          HV.meld({ gewicht: 'belangrijk', icoon: 'circle-x', titel: HV.p(a.naam), tekst: HV.t('Не підтверджено за 3 с — стан повернуто.', 'Niet bevestigd binnen 3 s — teruggezet.') });
          HV.logboek.voegToe({ maker: door, wat: [a.naam[0] + ': не підтверджено', a.naam[1] + ': niet bevestigd'], soort: 'huis.apparaat', gewicht: 'belangrijk', doel: a.id });
          klaar({ ok: false, reden: 'niet-bevestigd' });
          return;
        }
        HV.staat.wijzig(function (x) {
          pasToe(a, o.mogelijkheid, v, x);
          a.wacht = null;
          a.maker = { soort: door.soort, naam: door.naam, tijd: x.tijd, echt: Date.now() };
          if (a.beschikbaar === 'ok') a.gezien = x.tijd;
        });
        var regel = HV.logboek.voegToe({ maker: door, wat: [a.naam[0] + ': ' + werd[0], a.naam[1] + ': ' + werd[1]], waarom: o.waarom || null, was: was, werd: werd, toegestaan: toegestaan, soort: 'huis.apparaat', doel: a.id, gewicht: HV.gevaar.isZwaar(actie) ? 'belangrijk' : 'info' });
        HV.klok.stap(0);
        if (!o.stil) {
          var kanTerug = wasWaarde !== undefined && o.mogelijkheid !== 'herstart' && o.mogelijkheid !== 'signaal' && (actie.niveau !== 'gewoon' || door.soort !== 'mens');
          HV.meld({
            maker: door, icoon: HV.paspoort.soorten[a.soort].icoon,
            titel: HV.p(regel.wat),
            tekst: a.beschikbaar === 'verondersteld' ? HV.t('Без зворотного зв’язку: стан припущено.', 'Zonder terugmelding: toestand verondersteld.') : (was ? HV.p(was) + ' → ' + HV.p(werd) : ''),
            terug: kanTerug ? function () { HV.doe({ doel: a.id, mogelijkheid: o.mogelijkheid, waarde: wasWaarde, door: door, stil: true, zonderRitueel: true, waarom: ['повернуто', 'ongedaan gemaakt'] }); } : null,
            hoe: o.mogelijkheid === 'herstart' ? HV.t('Як повернути: відкату немає — мережа повернеться сама.', 'Terugdraaien: kan niet — het netwerk komt vanzelf terug.') : null
          });
        }
        klaar({ ok: true });
      }, mislukt ? VERTRAGING.mislukt : slaapt ? VERTRAGING.slaapt : VERTRAGING.bevestigd);
    });
  }

  /**
   * Виконати дію. Повертає Promise<{ ok, reden? }>.
   *   doel          — id пристрою | 'huis' | 'alle' | 'scene:<id>' | 'kamer:<id>'
   *   mogelijkheid  — 'aan', 'helderheid', 'kleurtemp', 'kleur', 'effect', 'positie', 'doel', 'stand', 'start', 'licht', …
   *   waarde        — нове значення
   *   door          — виконавець { soort:'mens'|'scene'|'automatisering'|'optimalisatie'|'agent'|'knop', id, naam:[uk,nl] };
   *                   типово — людина за пультом (поточна роль)
   *   stil          — без спливного сповіщення (Журнал пишеться завжди)
   */
  HV.doe = function (o) {
    var w = HV.staat.w;
    var door = o.door || HV.mens();
    var d = HV.gevaar.doelSoort(o.doel);
    var waarde = norm(o.mogelijkheid, o.waarde);
    var actie = HV.gevaar.vind(d.soort === 'apparaat' ? d.a : o.doel, o.mogelijkheid, waarde);
    var naam = d.soort === 'apparaat' ? HV.p(d.a.naam) : HV.p(actie.naam);

    // 1. зв'язок
    if (w.gegevens === 'geen') {
      return weiger('verbinding', HV.t('Не виконано: немає зв’язку з домом', 'Niet uitgevoerd: geen verbinding met het huis'), HV.t('Показано останній знімок, лише перегляд. Черги команд немає.', 'Je ziet de laatste momentopname, alleen bekijken. Er is geen wachtrij.'), door);
    }
    // 2. доступність
    if (d.soort === 'apparaat' && d.a.beschikbaar === 'onbereikbaar') {
      return weiger('onbereikbaar', naam + ': ' + HV.woord.onbereikbaar(), HV.t('Відкрийте пристрій, щоб побачити, що перевірити.', 'Open het apparaat om te zien wat je kunt controleren.'), door);
    }
    if (d.soort !== 'apparaat' && !samengesteldBestaat(d, o.mogelijkheid)) return Promise.resolve({ ok: false, reden: 'onbekend' });

    // 3–4. людина: роль і ритуал рівня
    if (door.soort === 'mens') {
      if (o.zonderRitueel) return voerUit(o, d, actie, door, null);
      var mag = HV.gevaar.rolMag(door.rol || HV.rol(), actie);
      if (!mag.mag) return weiger('rol', HV.t('Не виконано: ', 'Niet uitgevoerd: ') + HV.p(mag.reden), HV.t('Попросіть власника або мешканця.', 'Vraag het de eigenaar of een bewoner.'), door);
      if (HV.gevaar.isZwaar(actie)) {
        if (!HV.schil || !HV.schil.gevaar) return voerUit(o, d, actie, door, null);
        return HV.schil.gevaar({ actie: actie, naam: naam, apparaat: d.a || null, waarde: waarde }).then(function (ja) {
          if (!ja) return { ok: false, reden: 'geannuleerd' };
          return voerUit(o, d, actie, door, null);
        });
      }
      return voerUit(o, d, actie, door, null);
    }

    // 5. виконавець без людини: дозвіл hv-stand
    if (w.zelfGestopt) {
      HV.logboek.voegToe({ maker: door, wat: ['Не виконано: ' + HV.gevaar.actie(actie.sleutel).naam[0], 'Niet uitgevoerd: ' + HV.gevaar.actie(actie.sleutel).naam[1]], waarom: ['самостійні дії зупинено', 'zelfstandige acties zijn gestopt'], soort: 'huis.systeem' });
      HV.staat.wijzig();
      return Promise.resolve({ ok: false, reden: 'gestopt' });
    }
    var uitvoerderId = door.id || door.soort;
    var stand = HV.gevaar.stand(uitvoerderId, actie.sleutel);
    if (o.goedgekeurd) stand = 'altijd';
    if (stand === 'uit') {
      HV.logboek.voegToe({ maker: door, wat: ['Не виконано: ' + actie.naam[0] + (d.a ? ' — ' + d.a.naam[0] : ''), 'Niet uitgevoerd: ' + actie.naam[1] + (d.a ? ' — ' + d.a.naam[1] : '')], waarom: ['дозвіл «Вимкнено»', 'toestemming ‘Uit’'], soort: door.soort === 'agent' ? 'huis.agent' : 'huis.automatisering' });
      HV.meld({ maker: door, icoon: 'lock', titel: HV.t('Не виконано: дозвіл «Вимкнено»', 'Niet uitgevoerd: toestemming ‘Uit’'), tekst: HV.p(door.naam) + ' · ' + HV.p(actie.naam) });
      HV.staat.wijzig();
      return Promise.resolve({ ok: false, reden: 'stand-uit' });
    }
    if (stand === 'vragen') {
      var id = 'v' + (w.verzoeken.length + 1) + '-' + Date.now() % 10000;
      HV.staat.wijzig(function (x) {
        x.verzoeken.push({ id: id, uitvoerder: uitvoerderId, sleutel: actie.sleutel, doel: o.doel, mogelijkheid: o.mogelijkheid, waarde: waarde, sinds: x.tijd, tot: x.tijd + 5 * 60000, stand: 'wacht', wat: [actie.naam[0] + (d.a ? ': ' + d.a.naam[0] : ''), actie.naam[1] + (d.a ? ': ' + d.a.naam[1] : '')], waarom: o.waarom || null });

      case 'temperatuur': b.woord = ''; b.waarde = HV.maat(st.waarde, '°C', 1); break;
      case 'vocht': case 'batterij': b.waarde = HV.maat(st.waarde, '%'); if (a.soort === 'batterij' && st.waarde < 15) { b.woord = t('замініть батарейку', 'batterij vervangen'); b.toon = 'let-op'; b.aan = true; } break;
      case 'co2': b.waarde = HV.maat(st.waarde, 'ppm'); b.woord = st.waarde > 1200 ? t('провітріть', 'ventileren') : t('добре', 'goed'); break;
      case 'co': b.aan = !!st.alarm; b.woord = st.alarm ? t('тривога', 'alarm') : t('чисто', 'geen koolmonoxide'); if (st.alarm) b.toon = 'alarm'; break;
      case 'lichtsterkte': b.waarde = HV.maat(st.waarde, t('лк', 'lux')); break;
      case 'beweging': b.aan = !!st.actief; b.woord = st.actief ? t('рух зараз', 'beweging nu') : t('рух ', 'beweging ') + HV.duur(st.laatst) + t(' тому', ' geleden'); break;
      case 'aanwezigheid': b.aan = !!st.actief; b.woord = st.actief ? t('хтось є', 'iemand aanwezig') : t('нікого', 'niemand'); break;
      case 'contact': b.aan = !!st.open; b.woord = st.open ? HV.woord.open() : HV.woord.dicht(); b.icoon = st.open ? 'door-open' : 'door-closed'; if (st.open) b.toon = 'let-op'; break;
      case 'lek': case 'rook': b.aan = !!st.alarm; b.woord = st.alarm ? t('тривога', 'alarm') : t('спокійно', 'rustig'); if (st.alarm) b.toon = 'alarm'; break;
      case 'wasmachine': case 'droger': case 'vaatwasser': b.aan = !!st.loopt; b.woord = st.loopt ? t('ще ', 'nog ') + HV.duur(st.rest) : t('готова', 'klaar'); b.passief = true; b.aftel = st.loopt ? Math.min(1, st.rest / 95) : null; break;
      case 'oven': b.aan = !!st.aan; b.woord = st.aan ? HV.woord.verwarmt() : HV.woord.uit(); b.waarde = st.aan ? HV.maat(st.temperatuur, '°C') : ''; b.schakel = { mogelijkheid: 'aan' }; break;
      case 'koelkast': b.aan = false; b.woord = st.deurOpen ? t('дверцята відчинено', 'deur open') : ''; b.waarde = HV.maat(st.temperatuur, '°C', 1); b.passief = true; break;
      case 'koffie': b.aan = !!st.aan; b.woord = st.aan ? t('готує', 'zet koffie') : t('готова', 'klaar'); b.schakel = { mogelijkheid: 'aan' }; break;
      case 'computer': b.aan = !!st.aan; b.woord = st.aan ? t('працює', 'aan') : t('спить', 'slaapt'); b.schakel = { mogelijkheid: 'aan' }; break;
      case 'nas': b.aan = !!st.aan; b.woord = st.aan ? t('працює', 'aan') : HV.woord.uit(); b.waarde = HV.maat(st.vol, '%'); b.schakel = { mogelijkheid: 'aan' }; break;
      case 'printer': b.aan = !!st.aan; b.woord = aanUit(st.aan); b.schakel = { mogelijkheid: 'aan' }; break;
      case 'router': b.aan = true; b.woord = st.clients + ' ' + HV.meervoud(st.clients, ['пристрій', 'пристрої', 'пристроїв'], ['apparaat', 'apparaten']); b.passief = true; break;
      case 'irzender': case 'sceneknop': b.woord = HV.p(st.laatst); b.passief = true; break;
      case 'camera': b.woord = t('кадр із сервера', 'beeld via de server'); break;
      case 'deurbel': b.woord = st.laatst ? t('дзвінок о ', 'aangebeld om ') + HV.tijd(st.laatst) : t('тихо', 'stil'); break;
      case 'p1meter': b.waarde = HV.maat(st.fasen.reduce(function (x, y) { return x + y; }, 0), t('кВт', 'kW'), 2); break;
      case 'zonnepanelen': b.aan = st.vermogen > 0.05; b.waarde = HV.maat(st.vermogen, t('кВт', 'kW'), 1); b.toon = 'zon'; b.passief = true; break;
      case 'thuisbatterij': b.aan = st.vermogen !== 0; b.woord = st.vermogen > 0.02 ? HV.woord.laadt() : st.vermogen < -0.02 ? t('віддає', 'ontlaadt') : t('чекає', 'stand-by'); b.waarde = HV.maat(st.lading, '%'); b.niveau = st.lading; b.passief = true; break;
      case 'laadpaal': b.aan = !!st.laadt; b.woord = st.laadt ? HV.woord.laadt() : st.aangesloten ? t('під’єднано', 'aangesloten') : t('вільна', 'vrij'); b.waarde = st.laadt ? HV.maat(st.vermogen, t('кВт', 'kW'), 1) : ''; b.schakel = { mogelijkheid: 'laden' }; break;
      default: b.woord = HV.p(s.naam);
    }
    return b;
  };

  var STAAT_WOORD = { onbereikbaar: 'onbereikbaar', verouderd: 'verouderd', verondersteld: 'verondersteld', slaapt: 'slaapt' };
  /** Чи видно знак автора на пристрої (10 хв часу дому або пів хвилини справжнього). */
  HV.makerZichtbaar = function (a) { return !!a.maker && (HV.staat.w.tijd - a.maker.tijd < 600000 || Date.now() - a.maker.echt < 30000); };

  /**
   * Плитка пристрою: коло перемикає, тіло відкриває аркуш. Заливка рівня — спостережене, риска — бажане.
   * opties: { vorm:'2x1'|'2x2'|'1x1', metKamer }
   */
  o.tegel = function (a, opties) {
    var op = opties || {}, w = HV.staat.w, b = o.beeld(a);
    var vorm = op.vorm || (b.niveau != null && a.soort === 'licht' ? '2x2' : '2x1');
    var staat = a.wacht ? 'wacht' : (a.beschikbaar !== 'ok' ? a.beschikbaar : (w.gegevens === 'verouderd' ? 'verouderd' : null));
    var dood = a.beschikbaar === 'onbereikbaar';
    // бажане значення під час очікування (риска)
    var gewenstAan = a.wacht && (a.wacht.mogelijkheid === 'aan' || a.wacht.mogelijkheid === 'afspelen' || a.wacht.mogelijkheid === 'laden') ? a.wacht.waarde : null;
    var gewenstNiveau = a.wacht && a.wacht.mogelijkheid === 'helderheid' ? a.wacht.waarde : null;
    var aan = dood ? false : (gewenstAan != null ? gewenstAan : b.aan);
    var naam = HV.p(a.naam);
    var kamer = op.metKamer ? HV.staat.kamer(a.kamer) : null;
    var woord = dood ? HV.woord.onbereikbaar() : a.wacht ? HV.woord.wacht() : b.woord;
    var staatWoord = !dood && !a.wacht && STAAT_WOORD[a.beschikbaar] ? HV.woord[STAAT_WOORD[a.beschikbaar]]() : '';
    var leeftijd = HV.kijk.leeftijd(a);
    var waardeRegel = [];
    if (woord) waardeRegel.push('<span class="hv-tegel__woord">' + h(woord) + '</span>');
    if (b.waarde && !dood) waardeRegel.push('<span class="hv-tegel__getal">' + b.waarde + '</span>');
    if (staatWoord) waardeRegel.push('<span class="hv-tegel__staat">' + h(staatWoord) + '</span>');
    if (dood) waardeRegel.push('<span class="hv-tegel__oud">' + h(t('востаннє ', 'laatst ') + HV.tijd(a.gezien)) + '</span>');
    else if (a.beschikbaar === 'verouderd' || w.gegevens !== 'live') waardeRegel.push('<span class="hv-tegel__oud">' + h(HV.oud(leeftijd)) + '</span>');
    var ariaLijf = naam + (kamer ? ', ' + HV.p(kamer.naam) : '') + ': ' + (woord || '') + (staatWoord ? ', ' + staatWoord : '') + '. ' + t('Відкрити', 'Openen');
    var sch = b.schakel;
    var schakel = o.schakel({
      aan: aan, icoon: b.icoon, toon: b.toon, staat: staat, kritiek: b.kritiek, aftel: a.st.uitOm ? Math.max(0, Math.min(1, (a.st.uitOm - w.tijd) / 3600000)) : b.aftel,
      actie: sch && !b.kritiek ? 'schakel' : null, gegevens: sch ? { doel: a.id, mogelijkheid: sch.mogelijkheid, op: sch.op, af: sch.af } : null,
      aria: naam + (kamer ? ', ' + HV.p(kamer.naam) : '') + (sch ? '' : ': ' + woord)
    });
    var niveau = '';
    if (b.niveau != null && !dood) {
      niveau = '<span class="hv-tegel__niveau' + (b.toonNiveau ? ' hv-toon-' + b.toonNiveau : '') + '" aria-hidden="true"><i style="width:' + Math.max(0, Math.min(100, b.niveau)) + '%"></i>' + (gewenstNiveau != null ? '<b style="left:' + gewenstNiveau + '%"></b>' : '') + '</span>';
    }
    var stap = '';
    if (vorm === '2x2' && !dood && a.mog.indexOf('helderheid') >= 0) {
      stap = o.stapper({ actie: 'tegel-stap', gegevens: { doel: a.id, mogelijkheid: 'helderheid' }, stap: 10, label: naam, k: 'stap-' + a.id });
    } else if (vorm === '2x2' && !dood && b.stap) {
      stap = o.stapper({ actie: 'tegel-stap', gegevens: { doel: a.id, mogelijkheid: b.stap.mogelijkheid }, stap: b.stap.stap, label: naam, k: 'stap-' + a.id });
    }
    var altijd = HV.gevaar.altijdZwaar().filter(function (x) { return x.actie.soorten && x.actie.soorten.indexOf(a.soort) >= 0; })[0];
    return '<div class="hv-tegel hv-tegel--' + vorm + (aan ? ' is-aan' : '') + (staat ? ' is-' + staat : '') + (b.toon ? ' hv-toon-' + b.toon : '') + (b.kritiek ? ' hv-tegel--kritiek' : '') + '" data-k="tegel-' + h(a.id) + '">' +
      (altijd ? '<span class="hv-tegel__altijd">' + ic(altijd.actie.niveau === 'kritiek' ? 'risico-kritiek' : 'risico-gevaarlijk', { maat: 'risico', titel: t('Десь стоїть «Завжди» для цієї дії', 'Hier staat ergens ‘Altijd’ voor deze actie') }) + '</span>' : '') +
      schakel +
      '<button type="button" class="hv-tegel__lijf" data-actie="blad" data-blad="apparaat:' + h(a.id) + '" aria-label="' + h(ariaLijf) + '">' +
      '<span class="hv-tegel__naam">' + h(naam) + '</span>' + (kamer ? '<span class="hv-tegel__kamer">' + h(HV.p(kamer.naam)) + '</span>' : '') +
      '<span class="hv-tegel__waarde">' + waardeRegel.join('<span class="hv-punt" aria-hidden="true">·</span>') + '</span></button>' +
      (HV.makerZichtbaar(a) && !a.wacht ? '<span class="hv-tegel__maker">' + o.maker(a.maker, { alleenTeken: true }) + '</span>' : '') +
      stap + niveau + '</div>';
  };

  /** Картка кімнати: назва, температура, знак світла з лічильником, до трьох чипів-винятків, «−/+» цілі. */
  o.kamerkaart = function (kamer) {
    var w = HV.staat.w;
    var temp = HV.kijk.temperatuur(kamer.id);
    var lampen = HV.kijk.lampen(kamer.id), aan = HV.kijk.lampenAan(kamer.id);
    var chips = [];
    HV.kijk.inKamer(kamer.id).forEach(function (a) {
      if (chips.length >= 3) return;
      if (a.soort === 'contact' && a.st.open && HV.kijk.isVers(a)) chips.push(o.chip({ icoon: 'door-open', toon: 'let-op', tekst: HV.p(a.naam) + ': ' + HV.woord.open() }));
      else if (a.beschikbaar === 'onbereikbaar') chips.push(o.chip({ icoon: 'unplug', tekst: HV.p(a.naam) + ': ' + HV.woord.onbereikbaar() }));
      else if ((a.soort === 'rook' || a.soort === 'lek' || a.soort === 'co') && a.st.alarm) chips.push(o.chip({ icoon: 'alarm-smoke', toon: 'alarm', tekst: HV.p(a.naam) + ': ' + t('тривога', 'alarm') }));
      else if ((a.soort === 'wasmachine' || a.soort === 'vaatwasser' || a.soort === 'droger') && a.st.loopt) chips.push(o.chip({ icoon: HV.paspoort.soorten[a.soort].icoon, tekst: HV.p(a.naam) + ': ' + HV.duur(a.st.rest) }));
      else if ((a.soort === 'tv' && a.st.aan) || (a.soort === 'speaker' && a.st.speelt)) chips.push(o.chip({ icoon: HV.paspoort.soorten[a.soort].icoon, tekst: a.soort === 'tv' ? t('телевізор увімкнено', 'tv aan') : t('грає музика', 'muziek speelt') }));
    });
    var tempHtml = temp ? (temp.beschikbaar === 'verouderd' ? '<span class="hv-kamerkaart__temp is-verouderd">' + HV.maat(temp.st.waarde, '°C', 1) + '</span>' : '<span class="hv-kamerkaart__temp">' + HV.maat(temp.st.waarde, '°C', 1) + '</span>') : '<span class="hv-kamerkaart__temp is-leeg" aria-label="' + h(HV.woord.onbekend()) + '">—</span>';
    var sub = [];
    if (lampen.length) sub.push(aan.length ? aan.length + ' ' + t('з', 'van') + ' ' + lampen.length + ' ' + HV.meervoud(lampen.length, ['лампи', 'ламп', 'ламп'], ['lamp', 'lampen']) : t('світло вимкнено', 'licht uit'));
    if (temp && temp.beschikbaar === 'verouderd') sub.push(HV.woord.verouderd() + ' ' + HV.oud(HV.kijk.leeftijd(temp)));
    else if (kamer.doel != null) sub.push(t('ціль ', 'doel ') + HV.getal(kamer.doel, 1) + ' °C');
    return '<article class="hv-kamerkaart' + (aan.length ? ' is-licht' : '') + '" data-k="kamer-' + h(kamer.id) + '">' +
      '<button type="button" class="hv-kamerkaart__lijf" data-actie="ga" data-naar="kamers-kamer-' + h(kamer.id) + '" aria-label="' + h(HV.p(kamer.naam) + '. ' + t('Відкрити кімнату', 'Kamer openen')) + '">' +
      '<span class="hv-kamerkaart__kop">' + ic(kamer.icoon, { maat: 's' }) + '<span class="hv-kamerkaart__naam">' + h(HV.p(kamer.naam)) + '</span></span>' + tempHtml +
      '<span class="hv-kamerkaart__sub">' + h(sub.join(' · ')) + '</span></button>' +
      (lampen.length ? o.schakel({ aan: aan.length > 0, icoon: 'lightbulb', toon: 'aan', actie: 'kamer-licht', gegevens: { kamer: kamer.id }, aria: t('Світло: ', 'Licht: ') + HV.p(kamer.naam) }) : '') +
      (chips.length ? '<div class="hv-kamerkaart__chips">' + chips.join('') + '</div>' : '') +
      (kamer.doel != null && w.gegevens !== 'geen' ? '<div class="hv-kamerkaart__doel">' + o.stapper({ actie: 'kamer-doel', gegevens: { kamer: kamer.id }, stap: 0.5, label: t('Ціль температури: ', 'Doeltemperatuur: ') + HV.p(kamer.naam), k: 'doel-' + kamer.id }) + '</div>' : '') +
      '</article>';
  };

  /**
   * Телеметрична картка (авто, дрон, робот): заряд і запас ходу, три числа, силует.
   * p: { id, icoon, naam, stand (слово), lading (0–100), bereik (HTML), getallen:[{ label, waarde }], toon, actie, gegevens, staat }
   */
  o.telemetrie = function (p) {
    return '<article class="hv-telemetrie hv-toon-' + (p.toon || 'batterij') + (p.staat ? ' is-' + p.staat : '') + '" data-k="tele-' + h(p.id) + '">' +
      '<' + (p.actie ? 'button type="button"' + actieAttrs(p.actie, p.gegevens) : 'div') + ' class="hv-telemetrie__lijf">' +
      '<span class="hv-telemetrie__kop"><span class="hv-telemetrie__naam">' + h(p.naam) + '</span><span class="hv-telemetrie__stand">' + h(p.stand || '') + '</span></span>' +
      '<span class="hv-telemetrie__silhouet">' + ic(p.icoon, { maat: 'xl' }) + '</span>' +
      (p.lading != null ? '<span class="hv-telemetrie__lading"><span class="hv-telemetrie__getal">' + HV.maat(Math.round(p.lading), '%') + '</span>' + (p.bereik ? '<span class="hv-telemetrie__bereik">' + p.bereik + '</span>' : '') + '</span>' +
        '<span class="hv-telemetrie__balk" aria-hidden="true"><i style="width:' + Math.max(0, Math.min(100, p.lading)) + '%"></i>' + (p.doel ? '<b style="left:' + p.doel + '%"></b>' : '') + '</span>' : '') +
      (p.getallen && p.getallen.length ? '<span class="hv-telemetrie__rij">' + p.getallen.slice(0, 3).map(function (g) { return '<span><span class="hv-telemetrie__label">' + h(g.label) + '</span><span class="hv-telemetrie__waarde">' + g.waarde + '</span></span>'; }).join('') + '</span>' : '') +
      '</' + (p.actie ? 'button' : 'div') + '></article>';

  /** Кнопка сцени: коло запускає; «діє» — коли сцена активна. */
  o.scene = function (scene, actief) {
    return '<button type="button" class="hv-scene' + (actief ? ' is-actief' : '') + '" data-actie="scene" data-scene="' + h(scene.id) + '" data-k="scene-' + h(scene.id) + '" aria-label="' + h(t('Сцена ', 'Scène ') + HV.p(scene.naam) + (actief ? ', ' + t('діє', 'actief') : '')) + '">' +
      '<span class="hv-scene__teken">' + ic(scene.icoon) + '</span><span class="hv-scene__naam">' + h(HV.p(scene.naam)) + '</span>' + (actief ? '<span class="hv-scene__actief">' + h(t('діє', 'actief')) + '</span>' : '') + '</button>';
  };

  // ── Blok, held, nu, leeg, skelet ──
  /**
   * Смуга розділу, що згортається й пам'ятає свій стан. Порожній блок зникає (inhoud === '').
   * p: { id, titel, teller, inhoud, uitleg (текст підказки), extra (HTML у заголовку), vast (не згортається), samenvatting (рядок у згорнутому), dicht (типово згорнутий) }
   */
  o.blok = function (p) {
    if (!p.inhoud) return '';
    var geheugen = HV.opslag.lees('blokken', {});
    var open = p.vast ? true : (p.id in geheugen ? geheugen[p.id] : !p.dicht);
    var kan = !p.vast && HV.profielKanInklappen();
    if (!kan) open = true;
    var titel = '<h2 class="hv-blok__naam">' + h(p.titel) + '</h2>' + (p.teller != null ? '<span class="hv-blok__teller">' + h(p.teller) + '</span>' : '');
    var kop = kan
      ? '<button type="button" class="hv-blok__titel" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="blok-' + h(p.id) + '" data-actie="blok" data-blok="' + h(p.id) + '">' + titel + ic('chevron-down', { maat: 's', klas: 'hv-blok__pijl' }) + '</button>'
      : '<div class="hv-blok__titel">' + titel + '</div>';
    return '<section class="hv-blok' + (open ? ' is-open' : ' is-dicht') + (p.klas ? ' ' + p.klas : '') + '" data-k="blok-' + h(p.id) + '">' +
      '<header class="hv-blok__kop">' + kop + (p.uitleg ? o.gevolg(p.uitleg, { kop: p.titel }) : '') + (p.extra ? '<span class="hv-blok__extra">' + p.extra + '</span>' : '') + '</header>' +
      (open ? '<div class="hv-blok__inhoud" id="blok-' + h(p.id) + '">' + p.inhoud + '</div>' : (p.samenvatting ? '<p class="hv-blok__samenvatting" id="blok-' + h(p.id) + '">' + p.samenvatting + '</p>' : '<span id="blok-' + h(p.id) + '" hidden></span>')) +
      '</section>';
  };
  HV.profielKanInklappen = function () { return ['tv', 'strook', 'horloge', 'inkt'].indexOf(HV.profiel ? HV.profiel().id : '') < 0; };

  /** Герой: речення дому на небі, дата й час дому, паперові чипи одним рядом; праворуч — розріз. */
  o.held = function (p) {
    return '<section class="hv-held" data-k="held" aria-label="' + h(t('Як зараз удома', 'Hoe het thuis is')) + '">' +
      '<div class="hv-held__tekst">' + (p.datum ? '<p class="hv-held__datum">' + p.datum + '</p>' : '') +
      '<h1 class="hv-held__zin"><span class="hv-held__vol">' + p.zin + '</span><span class="hv-held__kort">' + (p.kort || p.zin) + '</span></h1>' +
      (p.chips ? '<div class="hv-held__chips" role="list">' + p.chips + '</div>' : '') + '</div>' +
      (p.rechts ? '<div class="hv-held__beeld">' + p.rechts + '</div>' : '') + '</section>';
  };

  /** «Зараз важливо»: до трьох рядків «знак · факт · дія»; четвертий рядок — «Ще N у Журналі». */
  o.nu = function (items) {
    if (!items || !items.length) return '';
    var w = HV.staat.w, max = (HV.bouw.gedrag && HV.bouw.gedrag.nuMax) || 3;
    var volgorde = { alarm: 0, verzoek: 1, aandacht: 2, info: 3 };
    var lijst = items.slice().sort(function (a, b) { return volgorde[a.soort] - volgorde[b.soort]; });

    try { lijf = g.render(ctx); } catch (e) { if (window.console) console.error('[maquette] gezicht ' + g.id + ': ' + (e && e.stack ? e.stack : e)); lijf = o.leeg({ icoon: 'circle-x', titel: String(e && e.message ? e.message : e) }); }

        o.icoonknop({ icoon: 'chevron-right', aria: t('Наступне обличчя', 'Volgende wijzerplaat'), actie: 'ui', gegevens: { naam: 'gezicht-' + p.id, waarde: (i + 1) % lijst.length } }) + '</div>';

  }

  function teken() {
    var doek = document.getElementById('hv-doek');
    if (!doek || !HV.staat.w) return;
    HV.zetTaal(HV.opslag.lees('taal', 'uk'));
    var ctx = HV.ctx(), w = ctx.staat, p = ctx.profiel;
    var thema = HV.thema();
    var s = HV.schermen[route.scherm];

    // klassen op de wortel van het doek
    var klassen = ['hv-doek', thema === 'donker' ? 'theme-dark' : thema === 'inkt' ? 'theme-inkt' : 'theme-light', 'hv-dicht-' + ctx.dichtheid, 'hv-profiel-' + p.id, 'hv-rol-' + ctx.rol];
    if (p.speciaal) klassen.push('is-speciaal');
    if (w.nood && !w.nood.bevestigd) klassen.push('is-nood');
    if (route.blad && !p.speciaal) klassen.push('heeft-laag');
    if (HV.lagen && HV.lagen.dialoog()) klassen.push('heeft-dialoog');
    if (doek.classList.contains('is-gerold')) klassen.push('is-gerold');
    if (doek.classList.contains('is-sprong')) klassen.push('is-sprong');
    ['hv-hemel--vol', 'hv-hemel--stil', 'hv-hemel--geen', 'is-regen', 'is-sneeuw'].forEach(function (k) { if (doek.classList.contains(k)) klassen.push(k); });

    // hemel
    var niveau = (w.nood && !w.nood.bevestigd) || thema === 'inkt' || p.hemel === 'geen' ? 'geen' : (p.hemel === 'stil' || (!p.speciaal && route.scherm !== 'overzicht')) ? 'stil' : 'vol';
    HV.hemel.pasToe(doek, w, { thema: thema, niveau: niveau, sprong: sprong || w.snelheid >= 60 });
    sprong = false;

    // schil
    if (p.speciaal) {
      HV.zet(document.getElementById('hv-kop'), '');
      HV.zet(document.getElementById('hv-onderbalk'), '');
      HV.zet(document.getElementById('hv-pagina'), gezichtHtml(ctx));

      HV.zet(document.getElementById('hv-onderbalk'), onderbalkHtml(ctx) + '<button type="button" class="hv-opdrachtknop" data-actie="opdracht" aria-label="' + h(t('Команда', 'Opdracht')) + '">' + HV.icoon('search', { maat: 'l' }) + '</button>');

    var bladHtml = route.blad && !p.speciaal ? HV.bladHtml(ctx, route.blad) : '';
    HV.zet(document.getElementById('hv-laagplek'), bladHtml ? '<div class="hv-dek hv-dek--laag" data-actie="blad-sluit" data-k="dek"></div>' + bladHtml : '');
    if (bladSleutel !== vorigBlad) {
      if (bladSleutel) { var titel = document.getElementById('hv-laag-titel'); if (titel) { try { titel.focus({ preventScroll: true }); } catch (e) { titel.focus(); } } }
      else if (opener && document.contains(opener)) { try { opener.focus({ preventScroll: true }); } catch (e) { /* фокус лишається */ } opener = null; }
      vorigBlad = bladSleutel;
    }

    if (HV.lagen) HV.lagen.teken(ctx);
    if (HV.pult && HV.pult.werkBij) HV.pult.werkBij(ctx);
    if (s && document.title !== undefined && !HV.bouw.artefact) { /* назва вкладки браузера лишається сталою */ }
  }

  // ───────────────────────── Gebeurtenissen ─────────────────────────
  function gegevensVan(el) { var g = {}; for (var k in el.dataset) g[k] = el.dataset[k]; return g; }
  function roep(naam, el, ev, extra) {
    var fn = HV.acties[naam];
    if (!fn) { if (window.console) console.error('[maquette] geen afhandeling voor data-actie="' + naam + '"'); return; }
    var g = gegevensVan(el);
    for (var k in extra || {}) g[k] = extra[k];
    try { fn(HV.ctx(), g, el, ev); } catch (e) { if (window.console) console.error('[maquette] actie ' + naam + ': ' + (e && e.stack ? e.stack : e)); }
  }

  function klik(ev) {

  // Schuif: tijdens het slepen werkt de kern de waarde bij zonder het scherm opnieuw te tekenen.
  function schuifZet(baan, v, fase) {
    var min = Number(baan.dataset.min), max = Number(baan.dataset.max);
    var deel = Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
    var wortel = baan.parentNode;
    baan.querySelector('.hv-schuif__vulling').style.width = deel + '%';
    baan.querySelector('.hv-schuif__knop').style.left = deel + '%';
    baan.setAttribute('aria-valuenow', v);
    baan.setAttribute('aria-valuetext', HV.maatTekst(v, baan.dataset.eenheid, Number(baan.dataset.decimalen)));
    var uit = wortel.querySelector('.hv-schuif__getal');
    if (uit) uit.innerHTML = HV.maat(v, baan.dataset.eenheid, Number(baan.dataset.decimalen));
    roep(baan.dataset.schuif, baan, null, { waarde: v, fase: fase });
  }
  function rond(v, baan) {
    var stap = Number(baan.dataset.stap) || 1, min = Number(baan.dataset.min), max = Number(baan.dataset.max);
    v = Math.round(v / stap) * stap;
    return Math.max(min, Math.min(max, Math.round(v * 100) / 100));
  }
  function schuifSleep(ev, baan) {
    if (baan.getAttribute('aria-disabled') === 'true') return;
    ev.preventDefault();
    var wortel = baan.parentNode;
    var min = Number(baan.dataset.min), max = Number(baan.dataset.max);
    var waarde = function (e) { var r = baan.getBoundingClientRect(); return rond(min + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (max - min), baan); };
    HV.sleept = true; wortel.setAttribute('data-bezig', '1'); wortel.classList.add('is-sleept');
    try { baan.setPointerCapture(ev.pointerId); } catch (e) { /* без захоплення теж працює */ }
    var laatste = waarde(ev);
    schuifZet(baan, laatste, 'sleep');
    var beweeg = function (e) { var v = waarde(e); if (v !== laatste) { laatste = v; schuifZet(baan, v, 'sleep'); } };
    var los = function () {
      baan.removeEventListener('pointermove', beweeg); baan.removeEventListener('pointerup', los); baan.removeEventListener('pointercancel', los);
      HV.sleept = false; wortel.removeAttribute('data-bezig'); wortel.classList.remove('is-sleept');
      schuifZet(baan, laatste, 'klaar');
      HV.teken();
    };
    baan.addEventListener('pointermove', beweeg); baan.addEventListener('pointerup', los); baan.addEventListener('pointercancel', los);
    baan.focus();
  }

  // Wijzer (thermostaat): hoek → waarde; ook zonder opnieuw tekenen.
  function wijzerZet(schijf, v, fase) {
    var min = Number(schijf.dataset.min), max = Number(schijf.dataset.max), R = 86, C = 100;
    var punt = function (x) { var hoek = (135 + 270 * Math.max(0, Math.min(1, (x - min) / (max - min)))) * Math.PI / 180; return [C + R * Math.cos(hoek), C + R * Math.sin(hoek)]; };
    var a = punt(min), d = punt(v), groot = (v - min) / (max - min) * 270 > 180 ? 1 : 0;
    var knop = schijf.querySelector('.hv-wijzer__knop'), vulling = schijf.querySelector('.hv-wijzer__vulling');
    knop.setAttribute('cx', d[0].toFixed(1)); knop.setAttribute('cy', d[1].toFixed(1));
    vulling.setAttribute('d', 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + 'A' + R + ' ' + R + ' 0 ' + groot + ' 1 ' + d[0].toFixed(1) + ' ' + d[1].toFixed(1));
    schijf.setAttribute('aria-valuenow', v); schijf.setAttribute('aria-valuetext', HV.maatTekst(v, '°C', 1));
    var uit = schijf.parentNode.querySelector('.hv-wijzer__doelgetal output');
    if (uit) uit.innerHTML = HV.maat(v, '°C', 1);
    roep(schijf.dataset.wijzer, schijf, null, { waarde: v, fase: fase });
  }
  function wijzerSleep(ev, schijf) {
    ev.preventDefault();
    var min = Number(schijf.dataset.min), max = Number(schijf.dataset.max), wortel = schijf.parentNode;
    var waarde = function (e) {
      var r = schijf.getBoundingClientRect();
      var graden = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;

      if (hoek > 270) hoek = hoek > 315 ? 0 : 270;
      return rond(min + hoek / 270 * (max - min), schijf);
    };
    HV.sleept = true; wortel.setAttribute('data-bezig', '1');
    try { schijf.setPointerCapture(ev.pointerId); } catch (e) { /* без захоплення теж працює */ }
    var laatste = waarde(ev);
    wijzerZet(schijf, laatste, 'sleep');
    var beweeg = function (e) { var v = waarde(e); if (v !== laatste) { laatste = v; wijzerZet(schijf, v, 'sleep'); } };
    var los = function () {
      schijf.removeEventListener('pointermove', beweeg); schijf.removeEventListener('pointerup', los); schijf.removeEventListener('pointercancel', los);
      HV.sleept = false; wortel.removeAttribute('data-bezig');
      wijzerZet(schijf, laatste, 'klaar'); HV.teken();
    };
    schijf.addEventListener('pointermove', beweeg); schijf.addEventListener('pointerup', los); schijf.addEventListener('pointercancel', los);
    schijf.focus();
  }

  function aanwijzer(ev) {
    if (ev.button != null && ev.button !== 0) return;
    var doel = ev.target.closest ? ev.target : ev.target.parentNode;
    var baan = doel.closest('[data-schuif]');
    if (baan) { schuifSleep(ev, baan); return; }
    var schijf = doel.closest('[data-wijzer]');
    if (schijf) { wijzerSleep(ev, schijf); return; }
    var rail = doel.closest('.hv-rail');
    if (rail && HV.lagen) HV.lagen.railStart(rail, ev);
  }

  function focusbaar(wortel) {
    return Array.prototype.slice.call(wortel.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')).filter(function (e) { return !e.disabled && e.offsetParent !== null; });
  }

  function toets(ev) {
    var el = ev.target, doek = document.getElementById('hv-doek');
    if (!doek || !doek.contains(el)) return;
    var sleutelNaam = ev.key;
    // Escape: закриває верхній шар
    if (sleutelNaam === 'Escape') {
      if (HV.lagen && HV.lagen.escape()) { ev.preventDefault(); return; }
      if (route.blad) { ev.preventDefault(); HV.bladOpen(null); }

    }
    // утримання фокуса в модальному шарі
    if (sleutelNaam === 'Tab') {
      var modaal = doek.querySelector('.hv-gevaar, .hv-opdracht, .hv-nood') || (route.blad && window.getComputedStyle(doek.querySelector('.hv-dek--laag') || doek).display !== 'none' && doek.querySelector('.hv-dek--laag') ? doek.querySelector('.hv-laag') : null);
      if (modaal) {
        var lijst = focusbaar(modaal);
        if (!lijst.length) return;
        var eerste = lijst[0], laatste = lijst[lijst.length - 1];
        if (!modaal.contains(el)) { ev.preventDefault(); eerste.focus(); }
        else if (ev.shiftKey && el === eerste) { ev.preventDefault(); laatste.focus(); }
        else if (!ev.shiftKey && el === laatste) { ev.preventDefault(); eerste.focus(); }

      var nieuw = null;
      if (sleutelNaam === 'ArrowRight' || sleutelNaam === 'ArrowUp') nieuw = nu + stap;
      else if (sleutelNaam === 'ArrowLeft' || sleutelNaam === 'ArrowDown') nieuw = nu - stap;
      else if (sleutelNaam === 'PageUp') nieuw = nu + stap * 10;
      else if (sleutelNaam === 'PageDown') nieuw = nu - stap * 10;
      else if (sleutelNaam === 'Home') nieuw = min;
      else if (sleutelNaam === 'End') nieuw = max;
      if (nieuw != null) {

        nieuw = rond(nieuw, as);

    var rol = el.getAttribute && el.getAttribute('role');
    if ((rol === 'tab' || rol === 'radio') && (sleutelNaam === 'ArrowRight' || sleutelNaam === 'ArrowLeft' || sleutelNaam === 'ArrowDown' || sleutelNaam === 'ArrowUp' || sleutelNaam === 'Home' || sleutelNaam === 'End')) {
      var groep = el.parentNode, broers = Array.prototype.slice.call(groep.querySelectorAll('[role="' + rol + '"]'));

  // ───────────────────────── Ingebouwde acties ─────────────────────────

  });
  HV.actie('tegel-stap', function (ctx, g) {
    var a = HV.staat.apparaat(g.doel), m = g.mogelijkheid, stap = Number(g.stap) || 10;

  HV.blad({
    soort: 'meer', vrij: true, icoon: 'ellipsis', titel: ['Ще', 'Meer'],
    render: function () {
      return o.kaart({ inhoud: '<div class="hv-rijen">' + HV.secties.filter(function (s) { return !s.telefoon; }).map(function (s) { return o.rij({ icoon: s.icoon, naam: HV.p(s.titel), actie: 'ga', gegevens: { naar: s.scherm }, k: 'meer-' + s.id }); }).join('') + '</div>' });

  // ───────────────────────── Start ─────────────────────────

  HV.naScenario = function () { sprong = true; naPagina = true; HV.teken(); };

  HV.start = function () {
