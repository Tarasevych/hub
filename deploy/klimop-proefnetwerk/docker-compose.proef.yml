# KLIMOP-003 (20.11.2026, Етап 2 Головного архітектурного маніфесту «Плющ» / «Klimop»):
# Стендова багатоконтейнерна конфігурація випробувальної мережі з 3 ізольованих вузлів.
# УВАГА: призначена ВИКЛЮЧНО для окремого стендового випробування на машині розробника.
# Не монтує робочих каталогів /srv/mijn-ruimte чи /srv/data, не під'єднується до PostgreSQL 18.6,
# працює у внутрішній мережі `internal: true` без виходу в зовнішню мережу та без привілеїв root.
# Geïsoleerde proefopstelling voor Fase 2 (uitsluitend voor lokale proeven, volledig gescheiden van productie).

name: klimop-etappe2-proefnetwerk

services:
  knoop-nl:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /werk
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /werk/rapporten:size=64m,noexec,nosuid,nodev
    volumes:
      - ../../:/werk:ro
    environment:
      KLIMOP_ROL: "nl"
      NODE_ENV: "test"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - klimop_stengels_intern
    command: ["node", "scripts/klimop-proefnetwerk.mjs"]

  knoop-ch:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /werk
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ../../:/werk:ro
    environment:
      KLIMOP_ROL: "ch"
      NODE_ENV: "test"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - klimop_stengels_intern
    command: ["node", "-e", "console.log('Стендовий вузол CH готовий в ізольованій мережі klimop_stengels_intern')"]

  knoop-ua:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /werk
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ../../:/werk:ro
    environment:
      KLIMOP_ROL: "ua"
      NODE_ENV: "test"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - klimop_stengels_intern
    command: ["node", "-e", "console.log('Стендовий вузол UA готовий в ізольованій мережі klimop_stengels_intern')"]

networks:
  klimop_stengels_intern:
    driver: bridge
    internal: true
