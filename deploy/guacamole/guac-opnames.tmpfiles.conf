# Opnames van het externe bureaublad (alleen als de eigenaar «opnemen» aanzet per verbinding). Bewaartermijn: 30 dagen
# (systemd-tmpfiles-clean.timer ruimt ouder op). Wijzigen: /etc/tmpfiles.d/mijn-ruimte-guac-opnames.conf (installeer-app.sh
# overschrijft een bestaand bestand niet).
d /srv/data/guac-opnames 0750 mijnruimte-guacd mijnruimte 30d
