# /etc/cloudflared/config.yml — SJABLOON voor de Cloudflare Tunnel van Mijn Ruimte.
#
# Invullen vóór gebruik:
#   <TUNNEL-ID>  uitvoer van:  cloudflared tunnel create mijn-ruimte
#   PORT         moet gelijk zijn aan PORT in mijn-ruimte.service (standaard 8080)
# DNS per hostnaam (eenmalig):  cloudflared tunnel route dns mijn-ruimte <hostnaam>
#
# De app luistert alleen op 127.0.0.1 en accepteert alleen deze hostnamen (Host-header); de tunnel geeft
# de oorspronkelijke Host door en zet cf-connecting-ip, waarop de server het client-IP baseert.
# TLS eindigt bij Cloudflare; tussen cloudflared en de app is het lokaal http over loopback.
# Zet in Cloudflare: SSL/TLS "Full", "Always Use HTTPS" aan, en bij voorkeur HSTS (de app stuurt hem ook).
tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

# Geen automatische updates van cloudflared vanuit de dienst zelf (via de pakketbeheerder bijwerken).
no-autoupdate: true

originRequest:
  connectTimeout: 10s
  keepAliveTimeout: 90s
  # Geen Happy Eyeballs naar IPv6: de app luistert alleen op 127.0.0.1.
  noHappyEyeballs: true

ingress:
  - hostname: hub.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: id.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: mail.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: cloud.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: ai.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: github.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: huis.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: api.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: admin.tarasevych.com
    service: http://127.0.0.1:8080
  - hostname: dashboard.tarasevych.com
    service: http://127.0.0.1:8080
  # mcp.tarasevych.com: één hostnaam, twee diensten (padsplitsing; zie deploy/MCP-SERVICE.txt).
  #   - de MCP-brug (alleen-lezen, poort 8091): de deuren /grok /claude /chatgpt /gemini /copilot, /oauth/*,
  #     /.well-known/* en /health. De regels worden van boven naar beneden gematcht, dus deze staat EERST.
  #   - al het andere (de schermen /overview /agents ..., /api/*, WSS /agent/ws voor agents): de hoofdapp op 8080.
  # De MCP-connector voor Claude (backend/mcp-connector.ts) staat in de hoofdapp: /mcp en /oauth2/* vallen al buiten de
  # brugregel hieronder; alleen deze twee discovery-paden zitten onder /.well-known en moeten VÓÓR de brugregel staan.
  # Connector v2: canoniek /mcp/<agent> valt buiten de deurregel hieronder (die vangt (?i:grok|claude|…) naar 8091).
  # /ai/<agent> blijft een alias. De RFC 9728-vorm /.well-known/oauth-protected-resource/(mcp|ai)/<agent> moet VÓÓR de
  # deurregel staan, anders slokt `\.well-known` hem op. Het kale /.well-known/oauth-protected-resource/mcp blijft de oude connector.
  - hostname: mcp.tarasevych.com
    path: ^/\.well-known/(oauth-protected-resource/(mcp/(claude|gpt|grok|gemini|copilot|cursor)|mcp|ai/(claude|gpt|grok|gemini|copilot|cursor))|oauth-authorization-server/oauth2)$
    service: http://127.0.0.1:8080
  - hostname: mcp.tarasevych.com
    path: ^/((?i:grok|claude|chatgpt|gemini|copilot)|oauth|health|\.well-known)(/|$)
    service: http://127.0.0.1:8091
  - hostname: mcp.tarasevych.com
    service: http://127.0.0.1:8080
  # Alles wat niet expliciet hierboven staat: 404 aan de rand, komt nooit bij de app.
  - service: http_status:404
