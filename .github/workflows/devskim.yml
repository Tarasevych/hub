# Пошук небезпечних шаблонів у коді (TypeScript, JavaScript, Python, Shell, PowerShell) через DevSkim.

name: DevSkim

on:
  push:
    branches: [ "voornaamst" ]
  pull_request:
    branches: [ "voornaamst" ]
  schedule:
    - cron: '32 22 * * 0'

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Отримати код сховища
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Запустити сканер DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16

      - name: Передати результати DevSkim до GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: devskim-results.sarif
