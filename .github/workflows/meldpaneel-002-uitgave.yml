name: 'MELDPANEEL-002 · Єдиний Пульт уваги, спокою та дії з офіційними логотипами src/merk/, графом першопричини та умовним відкладенням'

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері
# (20261122-082021 @ 55291902d45b або 20261120-141041 @ ba289fa919c6), правила координації 1.6.0, типи клієнта й сервера,
# статичні контракти, TRACE-001, 20 хмарних тестів, 12 стендів «Плюща», 178 безбазових (включно з meldpaneel-002 і klimop-001..022) і 13 післяскладальних випробувань,
# подвійний прогін усіх міграцій на PostgreSQL 16 із трьома ролями та 120 випробувань із базою даних і Хроміумом,
# повне складання, автоматично підписаний CRX3 0.9.7, маніфест встановлювача з обліком моделі ШІ та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels 1.6.0, client- en servertypen, statische contracten,
# TRACE-001, cloud-tests, 12 Klimop-proefopstellingen, 178 eenheidstests vóór en 13 na de bouw, dubbele migraties en databasetests met drie rollen
# en Chromium tegen PostgreSQL 16, volledige bouw, ondertekende CRX3 0.9.7, manifest en SHA-256.
on:
  push:
    branches:
      - feature/meldpaneel-002-aandachtspuls-20261122-020900
    paths:
      - .github/workflows/meldpaneel-002-uitgave.yml
      - orchestratie/ontwikkelarchieven/MELDPANEEL-002.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: meldpaneel-002-uitgave
  cancel-in-progress: false

env:
  TAAK: MELDPANEEL-002
  # Жива встановлена основа на сервері — KLIMOP-023 (20261122-082021 @ 55291902d45bda6431471c5a94bc9f4eed93b8ed);
  # також підтримуються безпосередні предки UPD-013 та UPD-012.
  BEKENDE_BASISSEN: '20261120-093715=318ad56136008cafdde193e11c5bfe638d5a6ce6 20261120-141041=ba289fa919c66765b6fc5565d340976994261c05 20261122-082021=55291902d45bda6431471c5a94bc9f4eed93b8ed'
  INTEGRATIE_BASIS: '32822354ea08fc850330eed96feaff5b1bb96a58'
  MODEL_ID: ${{ inputs.model_id || vars.MELDPANEEL_002_MODEL_ID || 'Gemini 4 Carbon (High)' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/meldpaneel-002-aandachtspuls-20261122-020900" ]; then
            echo "Випуск MELDPANEEL-002 можна запускати лише з гілки feature/meldpaneel-002-aandachtspuls-20261122-020900." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js і перевірити системні інструменти
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити наявність обов’язкових інструментів середовища та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з живою основою ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen 55291902d45bda6431471c5a94bc9f4eed93b8ed
          node scripts/vaardigheden/valideer.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/MELDPANEEL-002.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'MELDPANEEL-002');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал MELDPANEEL-002 валідний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента, 12 стендів «Плюща», 20 хмарних і 178 безбазових модульних випробувань
