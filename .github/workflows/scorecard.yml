# Перевірка безпеки ланцюга постачання через OpenSSF Scorecard.
# Controle van ketenbeveiliging via OpenSSF Scorecard.

name: 'Перевірка ланцюга постачання Scorecard · Scorecard-ketencontrole'

on:
  branch_protection_rule:
  schedule:
    - cron: '22 10 * * 5'
  push:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]
  pull_request:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]

permissions:
  contents: read

jobs:
  analysis:
    name: 'Аналіз ланцюга постачання · Scorecard-analyse'
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: 'Отримати вихідні коди сховища · Broncode ophalen'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Виконати перевірку Scorecard · Scorecard-analyse uitvoeren'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' && github.event.repository.default_branch == github.ref_name }}

      - name: 'Зберегти звіт SARIF як результат складання · SARIF-verslag opslaan'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: 'Надіслати звіт SARIF до служби перевірки коду GitHub · SARIF-verslag aanbieden'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
