# Одноразовий помічник: відкриває запит на злиття для гілки UITROLBOT-001.
# Eenmalige hulp: opent een pull request voor de UITROLBOT-001-tak.
# Після створення PR цей файл видаляється окремим комітом.
name: UITROLBOT-001 · open pull request
on:
  push:
    branches:
      - feature/uitrolbot-001-20261122-214039
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const head = 'feature/uitrolbot-001-20261122-214039';
            const base = 'integratie';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const open = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (open.data.length) {
              core.info(`PR bestaat al: ${open.data[0].html_url}`);
              return;
            }
            const body = [
              'Автоматично створено для гілки `UITROLBOT-001`.',
              '',
              'Запит: #98 · UITROL-AUTO-001.',
              '',
              '**Що змінює**',
              '- розбір посилання `t.me/...` на `chat_id` і `message_thread_id` у панелі «Оновлення → Налаштування»;',
              '- кнопка публікації двомовного пояснення випуску з `UITROL-MANIFEST.json`;',
              '- пояснення додається до автоматичного повідомлення «випуск встановлено»;',
              '- меню команд `setMyCommands` і `/start`;',
              '- «Перевірити зв\'язок» надсилає і пробний файл (`sendDocument`), а не лише текст;',
              '- зрозумілий текст для `TELEGRAM_HTTP_400` (хибна тема);',
              '- 12 модульних перевірок; `tsc` сервера й клієнта — 0 помилок.',
              '',
              '**Не входить**',
              '- активація бота: потрібен токен власника з @BotFather і сесія власника; це окремий крок поза кодом.',
              '',
              'Доказова база: issue #98, PR #134, commit 914b5268, PR #181.',
            ].join('\n');
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: 'UITROLBOT-001: активація бота випусків — посилання t.me, публікація пояснення, пробний файл',
              body,
            });
            core.info(`PR aangemaakt: ${pr.data.html_url}`);
