# Статичний аналіз безпеки сценаріїв Python за допомогою Bandit.

name: Bandit

on:
  push:
    branches: [ "voornaamst" ]
  pull_request:
    branches: [ "voornaamst" ]
  schedule:
    - cron: '40 20 * * 5'

permissions:
  contents: read

jobs:
  bandit:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код сховища
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Запустити сканер Bandit
        uses: shundor/python-bandit-scan@9955228c1cbdc5aeb5e511e0fa232154e2ed2b67 # main (v7/v4)
        with:
          exit_zero: true
          GITHUB_TOKEN: ${{ github.token }}
          excluded_paths: '.git,node_modules,dist,dist-server,uitvoer'
