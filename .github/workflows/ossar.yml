# Відкриті статичні аналізатори (ESLint, Bandit тощо) через OSSAR на основі Microsoft Security DevOps CLI.

name: OSSAR

on:
  push:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]
  pull_request:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]
  schedule:
    - cron: '30 6 * * 5'

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    # Наразі підтримується середовище windows-latest.
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: windows-latest

    steps:
      - name: Отримати код сховища
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Запустити OSSAR
        uses: github/ossar-action@4e96c4f6e591eb4b991abfd459e40b136a317aea # v2.0.0
        id: ossar

      - name: Передати результати OSSAR до GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}
