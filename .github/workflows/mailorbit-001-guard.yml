name: MAILORBIT-001 · verified unsigned preview package
on:
  push:
    branches:
      - feature/mailorbit-001-20261103-205354
permissions:
  contents: read
concurrency:
  group: mailorbit-001-release
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Check canonical policy and own task registration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          test -f orchestratie/taken/MAILORBIT-001.json
          node scripts/orch.mjs versheid --taak MAILORBIT-001 --fase start
      - name: Dependencies
        run: npm ci
      - name: Regenerate and commit canonical UI button catalogue (generated file only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/zoek-ui-catalogus.mjs
          if ! git diff --quiet -- shared/zoek-ui-knoppen.generated.ts; then
            git add shared/zoek-ui-knoppen.generated.ts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Regenerate and commit canonical UI button catalogue (generated file only) — lokaal vastleggen (zonder sleutel; push in de publicatietaak) · локальна фіксація (без ключа)
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): alleen lokaal vastleggen; de publicatietaak controleert en pusht deze commit.
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -m 'MAILORBIT-001: werk gegenereerde UI-catalogus bij [skip ci]'
          fi
      - name: Regenerate and commit canonical UI button catalogue (generated file only) — controle na het vastleggen · перевірка після фіксації
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify affected contracts, TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uitvoer
          node scripts/eenheidstests.mjs mail-orbit-001 | tee uitvoer/mailorbit-001-tests.log
          node scripts/eenheidstests.mjs mail-koppelen-20261020 | tee -a uitvoer/mailorbit-001-tests.log
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=5120 npm run build
          node scripts/orch.mjs controleer
          git status --short
          node scripts/orch.mjs versheid --taak MAILORBIT-001 --fase overdracht
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify actual installed production base (read-only)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 --retry 2 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/mijn-ruimte-production.json"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const actual = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/mijn-ruimte-production.json', 'utf8'));
          const versie = '20261103-205438', commit = '15025c3e9c8466b650f0a5488b18c42f54ab9d3a';
          if (actual.versie !== versie || actual.commit !== commit) {
            console.error('BASIS_VEROUDERD: verified production differs from owner-provided installed base', {versie:actual.versie, commit:String(actual.commit||'').slice(0,12)});
            process.exit(1);
          }
          writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({versie,bronCommit:commit,bron:'geverifieerd_productie_api'},null,2)+'\n');
          console.log('Basis verified:',versie,commit.slice(0,12));
          JS
      - name: Prepare bilingual v2 manifest and verified test results
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_VERSION="$(date -u +%Y%m%d-%H%M%S)"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const versie=process.env.RELEASE_VERSION;
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const basis='20261103-205438',basisSha='15025c3e9c8466b650f0a5488b18c42f54ab9d3a';
          const manifest={
            schema:1,versie,aangemaakt:new Date().toISOString(),
            herkomst:'git: feature/mailorbit-001-20261103-205354@'+sha+' (basis '+basis+' '+basisSha+')',
            auteur:'eigenaar',zonderAi:false,
            deelnemers:[
              {soort:'mens',naam:'eigenaar',rollen:['auteur','controle']},
              {soort:'ai',naam:'ChatGPT',platform:'ChatGPT',tool:'GitHub connector en GitHub Actions',model:{id:'gpt-6',versie:null,bron:'omgeving'},rollen:['ontwikkeling','testen','verpakken']}
            ],
            beschrijving:{
              uk:{
                titel:'Жива пошта: анімоване підключення сервісів',
                samenvatting:'Інтерактивна орбіта брендованих конвертів на порожній сторінці пошти й акаунтів із реальними внутрішніми вікнами підключення.',
                wijzigingen:['Орбіта з шістьма доступними поштовими сервісами, анімацією та збільшенням при наведенні','Однакова нова концепція на сторінках акаунтів та порожньої поштової скриньки','Адаптивний каталог для смартфонів, клавіатури й режиму зменшеного руху'],
                fixes:['Натомість старого порожнього екрана показано конкретний вибір підключення','Прямі дії повторно використовують наявні безпечні вікна OAuth та IMAP'],
                beperkingen:['Proton та Online.ua залишаються без кнопки, бо відповідний спосіб підключення не реалізований','Справжній Google/Microsoft OAuth не виконувався у CI; встановлення та перевірка Passkey — за власником'],
                instructies:'Спершу перевірте макет і роботу входу вручну. Лише власник може встановити пакет через Admin → Оновлення з Passkey.'
              },
              nl:{
                titel:'Levende e-mail: geanimeerde dienstkoppeling',
                samenvatting:'Interactieve cirkel van merk-enveloppen op een leeg e-mailscherm en accountpagina, met echte koppelvensters op dezelfde site.',
                wijzigingen:['Baan met zes beschikbare aanbieders, aankomstanimatie en vergroten bij aanwijzen','Dezelfde nieuwe ervaring op accountpagina en lege inbox','Responsieve catalogus voor mobiel, toetsenbord en verminderde beweging'],
                fixes:['Het oude lege scherm is vervangen door concrete koppelkeuzes','Acties gebruiken bestaande veilige OAuth- en IMAP-vensters opnieuw'],
                beperkingen:['Proton en Online.ua hebben geen knop zolang er geen veilige koppeling gebouwd is','Echte Google/Microsoft OAuth is niet in CI uitgevoerd; installatie en Passkey-bevestiging blijven bij eigenaar'],
                instructies:'Controleer het ontwerp en het aanmelden eerst handmatig. Alleen de eigenaar mag installeren via Admin → Updates en Passkey.'
              }
            }
          };
          writeFileSync('uitvoer/MAILORBIT-001-UITROL-MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');
          const log=readFileSync('uitvoer/mailorbit-001-tests.log','utf8');
          const geslaagd=(log.match(/^OK\s/gm)||[]).length;
          const mislukt=(log.match(/^FOUT\s/gm)||[]).length;
          if(!geslaagd||mislukt)throw Error('Test checks missing or failing: '+geslaagd+'/'+mislukt);
          writeFileSync('uitvoer/MAILORBIT-001-TESTRESULTATEN.json',JSON.stringify({
            geslaagd,mislukt,falend:[],uitleg:{
              uk:'Пройдено '+geslaagd+' перевірок UI та підключення, TypeScript і production build у CI. OAuth і реальний браузер після інсталяції не перевірялися.',
              nl:geslaagd+' UI- en koppelcontroles geslaagd, plus TypeScript en productiebuild in CI. OAuth en de echte browser na installatie niet gecontroleerd.'
            }
          },null,2)+'\n');
          console.log('Test checks:',geslaagd,'failed:',mislukt);
          JS
      - name: Build and validate unsigned ORCH installation package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket \
            --taak MAILORBIT-001 --auteur 'eigenaar' \
            --agent chatgpt \
            --versie "$RELEASE_VERSION" \
            --manifest "$PWD/uitvoer/MAILORBIT-001-UITROL-MANIFEST.json" \
            --testresultaten "$PWD/uitvoer/MAILORBIT-001-TESTRESULTATEN.json" \
            --samenvatting-uk 'Анімаційне підключення поштових акаунтів у Mijn Ruimte через наявні захищені вікна.' \
            --samenvatting-nl 'Geanimeerd e-mailaccounts koppelen met bestaande beveiligde vensters in Mijn Ruimte.' \
            --uit uitvoer
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-$RELEASE_VERSION-chatgpt-overdracht.zip"
          tar --gzip --list --file "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" > "$RUNNER_TEMP/mailorbit-tar-entries.txt"
          (cd uitvoer && sha256sum "mijn-ruimte-$RELEASE_VERSION.tar.gz" > "mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256")
          (cd uitvoer && sha256sum -c "mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256")
          echo "RELEASE_SHA=$(sha256sum "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Upload verified unsigned archive and handover
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mijn-ruimte-mailorbit-001-unsigned
          path: |
            uitvoer/mijn-ruimte-*.tar.gz
            uitvoer/mijn-ruimte-*.tar.gz.sha256
            uitvoer/mijn-ruimte-*.voorstel.json
            uitvoer/mijn-ruimte-*-overdracht.zip
            uitvoer/MAILORBIT-001-UITROL-MANIFEST.json
            uitvoer/MAILORBIT-001-TESTRESULTATEN.json
            uitvoer/mailorbit-001-tests.log
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          echo "MAILORBIT-001 version: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub source commit: $RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No production changes, no package signing." >> "$GITHUB_STEP_SUMMARY"
      - name: Дані для задачі публікації · gegevens voor de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): deze taak heeft geen schrijfrecht. Wat gepubliceerd moet worden, gaat als artefact naar de publicatietaak:
          # de lokale commits (git-bundel bovenop GITHUB_SHA), de verwachte HEAD, de pakketgegevens en de pakketbestanden.
          # Ця задача не має права запису: зміни й пакет передаються артефактом задачі публікації, яка все перевіряє сама.
          P="$RUNNER_TEMP/publicatie"
          mkdir -p "$P/uitvoer"
          git rev-parse HEAD > "$P/HEAD"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git -c core.hooksPath=/dev/null bundle create "$P/wijzigingen.bundle" HEAD "^$GITHUB_SHA"
          fi
          : > "$P/vars"
          printf '%s=%s\n' RELEASE_VERSION "$RELEASE_VERSION" >> "$P/vars"
          cp uitvoer/mijn-ruimte-"$RELEASE_VERSION"* "$P/uitvoer/"
      - name: Передати дані задачі публікації · gegevens aan de publicatietaak doorgeven
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mailorbit-001-guard-publicatie
          path: ${{ runner.temp }}/publicatie/
          if-no-files-found: error
          retention-days: 7

  publicatie:
    name: Публікація лише з перевірених даних (git і gh, з ключем) · publicatie uit gecontroleerde gegevens (git en gh, met sleutel)
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Вихідна фіксація без збереженого ключа · broncommit zonder bewaarde sleutel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Дані із задачі складання · gegevens uit de bouwtaak
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mailorbit-001-guard-publicatie
          path: ${{ runner.temp }}/publicatie
      - name: Перевірити передані дані · overgedragen gegevens controleren
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): de bouwtaak draaide npm, tests en eigen scripts — wat ze doorgeeft is NIET vertrouwd. Alleen aanvaarden:
          #  - commits bovenop GITHUB_SHA, zonder samenvoegingen, die uitsluitend de verwachte bestanden wijzigen (gewone bestanden);
          #  - pakketgegevens met een vaste vorm; de SHA-256 wordt hier opnieuw berekend.
          # Приймаються лише очікувані файли поверх GITHUB_SHA і дані випуску суворого вигляду; SHA-256 обчислюється тут заново.
          P="$RUNNER_TEMP/publicatie"
          TOEGESTAAN='shared/zoek-ui-knoppen.generated.ts'
          DOEL="$GITHUB_SHA"
          if [ -e "$P/wijzigingen.bundle" ]; then
            test -n "$TOEGESTAAN" || { echo 'Задача складання передала зміни, хоча цей процес їх не очікує — зупинено. · Onverwachte commits van de bouwtaak — gestopt.' >&2; exit 1; }
            git -c core.hooksPath=/dev/null fetch --quiet --no-tags "$P/wijzigingen.bundle" "+HEAD:refs/sec002/publicatie"
            DOEL="$(git rev-parse --verify 'refs/sec002/publicatie^{commit}')"
            git merge-base --is-ancestor "$GITHUB_SHA" "$DOEL" || { echo 'Зміни не лежать поверх GITHUB_SHA — зупинено. · De commits liggen niet bovenop GITHUB_SHA — gestopt.' >&2; exit 1; }
            test -z "$(git rev-list --merges "$GITHUB_SHA..$DOEL")" || { echo 'Злиття в переданих змінах — зупинено. · Samenvoeging in de overgedragen commits — gestopt.' >&2; exit 1; }
            git diff --name-only --no-renames -z "$GITHUB_SHA" "$DOEL" | while IFS= read -r -d '' PAD; do
              case " $TOEGESTAAN " in *" $PAD "*) ;; *) echo "Неочікуваний файл у переданих змінах · onverwacht bestand in de overgedragen commits: $PAD" >&2; exit 1 ;; esac
              MODUS="$(git ls-tree "$DOEL" -- "$PAD" | cut -d' ' -f1)"
              [ -z "$MODUS" ] || [ "$MODUS" = 100644 ] || { echo "Не звичайний файл · geen gewoon bestand: $PAD ($MODUS)" >&2; exit 1; }
            done
          fi
          [ "$(tr -d '\r\n' < "$P/HEAD")" = "$DOEL" ] || { echo 'Передана HEAD не збігається зі змінами — зупинено. · De overgedragen HEAD klopt niet — gestopt.' >&2; exit 1; }
          echo "RELEASE_COMMIT=$DOEL" >> "$GITHUB_ENV"
          V=''
          while IFS='=' read -r SLEUTEL WAARDE; do
            [ -n "$SLEUTEL" ] || continue
            case "$SLEUTEL" in
              RELEASE_VERSION|VERSIE|UITGAVE_VERSIE|LIVE_VERSIE) [[ "$WAARDE" =~ ^[0-9]{8}-[0-9]{6}$ ]] ;;
              LIVE_COMMIT) [[ "$WAARDE" =~ ^[0-9a-f]{40}$ ]] ;;
              *) false ;;
            esac || { echo "Недійсні дані випуску · ongeldige pakketgegevens: $SLEUTEL" >&2; exit 1; }
            case "$SLEUTEL" in RELEASE_VERSION|VERSIE|UITGAVE_VERSIE) V="$WAARDE" ;; esac
            echo "$SLEUTEL=$WAARDE" >> "$GITHUB_ENV"
          done < "$P/vars"
          if [ -n "$V" ]; then
            mkdir -p uitvoer
            cp -R "$P/uitvoer/." uitvoer/
            RELEASE_SHA="$(sha256sum "uitvoer/mijn-ruimte-$V.tar.gz" | cut -d' ' -f1)"
            if [ -f "uitvoer/mijn-ruimte-$V.tar.gz.sha256" ]; then
              [ "$(cut -d' ' -f1 < "uitvoer/mijn-ruimte-$V.tar.gz.sha256")" = "$RELEASE_SHA" ] || { echo 'Контрольна сума архіву не збігається — зупинено. · Controlesom van het archief klopt niet — gestopt.' >&2; exit 1; }
            fi
            echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Відправити перевірені зміни гілки (лише git, з ключем) · gecontroleerde wijzigingen pushen (alleen git, met sleutel)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RELEASE_COMMIT:refs/heads/feature/mailorbit-001-20261103-205354"
          fi
      - name: Publish downloadable GitHub prerelease (NO deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION-chatgpt-overdracht.zip" \
            --target "$RELEASE_COMMIT" --prerelease --latest=false \
            --title "MAILORBIT-001 · $RELEASE_VERSION (unsigned)" \
            --notes "Verified CI-built unsigned install package for MAILORBIT-001. Base: 20261103-205438 / 15025c3e9c8466b650f0a5488b18c42f54ab9d3a. SHA-256: $RELEASE_SHA. Not installed, not signed, no PR merge. The owner must authorize install with Passkey."
