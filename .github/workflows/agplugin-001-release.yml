name: AGPLUGIN-001 · випуск 20261106-131500

# AGPLUGIN-001 + UITROL-UTF8-001: збирає й публікує пакет оновлення сайту за TRACE-001 поверх встановленого випуску 20261106-092612
# та актуальної голови integratie (fb6c79dc6347, вкл. PR №40 від claude). Нічого не встановлює автоматично:
# власник сам завантажує mijn-ruimte-20261106-131500.tar.gz у Admin → Оновлення і схвалює passkey.

on:
  push:
    branches:
      - 'feature/agplugin-001-20261106-072500'
    paths:
      - '.github/workflows/agplugin-001-release.yml'
      - 'orchestratie/ontwikkelarchieven/AGPLUGIN-001.json'

permissions:
  contents: read

concurrency:
  group: agplugin-001-release
  cancel-in-progress: false

env:
  TAAK: AGPLUGIN-001
  TAK: 'feature/agplugin-001-20261106-072500'
  VERSIE: '20261106-131500'
  BASIS: '49760d814be61c460a219070471407534e1829f2'
  INTEGRATIE_HOOFD: 'fb6c79dc634796482d2823fdff26b94d28222738'
  PAKKET: 'mijn-ruimte-20261106-131500.tar.gz'
  OVERDRACHT: 'mijn-ruimte-20261106-131500-antigravity-overdracht.zip'

jobs:
  controle:
    name: Перевірка й збірка · controle en bouw
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Гілка, база й вільний тег · tak, basis en vrije tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TAK"
          test "$(git branch --show-current)" = "$TAK"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASIS" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_HOOFD" HEAD
          git fetch --quiet origin integratie
          if [ "$(git rev-parse origin/integratie)" != "$INTEGRATIE_HOOFD" ]; then
            echo "FOUT INTEGRATIE_VERDER: integratie ($(git rev-parse --short origin/integratie)) ≠ INTEGRATIE_HOOFD — випуск зупинено." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSIE" > /dev/null; then echo "FOUT TAG_BESTAAT: $VERSIE" >&2; exit 1; fi
          if gh release view "$VERSIE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "FOUT RELEASE_BESTAAT: $VERSIE" >&2; exit 1; fi
          echo "Гілка $TAK @ $(git rev-parse --short HEAD), база 20261106-092612 ($BASIS), integratie ($INTEGRATIE_HOOFD), тег $VERSIE вільний."

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Правила й актуальність · regels en versheid
        run: |
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase start
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht

      - name: Скрипти розгортання й каталог пошуку · deployscripts en zoekcatalogus
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do bash -n "$f"; n=$((n+1)); done < <(git ls-files -z -- 'deploy/*.sh' 'deploy/**/*.sh')
          test "$n" -gt 0
          echo "bash -n: $n скриптів без помилок"
          node scripts/zoek-ui-catalogus.mjs --controle

      - name: Типи сервера · servertypen
        run: npm run typecheck:server

      - name: Модульні перевірки · eenheidstests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/uitgave/tests"
          SUITES=(trace-001-ontwikkelarchief uitrol-voorcontrole uitrol-manifest uitrol-pakket-maken uitrol-deur
                  orch-kern orch-beoordeling-20261031 zoek-diepe-link-20261105 zoek-ui-tabblad
                  ontwerp-fundament-20261020 mobiel-cascade-20261105 design-001 eenheidstests-uitvoerder-20261106
                  connector-v2 connector-instructies merk-officieel merk-register contrast-knoppen-logos
                  agent-verbinden-20261020 agent-een-plek integraties-catalogus.test.ts
                  integraties-catalogus-v2-20261029.test.ts ai-agent-bord.test.ts)
          geslaagd=0; mislukt=0; falend=""
          for s in "${SUITES[@]}"; do
            log="$RUNNER_TEMP/uitgave/tests/$s.log"
            node scripts/eenheidstests.mjs "$s" > "$log" 2>&1; code=$?
            regel="$(grep -Eo '[0-9]+/[0-9]+ geslaagd' "$log" | tail -1 || true)"
            ok="${regel%%/*}"; rest="${regel#*/}"; tot="${rest%% *}"
            if [ "$code" -ne 0 ] || [ -z "$regel" ] || [ "$ok" != "$tot" ]; then
              mislukt=$((mislukt+1)); falend="$falend $s"; echo "FOUT $s (exit=$code, ${regel:-geen telling})"; tail -40 "$log"
            else
              geslaagd=$((geslaagd+ok)); echo "OK   $s $regel"
            fi
          done
          echo "UITGAVE_TESTS_GESLAAGD=$geslaagd" >> "$GITHUB_ENV"
          echo "UITGAVE_TESTS_SUITES=${#SUITES[@]}" >> "$GITHUB_ENV"
          if [ "$mislukt" -ne 0 ]; then echo "FOUT: $mislukt набір(и) червоні:$falend" >&2; exit 1; fi

      - name: Повна збірка · volledige bouw
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production NODE_OPTIONS=--max-old-space-size=5120 npm run build
          test -f dist/index.html
          test -f dist-server/start.mjs
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no; git diff --stat
            echo "FOUT BOUW_WIJZIGT_BESTANDEN: npm run build змінив відстежувані файли" >&2; exit 1
          fi

      - name: Журнал TRACE-001 · ontwikkeldossier
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/AGPLUGIN-001.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'AGPLUGIN-001');
            if (f.length) throw Error(f.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            if (d.herkomst?.tak !== process.env.TAK || d.herkomst?.basis !== process.env.BASIS) throw Error('herkomst ≠ TAK/BASIS');
            console.log('Журнал AGPLUGIN-001 валідний, privacy.geheimenUitgesloten = true');"

      - name: Результати тестів · testresultaten
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import fs from 'node:fs';
            const g = Number(process.env.UITGAVE_TESTS_GESLAAGD), n = Number(process.env.UITGAVE_TESTS_SUITES);
            const t = { versie: 2, geslaagd: g, mislukt: 0, falend: [],
              samenvatting: 'CI: пройшли ' + n + ' наборів модульних тестів (' + g + ' перевірок), typecheck:server, bash -n, каталог пошуку й повна збірка.',
              basis: null,
              uitleg: { uk: 'У CI пройшли ' + n + ' наборів модульних тестів (' + g + ' перевірок), typecheck:server, bash -n скриптів розгортання, перевірка каталогу пошуку й повна production-збірка.',
                        nl: 'In CI zijn ' + n + ' eenheidstestsuites (' + g + ' controles), typecheck:server, bash -n van de deployscripts, de zoekcatalogus en de volledige productiebouw geslaagd.' } };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/uitgave/testresultaten.json', JSON.stringify(t, null, 2) + '\n');"
          cat "$RUNNER_TEMP/uitgave/testresultaten.json"

      - uses: actions/upload-artifact@v4
        with:
          name: AGPLUGIN-001-controle
          path: ${{ runner.temp }}/uitgave/
          retention-days: 30
          if-no-files-found: error

  publiceer:
    name: Пакет і GitHub Release · pakket en release
    needs: controle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: AGPLUGIN-001-controle
          path: ${{ runner.temp }}/controle

      - name: Встановлена база з живого сайту · live basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TAK"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --quiet origin integratie
          test "$(git rev-parse origin/integratie)" = "$INTEGRATIE_HOOFD"
          curl --fail --silent --show-error --max-time 20 "https://hub.tarasevych.com/api/version?ts=$(date -u +%s)" -o "$RUNNER_TEMP/site-versie.json"
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const versie = String(d.versie ?? d.version ?? ""), commit = String(d.bronCommit ?? d.commit ?? "");
            if (!/^\d{8}-\d{6}$/.test(versie)) throw Error("FOUT: ongeldige versie in /api/version: " + versie);
            if (!/^[0-9a-f]{40}$/.test(commit)) throw Error("FOUT: ongeldige commit in /api/version: " + commit);
            if (!(process.env.VERSIE > versie)) throw Error("FOUT NIET_NIEUWER: " + process.env.VERSIE + " <= " + versie);
            fs.appendFileSync(process.env.GITHUB_ENV, "LIVE_VERSIE=" + versie + "\nLIVE_COMMIT=" + commit + "\n");
            console.log("Встановлено на сайті: " + versie + " @ " + commit);
          ' "$RUNNER_TEMP/site-versie.json"

      - name: Тимчасовий стан встановлення лише в CI · tijdelijke installatiestaat
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$LIVE_COMMIT^{commit}"
          git merge-base --is-ancestor "$LIVE_COMMIT" HEAD
          if git ls-files --error-unmatch orchestratie/geinstalleerd.json > /dev/null 2>&1 || [ -e orchestratie/geinstalleerd.json ]; then
            echo "FOUT: orchestratie/geinstalleerd.json bestaat al — niet overschreven" >&2; exit 1
          fi
          node -e 'require("fs").writeFileSync("orchestratie/geinstalleerd.json", JSON.stringify({ versie: process.env.LIVE_VERSIE, bronCommit: process.env.LIVE_COMMIT, bron: "/api/version (CI " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID + ")" }, null, 2) + "\n")'
          cat orchestratie/geinstalleerd.json

      - name: Маніфест · manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/maak-manifest.mjs" <<'JS'
          import fs from 'node:fs';
          const e = process.env;
          const { valideerManifest } = await import(e.GITHUB_WORKSPACE + '/shared/uitrol-manifest.ts');
          const manifest = {
            schema: 1, versie: e.VERSIE, aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} op ${e.TAK} (integratie ${e.INTEGRATIE_HOOFD}; basis ${e.LIVE_VERSIE} ${e.LIVE_COMMIT})`,
            auteur: 'Власник', zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: 'Власник', rollen: ['auteur', 'controle'] },
              { soort: 'ai', naam: 'claude', platform: 'Claude Code', tool: 'Claude Code', model: { id: null, versie: null, bron: 'onbekend' }, rollen: ['ontwikkeling', 'controle', 'testen'] },
              { soort: 'ai', naam: 'antigravity', platform: 'Google Antigravity', tool: 'Antigravity IDE', model: { id: null, versie: null, bron: 'onbekend' }, rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken'] },
            ],
            beschrijving: JSON.parse(fs.readFileSync(e.RUNNER_TEMP + '/beschrijving.json', 'utf8')),
          };
          const tekst = JSON.stringify(manifest, null, 2) + '\n';
          const r = valideerManifest(tekst, e.VERSIE);
          if (r.fouten.length) throw Error(JSON.stringify(r.fouten));
          fs.writeFileSync(e.RUNNER_TEMP + '/manifest.json', tekst);
          console.log('Двомовний маніфест валідний (deelnemers: Власник, claude, antigravity)');
          JS
          cat > "$RUNNER_TEMP/beschrijving.json" <<'JSON'
          {
            "uk": {
              "titel": "Плагін і двосторонній конектор Google Antigravity (AGPLUGIN-001) + виправлення UTF-8 у root-інсталяторі (claude)",
              "samenvatting": "Двосторонній плагін і конектор Google Antigravity (/antigravity) з 4-канальною панеллю мосту (Сайт, Браузер, ПК, Сервер) [antigravity], а також виправлення обрізання UTF-8 у root-інсталяторі (UITROL-UTF8-001) і попередні покращення пошуку та координації [claude].",
              "wijzigingen": [
                "[antigravity · AGPLUGIN-001] Плагін і двосторонній конектор Google Antigravity (/antigravity): підключення за OAuth RFC 9728 або токеном та повний каталог інструментів Connector v2.",
                "[antigravity · AGPLUGIN-001] Інтерактивна двомовна панель мосту AntigravityBrugPaneel на сторінці #agent/antigravity: керування 4 каналами (Сайт і Координація, Браузер, Локальний ПК, Сервер) в один клік.",
                "[antigravity · AGPLUGIN-001] Активна навичка та виконуваний CLI/MCP-міст mijn-ruimte (.agents/skills/mijn-ruimte) і пакет плагіна deploy/antigravity-plugin.",
                "[antigravity · AGPLUGIN-001] Офіційний логотип Google Antigravity (@iconify-json/logos, CC0-1.0, контраст 4.60:1), підтримка в розширенні браузера Chrome MV3 (рамка hemel #027FBD), матриці дозволів і каталозі інтеграцій (161 позиція).",
                "[claude · ZOEKDIEP-001] Пошук: результат відкриває потрібний лист у правильній скриньці (з вкладенням), файл Drive у потрібному акаунті, подію календаря, нотатку чи завдання та веде до потрібного розділу довгих сторінок.",
                "[claude · ORCH-001] Координація агентів (ORCH-001): задачу закрито, черга інтеграції порожня.",
                "[codex · DESIGN-002] Оформлення (DESIGN-002): календар, хмара, нотатки, пошук і налаштування мають однакові заокруглені поверхні й тіні та адаптивні сітки карток."
              ],
              "fixes": [
                "[claude · UITROL-UTF8-001, PR №40] Інсталятор (mijn-ruimte-uitrol.sh) обрізає AUTEUR і SAMENVATTING по цілому символу UTF-8 і захищає JSON-журнал встановлення від пошкодження при довгому кириличному описі.",
                "[claude · UITGAVE-001, PR №38] Пакувальник оновлень (maak-voorstelpakket.sh) обрізає кириличний список змін і diff по цілому символу й рядку без розриву UTF-8.",
                "[claude · ZOEKDIEP-001, PR №34, №35] Хмара відкриває елемент із пошуку поза першим завантаженням і більше не затирає місце продовження (resume); Gmail знаходить вкладення після повного завантаження листа.",
                "[claude · ORCH-001, PR №30, №33, №36] Виправлено старі помилки пошуку, контрасту, мобільної верстки, прав тимчасових тек, CSS-токенів і Chrome-перевірки «Координація агентів».",
                "[antigravity · AGPLUGIN-001] Додано скорочення KORT_ESSENTIE для імен інструментів Connector v2 (≤ 64 символів) та стислий заголовок інструкцій (≤ 512 символів) для довгих slug агентів.",
                "[antigravity · AGPLUGIN-001] Перегенеровано каталог кнопок пошуку (1319 елементів) та узгоджено реєстр інтеграцій (161 картка)."
              ],
              "beperkingen": [
                "Критичні політики не підписані власником: встановлення лише вручну з passkey, GitOps вимкнено.",
                "Три набори тестів не запускаються в хмарному контейнері (@iconify-json/logos, тестовий Home Assistant на IP контейнера, Playwright-core).",
                "Повний авторизований сайт із реальними даними не перевірено; перевірено модульні тести, браузерні стенди й повну збірку."
              ],
              "instructies": "Admin → Оновлення → «Нове оновлення»: завантажте саме mijn-ruimte-20261106-131500.tar.gz з GitHub Release (не zip), дочекайтеся зеленої попередньої перевірки й натисніть «Схвалити й встановити» з passkey. Між збіркою і цим встановленням не встановлюйте інших пакетів, інакше root відхилить базу (BASIS_VEROUDERD)."
            },
            "nl": {
              "titel": "Plug-in en tweerichtingsconnector Google Antigravity (AGPLUGIN-001) + UTF-8-herstel in root-installer (claude)",
              "samenvatting": "Tweerichtingsplug-in en connector Google Antigravity (/antigravity) met 4-kanaals brugpaneel (Site, Browser, Pc, Server) [antigravity], plus herstel van UTF-8-afkapping in de root-installer (UITROL-UTF8-001) en eerdere verbeteringen in zoeken en coördinatie [claude].",
              "wijzigingen": [
                "[antigravity · AGPLUGIN-001] Plug-in en tweerichtingsconnector Google Antigravity (/antigravity): koppeling via OAuth RFC 9728 of token en volledige Connector v2-gereedschapscatalogus.",
                "[antigravity · AGPLUGIN-001] Interactief tweetalig brugpaneel AntigravityBrugPaneel op #agent/antigravity: beheer van 4 kanalen (Site en Coördinatie, Browser, Lokale Pc, Server) met één klik.",
                "[antigravity · AGPLUGIN-001] Actieve vaardigheid en uitvoerbare CLI/MCP-brug mijn-ruimte (.agents/skills/mijn-ruimte) en plug-inpakket deploy/antigravity-plugin.",
                "[antigravity · AGPLUGIN-001] Officieel Google Antigravity-logo (@iconify-json/logos, CC0-1.0, contrast 4.60:1), ondersteuning in de Chrome MV3-browserextensie (kaderkleur hemel #027FBD), rechtenmatrix en integratiecatalogus (161 posities).",
                "[claude · ZOEKDIEP-001] Zoeken: een resultaat opent het juiste bericht in de juiste mailbox (met bijlage), het Drive-bestand in het juiste account, de agenda-afspraak, de notitie of de taak en leidt naar het juiste onderdeel van lange pagina’s.",
                "[claude · ORCH-001] Agentcoördinatie (ORCH-001): de taak is afgesloten, de integratiewachtrij is leeg.",
                "[codex · DESIGN-002] Vormgeving (DESIGN-002): agenda, cloud, notities, zoeken en instellingen hebben dezelfde afgeronde vlakken en schaduwen en responsieve kaartrasters."
              ],
              "fixes": [
                "[claude · UITROL-UTF8-001, PR #40] De root-installer (mijn-ruimte-uitrol.sh) knipt AUTEUR en SAMENVATTING op een heel UTF-8-teken en beschermt het JSON-installatielogboek tegen beschadiging bij lange Cyrillische beschrijvingen.",
                "[claude · UITGAVE-001, PR #38] De pakketbouwer (maak-voorstelpakket.sh) knipt de Cyrillische wijzigingslijst en diff op een heel teken en een hele regel zonder UTF-8 te breken.",
                "[claude · ZOEKDIEP-001, PR #34, #35] De cloud opent een item uit zoeken ook buiten de eerste lading en overschrijft de hervatplek (resume) niet meer; Gmail vindt bijlagen na het volledig laden van het bericht.",
                "[claude · ORCH-001, PR #30, #33, #36] Oude fouten in zoeken, contrast, mobiele opmaak, rechten van tijdelijke mappen, CSS-tokens en de Chrome-controle «Agentcoördinatie» zijn hersteld.",
                "[antigravity · AGPLUGIN-001] Verkorting KORT_ESSENTIE toegevoegd voor Connector v2-hulpmiddelnamen (≤ 64 tekens) en beknopte instructiekop (≤ 512 tekens) voor lange agentslugs.",
                "[antigravity · AGPLUGIN-001] De zoekcatalogus voor UI-knoppen is opnieuw gegenereerd (1319 elementen) en het integratieregister is bijgewerkt (161 kaarten)."
              ],
              "beperkingen": [
                "Kritieke beleidsregels zijn niet door de eigenaar ondertekend: installeren alleen handmatig met een passkey, GitOps staat uit.",
                "Drie testsuites draaien niet in de cloudcontainer (@iconify-json/logos, test-Home Assistant op het IP van de container, Playwright-core).",
                "De volledige aangemelde site met echte gegevens is niet gecontroleerd; eenheidstests, browseropstellingen en de volledige bouw wel."
              ],
              "instructies": "Admin → Updates → «Nieuwe update»: upload precies mijn-ruimte-20261106-131500.tar.gz uit de GitHub Release (geen zip), wacht op een groene voorcontrole en klik «Goedkeuren en installeren» met een passkey. Installeer tussen de bouw en deze installatie geen ander pakket, anders weigert root de basis (BASIS_VEROUDERD)."
            }
          }
          JSON
          node "$RUNNER_TEMP/maak-manifest.mjs"

      - name: Зібрати пакет через orch pakket · pakket bouwen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uitvoer
          env -u MANIFEST -u TESTS_GESLAAGD -u TESTS_MISLUKT -u TESTS_SAMENVATTING \
            node scripts/orch.mjs pakket --taak "$TAAK" --auteur "Власник" --agent antigravity --platform "Google Antigravity" \
              --versie "$VERSIE" --manifest "$RUNNER_TEMP/manifest.json" --testresultaten "$RUNNER_TEMP/controle/testresultaten.json" \
              --samenvatting-uk "Плагін і двосторонній конектор Google Antigravity (AGPLUGIN-001 від antigravity) + виправлення UTF-8 у root-інсталяторі (UITROL-UTF8-001 від claude), глибокі посилання пошуку (ZOEKDIEP-001) і закриття ORCH-001." \
              --samenvatting-nl "Plug-in en tweerichtingsconnector Google Antigravity (AGPLUGIN-001 door antigravity) + herstel van UTF-8 in de root-installer (UITROL-UTF8-001 door claude), diepe zoeklinks (ZOEKDIEP-001) en afsluiting van ORCH-001." \
              --uit uitvoer 2>&1 | tee "$RUNNER_TEMP/pakket.log"
          if grep -Eq '^(FOUT|LET OP (BASIS_ONBEKEND|INSTALLATIE_NIET_IN_HEAD))' "$RUNNER_TEMP/pakket.log"; then echo "FOUT: orch pakket meldde een fout" >&2; exit 1; fi
          test -f "uitvoer/$PAKKET"
          test -f "uitvoer/$OVERDRACHT"
          unzip -p "uitvoer/$OVERDRACHT" "$PAKKET.sha256" > "uitvoer/$PAKKET.sha256"
          (cd uitvoer && sha256sum -c --strict "$PAKKET.sha256")
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/$OVERDRACHT"
          rm -f orchestratie/geinstalleerd.json
          git checkout -- "orchestratie/taken/$TAAK.json"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Звірити вміст архіву · inhoud van het archief
        shell: bash
        run: |
          set -euo pipefail
          d="mijn-ruimte-$VERSIE"
          test "$(tar -xzOf "uitvoer/$PAKKET" "$d/UITROL-VERSIE" | tr -d '\n')" = "$VERSIE"
          test "$(tar -xzOf "uitvoer/$PAKKET" "$d/BRON-COMMIT" | tr -d '\n')" = "$GITHUB_SHA"
          basis="$(tar -xzOf "uitvoer/$PAKKET" "$d/UITROL-BASIS")"
          echo "$basis"
          grep -qx "versie=$LIVE_VERSIE" <<< "$basis"
          grep -qx "commit=$LIVE_COMMIT" <<< "$basis"
          tar -xzOf "uitvoer/$PAKKET" "$d/ONTWIKKELARCHIEF.json" > "$RUNNER_TEMP/ONTWIKKELARCHIEF.json"
          cat "$RUNNER_TEMP/ONTWIKKELARCHIEF.json"; echo
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesOntwikkelArchief } from './shared/ontwikkelarchief.ts';
            const e = process.env;
            const r = leesOntwikkelArchief(fs.readFileSync(e.RUNNER_TEMP + '/ONTWIKKELARCHIEF.json', 'utf8'), e.VERSIE, e.GITHUB_SHA);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (r.ref.tak !== e.TAK || r.ref.taakId !== e.TAAK) throw Error('tak/taakId wijken af');
            console.log('TRACE-001-посилання в архіві валідне');"
          git show "HEAD:orchestratie/ontwikkelarchieven/$TAAK.json" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/dossier.sha"
          test "$(cat "$RUNNER_TEMP/dossier.sha")" = "$(node -p 'require(process.argv[1]).sha256' "$RUNNER_TEMP/ONTWIKKELARCHIEF.json")"
          SHA="$(sha256sum "uitvoer/$PAKKET" | cut -d' ' -f1)"
          test "$(cut -d' ' -f1 "uitvoer/$PAKKET.sha256")" = "$SHA"
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "SHA-256 $PAKKET: $SHA"

      - name: Попередня перевірка сайту (без мережі) · voorcontrole van de site
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild backend/uitrol-voorcontrole.ts --bundle --platform=node --format=esm --packages=external --outfile="$RUNNER_TEMP/voorcontrole.mjs" --log-level=warning
          cat > "$RUNNER_TEMP/voorcontrole-draai.mjs" <<'JS'
          const [mod, pakket, versie, actief, online] = process.argv.slice(2);
          const { pakketVoorcontrole } = await import(mod);
          const opties = { versie, actieveVersie: actief };
          if (online !== 'online') opties.archiefControle = async () => ({ ok: true, code: 'OK', reden: 'offline vooraf · онлайн-перевірка після публікації' });
          const { resultaat, meta } = await pakketVoorcontrole(pakket, opties);
          for (const c of resultaat.controles) console.log(`${c.niveau.padEnd(12)} ${c.id}: ${c.uk}${c.details?.length ? ' — ' + c.details.slice(0, 5).join('; ') : ''}`);
          console.log(`fouten=${resultaat.fouten} waarschuwingen=${resultaat.waarschuwingen} commit=${meta.commit} agent=${meta.agent}`);
          if (!resultaat.ok || resultaat.fouten) process.exit(1);
          JS
          node "$RUNNER_TEMP/voorcontrole-draai.mjs" "$RUNNER_TEMP/voorcontrole.mjs" "$PWD/uitvoer/$PAKKET" "$VERSIE" "$LIVE_VERSIE" offline

      - name: Живу базу ще раз · live basis opnieuw
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "https://hub.tarasevych.com/api/version?ts=$(date -u +%s)" -o "$RUNNER_TEMP/site-versie-2.json"
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (String(d.versie ?? d.version) !== process.env.LIVE_VERSIE || String(d.bronCommit ?? d.commit) !== process.env.LIVE_COMMIT)
              throw Error("FOUT: встановлена версія змінилася під час збірки — нічого не опубліковано");
            console.log("База без змін: " + process.env.LIVE_VERSIE);
          ' "$RUNNER_TEMP/site-versie-2.json"
          git fetch --quiet origin "$TAK" integratie
          test "$(git rev-parse "origin/$TAK")" = "$GITHUB_SHA"
          test "$(git rev-parse origin/integratie)" = "$INTEGRATIE_HOOFD"

      - name: Опублікувати GitHub Release · release publiceren
        id: release
        shell: bash
        run: |
          set -euo pipefail
          D="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSIE"
          {
            echo "**Архів для встановлення (Admin → Оновлення):** $D/$PAKKET"
            echo
            echo "- SHA-256 (\`.tar.gz\`): \`$RELEASE_SHA\`"
            echo "- Пакет передачі (не для сайту): $D/$OVERDRACHT"
            echo "- Встановлена база (\`UITROL-BASIS\`): \`$LIVE_VERSIE\` @ \`$LIVE_COMMIT\`"
            echo "- BRON-COMMIT: \`$GITHUB_SHA\` (гілка \`$TAK\`, integratie \`$INTEGRATIE_HOOFD\`)"
            echo "- Журнал розробки (TRACE-001): \`orchestratie/ontwikkelarchieven/$TAAK.json\`"
            echo "- Збірка й перевірки: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat <<'MD'
          ### Учасники й відповідальність · Deelnemers en verantwoordelijkheid
          - **Власник** (`mens`) — автор, контроль (`auteur, controle`)
          - **claude · Claude Code** (`ai`, модель невідома) — розробка, перевірка, тестування (`ontwikkeling, controle, testen`):
            - **PR #40 (`UITROL-UTF8-001`, нове після `20261106-092612`)**: root-інсталятор (`deploy/uitrol/mijn-ruimte-uitrol.sh`) обрізає `AUTEUR` і `SAMENVATTING` по цілому символу UTF-8 і захищає JSON-журнал встановлення від пошкодження при довгому кириличному описі (`tests/eenheid/uitrol-deur.test.ts` 122/122)
            - **PR #30, #32–#36, #38 (`ORCH-001`, `ZOEKDIEP-001`, `UITGAVE-001`)**: глибокі посилання пошуку, закриття `ORCH-001`, виправлення пакувальника UTF-8, контрасту, мобільної верстки й тестів
          - **antigravity · Google Antigravity** (`ai`, модель невідома) — розробка, перевірка, тестування, пакування (`ontwikkeling, controle, testen, verpakken`):
            - **`AGPLUGIN-001`**: плагін і двосторонній конектор Google Antigravity (`/antigravity`, RFC 9728 OAuth), інтерактивна 4-канальна панель мосту `AntigravityBrugPaneel` (`#agent/antigravity` для Сайту, Браузера, ПК і Сервера), активна навичка та CLI/MCP-міст `mijn-ruimte`, офіційний логотип CC0-1.0 (контраст 4.60:1), підтримка в розширенні Chrome MV3, матриці дозволів і каталозі інтеграцій (161 позиція)

          ### Як встановити · Installeren
          Admin → Оновлення → «Нове оновлення» → завантажити саме `.tar.gz` вище → зелена попередня перевірка → «Схвалити й встановити» з passkey. Пакет передачі (`-overdracht.zip`) сайт не приймає.
          Admin → Updates → upload exact het `.tar.gz` hierboven → groene voorcontrole → goedkeuren met een passkey. Het overdrachtspakket (`-overdracht.zip`) is niet voor de site.
          MD
          } > "$RUNNER_TEMP/notities.md"
          gh release create "$VERSIE" "uitvoer/$PAKKET" "uitvoer/$PAKKET.sha256" "uitvoer/$OVERDRACHT" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAAK · $VERSIE" --notes-file "$RUNNER_TEMP/notities.md" --latest=false

      - name: Перевірити опублікований Release і TRACE-001 · gepubliceerde release en TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download"
          ok=0
          for i in $(seq 1 12); do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/release-api.json"
            digest="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const a=(r.assets||[]).find(x=>x.name===process.env.PAKKET); console.log(a && a.state==="uploaded" ? a.digest || "" : "")' "$RUNNER_TEMP/release-api.json")"
            if [ "$digest" = "sha256:$RELEASE_SHA" ]; then ok=1; break; fi
            echo "Чекаю на digest asset ($i/12): got '$digest'..."
            sleep 5
          done
          test "$ok" -eq 1
          gh release download "$VERSIE" --repo "$GITHUB_REPOSITORY" --pattern "$PAKKET" --dir "$RUNNER_TEMP/download"
          cmp -s "uitvoer/$PAKKET" "$RUNNER_TEMP/download/$PAKKET"
          # Точний Python-фрагмент TRACE-001 із deploy/uitrol/mijn-ruimte-uitrol.sh
          awk '/^  ARCHIEF_UITKOMST=/{flag=1; next} /^PY$/ && flag{flag=0} flag' deploy/uitrol/mijn-ruimte-uitrol.sh > "$RUNNER_TEMP/root-trace.py"
          test "$(wc -l < "$RUNNER_TEMP/root-trace.py")" -gt 50
          UITKOMST="$(timeout 55 python3 "$RUNNER_TEMP/root-trace.py" "$RUNNER_TEMP/ONTWIKKELARCHIEF.json" "$GITHUB_SHA" "$VERSIE" "$RUNNER_TEMP/download/$PAKKET")"
          echo "root TRACE-001: $UITKOMST"
          test "$UITKOMST" = "OK"

      - name: Попередня перевірка сайту з онлайн-TRACE · voorcontrole online
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/voorcontrole-draai.mjs" "$RUNNER_TEMP/voorcontrole.mjs" "$RUNNER_TEMP/download/$PAKKET" "$VERSIE" "$LIVE_VERSIE" online

      - name: Збій після публікації → Release непридатний · mislukt na publicatie
        if: failure() && steps.release.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          { echo "**НЕ ВСТАНОВЛЮВАТИ · NIET INSTALLEREN** — перевірка після публікації не пройшла: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; cat "$RUNNER_TEMP/notities.md"; } > "$RUNNER_TEMP/notities-mislukt.md"
          gh release edit "$VERSIE" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notities-mislukt.md" --draft=true
          echo "::error title=RELEASE_INGETROKKEN::Release $VERSIE позначено НЕ ВСТАНОВЛЮВАТИ й переведено в чернетку"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGPLUGIN-001-pakket
          path: |
            uitvoer/
            ${{ runner.temp }}/pakket.log
            ${{ runner.temp }}/ONTWIKKELARCHIEF.json
            ${{ runner.temp }}/notities.md
          retention-days: 30
          if-no-files-found: warn
