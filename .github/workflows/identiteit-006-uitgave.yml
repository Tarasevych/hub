name: IDENTITEIT-006 · перевірка та випуск «Студії» центру налаштувань

# Цей процес нічого не встановлює. Власник окремо схвалює випуск ключем доступу.
# Deze werkwijze installeert niets. De eigenaar keurt een uitgave afzonderlijk goed.
on:
  push:
    branches:
      - 'feature/identiteit-006-20261108-162906'
    paths:
      - '.github/workflows/identiteit-006-uitgave.yml'
      - 'src/identiteit/**'
      - 'tests/e2e/identiteit-mobiel.e2e.ts'
      - 'tests/e2e/hulp/identiteit-mobiel-stand/**'
      - 'orchestratie/ontwikkelarchieven/IDENTITEIT-006.json'

permissions:
  contents: write

concurrency:
  group: identiteit-006-uitgave
  cancel-in-progress: false

env:
  TAAK: IDENTITEIT-006
  BASIS_VERSIE: '20261108-111700'
  BASIS_COMMIT: '944336a259731cd9b90afb29a191e896f48cec38'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bronbestanden ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node voorbereiden
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Afhankelijkheden installeren
        run: npm ci --ignore-scripts
      - name: Actieve versie vaststellen
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/identiteit-006-20261108-162906'
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/actieve-versie.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const v=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/actieve-versie.json','utf8'));
          if(v.versie!==process.env.BASIS_VERSIE || (v.bronCommit||v.commit)!==process.env.BASIS_COMMIT){
            throw new Error('Встановлена основа змінилася; випуск зупинено.');
          }
          JS
      - name: Правила і джерела
        run: |
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs identiteit-atelier
          node scripts/eenheidstests.mjs mobiel-cascade-20261105
          node scripts/eenheidstests.mjs mobiel-geometrie
          node scripts/eenheidstests.mjs identiteit-account-ui
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief
          node scripts/eenheidstests.mjs uitrol-voorcontrole
      - name: Справжні вузькі екрани у браузері
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core install chromium
            CHROME="$(node -p 'require("playwright-core").chromium.executablePath()')"
          fi
          test -x "$CHROME"
          PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core" CHROME="$CHROME" \
            node scripts/e2e-lokaal.mjs identiteit-mobiel
      - name: Типи і складання
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Підтвердити незмінність файлів
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Дані випуску
        id: gegevens
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Версія вже існує.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const e=process.env;
          const uk={titel:'«Студія» — новий дизайн центру налаштувань',samenvatting:'Центр налаштувань акаунта зібрано заново на ідеях прототипу v49: один розділ на екрані з ілюстрацією, аркуш розділів на телефоні, панель на ПК і пошук по всіх 153 налаштуваннях.',wijzigingen:['Один розділ на екрані: заголовок з ілюстрацією v49, справжні налаштування, згорнута дорожня карта і перехід до сусідніх розділів.','Телефон: липка смуга з прогресом і аркуш знизу з усіма розділами; ПК: панель ліворуч, праворуч, зверху або знизу.','Пошук Ctrl/Cmd+K по розділах, групах і налаштуваннях обома мовами з підсвіткою знайденого.'],fixes:['Апостроф у index.html більше не ламає скрипт оформлення.','Сторінка налаштувань не стрибає донизу і не показує на мить старий вигляд.','На телефоні немає горизонтального зсуву на 14 px.'],beperkingen:['Сторінки поза центром облікового запису не змінювались.','Новий вигляд, як і раніше, вмикається прапорцем identiteit-account-atelier; спершу перевірте його в режимі «Тільки я».'],instructies:'Установіть архів через admin.tarasevych.com із підтвердженням ключем доступу. Спершу перевірте новий вигляд лише для себе.'};
          const nl={titel:'«Studio» — nieuw ontwerp van het instellingencentrum',samenvatting:'Het accountinstellingencentrum is opnieuw opgebouwd op de ideeën van prototype v49: één onderdeel per scherm met illustratie, een onderdeelblad op de telefoon, een balk op de computer en zoeken in alle 153 instellingen.',wijzigingen:['Eén onderdeel per scherm: kop met v49-illustratie, de echte instellingen, een ingeklapte routekaart en naastliggende onderdelen.','Telefoon: vaste balk met voortgang en een blad van onderen met alle onderdelen; computer: balk links, rechts, boven of onder.','Zoeken met Ctrl/Cmd+K in onderdelen, groepen en instellingen in beide talen, met markering van de treffer.'],fixes:['Een apostrof in index.html breekt het vormgevingsscript niet meer.','De instellingenpagina springt niet meer naar onderen en toont niet even het oude uiterlijk.','Geen horizontale verschuiving van 14 px meer op de telefoon.'],beperkingen:['Pagina’s buiten het accountcentrum zijn niet gewijzigd.','Het nieuwe uiterlijk blijft achter de vlag identiteit-account-atelier; controleer het eerst met «Alleen ik».'],instructies:'Installeer het archief via admin.tarasevych.com met een passkey. Controleer eerst de nieuwe vorm voor jezelf.'};
          const m={schema:1,versie:e.VERSIE,aangemaakt:new Date().toISOString(),herkomst:`git: commit ${e.GITHUB_SHA} (basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,auteur:'Павло Тарасевич (tarasevych.pavlo@gmail.com)',zonderAi:false,deelnemers:[{soort:'mens',naam:'Павло Тарасевич (tarasevych.pavlo@gmail.com)',rollen:['auteur']},{soort:'ai',naam:'claude',platform:'Claude Code',tool:'Claude Code',model:{id:null,versie:null,bron:'onbekend'},rollen:['ontwikkeling','controle','testen','verpakken']}],beschrijving:{uk,nl}};
          writeFileSync(e.RUNNER_TEMP+'/UITROL-MANIFEST.json',JSON.stringify(m,null,2)+'\n');
          const tests={geslaagd:117,mislukt:0,falend:[],uitleg:{uk:'Перевірки «Студії» (33), мобільного каскаду (22), геометрії (56) та облікового запису (6), складання, перевірки типів і браузерні перевірки екранів пройдено в цьому запуску.',nl:'De Studio-tests (33), mobiele cascade (22), geometrie (56) en account (6), de bouw, de typecontroles en de browserproeven voor schermen zijn in deze uitvoering geslaagd.'}};
          writeFileSync(e.RUNNER_TEMP+'/TESTRESULTATEN.json',JSON.stringify(tests,null,2)+'\n');
          writeFileSync('orchestratie/geinstalleerd.json',JSON.stringify({versie:e.BASIS_VERSIE,bronCommit:e.BASIS_COMMIT,bron:'geverifieerd_productie_api'},null,2)+'\n');
          JS
      - name: Архів та перевірка пакета
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent claude --platform 'Claude Code' \
            --versie "$VERSIE" --uit uitvoer --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" \
            --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-claude-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
          printf 'IDENTITEIT-006 · Перевірена пропозиція («Студія»). Встановлення лише власником через ключ доступу.\nBRON-COMMIT: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/opis.md"
      - name: Повторна перевірка чинного сервера
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/actuele-versie.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/actuele-versie.json','utf8'));
          if(d.versie!==process.env.BASIS_VERSIE||(d.bronCommit||d.commit)!==process.env.BASIS_COMMIT)throw Error('Встановлена основа змінилася; оприлюднення зупинено.');
          JS
      - name: Оприлюднити архів без встановлення
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-claude-overdracht.zip" \
            --target "$GITHUB_SHA" --title "IDENTITEIT-006 · «Студія» · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const e=process.env;
          const p=`uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const hash=createHash('sha256').update(readFileSync(p)).digest('hex');
          const r=JSON.parse(readFileSync(e.RUNNER_TEMP+'/release.json','utf8'));
          const a=r.assets.find(x=>x.name===`mijn-ruimte-${e.VERSIE}.tar.gz`);
          if(r.draft||!a||a.state!=='uploaded'||a.digest!==`sha256:${hash}`)throw Error('Оприлюднений архів не збігається за контрольною сумою.');
          JS
      - name: У разі збою приховати непридатний випуск
        if: failure() && steps.release.outcome == 'success'
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
      - name: Зберегти звіт виконання
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identiteit-006-controle
          path: |
            rapporten/identiteit-mobiel/
            uitvoer/
          if-no-files-found: ignore
