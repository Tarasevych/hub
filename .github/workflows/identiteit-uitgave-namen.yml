name: ІДЕНТИТЕТ · упорядкування назв минулих випусків

# Одноразове впорядкування назв і описів випусків, які створив агент.
# Запускається лише push-ом у службову гілку docs/identiteit-uitgave-*, тому нового пакета не складає.

on:
  push:
    branches:
      - 'docs/identiteit-uitgave-*'

permissions:
  contents: write

jobs:
  namen:
    runs-on: ubuntu-latest
    steps:
      - name: Перейменувати минулі випуски
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          noem() {
            TAG="$1"; TITEL="$2"
            ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null || true)"
            if [ -z "$ID" ]; then echo "немає випуску $TAG"; return 0; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f name="$TITEL" \
              -f body="Застарілий випуск. Встановлюйте 20261107-121500 або новіший, підтверджений ключем доступу власника. Журнал розробки: orchestration/ontwikkelarchieven/IDENTITEIT-001.json." > /dev/null
            echo "оновлено: $TAG → $TITEL"
          }
          noem 20261104-153759 "ІДЕНТИТЕТ-ACCOUNT · перша спроба (застаріла)"
          noem 20261104-154114 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261104-160343 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261104-164906 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261104-191935 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261104-204906 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261105-003823 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
          noem 20261105-061659 "ІДЕНТИТЕТ-ACCOUNT · сторінка облікового запису (застаріла)"
