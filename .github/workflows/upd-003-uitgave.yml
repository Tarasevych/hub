          node --input-type=module -e 'import { readFileSync } from "node:fs"; const ev = JSON.parse(readFileSync("dist/downloads/extension-version.json", "utf8")); if (ev.version !== "0.9.6") throw Error("Очікувалася версія розширення 0.9.6, отримано: " + ev.version); console.log("extension-version.json:", ev.version);'
