name: IDENTITEIT-003 · безпечний випуск оформлення облікового запису

on:
  push:
    branches:
      - 'feature/identiteit-003-account-atelier-20261107-190805'

permissions:
  contents: read

concurrency:
  group: identiteit-003-uitgave
  cancel-in-progress: false

jobs:
  pakket:
    name: Перевірка, пакет і звірення опублікованого випуску
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Отримати вихідні файли та історію
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Підготувати середовище
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Звірити правила й встановлену основу
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak IDENTITEIT-003 --fase overdracht
          curl --fail --silent --show-error --max-time 30 'https://id.tarasevych.com/api/version' -o "$RUNNER_TEMP/werkend.json"
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const d=JSON.parse(readFileSync(process.argv[1],"utf8"));
            const versie=String(d.versie||"");const bronCommit=String(d.commit||d.bronCommit||"");
            if(!/^\d{8}-\d{6}$/.test(versie)||!/^[a-f0-9]{40}$/.test(bronCommit))throw Error("INSTALLATIE_ONBEKEND");
            writeFileSync("orchestratie/geinstalleerd.json",JSON.stringify({versie,bronCommit,bron:"rechtstreeks gecontroleerde /api/version"},null,2)+"\n");
            console.log(`Встановлена основа: ${versie} @ ${bronCommit.slice(0,12)}`);
          ' "$RUNNER_TEMP/werkend.json"
          BASIS_COMMIT="$(node -p 'require("./orchestratie/geinstalleerd.json").bronCommit')"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD || { echo 'ВІДХИЛЕНО: встановлена основа не є предком випуску'; exit 1; }

      - name: Установити засоби складання
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Перевірити справжні дії й безпечне повернення
        shell: bash
        run: |
          set -euo pipefail
          node scripts/eenheidstests.mjs identiteit-atelier.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          npm run typecheck:server
          npx tsc --noEmit -p tsconfig.json
          npm run build

      - name: Підготувати двомовні відомості випуску
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          node --input-type=module -e '
            import {writeFileSync,readFileSync} from "node:fs";
            const versie=process.argv[1];const sha=process.env.GITHUB_SHA;
            const basis=JSON.parse(readFileSync("orchestratie/geinstalleerd.json","utf8"));
            const naam="Павло Тарасевич (tarasevych.pavlo@gmail.com)";
            const m={schema:1,versie,aangemaakt:new Date().toISOString(),herkomst:`git: commit ${sha} (basis ${basis.versie} ${basis.bronCommit})`,auteur:naam,zonderAi:false,
              deelnemers:[{soort:"mens",naam,rollen:["auteur"]},{soort:"ai",naam:"codex",platform:"ChatGPT",tool:"Codex",model:{id:"gpt-6",versie:null,bron:"omgeving"},rollen:["ontwikkeling","controle","testen","verpakken"]}],
              beschrijving:{
                uk:{titel:"Нове оформлення керування обліковим записом",samenvatting:"Дванадцять розділів із відповідними змісту піктограмами, ілюстраціями та розгортними налаштуваннями. Оновлення можна вмикати для себе, вибраних людей або всіх і негайно вимикати без втрати даних.",wijzigingen:["Окрема нова оболонка сторінки за перемикачем.","Кольорові піктограми й тематичні ілюстрації дванадцяти розділів.","Розгортні налаштування та блок запланованих можливостей.","Підтримка двох мов, вузьких екранів і тем."],fixes:["Збережено попередню сторінку як запасну.","Відокремлено читання перемикачів від технічних засобів керування."],beperkingen:["Новий вигляд спочатку вимкнено — власник обирає аудиторію.","Неоголошені серверні дії не вмикаються; 153 пункти зразка не є 153 підключеними діями."],instructies:"У технічному профілі відкрийте «Нові можливості сайту», знайдіть «Нове оформлення «Керування обліковим записом»», оберіть спершу «Тільки я». Для негайного повернення оберіть «Вимкнено»."},
                nl:{titel:"Vernieuwd accountbeheer met veilige terugkeer",samenvatting:"Twaalf onderdelen met betekenisvolle pictogrammen, illustraties en uitklapbare instellingen. Het nieuwe uiterlijk kan eerst voor de eigenaar, daarna voor gekozen mensen of iedereen aan en zonder gegevensverlies uit.",wijzigingen:["Afzonderlijke nieuwe accountvorm achter een schakelaar.","Gekleurde pictogrammen en passende illustraties voor twaalf onderdelen.","Uitklapbare instellingen en een blok met plannen.","Ondersteuning voor twee talen, kleine schermen en thema’s."],fixes:["De bestaande pagina blijft als terugval behouden.","Het lezen van schakelaars staat los van technisch beheer."],beperkingen:["De nieuwe vorm staat aanvankelijk uit; de eigenaar kiest wie haar ziet.","Toekomstige serverhandelingen worden niet aangezet; 153 proefonderdelen zijn niet 153 aangesloten handelingen."],instructies:"Open in het technische profiel «Nieuwe mogelijkheden», zoek «Nieuwe vorm van Accountbeheer» en kies eerst «Alleen ik». Kies «Uit» om meteen terug te keren."}}};
            writeFileSync("uitgave-manifest.json",JSON.stringify(m,null,2)+"\n");
          ' "$VERSIE"

      - name: Налаштувати описи та результати випробувань
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            // SEC-002: cijfers uit de echte uitvoer van scripts/eenheidstests.mjs, geen letterlijke getallen · кількість перевірок — із фактичного виводу тестів.
            const gemeten={geslaagd:0,mislukt:0};
            const perTest = new Map(); for (const r of readFileSync(process.env.RUNNER_TEMP+"/eenheidstests.log", "utf8").matchAll(/^(\d+)\/(\d+) geslaagd \(([^)\n]+)\)/gm)) perTest.set(r[3], [Number(r[1]), Number(r[2])]); for (const [g, n] of perTest.values()) { gemeten.geslaagd += g; gemeten.mislukt += n - g; } const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + " " + g + "/" + n).join("; ");
            if(!gemeten.geslaagd||gemeten.mislukt)throw Error("Немає виміряних результатів тестів або є невдалі перевірки — випуск зупинено.");
            writeFileSync("uitgave-testen.json",JSON.stringify({geslaagd:gemeten.geslaagd,mislukt:gemeten.mislukt,falend:[],uitleg:{uk:"Перевірки нового вигляду, зокрема довжини опису прапорця за обмеженням бази даних, успішні; також пройдено перевірки типів і складання." + " Виміряно в цьому запуску — файл тестів і пройдено з усього: " + gemetenLijst + ".",nl:"Controles van de nieuwe vorm, inclusief de maximale omschrijvingslengte volgens het databaseschema, geslaagd; ook typecontroles en de volledige bouw geslaagd." + " Gemeten in deze uitvoering — testbestand en geslaagd van totaal: " + gemetenLijst + "."}},null,2)+"\n");
          '

      - name: Скласти сумісний архів за правилами
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak IDENTITEIT-003 --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' --agent codex --model-id gpt-6 --model-bron omgeving --platform ChatGPT --tool Codex --versie "$VERSIE" --manifest uitgave-manifest.json --testresultaten uitgave-testen.json --uit uitvoer
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-$VERSIE-codex-overdracht.zip"
      - name: Дані для задачі публікації · gegevens voor de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): deze taak heeft geen schrijfrecht. Wat gepubliceerd moet worden, gaat als artefact naar de publicatietaak:
          # de lokale commits (git-bundel bovenop GITHUB_SHA), de verwachte HEAD, de pakketgegevens en de pakketbestanden.
          # Ця задача не має права запису: зміни й пакет передаються артефактом задачі публікації, яка все перевіряє сама.
          P="$RUNNER_TEMP/publicatie"
          mkdir -p "$P/uitvoer"
          git rev-parse HEAD > "$P/HEAD"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git -c core.hooksPath=/dev/null bundle create "$P/wijzigingen.bundle" HEAD "^$GITHUB_SHA"
          fi
          : > "$P/vars"
          printf '%s=%s\n' VERSIE "$VERSIE" >> "$P/vars"
          cp uitvoer/mijn-ruimte-"$VERSIE"* "$P/uitvoer/"
      - name: Передати дані задачі публікації · gegevens aan de publicatietaak doorgeven
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identiteit-003-release-publicatie
          path: ${{ runner.temp }}/publicatie/
          if-no-files-found: error
          retention-days: 7

  publicatie:
    name: Публікація лише з перевірених даних (git і gh, з ключем) · publicatie uit gecontroleerde gegevens (git en gh, met sleutel)
    needs: pakket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Вихідна фіксація без збереженого ключа · broncommit zonder bewaarde sleutel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Дані із задачі складання · gegevens uit de bouwtaak
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: identiteit-003-release-publicatie
          path: ${{ runner.temp }}/publicatie
      - name: Перевірити передані дані · overgedragen gegevens controleren
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): de bouwtaak draaide npm, tests en eigen scripts — wat ze doorgeeft is NIET vertrouwd. Alleen aanvaarden:
          #  - commits bovenop GITHUB_SHA, zonder samenvoegingen, die uitsluitend de verwachte bestanden wijzigen (gewone bestanden);
          #  - pakketgegevens met een vaste vorm; de SHA-256 wordt hier opnieuw berekend.
          # Приймаються лише очікувані файли поверх GITHUB_SHA і дані випуску суворого вигляду; SHA-256 обчислюється тут заново.
          P="$RUNNER_TEMP/publicatie"
          TOEGESTAAN=''
          DOEL="$GITHUB_SHA"
          if [ -e "$P/wijzigingen.bundle" ]; then
            test -n "$TOEGESTAAN" || { echo 'Задача складання передала зміни, хоча цей процес їх не очікує — зупинено. · Onverwachte commits van de bouwtaak — gestopt.' >&2; exit 1; }
            git -c core.hooksPath=/dev/null fetch --quiet --no-tags "$P/wijzigingen.bundle" "+HEAD:refs/sec002/publicatie"
            DOEL="$(git rev-parse --verify 'refs/sec002/publicatie^{commit}')"
            git merge-base --is-ancestor "$GITHUB_SHA" "$DOEL" || { echo 'Зміни не лежать поверх GITHUB_SHA — зупинено. · De commits liggen niet bovenop GITHUB_SHA — gestopt.' >&2; exit 1; }
            test -z "$(git rev-list --merges "$GITHUB_SHA..$DOEL")" || { echo 'Злиття в переданих змінах — зупинено. · Samenvoeging in de overgedragen commits — gestopt.' >&2; exit 1; }
            git diff --name-only --no-renames -z "$GITHUB_SHA" "$DOEL" | while IFS= read -r -d '' PAD; do
              case " $TOEGESTAAN " in *" $PAD "*) ;; *) echo "Неочікуваний файл у переданих змінах · onverwacht bestand in de overgedragen commits: $PAD" >&2; exit 1 ;; esac
              MODUS="$(git ls-tree "$DOEL" -- "$PAD" | cut -d' ' -f1)"
              [ -z "$MODUS" ] || [ "$MODUS" = 100644 ] || { echo "Не звичайний файл · geen gewoon bestand: $PAD ($MODUS)" >&2; exit 1; }
            done
          fi
          [ "$(tr -d '\r\n' < "$P/HEAD")" = "$DOEL" ] || { echo 'Передана HEAD не збігається зі змінами — зупинено. · De overgedragen HEAD klopt niet — gestopt.' >&2; exit 1; }
          echo "RELEASE_COMMIT=$DOEL" >> "$GITHUB_ENV"
          V=''
          while IFS='=' read -r SLEUTEL WAARDE; do
            [ -n "$SLEUTEL" ] || continue
            case "$SLEUTEL" in
              RELEASE_VERSION|VERSIE|UITGAVE_VERSIE|LIVE_VERSIE) [[ "$WAARDE" =~ ^[0-9]{8}-[0-9]{6}$ ]] ;;
              LIVE_COMMIT) [[ "$WAARDE" =~ ^[0-9a-f]{40}$ ]] ;;
              *) false ;;
            esac || { echo "Недійсні дані випуску · ongeldige pakketgegevens: $SLEUTEL" >&2; exit 1; }
            case "$SLEUTEL" in RELEASE_VERSION|VERSIE|UITGAVE_VERSIE) V="$WAARDE" ;; esac
            echo "$SLEUTEL=$WAARDE" >> "$GITHUB_ENV"
          done < "$P/vars"
          if [ -n "$V" ]; then
            mkdir -p uitvoer
            cp -R "$P/uitvoer/." uitvoer/
            RELEASE_SHA="$(sha256sum "uitvoer/mijn-ruimte-$V.tar.gz" | cut -d' ' -f1)"
            if [ -f "uitvoer/mijn-ruimte-$V.tar.gz.sha256" ]; then
              [ "$(cut -d' ' -f1 < "uitvoer/mijn-ruimte-$V.tar.gz.sha256")" = "$RELEASE_SHA" ] || { echo 'Контрольна сума архіву не збігається — зупинено. · Controlesom van het archief klopt niet — gestopt.' >&2; exit 1; }
            fi
            echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Опублікувати точний архів у GitHub
        id: publiceren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BESTAND="mijn-ruimte-$VERSIE.tar.gz"
          test -f "uitvoer/$BESTAND"
          sha256sum "uitvoer/$BESTAND" | sed 's#  uitvoer/#  #' > "uitvoer/$BESTAND.sha256"
          gh release create "$VERSIE" "uitvoer/$BESTAND" "uitvoer/$BESTAND.sha256" "uitvoer/mijn-ruimte-$VERSIE-codex-overdracht.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "IDENTITEIT-003 · $VERSIE" --notes 'Виправлено причину відмови попереднього встановлення: опис прапорця тепер відповідає обмеженню бази даних у 300 символів. Новий вигляд початково вимкнено. Встановлення потребує підтвердження власника.' --prerelease --latest=false

      - name: Звірити відбиток опублікованого файлу
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BESTAND="mijn-ruimte-$VERSIE.tar.gz"
          for SPROBE in 1 2 3 4 5; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
            WERKELIJK="$(node --input-type=module -e 'import {readFileSync} from "node:fs";const r=JSON.parse(readFileSync(process.argv[1],"utf8"));const b=(r.assets||[]).find(a=>a.name===process.argv[2]);console.log(b?.digest||"")' "$RUNNER_TEMP/uitgave.json" "$BESTAND")"
            VERWACHT="sha256:$(sha256sum "uitvoer/$BESTAND" | cut -d ' ' -f 1)"
            if [ "$WERKELIJK" = "$VERWACHT" ]; then echo "Перевірено: $WERKELIJK"; exit 0; fi
            sleep 2
          done
          echo 'ВІДХИЛЕНО: відбиток випуску не збігається з архівом'
          exit 1

      - name: Заблокувати невдалий опублікований випуск
        if: failure() && steps.publiceren.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$VERSIE" --repo "$GITHUB_REPOSITORY" --draft=true --notes 'НЕ ВСТАНОВЛЮВАТИ: перевірка опублікованого архіву не пройдена.'
