name: GITHUB-010 · повноцінне двостороннє робоче середовище GitHub та екосистемні мости

# Ніколи не встановлює пакет на сервер. Перед оприлюдненням звіряє живу встановлену основу, джерела, міграції, типи й контрольну суму.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, broncode, migraties, typen en controlesom.
on:
  push:
    branches:
      - 'feature/github-010-volledige-omgeving-20261111-210000'
    paths:
      - '.github/workflows/github-010-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/GITHUB-010.json'
      - 'orchestratie/taken/GITHUB-010.json'
      - 'migrations/0208_github_spiegel_en_werkruimte.sql'
      - 'migrations/rechten.sql'
      - 'shared/**'
      - 'backend/**'
      - 'server/**'
      - 'public/canonical-service.js'
      - 'scripts/zoek-ui-catalogus.mjs'
      - 'src/**'
      - 'tests/eenheid/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-010-uitgave
  cancel-in-progress: true

env:
  TAAK: GITHUB-010
  BASIS_VERSIE: '20261111-191818'
  BASIS_COMMIT: '7734fc3b779b78cac79fc7bb3d55e03a4b183937'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: 'gemini-2.5-pro'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error(`Встановлена версія змінилася (${v.versie} @ ${v.bronCommit || v.commit}). Випуск зупинено для нового узгодження.`);
          }
          JS
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -o pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Виконати одиничні перевірки середовища GitHub, меню, шлюзу та розміщення
        run: |
          set -o pipefail
          node scripts/plaatsing-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/eenheidstests.mjs github-volledige-werkruimte.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-oauth-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-koppelkaart-20261019.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-platform.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs dev-rechten-media-github-20261021.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs routes.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs plaatsing-20261025.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs zoek-ui-tabblad-20261105.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs connector-v2.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs hulpmiddelen-tweetalig-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs menu-v2.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs menu-indeling.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs werkblad-register-20261027.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити типи та скласти застосунок
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Перевірити подвійне застосування міграцій і серверні тести з базою даних
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const tabellen = await pool.query(`
            SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'app'
               AND c.relname IN (
                 'github_spiegel_repos',
                 'github_spiegel_gebeurtenissen',
                 'github_bord_koppelingen',
                 'github_eenklik_manifesten'
               )
          `);
          await pool.end();
          if (tabellen.rowCount !== 4 || tabellen.rows.some((t) => t.relrowsecurity !== true || t.relforcerowsecurity !== true)) {
            throw Error('Таблиці середовища GitHub (міграція 0208) не створені або не мають примусового захисту RLS.');
          }
          JS
          node scripts/eenheidstests.mjs site-hulpmiddelen.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs ruimte-bord-github-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Повноцінне двостороннє робоче середовище GitHub (github.tarasevych.com), однонатискове підключення та екосистемні мости',
            samenvatting: 'Масштабне оновлення розділу https://github.tarasevych.com/ на основі живої версії 20261111-191818: сучасне адаптивне оформлення всіх 13 вкладок підменю та спливних робочих вікон, провідник дерева файлів і вбудований вебредактор коду з різницею змін, задачі й запити на злиття з рецензіями та захищеним злиттям, керування конвеєрами дій і випусками, підключення GitHub в один натиск без ручного введення ключів, ізольоване двостороннє дзеркало з живим підписаним перехоплювачем подій, інтеграція з підключеними пристроями й екосистемою ШІ та майстер самостійного розгортання.',
            wijzigingen: [
              'Повне робоче середовище github.tarasevych.com (13 розділів підменю: Огляд, Сховища, Код і файли, Задачі, Запити на злиття, Дії та перевірки, Випуски, Дзеркало і міст, Проєкти, Документація, Пошук коду, Події, Доступ і ключі): єдина верхня панель активного сховища, створення й налаштування сховищ, відгалуження, позначення зірочкою та адаптивні спливні вікна <dialog> для комп’ютерів і смартфонів.',
              'Провідник дерева файлів за гілками й мітками версій, створення та видалення робочих гілок із захистом типової гілки, вбудований вебредактор коду з по-рядковою різницею змін та збереженням прямо у гілку або у нову гілку з відкриттям запиту на злиття, а також по-рядкове порівняння гілок і перегляд фіксацій змін.',
              'Робочі вікна задач, кольорових міток, запитів на злиття (змінені файли з різницею, перевірки конвеєра, рецензії схвалення або зауважень і захищене злиття з обов’язковим підтвердженням), конвеєрів дій (ручний запуск, перезапуск, скасування, журнали) та керування випусками.',
              'Підключення GitHub в один натиск без потреби додавати додаткові ключі: прямий вхід через OAuth, офіційний потік маніфесту застосунку GitHub для свіжорозгорнутих серверів із автоматичним запечатуванням ключів AES-256-GCM та вхід за 8-значним кодом пристрою з автоопитуванням.',
              'Ізольоване двостороннє дзеркало сховищ у межах приватного або технічного простору облікового запису (міграція 0208_github_spiegel_en_werkruimte.sql із примусовим захистом RLS), підписаний перехоплювач подій POST /api/github/webhook/:sleutel (HMAC-SHA256), двосторонній міст із Дошкою завдань, передача будови сховища до спільного контексту ШІ, 7 нових двомовних інструментів ШІ у каталозі v2 та майстер самостійного розгортання на власному чи серверному обладнанні.'
            ],
            fixes: [
              'Кодування складених назв гілок із косою рискою (наприклад, feature/... або release/...) по сегментах у дереві файлів, порівнянні гілок та перегляді фіксацій змін, щоб запити до GitHub API працювали без збоїв для вкладених назв гілок.'
            ],
            beperkingen: [
              'Злиття запиту на злиття вимагає явної позначки підтвердження користувача у робочому вікні перед виконанням дії на GitHub.',
              'Команди клонування, синхронізації та розгортання на підключених пристроях подаються через захищену чергу підтвердження дій користувача.',
              'Встановлення випуску на робочий сервер виконується виключно власником із підтвердженням ключем доступу.'
            ],
            instructies: 'Завантажте архів mijn-ruimte-<VERSIE>.tar.gz на сторінці «Оновлення → Нове оновлення», підтвердьте встановлення ключем доступу та відкрийте https://github.tarasevych.com/ для перевірки оновленого підменю, однонатискового підключення, провідника коду з редактором, задач, запитів на злиття та розділу «Дзеркало і міст».'
          };
          const nl = {
            titel: 'Volledige tweerichtings-GitHub-werkruimte (github.tarasevych.com), éénkliks koppeling en ecosysteembruggen',
            samenvatting: 'Uitgebreide vernieuwing van https://github.tarasevych.com/ boven op de geïnstalleerde versie 20261111-191818: eigentijdse en mobielvriendelijke vormgeving van alle 13 submenutabbladen en dialoogvensters, bestandsboom en ingebouwde webeditor met regelverschil, vraagstukken en samenvoegingsverzoeken met beoordelingen en beschermd samenvoegen, beheer van CI-werkstromen en uitgaven, éénkliks koppeling zonder handmatig sleutels in te voeren, geïsoleerde tweerichtingsspiegel met ondertekende webhooks, samenwerking met gekoppelde apparaten en het AI-ecosysteem en een zelfstandige uitrolwizard.',
            wijzigingen: [
              'Volledige werkruimte op github.tarasevych.com (13 submenutabbladen: Overzicht, Opslagplaatsen, Code en bestanden, Vraagstukken, Samenvoegingsverzoeken, Acties en controles, Uitgaven, Spiegel en brug, Projecten, Documentatie, Code zoeken, Activiteit, Toegang en sleutels): centrale actieve-opslagplaatsbalk, aanmaken en bijwerken van opslagplaatsen, afsplitsen, stermarkering en mobielvriendelijke <dialog>-vensters.',
