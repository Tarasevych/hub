              nl: 'Bouwcontroles van plaatsing en de UI-zoekcatalogus zijn geslaagd, evenals de eenheidstests voor github-volledige-werkruimte, github-oauth, github-koppelkaart, github-platform, ruimte-isolatie ruimte-bord-github, de toegangspoort op alle routes, plaatsing, zoektabbladen, connector-v2 en tweetalige AI-hulpmiddelen, menu-opbouw (menu-v2, menu-indeling, werkblad-register) en herkomst TRACE-001, plus typecontrole van client en server, productiebouw en dubbele uitvoering van alle migraties inclusief 0208 op een schone PostgreSQL 16-databank met FORCE ROW LEVEL SECURITY-verificatie.' + ' Gemeten in deze uitvoering — testbestand en geslaagd van totaal: ' + gemetenLijst + '.'
