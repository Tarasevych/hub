              'Werkvensters voor vraagstukken, kleuretiketten, samenvoegingsverzoeken (gewijzigde bestanden met patch, CI-controles, beoordelingen en beschermd samenvoegen na bevestiging), CI-werkstromen (handmatig starten, herstarten, annuleren, logboeken) en beheer van uitgaven.',
              'Eénkliks GitHub-koppeling zonder extra sleutels toe te voegen: directe OAuth-aanmelding, officiële GitHub App Manifest-stroom voor vers uitgerolde servers met automatische AES-256-GCM-verzegeling en aanmelding via een 8-cijferige apparaatcode.',
              'Geïsoleerde tweerichtingsspiegel per privé- of technische ruimte (migratie 0208_github_spiegel_en_werkruimte.sql met verplichte FORCE ROW LEVEL SECURITY), ondertekende webhook-ontvanger POST /api/github/webhook/:sleutel (HMAC-SHA256), tweerichtingsbrug met het takenbord, overdracht naar gedeelde AI-context, 7 nieuwe tweetalige AI-hulpmiddelen in de v2-catalogus en een uitrolwizard voor eigen of gekoppelde apparatuur.'
            ],
            fixes: [
              'Padcodering per segment voor samengestelde taknamen met schuine strepen (zoals feature/... of release/...) in de bestandsboom, takvergelijking en vastleggingsdetails.'
            ],
            beperkingen: [
              'Het samenvoegen van een samenvoegingsverzoek vereist een uitdrukkelijk bevestigingsvinkje van de gebruiker in het werkvenster.',
              'Kloon-, synchronisatie- en uitrolopdrachten op verbonden apparaten verlopen via de goedkeuringsrij van de gebruiker.',
