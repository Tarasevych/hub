name: TELEGRAM-002 · Підтвердження в Telegram піктограмою та фото облікових записів; розшифрування на місці

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері,
# правила координації, типи, модульні випробування Telegram і сховища ключів, повне складання та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, typen, tests, bouw en controlesom.
on:
  # Надсилання цього файла лише реєструє процес на гілці; складання починається тільки вручну. · Push registreert alleen; bouwen gebeurt handmatig.
  push:
    branches:
      - feature/telegram-002-20261114-225433
    paths:
      - .github/workflows/telegram-002-uitgave.yml
  # Лише вручну: модель ШІ передається параметром запуску (у файлах сховища її не пишемо). · Alleen handmatig.
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ, що виконала роботу (для UITROL-MANIFEST.json)'
        required: true
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-002-uitgave
  cancel-in-progress: false

env:
  TAAK: TELEGRAM-002
  # Жива основа — 20261114-180411 (IDENTITEIT-015) або попередня 20261114-111234; остання в переліку — запасна, якщо тунель недоступний.
  BEKENDE_BASISSEN: '20261114-111234=6e7dac3a783988848991a2e0af9e0ac2998a997a 20261114-180411=987b81a578f120dfcf7af253a110a0d106883365'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  # Ідентифікатор моделі ШІ задає власник змінною сховища (у файлах сховища його не пишемо).
  # De model-id zet de eigenaar als repository-variabele (niet in bestanden van de repository).
  MODEL_ID: ${{ inputs.model_id || vars.TELEGRAM_002_MODEL_ID }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/telegram-002-20261114-225433" ]; then
            echo "Випуск TELEGRAM-002 можна запускати лише з гілки feature/telegram-002-20261114-225433." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила та модульні випробування Telegram і сховища ключів
        run: |
          set -euo pipefail
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          for t in telegram-aanmelden-20261109 apparaat-bevestiging-20261109 mobiel-cascade-20261105 thema identiteit-account-ui; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи та скласти застосунок
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Усі міграції на чистій базі (двічі) та випробування Telegram проти справжньої бази · migraties tweemaal en tests tegen de database
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)" RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)" AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)" OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs | tail -3
          # Повторний прогін нічого не змінює. · Tweede keer: niets te doen.
          node dist-server/migrate.mjs | tail -1
          for t in telegram-venster-20261114 telegram-aanmelden-stroom-20261109 telegram-inlog-apparaat-20261112 apparaat-bevestiging-stroom-20261109 aanmeld-koppel-20261030 aanmeld-ui-20261030 kluis-apparaat-20261114 melding-soorten meldingen-sferen-20261022; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'TELEGRAM-002 · Підтвердження в Telegram однаковою піктограмою, фото облікових записів у запитах; розшифрування даних на місці',
            samenvatting: 'Етап 1 удосконалення Telegram: вхід і дії підтверджуються вибором однакової піктограми в захищеному вікні Telegram, а запити показують фото облікового запису. Разом із KLUIS-001: розшифрування даних там, де ви є, і пам’ять ключа на знайомому пристрої. Зібрано поверх встановленої лінії 20261114-180411.',
            wijzigingen: [
              'Захищене вікно Telegram: на сайті видно одну піктограму, у вікні треба обрати таку саму з чотирьох; таємний код вводиться лише у вікні, ніколи в чаті.',
              '48 піктограм із випадковим добором для кожного запиту; форма на плитці стала більшою.',
              'Фото й ім’я облікового запису сайту — у вікні Telegram і в картці бота (також під час прив’язки); фото й ім’я Telegram — у запитах на сайті.',
              'Пристрій і браузер з офіційними логотипами; місто й країна мовою читача без англійських назв; історія фото та імен Telegram у налаштуваннях.',
              'KLUIS-001: картка «Ваші дані зараз зашифровані» розшифровує на місці ключем доступу або кодом; знайомий пристрій пам’ятає ключ даних.'
            ],
            fixes: [
              'WhatsApp у переліку способів входу має стан «Заплановано» замість «Неможливо».'
            ],
            beperkingen: [
              'Нове вікно Telegram працює за перемикачем telegram-v2 (типово вимкнено) — його вмикає власник. Етапи 2–7 плану ще попереду.'
            ],
            instructies: 'Перед встановленням — резервна копія на R:\\; встановлення з підтвердженням passkey; після встановлення перевірити накладання на попередню версію і /api/version. Міграції 0276 і 0277 повторювані.'
          };
          const nl = {
            titel: 'TELEGRAM-002 · Bevestigen in Telegram met hetzelfde pictogram, accountfoto’s bij verzoeken; gegevens ontsleutelen waar u bent',
            samenvatting: 'Fase 1 van de Telegram-verbetering: aanmelden en handelingen worden bevestigd door hetzelfde pictogram te kiezen in het beveiligde Telegram-venster, en verzoeken tonen de foto van het account. Samen met KLUIS-001: ontsleutelen waar u bent en sleutelgeheugen op een bekend apparaat. Gebouwd bovenop de geïnstalleerde lijn 20261114-180411.',
            wijzigingen: [
              'Beveiligd Telegram-venster: de site toont één pictogram, in het venster kiest u hetzelfde uit vier; de geheime code alleen in het venster, nooit in de chat.',
              '48 pictogrammen, willekeurig gekozen per verzoek; de vorm op de tegel is groter.',
              'Foto en naam van het site-account in het Telegram-venster en in de kaart van de bot (ook bij koppelen); foto en naam van Telegram bij verzoeken op de site.',
              'Apparaat en browser met officiële logo’s; plaats en land in de taal van de lezer; geschiedenis van Telegram-foto’s en -namen in de instellingen.',
              'KLUIS-001: de kaart «Uw gegevens zijn nu versleuteld» ontsleutelt ter plekke met toegangssleutel of code; een bekend apparaat onthoudt de gegevenssleutel.'
            ],
            fixes: [
              'WhatsApp staat in de lijst van aanmeldmethoden op «Gepland» in plaats van «Onmogelijk».'
            ],
            beperkingen: [
              'Het nieuwe Telegram-venster werkt achter de schakelaar telegram-v2 (standaard uit) — de eigenaar zet die aan. Fasen 2–7 van het plan volgen nog.'
            ],
            instructies: 'Vóór installatie een reservekopie op R:\\; installeren met passkey-bevestiging; daarna de overlay op de vorige versie en /api/version controleren. Migraties 0276 en 0277 zijn herhaalbaar.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'claude',
                platform: 'Claude Code',
                tool: 'Claude Code (хмарний сеанс)',
                model: { id: e.MODEL_ID, versie: e.MODEL_VERSIE || null, bron: 'omgeving' },
                rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken']
              }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          const gemeten = { geslaagd: 0, mislukt: 0 };
          const perTest = new Map(); for (const r of readFileSync(e.RUNNER_TEMP + '/eenheidstests.log', 'utf8').matchAll(/^(\d+)\/(\d+) geslaagd \(([^)\n]+)\)/gm)) perTest.set(r[3], [Number(r[1]), Number(r[2])]); for (const [g, n] of perTest.values()) { gemeten.geslaagd += g; gemeten.mislukt += n - g; } const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + ' ' + g + '/' + n).join('; ');
          if (!gemeten.geslaagd || gemeten.mislukt) throw Error('Немає виміряних результатів випробувань або є невдалі перевірки — випуск зупинено.');
          const tests = {
            geslaagd: gemeten.geslaagd,
            mislukt: gemeten.mislukt,
            falend: [],
            uitleg: {
              uk: 'Успішно пройдено правила координації, свіжість основи та перевірку походження, статичні перевірки карти файлів, довідок і розміщення, перевірку типів клієнта та сервера, повне виробниче складання з ізоляцією технічних пакунків та модульні випробування Telegram, підтвердження пристрою і сховища ключів. Виміряно в цьому запуску: ' + gemetenLijst + '.',
              nl: 'Geslaagd: coördinatieregels, versheid van de basis en herkomstcontrole, statische controles van bestandskaart, hulpteksten en plaatsing, typecontrole van client en server, volledige productiebouw met afscherming van technische bundels en eenheidstests van Telegram, apparaatbevestiging en de sleutelkluis. Gemeten in deze uitvoering: ' + gemetenLijst + '.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie: e.BASIS_VERSIE, bronCommit: e.BASIS_COMMIT, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
          const opis = [
            `TELEGRAM-002 · Підтвердження в Telegram піктограмою, фото в запитах; розшифрування на місці · ${e.VERSIE}`,
            '',
            uk.samenvatting,
            '',
            ...uk.wijzigingen.map((x) => `- ${x}`),
            '',
            'Виправлено:',
            ...uk.fixes.map((x) => `- ${x}`),
            '',
            uk.instructies.replace('<VERSIE>', e.VERSIE),
            '',
            '---',
            '',
            nl.samenvatting,
            '',
            nl.instructies.replace('<VERSIE>', e.VERSIE),
            '',
            `Фіксація змін: ${e.GITHUB_SHA}`,
            `Інтеграційна основа: ${e.INTEGRATIE_BASIS}`,
            `Встановлена основа сервера: ${e.BASIS_VERSIE} @ ${e.BASIS_COMMIT}`,
            ''
          ].join('\n');
          writeFileSync(e.RUNNER_TEMP + '/opis.md', opis);
          JS
      - name: Скласти та перевірити пакунки випуску й передачі
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent claude --platform 'Claude Code' --tool 'Claude Code (хмарний сеанс)' \
            --model-id "$MODEL_ID" --model-bron omgeving \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk "Telegram, етап 1: підтвердження однаковою піктограмою в захищеному вікні, 48 піктограм, фото облікових записів у запитах; разом із KLUIS-001 (розшифрування на місці). Поверх встановленої основи." \
            --samenvatting-nl "Telegram, fase 1: bevestigen met hetzelfde pictogram in het beveiligde venster, 48 pictogrammen, accountfoto bij verzoeken; samen met KLUIS-001 (ontsleutelen waar u bent). Bovenop de geïnstalleerde basis." \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-claude-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Перевірити UITROL-MANIFEST.json усередині архіву валідатором інсталятора · manifest in het archief valideren
        shell: bash
        run: |
          set -euo pipefail
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/UITROL-MANIFEST.json" > "$RUNNER_TEMP/manifest-in-archief.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { valideerManifest } from './shared/uitrol-manifest.ts';
          const e = process.env;
          const ruw = readFileSync(e.RUNNER_TEMP + '/manifest-in-archief.json', 'utf8');
          const { manifest, fouten } = valideerManifest(ruw, e.VERSIE);
          if (fouten.length || !manifest) {
            for (const f of fouten) console.error('::error::UITROL-MANIFEST.json · ' + (f.veld || '') + ': ' + (f.uk || JSON.stringify(f)));
            throw Error('Маніфест в архіві не проходить перевірку інсталятора — випуск зупинено.');
          }
          if (!manifest.aangemaakt || !manifest.herkomst || manifest.herkomst.length < 5) throw Error('Немає aangemaakt/herkomst у маніфесті.');
          const ai = manifest.deelnemers.filter((d) => d.soort === 'ai');
          if (!ai.length || ai.some((d) => !d.model || !d.model.id)) throw Error('У маніфесті немає моделі ШІ.');
          console.log('UITROL-MANIFEST.json в архіві: 0 помилок · aangemaakt ' + manifest.aangemaakt + ' · herkomst ' + manifest.herkomst.slice(0, 60) + '…');
          JS
      - name: Передати перевірені пакунки завданню оприлюднення · overdracht aan de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overdracht/uitvoer"
          cp -R uitvoer/. "$RUNNER_TEMP/overdracht/uitvoer/"
          cp "$RUNNER_TEMP/opis.md" "$RUNNER_TEMP/overdracht/opis.md"
          printf '%s\n' "$VERSIE" > "$RUNNER_TEMP/overdracht/VERSIE"
          printf '%s\n%s\n' "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/overdracht/BASIS"
      - name: Зберегти пакунки для завдання оприлюднення · artefact voor de publicatietaak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telegram-002-overdracht
          path: ${{ runner.temp }}/overdracht/
          if-no-files-found: error
          retention-days: 7
      - name: Зберегти пакунки перевірки у сховищі виконання
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telegram-002-controle
          path: uitvoer/
          if-no-files-found: ignore
  uitgave:
    name: Оприлюднення перевірених пакунків · publicatie van de gecontroleerde pakketten
    needs: controle-en-uitgave
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Отримати перевірені пакунки · gecontroleerde pakketten ophalen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: telegram-002-overdracht
          path: ${{ runner.temp }}/overdracht
      - name: Відновити пакунки й звірити контрольну суму · pakketten terugzetten en controlesom vergelijken
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(tr -d '\r\n' < "$RUNNER_TEMP/overdracht/VERSIE")"
          VERTROUWD=" ${TOEGESTANE_BASES:-} ${BEKENDE_BASISSEN:-} ${BASIS_VERSIE:+${BASIS_COMMIT:+${BASIS_VERSIE}=${BASIS_COMMIT}}} "
          BASIS_VERSIE="$(sed -n 1p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          BASIS_COMMIT="$(sed -n 2p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          [[ "$VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Передані дані випуску мають неправильний вигляд — оприлюднення зупинено.' >&2; exit 1; }
          case "$VERTROUWD" in *" ${BASIS_VERSIE}=${BASIS_COMMIT} "*) ;; *) echo 'Основа з артефакту складання не входить до довірених значень цього процесу — оприлюднення зупинено.' >&2; exit 1 ;; esac
          { echo "VERSIE=$VERSIE"; echo "BASIS_VERSIE=$BASIS_VERSIE"; echo "BASIS_COMMIT=$BASIS_COMMIT"; } >> "$GITHUB_ENV"
          mkdir -p uitvoer
          cp -R "$RUNNER_TEMP/overdracht/uitvoer/." uitvoer/
          cp "$RUNNER_TEMP/overdracht/opis.md" "$RUNNER_TEMP/opis.md"
          sha256sum --check "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Упевнитися, що такого випуску ще немає · deze uitgave mag nog niet bestaan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/pered-vypuskom.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const code = process.env.HTTP_CODE || '000';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
            if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
              throw Error('Робочий сервер оновився під час перевірок. Оприлюднення зупинено.');
            }
          } else if (code !== '530' && code !== '502' && code !== '504' && code !== '000') {
            throw Error(`Неочікувана відповідь під час повторної звірки сервера: HTTP ${code}`);
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-claude-overdracht.zip" \
            --target "$GITHUB_SHA" --title "TELEGRAM-002 · Підтвердження в Telegram піктограмою, фото в запитах; розшифрування на місці · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
