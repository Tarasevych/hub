          mkdir -p "$UPLOADS_DIR"

          node dist-server/migrate.mjs | tail -3
          W_MIG="$(openssl rand -hex 24)"
          W_APP="$(openssl rand -hex 24)"
          W_SYS="$(openssl rand -hex 24)"
          S_MIG="$(printf '%s\n' "$W_MIG" | node deploy/scram-verifier.mjs)"
          S_APP="$(printf '%s\n' "$W_APP" | node deploy/scram-verifier.mjs)"
          S_SYS="$(printf '%s\n' "$W_SYS" | node deploy/scram-verifier.mjs)"
          psql "$DATABASE_URL" -v legacy_rol=migratie -v migrator_scram="$S_MIG" -v app_scram="$S_APP" -v systeem_scram="$S_SYS" -f deploy/db-rollen.sql
          export DATABASE_URL_APP="postgres://mijnruimte_app:${W_APP}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_MIGRATIE="postgres://mijnruimte_migrator:${W_MIG}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_SYSTEM="postgres://mijnruimte_system:${W_SYS}@127.0.0.1:5432/mijnruimte_schoon"
          node dist-server/migrate.mjs | tail -3

          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core@1.56.1 install chromium
            CHROME="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          fi
