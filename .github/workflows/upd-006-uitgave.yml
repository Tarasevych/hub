            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Підготувати ролі й міграції PostgreSQL 16 (двічі), Хроміум і запустити 120 випробувань із БД
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export RECOVERY_CODE_PEPPER="$(openssl rand -base64 32)"
          export AUDIT_IP_PEPPER="$(openssl rand -base64 40)"
          export SESSION_SECRET="$(openssl rand -base64 32)"
          export OWNER_VAULT_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
