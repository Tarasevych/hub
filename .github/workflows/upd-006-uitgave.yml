name: 'UPD-006 · Панель оновлення по центру, 96/96 піктограм (Варіант А) та підлаштований Grok MOBIEL-002'

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері (20261119-080944 @ cab0acb9),
# правила координації, типи клієнта й сервера, статичні контракти, TRACE-001, 20 хмарних тестів, 144 безбазових і 13 післяскладальних випробувань,
# подвійний прогін усіх міграцій на PostgreSQL 16 (до 0302_tech_snelkoppelingen) із трьома ролями та 120 випробувань із базою даних і Хроміумом,
# повне складання, автоматично підписаний CRX3 0.9.7, маніфест встановлювача та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, client- en servertypen, statische contracten, TRACE-001,
# cloud-tests, eenheidstests vóór en na de bouw, dubbele migraties (t/m 0302) en databasetests met drie rollen en Chromium tegen PostgreSQL 16,
# volledige bouw, ondertekende CRX3 0.9.7, manifest en SHA-256.
on:
  push:
    branches:
      - feature/upd-006-uitgave-20261119-114700
    paths:
      - .github/workflows/upd-006-uitgave.yml
      - orchestratie/ontwikkelarchieven/UPD-006.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upd-006-uitgave
  cancel-in-progress: false

env:
  TAAK: UPD-006
  # Жива встановлена основа на сервері — UPD-005 (20261119-080944 @ cab0acb9e23ceef5d17515bac5eba2f065101750).
  BEKENDE_BASISSEN: '20261119-080944=cab0acb9e23ceef5d17515bac5eba2f065101750'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: ${{ inputs.model_id || vars.UPD_006_MODEL_ID || 'Gemini 3.1 Pro (Google Antigravity)' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/upd-006-uitgave-20261119-114700" ]; then
            echo "Випуск UPD-006 можна запускати лише з гілки feature/upd-006-uitgave-20261119-114700." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js і перевірити системні інструменти
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити наявність обов’язкових інструментів середовища та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з живою основою ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen cab0acb9e23ceef5d17515bac5eba2f065101750
          node scripts/vaardigheden/valideer.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/UPD-006.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'UPD-006');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал UPD-006 валідний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента, 20 хмарних тестів і 148 безбазових модульних випробувань
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node deploy/agent/agent.mjs selftest --root /tmp
          for f in \
            tests/eenheid/cloud-delen-m3.test.mjs \
            tests/eenheid/cloud-m10-integration-safety.test.mjs \
            tests/eenheid/cloud-m11-voorbeeld.test.mjs \
            tests/eenheid/cloud-m3-gate.test.mjs \
            tests/eenheid/cloud-m5-aanbieder-golf.test.mjs \
            tests/eenheid/cloud-m6-beleid-bewaker.test.mjs \
            tests/eenheid/cloud-m6-bestuur.test.mjs \
            tests/eenheid/cloud-m7-beleid.test.mjs \
            tests/eenheid/cloud-m7-crypto.test.mjs \
            tests/eenheid/cloud-m7-transfer.test.mjs \
            tests/eenheid/cloud-m8-verenigd.test.mjs \
            tests/eenheid/cloud-m9-checkpoints.test.mjs \
            tests/eenheid/cloud-m9-composition.test.mjs \
            tests/eenheid/cloud-m9-directory.test.mjs \
            tests/eenheid/cloud-m9-upload.test.mjs \
            tests/eenheid/cloud-migratie-volgorde.test.mjs \
            tests/eenheid/cloud-overdracht-m2.test.mjs \
            tests/eenheid/cloud-overdracht-m3.test.mjs \
            tests/eenheid/cloud-verbinding-m4.test.mjs \
            tests/eenheid/cloud-versies-m3.test.mjs; do
            printf '=== FILE: %s ===\n' "$f" >> "$RUNNER_TEMP/eenheidstests.log"
            node --test "$f" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          for t in \
            aanmeld-ui-20261030 \
            aanmelden-integ-20261103 \
            accent-001-tint-transparantie \
            account-wissen-20261026 \
            accountmenu-strook-20261115 \
            accountmenu-v2-20261029 \
            accountmenu-v3 \
            afstemming-ui-20261030 \
            afstemming-zvirka-ui-20261030 \
            agent-verbinden-20261020 \
            agenten-pagina-20261026 \
            agenten-pagina-blokken-20261103 \
            ai-acties-20261024 \
            ai-doorverwijzing-ui004 \
            ai-ecosysteem-en-google-herstel \
            ai-hub \
            ai-mail-assistent \
            ai-onafhankelijke-agenten \
            ai-vertaling \
            ai-werkruimte-20261019 \
            ankers-002-agenten-20261115 \
            apparaat-bevestiging-20261109 \
            apparaat-symbool-96-20261119 \
            audit-filters \
            bijdragen-001-20261118 \
            blokken-001-account \
            breedte-001-kolom-20261115 \
            browser-gedeeld-20261022 \
            centrering-pc-20261115 \
            chat \
            cloud-001-ui-contract \
            cloud-vnext-ui-20261029 \
            contrast-knoppen-logos-20261021 \
            dock-snelmenu-20261029 \
            extensie-090-site-20261106 \
            extensie-093-stel-in-20261117 \
            extensie-brug-zonder-f5-20261106 \
            extensie-offscreen-20261106 \
            extensie-opties \
            extensie-profielen \
            extensie-tabblad-hint-20261115 \
            extensie-ui \
            extensie-vergrendeling \
            gemini-004-agenten-ankers-20261117 \
            github-012-mobiele-weergave \
            github-koppelkaart-20261019 \
            github-platform \
            github-volledige-werkruimte \
            hint-001-ankertip \
            historie-kroniek \
            huis-001-oude-fouten-20261110 \
            hulp-vraagtekens \
            identiteit-009-mobiel-veiligheid \
            identiteit-015-vormgeving-toegang \
            identiteit-account-ui \
            identiteit-atelier \
            identiteit-maquette \
            integraties-catalogus-v2-20261029 \
            klap-alles-20261115 \
            klassiek-001-kern \
            klassiek-002a-werkruimte \
            klassiek-002c-panelen \
            klassiek-004b-github-brontekst \
            klassiek-005a-werkblad \
