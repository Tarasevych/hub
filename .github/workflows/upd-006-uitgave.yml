          export GITHUB_KOPPELING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export CLOUD_OAUTH_TOKEN_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M8_CURSOR_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M6_CI_ATTESTATION_HMAC_KEY="$(openssl rand -hex 32)"
          export RUIMTE_BINDING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export AI_BEVESTIGING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export SESSION_PEPPER="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_GITHUB_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_ARCHIEF_SLEUTEL="$(openssl rand -hex 32)"
          export TELEGRAM_AANMELD_PEPER="$(openssl rand -hex 24)"
