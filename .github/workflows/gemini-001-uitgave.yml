name: GEMINI-001 · Права панель якорів, портал меню облікових записів, групування користувачів, аудит та адаптивність

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері (20261114-222613),
# правила координації, типи, статичні контракти, модульні випробування проти PostgreSQL 16, подвійний прогін міграцій, повне складання,
# маніфест інсталятора, TRACE-001 та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, typen, tests tegen PostgreSQL 16, migraties, bouw, manifest en SHA-256.
on:
  # Надсилання цього файла лише реєструє процес на гілці; складання починається через workflow_dispatch із точним model_id.
  push:
    branches:
      - fix/ui-paneel-gebruikers-audit-20261114-184932
    paths:
      - .github/workflows/gemini-001-uitgave.yml
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ, що виконала роботу (для UITROL-MANIFEST.json)'
        required: true
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-001-uitgave
  cancel-in-progress: false

env:
  TAAK: GEMINI-001
  # Жива встановлена основа на сервері — 20261114-222613 (TELEGRAM-002 @ 5c2cbb8966309557cc20421e9291ba7a3e40c762).
  BEKENDE_BASISSEN: '20261114-222613=5c2cbb8966309557cc20421e9291ba7a3e40c762'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: ${{ inputs.model_id || vars.GEMINI_001_MODEL_ID }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "fix/ui-paneel-gebruikers-audit-20261114-184932" ]; then
            echo "Випуск GEMINI-001 можна запускати лише з гілки fix/ui-paneel-gebruikers-audit-20261114-184932." >&2
            exit 1
          fi
          if [ -z "${MODEL_ID:-}" ]; then
            echo "Не задано model_id для UITROL-MANIFEST.json." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            throw Error(`orchestratie/geinstalleerd.json (${gi.versie} @ ${gi.bronCommit}) не збігається з основою (${versie} @ ${levend}).`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила та модульні випробування без бази даних
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          for t in \
            ui-paneel-gebruikers-audit-gemini-001 \
            hulp-vraagtekens \
            mobiel-cascade-20261105 \
            mobiel-geometrie-20261021 \
            klassiek-009a-sleutelpoort \
            plaatsing-20261025 \
            uitrol-manifest \
            uitrol-voorcontrole \
            uitrol-pakket-maken \
            uitrol-codes \
            uitrol-tijden \
            uitrol-vereisten-001 \
            contrast-knoppen-logos-20261021 \
            sec-002-afwerking-b-20261112 \
            telegram-aanmelden-20261109 \
            apparaat-bevestiging-20261109 \
            identiteit-account-ui \
            zoek-ui-tabblad-20261105 \
            zoek-ui-bereik-20261105 \
            zoek-ui-sectie-20261105 \
            zoek-diepe-link-20261105 \
            zoek-route-tabblad-20261105 \
            zoek-menu-20261103 \
            zoek-in-menu-20261024 \
            integraties-catalogus-v2-20261029 \
            thema \
            maquette-001-kern \
            klassiek-001-kern \
            klassiek-002a-werkruimte \
            klassiek-002c-panelen \
            klassiek-007a-huis-kern \
            klassiek-008a-mcp-kern-uitrol \
            klassiek-010a-beheer-kern \
            accountmenu-v2-20261029 \
            accountmenu-v3 \
            uitrol-weergave-v2 \
            ai-hub \
            ai-werkruimte-20261019 \
            ai-doorverwijzing-ui004 \
            audit-filters \
            ui-audit-g \
            dock-snelmenu-20261029 \
            strook-menu \
            menu-per-account-20261019 \
            menu-per-profiel-20261019 \
            menu-taal-prapor-20261103 \
            aanmelden-integ-20261103 \
            huis-001-oude-fouten-20261110 \
            verbindingen-centrum-20261029 \
            orch-kern-20261031 \
            orch-pakket-20261031 \
            orch-uitrol-basis-20261031 \
            orch-beoordeling-20261031; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи та скласти застосунок
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Усі міграції на чистій базі (двічі) та випробування проти справжньої бази даних
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export DATABASE_URL_SYSTEM="$DATABASE_URL"
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs | tail -3
          # Повторний прогін нічого не змінює. · Tweede keer: niets te doen.
          node dist-server/migrate.mjs | tail -1
          for t in \
            telegram-venster-20261114 \
            telegram-aanmelden-stroom-20261109 \
            telegram-inlog-apparaat-20261112 \
            apparaat-bevestiging-stroom-20261109 \
            aanmeld-koppel-20261030 \
            aanmeld-ui-20261030 \
            kluis-apparaat-20261114 \
            melding-soorten \
            meldingen-sferen-20261022 \
            beheer-journaal \
            gebruiker-audit-2026-10-19 \
            sec-002-g10i-20261112; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'GEMINI-001 · Права панель якорів, портал меню облікових записів, групування користувачів, аудит та адаптивність',
            samenvatting: 'Комплексне усунення накладання правої панелі на меню облікових записів, перебудова локальної навігації на всіх піддоменах, впорядкування верхівки бічного меню, групування схожих облікових записів і прозорий захист власника, оновлення карток і фільтрів журналу аудиту та вузької адаптивності сторінок платформи поверх встановленої версії 20261114-222613 (TELEGRAM-002 і KLUIS-001).',
            wijzigingen: [
              'Меню облікових записів винесено в окремий верхній шар через портал безпосередньо в тілі документа, щоб права панель «Розділи якорів» більше не перекривала його.',
              'Верхівка розгорнутого лівого бічного меню тримає елементи в одному рядку без зісковзування кнопки налаштувань та обрізання позначки «ТЕХ».',
              'Права панель на всіх піддоменах показує локальні розділи, групи й підрозділи активної сторінки замість повторення головного меню, а рядок пошуку адаптивно стискається й згортається на вузькому екрані.',
              'На сторінці користувачів у консолі керування додано групування схожих облікових записів (за особою, транслітерацією імені та адресою), показ світлин, дат входу, розширені фільтри й виразне блокування полів захищеного власника.',
              'У журналі аудиту усунуто хибний напис «Не перевірено» до запуску звірки, розділено групи фільтрів із підзаголовками, виділено активний період і перенесено кнопки дій усередину карток записів.',
              'Таблиця пристроїв на вузьких екранах перетворюється на картки, способи входу підтримують перетягування поруч зі стрілками, а майстер підключень відкривається локально під вибраною карткою без стрибка сторінки вгору.',
              'Усунуто обрізання та вихід довгих назв, адрес і кнопок за межі карток на сторінках платформи й оновлено основу поверх 20261114-222613.'
            ],
            fixes: [
              'Оновлено виклик смуги підключень на сторінці платформи інтерфейсів без дублювальної картки Telegram та збережено всі чинні можливості попередніх випусків.'
            ],
            beperkingen: [
              'Автоматичне встановлення на робочий сервер вимкнене за правилами платформи: пакет готовий до завантаження й встановлення виключно власником через майстер оновлень із ключем доступу та резервною копією.'
            ],
            instructies: 'Перед встановленням зробіть резервну копію на R:\\; встановлюйте через майстер «Нове оновлення» з підтвердженням ключем доступу поверх 20261114-222613; після встановлення перевірте /api/version та візуальний стан на піддоменах.'
          };
          const nl = {
            titel: 'GEMINI-001 · Portaal van het accountmenu, groepsgewijze ankerbalk, gebruikersgroepering, auditlogboek en smalle weergave',
            samenvatting: 'Integrale oplossing voor overlapping tussen het accountmenu en de rechter ankerbalk, herbouw van lokale paginanavigatie op alle subdomeinen, een eenregelige bovenbalk in het zijmenu, groepering van verwante gebruikersaccounts, herontwerp van het auditlogboek en smalle weergave boven op de geïnstalleerde versie 20261114-222613 (TELEGRAM-002 en KLUIS-001).',
            wijzigingen: [
              'Het geopende accountmenu wordt via een portaal rechtstreeks in document.body boven de rechter ankerbalk geplaatst zodat het menu nooit meer wordt afgedekt.',
              'De bovenkant van het uitgeklapte zijmenu houdt alle knoppen op één regel zonder dat de instellingenknop wegzakt of de aanduiding «ТЕХ» wordt afgesneden.',
              'De rechter ankerbalk toont op alle subdomeinen echte lokale paginasecties en uitklapbare groepen in plaats van het hoofdmenu te herhalen, en de zoekbalk schaalt en klapt adaptief in op smalle schermen.',
              'Het gebruikersbeheer groepeert verwante accounts (op persoonsverwijzing, naamtransliteratie en e-mailbasis), toont profielfoto’s, aanmeldtijdstippen, uitgebreide filters en duidelijke vergrendeling van beschermde eigenaarsvelden.',
              'In het auditlogboek verschijnt geen misleidende melding «Не перевірено» vóór controle, de filtergroepen hebben eigen subkoppen met een duidelijk actieve periode en actieknoppen blijven binnen de kaarten.',
              'De apparatentabel schakelt op smalle schermen over naar kaarten, aanmeldmethoden ondersteunen verslepen naast pijltjesknoppen en de verbindingsassistent opent lokaal onder de gekozen kaart zonder omhoog te scrollen.',
              'Overloop van lange namen, adressen en knoppen buiten kaarten op platformpagina’s is verholpen, samengevoegd met de geïnstalleerde basis 20261114-222613.'
            ],
            fixes: [
              'De integratiestrook op het API-platform toont geen dubbele Telegram-kaart meer en alle functies van voorgaande releases blijven intact.'
            ],
            beperkingen: [
              'Automatische installatie op de productieserver is uitgeschakeld volgens de platformregels: dit pakket staat klaar voor installatie door de eigenaar via de updatewizard met toegangssleutel en reservekopie.'
            ],
            instructies: 'Maak vóór installatie een reservekopie op R:\\; installeer via de wizard «Nieuwe update» met bevestiging via toegangssleutel boven op 20261114-222613; controleer daarna /api/version en de weergave op de subdomeinen.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'gemini',
                platform: 'Google Antigravity',
                tool: 'Antigravity IDE',
                model: { id: e.MODEL_ID, versie: e.MODEL_VERSIE || null, bron: 'auteur' },
                rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken']
              }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          const logTekst = readFileSync(e.RUNNER_TEMP + '/eenheidstests.log', 'utf8');
          const gemeten = { geslaagd: 0, mislukt: 0 };
          const perTest = new Map();
          for (const r of logTekst.matchAll(/^(\d+)\/(\d+) geslaagd \(([^\n]+)\)$/gm)) {
            perTest.set(r[3], [Number(r[1]), Number(r[2])]);
          }
          for (const r of logTekst.matchAll(/^([a-zA-Z0-9_-]+):\s+(\d+)\/(\d+) geslaagd/gm)) {
            perTest.set(r[1], [Number(r[2]), Number(r[3])]);
          }
          for (const [g, n] of perTest.values()) {
            gemeten.geslaagd += g;
            gemeten.mislukt += n - g;
          }
          const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + ' ' + g + '/' + n).join('; ');
          if (!gemeten.geslaagd || gemeten.mislukt) {
            throw Error(`Немає виміряних результатів випробувань або є невдалі перевірки (${gemeten.geslaagd}/${gemeten.mislukt}) — випуск зупинено.`);
          }
          const tests = {
            geslaagd: gemeten.geslaagd,
            mislukt: gemeten.mislukt,
            falend: [],
            uitleg: {
              uk: 'Успішно пройдено правила координації, свіжість основи та перевірку походження TRACE-001, статичні перевірки карти файлів, довідок, пошукового каталогу, сценаріїв і розміщення, перевірку типів клієнта та сервера, повне виробниче складання, подвійний прогін усіх міграцій на чистій базі PostgreSQL 16 та модульні випробування (разом із перевірками бази даних). Виміряно в цьому запуску: ' + gemetenLijst + '.',
              nl: 'Geslaagd: coördinatieregels, versheid van de basis en herkomstcontrole TRACE-001, statische controles van bestandskaart, hulpteksten, zoekcatalogus, scripts en plaatsing, typecontrole van client en server, volledige productiebouw, dubbele uitvoering van alle migraties op PostgreSQL 16 en eenheidstests inclusief databasetests. Gemeten in deze uitvoering: ' + gemetenLijst + '.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          const opis = [
            `GEMINI-001 · Права панель якорів, портал меню облікових записів, групування користувачів, аудит та адаптивність · ${e.VERSIE}`,
            '',
            uk.samenvatting,
            '',
            ...uk.wijzigingen.map((x) => `- ${x}`),
            '',
            'Виправлено:',
            ...uk.fixes.map((x) => `- ${x}`),
            '',
            uk.instructies,
            '',
            '---',
            '',
            nl.samenvatting,
            '',
            nl.instructies,
            '',
            `Фіксація змін: ${e.GITHUB_SHA}`,
            `Інтеграційна основа: ${e.INTEGRATIE_BASIS}`,
            `Встановлена основа сервера: ${e.BASIS_VERSIE} @ ${e.BASIS_COMMIT}`,
            ''
          ].join('\n');
          writeFileSync(e.RUNNER_TEMP + '/opis.md', opis);
          JS
      - name: Скласти та перевірити пакунки випуску й передачі
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent gemini --platform 'Google Antigravity' --tool 'Antigravity IDE' \
            --model-id "$MODEL_ID" --model-bron auteur \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk "Права панель якорів, портал меню облікових записів, групування користувачів, аудит та адаптивність (GEMINI-001) поверх встановленої основи 20261114-222613." \
            --samenvatting-nl "Portaal accountmenu, groepsgewijze ankerbalk, gebruikersgroepering, auditlogboek en smalle weergave (GEMINI-001) boven op basis 20261114-222613." \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Перевірити UITROL-MANIFEST.json і ONTWIKKELARCHIEF.json усередині архіву валідаторами інсталятора
        shell: bash
        run: |
          set -euo pipefail
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/UITROL-MANIFEST.json" > "$RUNNER_TEMP/manifest-in-archief.json"
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/ONTWIKKELARCHIEF.json" > "$RUNNER_TEMP/archief-in-archief.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { valideerManifest } from './shared/uitrol-manifest.ts';
          import { leesOntwikkelArchief } from './shared/ontwikkelarchief.ts';
          const e = process.env;
          const ruw = readFileSync(e.RUNNER_TEMP + '/manifest-in-archief.json', 'utf8');
          const { manifest, fouten } = valideerManifest(ruw, e.VERSIE);
          if (fouten.length || !manifest) {
            for (const f of fouten) console.error('::error::UITROL-MANIFEST.json · ' + (f.veld || '') + ': ' + (f.uk || JSON.stringify(f)));
            throw Error('Маніфест в архіві не проходить перевірку інсталятора — випуск зупинено.');
          }
          if (!manifest.aangemaakt || !manifest.herkomst || manifest.herkomst.length < 5) throw Error('Немає aangemaakt/herkomst у маніфесті.');
          const ai = manifest.deelnemers.filter((d) => d.soort === 'ai');
          if (!ai.length || ai.some((d) => !d.model || !d.model.id)) throw Error('У маніфесті немає моделі ШІ.');
          const ar = leesOntwikkelArchief(readFileSync(e.RUNNER_TEMP + '/archief-in-archief.json', 'utf8'), e.VERSIE, e.GITHUB_SHA);
          if (ar.fouten.length || !ar.ref) {
            throw Error('ONTWIKKELARCHIEF.json в архіві не пройшов перевірку: ' + ar.fouten.join(', '));
          }
          console.log('UITROL-MANIFEST.json і ONTWIKKELARCHIEF.json в архіві: 0 помилок · модель ' + ai[0].model.id);
          JS
      - name: Передати перевірені пакунки завданню оприлюднення · overdracht aan de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overdracht/uitvoer"
          cp -R uitvoer/. "$RUNNER_TEMP/overdracht/uitvoer/"
          cp "$RUNNER_TEMP/opis.md" "$RUNNER_TEMP/overdracht/opis.md"
          printf '%s\n' "$VERSIE" > "$RUNNER_TEMP/overdracht/VERSIE"
          printf '%s\n%s\n' "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/overdracht/BASIS"
      - name: Зберегти пакунки для завдання оприлюднення · artefact voor de publicatietaak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-001-overdracht
          path: ${{ runner.temp }}/overdracht/
          if-no-files-found: error
          retention-days: 7
      - name: Зберегти пакунки перевірки у сховищі виконання
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-001-controle
          path: uitvoer/
          if-no-files-found: ignore
  uitgave:
    name: Оприлюднення перевірених пакунків · publicatie van de gecontroleerde pakketten
    needs: controle-en-uitgave
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Отримати перевірені пакунки · gecontroleerde pakketten ophalen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gemini-001-overdracht
          path: ${{ runner.temp }}/overdracht
      - name: Відновити пакунки й звірити контрольну суму · pakketten terugzetten en controlesom vergelijken
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(tr -d '\r\n' < "$RUNNER_TEMP/overdracht/VERSIE")"
          VERTROUWD=" ${TOEGESTANE_BASES:-} ${BEKENDE_BASISSEN:-} ${BASIS_VERSIE:+${BASIS_COMMIT:+${BASIS_VERSIE}=${BASIS_COMMIT}}} "
          BASIS_VERSIE="$(sed -n 1p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          BASIS_COMMIT="$(sed -n 2p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          [[ "$VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Передані дані випуску мають неправильний вигляд — оприлюднення зупинено.' >&2; exit 1; }
          case "$VERTROUWD" in *" ${BASIS_VERSIE}=${BASIS_COMMIT} "*) ;; *) echo 'Основа з артефакту складання не входить до довірених значень цього процесу — оприлюднення зупинено.' >&2; exit 1 ;; esac
          { echo "VERSIE=$VERSIE"; echo "BASIS_VERSIE=$BASIS_VERSIE"; echo "BASIS_COMMIT=$BASIS_COMMIT"; } >> "$GITHUB_ENV"
          mkdir -p uitvoer
          cp -R "$RUNNER_TEMP/overdracht/uitvoer/." uitvoer/
          cp "$RUNNER_TEMP/overdracht/opis.md" "$RUNNER_TEMP/opis.md"
          sha256sum --check "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Упевнитися, що такого випуску ще немає · deze uitgave mag nog niet bestaan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/pered-vypuskom.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const code = process.env.HTTP_CODE || '000';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
            if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
              throw Error('Робочий сервер оновився під час перевірок. Оприлюднення зупинено.');
            }
          } else if (code !== '530' && code !== '502' && code !== '504' && code !== '000') {
            throw Error(`Неочікувана відповідь під час повторної звірки сервера: HTTP ${code}`);
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip" \
            --target "$GITHUB_SHA" --title "GEMINI-001 · Права панель якорів, портал меню облікових записів, групування користувачів, аудит та адаптивність · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
