              'Toestemmingen volgens het besluit van de eigenaar: voor elke actie «Uit · Vragen · Altijd» per uitvoerder, standaard «Uit», alleen de eigenaar wijzigt; een waarschuwingsteken «!» met uitleg van het risico; elke wijziging en elke actie staat in het Logboek.',
              'Dertien soorten schermen in echte pixels: horloge, telefoon, wandpaneel, computer, ultrabreed, televisie, stroken van 1920×480 en 1280×400, vierkant, rond, klein, deurpaneel en elektronische inkt; drie thema’s en twee talen.',
              'Ingebouwde simulator van het demohuis «Wilgenlaan 12»: 88 apparaten van alle soorten, 15 scenario’s (ochtend, avond, rook in de keuken, lekkage, dakinspectie met een drone, negatieve prijs enzovoort) en tijdversnelling tot ×600.',
              'Ontwerpspecificatie in het Oekraïens en het Nederlands: het hoofddocument, de normatieve ontwerptaal met tokens en gemeten contrast, en tien zonedocumenten (docs/huis/).',
              'Onafhankelijke eindcontrole van de maquette en de specificatie (vormgeving, gedrag, volledigheid, taal) en twee herstelrondes: toetsenbord en focus in alle lagen; «Geen verbinding» schakelt alle acties uit; een verzoek van een uitvoerder bestaat alleen bij «Vragen» — bij «Uit» vervalt het vanzelf, en goedkeuren kan alleen een mens die dat mag, met het ritueel van het niveau van de actie; een opdracht die niets verandert, schrijft geen regel; «Onderdelen» dekt alle 49 componenten; dezelfde termen in alle onderdelen.',
              'Een link naar de maquette op het tabblad «Вітрина / Toonzaal» en op de informatiepagina van het onderdeel; de maquettepagina is gebouwd zonder inline scripts en stijlen, het beveiligingsbeleid van de site wordt niet versoepeld.'
