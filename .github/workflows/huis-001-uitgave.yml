              nl: 'Geslaagd: coördinatieregels en versheid van de basis; de statische controle van de maquette (57 tabbladen zonder stompen, 104 bedieningsbladen, 130 acties, 15 scenario’s, ruim 7000 tekstparen volgens de taalwet); eenheidstests van de maquette (22/22), van het herstel in «Huis» (16/16), van het menu, het werkblad, de tweetaligheid van hulpmiddelen en de routes; typecontrole; de volledige bouw met de maquette in dist/huis-maquette/ zonder inline scripts en stijlen; migraties tweemaal toegepast; de reeks huis-vnext (54/54) en de meldingssoorten op een schone database. In de ontwikkelomgeving is daarnaast de volledige rooktest van de maquette in de browser geslaagd (alle routes in zes profielen, drie thema’s en twee talen — nul fouten), evenals de controle onder het echte beveiligingsbeleid van de site.'
