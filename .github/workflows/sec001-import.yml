name: SEC-001 Import Snapshot
on:
  push:
    branches:
      - audit/sec-001-20261030
    paths:
      - 'incoming/SEC-001_SOURCE_UPLOAD_20261030.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec001-import
  cancel-in-progress: false

jobs:
  unpack:
    if: github.repository == 'Tarasevych/hub' && github.ref == 'refs/heads/audit/sec-001-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          path=Path('incoming/SEC-001_SOURCE_UPLOAD_20261030.zip')
          if not path.is_file():
              raise SystemExit('ZIP missing: upload to incoming/')
          expected='8a447a7b68eefe9d752aed335d8573f46aff989a2b834da905a832b13d8131b0'
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'ZIP SHA-256 mismatch: {actual}')
          with zipfile.ZipFile(path) as z:
              names=z.infolist()
              if len(names)!=2573:
                  raise SystemExit(f'Unexpected file count: {len(names)}')
              if sum(i.file_size for i in names)>50_000_000:
                  raise SystemExit('Excessive expanded size')
              for i in names:
                  p=Path(i.filename)
                  if i.is_dir() or p.is_absolute() or '..' in p.parts or str(p).startswith('.git/') or str(p).startswith('.github/'):
                      raise SystemExit(f'Unsafe zip member: {i.filename}')
                  if (i.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Symlink member forbidden')
                  dest=Path('.')/p
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(i) as source, dest.open('wb') as target:
                      shutil.copyfileobj(source,target)
          path.unlink()
          print('Imported 2573 source files')
          PY
      - name: Commit audit snapshot only on audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- backend src shared tests deploy migrations docs scripts extension server integrations public
          git add -f -- package.json package-lock.json index.html tsconfig.json vite.config.ts .gitignore 2>/dev/null || true
          rm -f incoming/*.tar.gz incoming/*.tgz
          git rm -f --ignore-unmatch -- 'incoming/*.tar.gz' 'incoming/*.tgz' 2>/dev/null || true
          git add -u -- incoming/SEC-001_SOURCE_UPLOAD_20261030.zip
          git add -f -- '*.md' '*.json' '*.mjs' '*.ts' '*.sh' '*.txt' '*.yaml' '*.yml' '*.service' '*.timer' '*.path' '*.socket' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No files to commit"
          else
            git commit -m "SEC-001: import 2026-10-30 source snapshot for security audit"
            git push origin HEAD:audit/sec-001-20261030
          fi
