          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
          test -s dist/index.html
          test -s dist/huis-maquette/index.html
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const ev = JSON.parse(readFileSync("dist/downloads/extension-version.json", "utf8")); if (ev.version !== "0.9.4") throw Error("Очікувалася версія розширення 0.9.4, отримано: " + ev.version); console.log("extension-version.json:", ev.version);'
