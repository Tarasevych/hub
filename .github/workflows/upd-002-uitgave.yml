            klassiek-002c-panelen \
            klassiek-004b-github-brontekst \
            klassiek-005a-werkblad \
            klassiek-007a-huis-kern \
            klassiek-008a-mcp-kern-uitrol \
            klassiek-009a-sleutelpoort \
            klassiek-010a-beheer-kern \
            kleuren-001-een-bron \
