name: IDENTITEIT-009 · повна мобільна адаптація та зміцнення безпеки розділу Ідентичність (id.tarasevych.com)

# Ніколи не встановлює пакунок на сервер. Перед оприлюдненням звіряє живу встановлену основу (20261112-090824), макет HUIS-001, типи, міграції й контрольну суму.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis (20261112-090824), maquette HUIS-001, typen, migraties en controlesom.
on:
  push:
    branches:
      - 'fix/identiteit-009-mobiel-veiligheid-20261112-080000'
    paths:
      - '.github/workflows/identiteit-009-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/IDENTITEIT-009.json'
      - 'orchestratie/taken/IDENTITEIT-009.json'
      - 'backend/**'
      - 'src/**'
      - 'tests/eenheid/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identiteit-009-uitgave
  cancel-in-progress: true

env:
  TAAK: IDENTITEIT-009
  # Встановлена на сервері основа (версія=фіксація змін); обов'язковий предок цієї гілки.
  # Geïnstalleerde serverbasis (versie=commit); verplichte voorouder van deze tak.
  BEKENDE_BASISSEN: '20261112-090824=fd772f575b85a81c43195f4dba840db3c60a87b1'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: 'gemini-2.5-pro'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          const levend = v.bronCommit || v.commit;
          const bekend = new Map(process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('=')));
          if (bekend.get(v.versie) !== levend) {
            throw Error(`Встановлена версія (${v.versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${v.versie}\nBASIS_COMMIT=${levend}\n`);
          console.log(`Основа випуску: ${v.versie} @ ${levend}`);
          JS
          BASIS_COMMIT="$(node -e "const v=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/versie.json','utf8'));process.stdout.write(v.bronCommit||v.commit)")"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -o pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити розміщення, каталог інтерфейсу, макет HUIS-001 та модульні тести розділу Ідентичність
        run: |
          set -o pipefail
          node scripts/plaatsing-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/huis-maquette.mjs --controle
          node scripts/eenheidstests.mjs identiteit-009-mobiel-veiligheid.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs identiteit-maquette.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs identiteit-atelier.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs identiteit-account-ui.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs mobiel-geometrie-20261021.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs mobiel-cascade-20261105.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs aanmelden-integ-20261103.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs aanmeld-ui-20261030.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs aanmeld-001-weergave.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs accountmenu-v3.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs lees-venster-20261024.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs contrast-knoppen-logos-20261021.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs menu-per-profiel-20261019.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs huis-001-maquette-20261112.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs routes.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs plaatsing-20261025.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити типи та скласти застосунок разом із макетом розумного будинку
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
          test -s dist/huis-maquette/index.html
          test -s dist/huis-maquette/maquette.css
          test -s dist/huis-maquette/maquette.js
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('dist/huis-maquette/index.html', 'utf8');
          if (/<script(?![^>]*\ssrc=)[^>]*>/i.test(html) || /<style[\s>]/i.test(html)) {
            throw Error('Сторінка макета містить вбудований сценарій або стиль: політика безпеки сайту її не пропустить.');
          }
          JS
      - name: Перевірити подвійне застосування міграцій і серверні тести з базою даних
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node scripts/eenheidstests.mjs sleutelkluis-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs site-hulpmiddelen.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Повна мобільна адаптація всіх трьох режимів розділу Ідентичність (id.tarasevych.com) та зміцнення безпеки й швидкодії',
            samenvatting: 'Повне адаптивне та захисне оновлення розділу https://id.tarasevych.com/ поверх живої встановленої версії ' + e.BASIS_VERSIE + ' (із повним збереженням HUIS-001, GITHUB-012, GITHUB-011 та GITHUB-010): усі три режими відображення («Макет», «Студія», «Класичний»), усі 12 підрозділів, вкладені секції та екран входу адаптовано для смартфонів (320–430 px), планшетів і настільних екранів, а виявлені недоліки безпеки, швидкодії, працездатності та клієнтської стійкості усунено.',
            wijzigingen: [
              'Режим «Студія» (.mr-at): захист карток від правила flat-content, кнопка «Вигляд і навігація» у мобільній смузі .mr-at-balk для вибору розташування та стилю меню на смартфонах, обмежена за висотою прокручувана панель .mr-at-popover, узгоджений верхній відступ під шапкою сайту та одноколонкове перенесення сусідніх розділів на вузьких контейнерах.',
              'Режим «Макет» (.mq-root): приховування фонової бічної шухляди позаду відкритого мобільного меню облікового запису (.am3-mobiel-laag), автоматичне зачинення тимчасово відкритої шухляди після закриття меню та збалансовані внутрішні відступи справжніх панелей налаштувань на вузьких екранах.',
              'Режим «Класичний» (.ia-account) та екран входу (.mr-sign-in): компактна липка горизонтальна стрічка змісту .ia-toc з автоцентруванням активної вкладки та захистом від жесту бічного меню (data-no-edge-swipe), усунення потрійного дублювання секцій доступу й повторюваних ідентифікаторів, розширені сенсорні зони (40–44 px) у всіх підрозділах і симетричні поля екрана входу на 320 px.',
              'Безпека світлини профілю: повноцінне скидання власної світлини до початкового зображення постачальника на сервері й клієнті із записом події owner.profile.photo.reset у журнал аудиту, обмеження часу очікування 10 с, політика no-referrer і верхні межі обсягу завантаження (8 МБ за посиланням, 12 МБ з пристрою).',
              'Швидкодія та клієнтська стійкість: об’єднання одночасних однакових запитів читання у swrPost (lees-cache.ts), автопідвантаження активних сесій у SessiesOverzicht, усунення самовільного перестрибування прокрутки в AanmeldVnextPanelen і перевірка структури мережевих відповідей у всіх секціях доступу, ключів, кодів відновлення, Telegram та підтвердження на пристроях.'
            ],
            fixes: [
              'Виправлено кнопку скидання світлини профілю в Profielfoto.tsx, яка раніше лише очищувала локальне поле стану й не зберігала зміну на сервері.',
              'Усунено потрійне відмальовування однакових блоків ключів доступу, сховища ключів, Telegram і підтвердження на пристроях на об’єднаній сторінці Класичного режиму.',
              'Усунено винятки клієнтського виконання при неповних або перерваних мережевих відповідях у Luisteraar.tsx, ToegangssleutelsSectie.tsx, TelegramSectie.tsx, SleutelkluisSectie.tsx, HerstelcodesSectie.tsx, Toegangscodes.tsx, InstellingenSectie.tsx та AanbiederCatalogus.tsx.',
              'Виправлено поломку сітки редактора меню на вузьких екранах (.settings-menu-editor article), вихід списків вибору підтвердження на пристроях за межі 320 px, обрізання таємних значень у .access-plane-secret і накладання міток у прозорості панелі та сповіщеннях.'
            ],
            beperkingen: [
              'Встановлення випуску на робочий сервер виконує виключно власник із підтвердженням ключем доступу.'
            ],
            instructies: 'Завантажте архів mijn-ruimte-<VERSIE>.tar.gz на сторінці «Оновлення → Нове оновлення», підтвердьте встановлення ключем доступу та перевірте всі три режими відображення («Макет», «Студія», «Класичний») на https://id.tarasevych.com/.'
          };
          const nl = {
            titel: 'Volledige mobiele aanpassing van alle drie weergavemodi van Identiteit (id.tarasevych.com) en versterking van veiligheid en snelheid',
            samenvatting: 'Volledige responsieve en beveiligingsbijwerking van https://id.tarasevych.com/ boven op de geïnstalleerde versie ' + e.BASIS_VERSIE + ' (met volledig behoud van HUIS-001, GITHUB-012, GITHUB-011 en GITHUB-010): alle drie weergavemodi («Ontwerp», «Studio», «Klassiek»), alle 12 onderdelen, ingebedde secties en het aanmeldscherm zijn aangepast voor smartphones (320–430 px), tablets en desktops, inclusief herstel van beveiliging, snelheid, werking en clientbestendigheid.',
            wijzigingen: [
              'Modus «Studio» (.mr-at): bescherming van kaarten tegen flat-content, knop «Weergave en navigatie» in de mobiele balk .mr-at-balk voor navigatiepositie en stijl op smartphones, in hoogte begrensd schuifbaar venster .mr-at-popover, uitgelijnde bovenmarge onder de sitekop en enkelkoloms plaatsing van buuronderdelen op smalle containers.',
              'Modus «Ontwerp» (.mq-root): verbergen van de achtergrond-zijlade achter het geopende mobiele accountmenu (.am3-mobiel-laag), automatisch sluiten van de tijdelijk geopende zijlade na het sluiten van het menu en evenwichtige binnenmarges voor echte instellingenpanelen op smalle schermen.',
              'Modus «Klassiek» (.ia-account) en aanmeldscherm (.mr-sign-in): compacte horizontaal schuifbare inhoudsopgave .ia-toc met automatische centrering van het actieve onderdeel en bescherming tegen zijvegen (data-no-edge-swipe), opheffing van drievoudige herhaling van toegangssecties en dubbele id-waarden, vergrote aanraakdoelen (40–44 px) en symmetrische marges op 320 px.',
              'Beveiliging van de profielfoto: volledig herstel van de eigen profielfoto naar de oorspronkelijke aanbiedersafbeelding op server en client met vastlegging van owner.profile.photo.reset in het controlelogboek, tijdslimiet van 10 s, no-referrer-beleid en volumegrenzen (8 MB via koppeling, 12 MB vanaf apparaat).',
              'Snelheid en clientbestendigheid: samenvoeging van gelijktijdige identieke leesverzoeken in swrPost (lees-cache.ts), automatisch laden van actieve sessies in SessiesOverzicht, voorkomen van ongewenst omlaagspringen in AanmeldVnextPanelen en structuurcontrole van netwerkantwoorden in alle secties voor toegang, sleutels, herstelcodes, Telegram en apparaatbevestiging.'
            ],
            fixes: [
              'Herstelknop voor de profielfoto in Profielfoto.tsx gerepareerd zodat de wijziging daadwerkelijk op de server wordt bewaard en niet alleen lokaal.',
              'Drievoudige weergave van passkeys, sleutelkluis, Telegram en apparaatbevestiging op de lange pagina van de Klassieke modus opgeheven.',
              'Uitvoeringsfouten bij onvolledige of onderbroken netwerkantwoorden verholpen in Luisteraar.tsx, ToegangssleutelsSectie.tsx, TelegramSectie.tsx, SleutelkluisSectie.tsx, HerstelcodesSectie.tsx, Toegangscodes.tsx, InstellingenSectie.tsx en AanbiederCatalogus.tsx.',
              'Opmaak van de menubewerker op smalle schermen (.settings-menu-editor article), brede keuzelijsten bij apparaatbevestiging op 320 px, afsnijden van geheime waarden in .access-plane-secret en overlappende bijschriften bij balktransparantie en meldingstijden hersteld.'
            ],
            beperkingen: [
              'Installatie op de productieserver gebeurt uitsluitend door de eigenaar met bevestiging via de toegangssleutel.'
            ],
            instructies: 'Bied mijn-ruimte-<VERSIE>.tar.gz aan via «Updates → Nieuwe update», bevestig de installatie met uw toegangssleutel en controleer alle drie weergavemodi («Ontwerp», «Studio», «Klassiek») op https://id.tarasevych.com/.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'gemini',
                platform: 'Google Antigravity',
                tool: 'Antigravity IDE',
                model: { id: e.MODEL_ID, versie: null, bron: 'omgeving' },
