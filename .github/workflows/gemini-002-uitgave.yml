name: GEMINI-002 · Єдина екосистема споживчих сповіщень («застосунок у застосунку»), вбудований переглядач вкладень, змахи, ШІ-розбір та профілі просторів

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері (20261114-222613),
# правила координації, типи, статичні контракти, 68 безбазових і 16 без-Chrome БД-тестів на PostgreSQL 16, подвійний прогін міграцій,
# політики FORCE ROW LEVEL SECURITY та права mijnruimte_app на 3 таблиці 0278, повне складання, маніфест інсталятора, TRACE-001 і SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, typen, tests tegen PostgreSQL 16, migraties, RLS-rechten van 0278, bouw, manifest en SHA-256.
on:
  # Надсилання цього файла лише реєструє процес на гілці; складання починається через workflow_dispatch із точним model_id.
  push:
    branches:
      - feature/meldingen-ecosysteem-20261115-010721
    paths:
      - .github/workflows/gemini-002-uitgave.yml
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ, що виконала роботу (для UITROL-MANIFEST.json)'
        required: true
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-002-uitgave
  cancel-in-progress: false

env:
  TAAK: GEMINI-002
  # Жива встановлена основа на сервері — 20261114-222613 (TELEGRAM-002 + KLUIS-001 @ 5c2cbb8966309557cc20421e9291ba7a3e40c762).
  BEKENDE_BASISSEN: '20261114-222613=5c2cbb8966309557cc20421e9291ba7a3e40c762'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: ${{ inputs.model_id || vars.GEMINI_002_MODEL_ID }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/meldingen-ecosysteem-20261115-010721" ]; then
            echo "Випуск GEMINI-002 можна запускати лише з гілки feature/meldingen-ecosysteem-20261115-010721." >&2
            exit 1
          fi
          if [ -z "${MODEL_ID:-}" ]; then
            echo "Не задано model_id для UITROL-MANIFEST.json." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            throw Error(`orchestratie/geinstalleerd.json (${gi.versie} @ ${gi.bronCommit}) не збігається з основою (${versie} @ ${levend}).`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента та 68 безбазових модульних випробувань
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          node deploy/agent/agent.mjs selftest --root /tmp
          for t in \
            meldingen-ecosysteem-kern \
            meldingen-ecosysteem-ui \
            melding-positie \
            mededeling-ontdubbelen \
            meldingen-status-20261030 \
            meldingen-uitleg-20261030 \
            meldingen-integ-20261103 \
            meldingen-mobiel-20261021 \
            meldingen-v2-20261029 \
            identiteit-account-ui \
            identiteit-atelier \
            identiteit-maquette \
            identiteit-015-vormgeving-toegang \
            maquette-001-kern \
            ui-paneel-gebruikers-audit-gemini-001 \
            hulp-vraagtekens \
            mobiel-cascade-20261105 \
            mobiel-geometrie-20261021 \
            klassiek-009a-sleutelpoort \
            plaatsing-20261025 \
            uitrol-manifest \
            uitrol-voorcontrole \
            uitrol-pakket-maken \
            uitrol-codes \
            uitrol-tijden \
            uitrol-vereisten-001 \
            contrast-knoppen-logos-20261021 \
            sec-002-afwerking-b-20261112 \
            telegram-aanmelden-20261109 \
            apparaat-bevestiging-20261109 \
            zoek-ui-tabblad-20261105 \
            zoek-ui-bereik-20261105 \
            zoek-ui-sectie-20261105 \
            zoek-diepe-link-20261105 \
            zoek-route-tabblad-20261105 \
            zoek-menu-20261103 \
            zoek-in-menu-20261024 \
            integraties-catalogus-v2-20261029 \
            thema \
            klassiek-001-kern \
            klassiek-002a-werkruimte \
            klassiek-002c-panelen \
            klassiek-007a-huis-kern \
            klassiek-008a-mcp-kern-uitrol \
            klassiek-010a-beheer-kern \
            accountmenu-v2-20261029 \
            accountmenu-v3 \
            uitrol-weergave-v2 \
            ai-hub \
            ai-werkruimte-20261019 \
            ai-doorverwijzing-ui004 \
            audit-filters \
            ui-audit-g \
            dock-snelmenu-20261029 \
            strook-menu \
            menu-per-account-20261019 \
            menu-per-profiel-20261019 \
            menu-taal-prapor-20261103 \
            aanmelden-integ-20261103 \
            huis-001-oude-fouten-20261110 \
            verbindingen-centrum-20261029 \
            browser-extensie \
            extensie-offscreen-20261106 \
            extensie-profielen \
            orch-kern-20261031 \
            orch-pakket-20261031 \
            orch-uitrol-basis-20261031 \
            orch-beoordeling-20261031; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи та скласти застосунок
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Усі міграції на чистій базі (двічі), випробування PostgreSQL 16 (без Chrome), RLS та права 0278
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export DATABASE_URL_SYSTEM="$DATABASE_URL"
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs | tail -3
          # Повторний прогін нічого не змінює. · Tweede keer: niets te doen.
          node dist-server/migrate.mjs | tail -1
          for t in \
            telegram-venster-20261114 \
            telegram-aanmelden-stroom-20261109 \
            telegram-inlog-apparaat-20261112 \
            apparaat-bevestiging-stroom-20261109 \
            aanmeld-koppel-20261030 \
            aanmeld-ui-20261030 \
            kluis-apparaat-20261114 \
            melding-soorten \
            meldingen-sferen-20261022 \
            ruimte-meldingen-20261020 \
            menu-meldingen \
            identiteit-015-profiel-blokken \
            migraties-pg16-20261021 \
            beheer-journaal \
            gebruiker-audit-2026-10-19 \
            sec-002-g10i-20261112; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';

          const tabellen = [
            'melding_ecosysteem_profiel',
            'melding_ecosysteem_gebeurtenissen',
            'melding_ecosysteem_actie_log',
          ];
          const verwachteBeleidsregels = [
            'melding_ecosysteem_profiel_eigen',
            'melding_ecosysteem_geb_eigen',
            'melding_ecosysteem_log_eigen',
          ];

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const cls = await client.query(
              `SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity
                 FROM pg_class c
                 JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'app' AND c.relname = ANY($1::text[])
                ORDER BY c.relname`,
              [tabellen],
            );
            if (cls.rows.length !== 3 || cls.rows.some((r) => !r.relrowsecurity || !r.relforcerowsecurity)) {
              throw Error(`Таблиці 0278 не мають увімкненого FORCE ROW LEVEL SECURITY: ${JSON.stringify(cls.rows)}`);
            }

            const pol = await client.query(
              `SELECT tablename, policyname, qual, with_check
                 FROM pg_policies
                WHERE schemaname = 'app' AND tablename = ANY($1::text[])
                ORDER BY policyname`,
              [tabellen],
            );
            const gevondenPols = new Set(pol.rows.map((r) => r.policyname));
            for (const naam of verwachteBeleidsregels) {
              if (!gevondenPols.has(naam)) {
                throw Error(`Відсутня політика RLS ${naam}: ${JSON.stringify(pol.rows)}`);
              }
            }
            for (const row of pol.rows) {
              const tekst = `${row.qual || ''} ${row.with_check || ''}`;
              if (!tekst.includes('mijnruimte_app') || !tekst.includes('huidige_gebruiker')) {
                throw Error(`Політика ${row.policyname} має несподіваний вираз: ${tekst}`);
              }
            }

            const rechtenSql = readFileSync('migrations/rechten.sql', 'utf8');
            await client.query('BEGIN');
            try {
              await client.query(`DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mijnruimte_app') THEN CREATE ROLE mijnruimte_app NOLOGIN; END IF; END $$;`);
              await client.query(rechtenSql);
              const priv = await client.query(
                `SELECT bool_and(has_table_privilege('mijnruimte_app', t.tbl, p.perm)) AS alle_ok
                   FROM (VALUES
                     ('app.melding_ecosysteem_profiel'),
                     ('app.melding_ecosysteem_gebeurtenissen'),
                     ('app.melding_ecosysteem_actie_log')
                   ) AS t(tbl)
                  CROSS JOIN (VALUES ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE')) AS p(perm)`,
              );
              if (!priv.rows[0]?.alle_ok) {
                throw Error('Не видано повних прав SELECT/INSERT/UPDATE/DELETE для mijnruimte_app на 3 таблиці 0278 через migrations/rechten.sql.');
              }
            } finally {
              await client.query('ROLLBACK');
            }
            console.log('Перевірка RLS, політик і прав mijnruimte_app на 3 таблиці 0278 пройдена бездоганно.');
          } finally {
            await client.end();
          }
          JS
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'GEMINI-002 · Єдина екосистема споживчих сповіщень («застосунок у застосунку»), вбудований переглядач вкладень, змахи, ШІ-розбір та профілі просторів',
            samenvatting: 'Повноцінна екосистема споживчих сповіщень формату «застосунок у застосунку» поверх встановленої версії 20261114-222613 та GEMINI-001: незалежний портал у тілі документа поверх усіх вікон із восьмисторонньою зміною розмірів, змахами й згортанням у плавучу пігулку, єдина шина інтерпретації сигналів з усіх піддоменів, 5 інформаційних смуг, ПК-агента й розширення оглядача, конфіденційний вбудований переглядач вкладень усіх форматів, локальний та безпечний зовнішній ШІ-розбір, сувора ізоляція просторів під RLS у міграції 0278 і 13-та вкладка керування /melding.',
            wijzigingen: [
              'Розгорнуто незалежний портал MeldingenPortaal у верхньому шарі документа (z-index 105000) із перетягуванням, зміною розмірів із 8 боків, чотирма режимами вікна, плавучою пігулкою та контекстним підлаштуванням до 11 піддоменів сайту.',
              'Впроваджено картки зі змахами MeldingVeegKaart із захисним блокуванням від випадкового переміщення в архів нових критичних сповіщень безпеки.',
