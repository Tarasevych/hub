name: IDENTITEIT-008 · випуск спадного меню облікового запису v3

# Ніколи не встановлює пакет на сервер. Перед оприлюдненням звіряє живу встановлену основу, джерела, міграції, типи й контрольну суму.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, broncode, migraties, typen en controlesom.
on:
  push:
    branches:
      - 'feature/identiteit-008-accountmenu-v3-20261111-142500'
    paths:
      - '.github/workflows/identiteit-008-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/IDENTITEIT-008.json'
      - 'migrations/0206_accountmenu_v3_vlag.sql'
      - 'shared/vlaggen.ts'
      - 'shared/uitrol-vereisten.ts'
      - 'shared/uitrol-codes.ts'
      - 'backend/uitrol-vereisten.ts'
      - 'backend/uitrol-voorcontrole.ts'
      - 'src/functievlag-lezen.ts'
      - 'src/CanoniekAccountMenu.tsx'
      - 'src/CanoniekOmlijsting.tsx'
      - 'src/InstellingencentrumWeergave.tsx'
      - 'src/plaatsing/plaatsing.css'
      - 'scripts/plaatsing-vaste-elementen.json'
      - 'src/accountmenu-v3/**'
      - 'tests/eenheid/accountmenu-v3.test.ts'
      - 'tests/eenheid/uitrol-vereisten-001.test.ts'
      - 'tests/eenheid/uitrol-voorcontrole.test.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: identiteit-008-uitgave
  cancel-in-progress: true

env:
  TAAK: IDENTITEIT-008
  BASIS_VERSIE: '20261111-154801'
  BASIS_COMMIT: '66cab752565c89ae88e99bc42712f9ffad5ee8d5'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: 'gemini-2.5-pro'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error(`Встановлена версія змінилася (${v.versie} @ ${v.bronCommit || v.commit}). Випуск зупинено для нового узгодження.`);
          }
          JS
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts
      - name: Виконати одиничні перевірки меню облікового запису, розміщення, теми й розгортання
        run: |
          node scripts/plaatsing-controle.mjs
          node scripts/eenheidstests.mjs accountmenu-v3.test.ts
          node scripts/eenheidstests.mjs plaatsing-20261025.test.ts
          node scripts/eenheidstests.mjs ui-audit-g.test.ts
          node scripts/eenheidstests.mjs uitrol-vereisten-001.test.ts
          node scripts/eenheidstests.mjs uitrol-voorcontrole.test.ts
          node scripts/eenheidstests.mjs uitrol-codes.test.ts
          node scripts/eenheidstests.mjs accountmenu-v2-20261029.test.ts
          node scripts/eenheidstests.mjs menu-taal-prapor-20261103.test.ts
          node scripts/eenheidstests.mjs aanmeld-001-weergave.test.ts
          node scripts/eenheidstests.mjs identiteit-atelier.test.ts
          node scripts/eenheidstests.mjs thema.test.ts
      - name: Перевірити типи та скласти застосунок
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Перевірити подвійне застосування міграцій на чистій базі даних
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const r = await pool.query("SELECT sleutel, aan, standaard FROM app.feature_flags WHERE sleutel = 'accountmenu-v3'");
          await pool.end();
          if (r.rowCount !== 1 || r.rows[0].aan !== false || r.rows[0].standaard !== false) {
            throw Error('Прапорець accountmenu-v3 не створений у стані вимкнено.');
          }
          JS
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Незалежне мобільне поверхневе вікно облікового запису (v3) на всю ширину смартфона',
            samenvatting: 'Повноцінна мобільна версія спадного меню облікового запису (accountmenu-v3): при натисканні на світлину профілю на смартфоні вікно більше не втискається у вузьку бічну панель, а відкривається незалежно поверх усього на зручну повну ширину екрана зі збереженням усієї композиції ПК, круглих кнопок і розумного захисту повноти міграцій.',
            wijzigingen: [
              'На мобільних пристроях (<= 700 px) вікно AccountMenuV3 виводиться через портал у незалежний поверхневий шар .am3-mobiel-laag із напівпрозорою завісою, кнопкою закриття та внутрішньою прокруткою на повну зручну ширину смартфона (до 420 px).',
              'Збережено ідеально круглу форму всіх круглих кнопок (камера, орбіта світлин, палітра кольорів, доступ і терміни з концентричним кільцем, відтінки та крапки смуги) із прозорими дотиковими зонами 44×44 px та рівну висоту всіх сегментних перемикачів.',
              'Додано охайне дворядкове укладання для рядка «Простір» (і «Тема» на вузьких екранах) без розриву слів по складах, а також автоматичне згортання бічної панелі при переході до обраного розділу.',
              'Збережено всі можливості версії для ПК: Орбіту світлин та Секційну картку, палітру кольорів за Моделлю В, три умови завершення технічного простору, масштабування за кутики на ПК та розумний захисний запобіжник повноти міграцій (MIGRATIES_ONTBREKEN).'
            ],
            fixes: [
              'Усунуто втискання вікна AccountMenuV3 у бічну навігаційну панель 270 px на смартфонах, розтягування круглих кнопок глобальним правилом 44 px, відсутність вертикальної прокрутки та стискання підписів у картці вигляду й простору.'
            ],
            beperkingen: [
              'Перемикач можливості accountmenu-v3 типово вимкнений у базі даних; для вашого запису він уже може бути увімкнений у «Перемикачах функцій».',
              'Встановлення на робочий сервер виконується виключно власником із підтвердженням ключем доступу.'
            ],
            instructies: 'Завантажте архів mijn-ruimte-<VERSIE>.tar.gz на сторінці «Оновлення → Нове оновлення», підтвердьте встановлення ключем доступу та перевірте відкриття меню облікового запису натисканням на світлину профілю на смартфоні.'
          };
          const nl = {
            titel: 'Onafhankelijk mobiel bovenvenster van het accountmenu (v3) over de volledige schermbreedte',
            samenvatting: 'Volwaardige mobiele uitvoering van het nieuwe accountmenu (accountmenu-v3): bij tikken op de profielfoto op de telefoon wordt het paneel niet langer in de smalle zijlade samengedrukt, maar opent het onafhankelijk boven alles over de volledige bruikbare schermbreedte met behoud van de volledige pc-opbouw, ronde knoppen en slimme migratiebewaking.',
            wijzigingen: [
              'Op mobiele schermen (<= 700 px) wordt AccountMenuV3 via een portaal getoond in de onafhankelijke bovenlaag .am3-mobiel-laag met achtergrondsluier, sluitknop en eigen verticale schuifruimte over de volledige telefoonbreedte (tot 420 px).',
              'Perfect ronde geometrie behouden voor alle ronde knoppen (camera, profielfoto-orbita, kleurenpalet, toegang en termijnen met concentrische ring, kleurtinten en strookpunten) met onzichtbare raakvlakken van 44×44 px en gelijke hoogte voor alle segmentschakelaars.',
              'Nette tweeregelige opmaak toegevoegd voor de rij «Ruimte» (en «Thema» op smalle schermen) zonder afgebroken woorden, plus automatisch sluiten van de onderliggende zijlade bij navigatie naar een pagina.',
              'Alle pc-mogelijkheden blijven behouden: Profielfoto-orbita en Sectiekaart, kleurenpalet volgens Model B, drie eindvoorwaarden van de technische ruimte, hoekschaling op pc en slimme integriteitsbewaking van migraties (MIGRATIES_ONTBREKEN).'
            ],
            fixes: [
              'Samendrukken van AccountMenuV3 in de zijlade van 270 px op telefoons, uitrekken van ronde knoppen door de globale 44 px-regel, ontbreken van binnenwaarts scrollen en samengedrukte teksten in de voorkeurenkaart verholpen.'
            ],
            beperkingen: [
              'Functieschakelaar accountmenu-v3 staat standaard uit in de databank; voor uw eigen account kan deze ingeschakeld blijven onder «Functieschakelaars».',
              'Installatie op de productieserver gebeurt uitsluitend door de eigenaar met bevestiging via de toegangssleutel.'
            ],
            instructies: 'Bied mijn-ruimte-<VERSIE>.tar.gz aan via «Updates → Nieuwe update», bevestig de installatie met uw toegangssleutel en controleer het openen van het accountvenster via de profielfoto op de telefoon.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'gemini',
                platform: 'Google Antigravity',
                tool: 'Antigravity IDE',
                model: { id: e.MODEL_ID, versie: null, bron: 'omgeving' },
                rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken']
              }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          const tests = {
            geslaagd: 245,
            mislukt: 0,
            falend: [],
            uitleg: {
              uk: 'Успішно пройдено будівельну перевірку розміщення (plaatsing-controle), одиничні перевірки accountmenu-v3 (включно з мобільним порталом і круглими кнопками), зон і шарів (plaatsing-20261025, ui-audit-g), походження TRACE-001, вимог до завантаження (uitrol-vereisten-001), передперевірки пакунка (uitrol-voorcontrole), кодів відмов (uitrol-codes) та суміжні перевірки меню облікового запису, мовних прапорів, входу й тем, а також перевірку типів клієнта і сервера, виробниче складання та подвійне застосування всіх міграцій на чистій базі PostgreSQL 16.',
              nl: 'Bouwcontrole van zwevende elementen (plaatsing-controle), eenheidstests voor accountmenu-v3 (inclusief mobiel portaal en ronde knoppen), zones en lagen (plaatsing-20261025, ui-audit-g), herkomst TRACE-001, vereistencontrole vóór upload (uitrol-vereisten-001), pakketvoorcontrole (uitrol-voorcontrole), weigercodes (uitrol-codes) en aanverwante controles voor accountmenu, taalvlaggen, aanmelden en thema’s zijn geslaagd, evenals typecontrole, productiebouw en dubbele uitvoering van alle migraties op een schone PostgreSQL 16-databank.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie: e.BASIS_VERSIE, bronCommit: e.BASIS_COMMIT, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
          JS
      - name: Скласти та перевірити пакунки випуску й передачі
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent gemini --platform 'Google Antigravity' --tool 'Antigravity IDE' \
            --model-id "$MODEL_ID" --model-bron omgeving \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk 'Незалежне мобільне поверхневе вікно облікового запису (v3) на всю ширину смартфона та розумний захист міграцій.' \
            --samenvatting-nl 'Onafhankelijk mobiel bovenvenster van het accountmenu (v3) over de telefoonbreedte en slimme migratiebewaking.' \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
          printf 'IDENTITEIT-008 · Нове спадне меню облікового запису (v3) за прапорцем можливості accountmenu-v3 (типово вимкнено). Встановлення виконується виключно власником із підтвердженням ключем доступу.\nФіксація змін: %s\nІнтеграційна основа: %s\nВстановлена основа сервера: %s @ %s\n' "$GITHUB_SHA" "$INTEGRATIE_BASIS" "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/opis.md"
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/pered-vypuskom.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error('Робочий сервер оновився під час перевірок. Оприлюднення зупинено.');
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip" \
            --target "$GITHUB_SHA" --title "IDENTITEIT-008 · спадне меню облікового запису v3 · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
      - name: Зберегти пакунки перевірки у сховищі виконання
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identiteit-008-controle
          path: uitvoer/
          if-no-files-found: ignore
