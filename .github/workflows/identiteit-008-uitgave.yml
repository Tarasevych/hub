name: IDENTITEIT-008 · меню облікового запису v3, пошта Google та відкрита екосистема ШІ

# Ніколи не встановлює пакет на сервер. Перед оприлюдненням звіряє живу встановлену основу, джерела, міграції, типи й контрольну суму.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, broncode, migraties, typen en controlesom.
on:
  push:
    branches:
      - 'feature/identiteit-008-accountmenu-v3-20261111-142500'
    paths:
      - '.github/workflows/identiteit-008-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/IDENTITEIT-008.json'
      - 'migrations/0206_accountmenu_v3_vlag.sql'
      - 'migrations/0207_ai_ecosysteem_werkruimtes.sql'
      - 'migrations/rechten.sql'
      - 'shared/**'
      - 'backend/**'
      - 'deploy/mcp/server.mjs'
      - 'extension/**'
      - 'scripts/plaatsing-vaste-elementen.json'
      - 'src/**'
      - 'tests/eenheid/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identiteit-008-uitgave
  cancel-in-progress: true

env:
  TAAK: IDENTITEIT-008
  BASIS_VERSIE: '20261111-172513'
  BASIS_COMMIT: '730d9f811b09d138d5378ef9339bf4c895074c16'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: 'gemini-2.5-pro'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error(`Встановлена версія змінилася (${v.versie} @ ${v.bronCommit || v.commit}). Випуск зупинено для нового узгодження.`);
          }
          JS
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -o pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Виконати одиничні перевірки меню, пошти, екосистеми ШІ, розміщення та розгортання
        run: |
          set -o pipefail
          node scripts/plaatsing-controle.mjs
          node scripts/eenheidstests.mjs accountmenu-v3.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs ai-ecosysteem-en-google-herstel.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs ai-werkruimte-20261019.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs agent-verbinden-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs hulpmiddelen-tweetalig-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs connector-v2.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs plaatsing-20261025.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs ui-audit-g.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs uitrol-vereisten-001.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs uitrol-voorcontrole.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs uitrol-codes.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs accountmenu-v2-20261029.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs menu-taal-prapor-20261103.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs aanmeld-001-weergave.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs identiteit-atelier.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs thema.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити типи та скласти застосунок
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Перевірити подвійне застосування міграцій на чистій базі даних
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const r = await pool.query("SELECT sleutel, aan, standaard FROM app.feature_flags WHERE sleutel = 'accountmenu-v3'");
          const tabellen = await pool.query(`
            SELECT c.relname, c.relrowsecurity
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'app'
               AND c.relname IN ('ai_agent_werkruimtes', 'ai_gedeelde_context', 'ai_agent_overdrachten', 'ai_ruimte_uitbreidingen')
          `);
          await pool.end();
          if (r.rowCount !== 1 || r.rows[0].aan !== false || r.rows[0].standaard !== false) {
            throw Error('Прапорець accountmenu-v3 не створений у стані вимкнено.');
          }
          if (tabellen.rowCount !== 4 || tabellen.rows.some((t) => t.relrowsecurity !== true)) {
            throw Error('Таблиці відкритої екосистеми ШІ (0207) не створені або не мають увімкненого RLS.');
          }
          JS
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Виправлення входу пошти Google і меню облікового запису (v3) та відкрита агентна екосистема розділу ШІ',
            samenvatting: 'Поєднаний випуск на основі живої версії 20261111-172513: виправлено завершення входу пошти Google при закритому сховищі ключів, утримання кнопки палітри кольорів на смартфоні та розмежування кнопок переходу й видалення записів у меню профілю, а також упроваджено відкриту агентну екосистему розділу ШІ з ізольованими просторами агентів, спільним контекстом між завданнями, взаємодією між агентами, першокласною підтримкою OpenAI Codex і Anthropic Claude та самостійним розгортанням на власному обладнанні.',
            wijzigingen: [
              'Відкрита агентна екосистема розділу ШІ (ai.tarasevych.com та mcp.tarasevych.com, міграція 0207_ai_ecosysteem_werkruimtes.sql): єдина планка простору у вкладці чату та три повноцінні робочі розділи — ізольовані простори агентів, спільний контекст із передачею завдань між агентами та розширення простору користувача.',
              'Ізольовані робочі простори агентів ШІ з подвійним замком безпеки: керований доступ до локального комп’ютера (agent.mjs, дозволені теки, читання чи запис), розширення оглядача (дозволені домени) та сервера (лише в технічному просторі), а також вибірковий доступ до файлів, пошти, календаря, Диска, дошки, GitHub і зовнішніх служб.',
              'Першокласна підтримка OpenAI Codex (/codex) нарівні з Anthropic Claude (/claude) та іншими інструментами програмування ШІ у всіх реєстрах клієнтів, каталозі прав v2, чотирьох нових інструментах спільного контексту й передачі завдань та рецептах підключення.',
              'Повна відкритість платформи для розгортання на власному обладнанні: вбудований формувач налаштувань (docker-compose.yml, приклад .env, команди підключення комп’ютера, Codex і Claude та підтримка локальних відкритих моделей) без залежності від одного сайту.'
            ],
            fixes: [
              'Пошта Google: усунуто підміну закритого особистого сховища ключів користувача сліпим кодом GOOGLE_SUITE_CALLBACK_FAILED · HTTP 400; тепер і перед початком входу, і при зворотному виклику повертається точний код SLEUTELKLUIS_GESLOTEN із прямою кнопкою переходу до розблокування сховища ключів.',
              'Палітра кольорів у меню облікового запису (v3): усунуто миттєве автозгортання полички палітри після утримання на сенсорному екрані смартфона (ігнорування синтетичної події contextmenu протягом 850 мс) та додано явну кнопку закриття полички.',
              'Перелік збережених облікових записів у меню v3: ізольовано дотикові шари ::after кнопок переходу/входу та хрестика видалення запису зі списку власним position: relative зі збільшеним проміжком, тож натискання «Перейти» / «Увійти» більше ніколи не зачіпає видалення сусіднього запису.'
            ],
            beperkingen: [
              'Якщо особисте сховище ключів закрите на сервері, перед завершенням прив’язки нової поштової скриньки Google потрібно натиснути кнопку «Відкрити сховище ключів» і розблокувати його.',
              'Встановлення випуску на робочий сервер виконується виключно власником із підтвердженням ключем доступу.'
            ],
            instructies: 'Завантажте архів mijn-ruimte-<VERSIE>.tar.gz на сторінці «Оновлення → Нове оновлення», підтвердьте встановлення ключем доступу, перевірте поличку палітри й перемикання записів у меню профілю, повторне підключення пошти Google та нові можливості розділу ШІ на ai.tarasevych.com.'
          };
          const nl = {
            titel: 'Herstel van Google-mailkoppeling en accountmenu (v3) plus het open agent-ecosysteem van het AI-onderdeel',
            samenvatting: 'Gecombineerde uitgave boven op de geïnstalleerde versie 20261111-172513: herstelt het afronden van de Google-mailkoppeling bij een gesloten sleutelkluis, het openhouden van de paletlade bij vasthouden op de telefoon en de scheiding tussen wissel- en verwijderknoppen in het accountmenu, en introduceert het open agent-ecosysteem op ai.tarasevych.com met geïsoleerde agent-werkruimtes, gedeelde werkcontext, taakoverdracht tussen agenten, eersteklas ondersteuning van OpenAI Codex en Anthropic Claude en zelfstandige uitrol op eigen apparatuur.',
            wijzigingen: [
              'Open agent-ecosysteem van het AI-onderdeel (ai.tarasevych.com en mcp.tarasevych.com, migratie 0207_ai_ecosysteem_werkruimtes.sql): verenigde ruimtebalk boven de chat en drie volledige werkschermen voor geïsoleerde agent-werkruimtes, gedeelde werkcontext met taakoverdracht en ruimte-uitbreidingen.',
              'Geïsoleerde werkruimtes voor AI-agenten met dubbele veiligheidsgrendel: beheerbare toegang tot de lokale computer (agent.mjs, toegestane mappen, lezen of schrijven), browserextensie (toegestane domeinen) en server (uitsluitend in de technische ruimte), plus selectieve toegang tot bestanden, e-mail, agenda, schijf, bord, GitHub en externe diensten.',
              'Eersteklas ondersteuning van OpenAI Codex (/codex) naast Anthropic Claude (/claude) en overige AI-programmeerhulpmiddelen in alle clientregisters, de v2-rechtencatalogus, vier nieuwe hulpmiddelen voor gedeelde context en overdracht en de koppelrecepten.',
              'Volledig open opstelling voor zelfstandige uitrol op eigen apparatuur: ingebouwde opbouwer (docker-compose.yml, .env-voorbeeld, koppelopdrachten voor lokale agent, Codex en Claude en ondersteuning van lokale open modellen) zonder afhankelijkheid van één site.'
            ],
            fixes: [
              'Google-mailkoppeling: gesloten persoonlijke sleutelkluis wordt niet langer gemaskeerd als GOOGLE_SUITE_CALLBACK_FAILED · HTTP 400; zowel bij de start als bij de terugkeer geeft de server SLEUTELKLUIS_GESLOTEN terug met een directe knop om de sleutelkluis te ontgrendelen.',
              'Kleurenpalet in accountmenu (v3): direct dichtklappen van de paletlade na ingedrukt houden op aanraakschermen verholpen (synthetisch contextmenu gedurende 850 ms genegeerd) en een duidelijke sluitknop toegevoegd.',
              'Accountlijst in menu v3: onzichtbare ::after-raakvlakken van de wissel-/aanmeldknop en het verwijderkruisje geïsoleerd met eigen position: relative en extra tussenruimte, zodat tikken op «Wisselen» / «Aanmelden» nooit meer het verwijderkruisje raakt.'
            ],
            beperkingen: [
              'Wanneer de persoonlijke sleutelkluis op de server gesloten is, dient deze eerst via de knop «Sleutelkluis ontgrendelen» geopend te worden voordat een nieuwe Google-mailbox gekoppeld wordt.',
              'Installatie op de productieserver gebeurt uitsluitend door de eigenaar met bevestiging via de toegangssleutel.'
            ],
            instructies: 'Bied mijn-ruimte-<VERSIE>.tar.gz aan via «Updates → Nieuwe update», bevestig de installatie met uw toegangssleutel en controleer de paletlade en accountwissel in het profielmenu, de Google-mailkoppeling en het vernieuwde AI-onderdeel op ai.tarasevych.com.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'gemini',
                platform: 'Google Antigravity',
                tool: 'Antigravity IDE',
                model: { id: e.MODEL_ID, versie: null, bron: 'omgeving' },
                rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken']
              }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          // SEC-002: cijfers uit de echte uitvoer van scripts/eenheidstests.mjs («N/M geslaagd (…)» per testbestand), geen letterlijke getallen.
          // Кількість перевірок береться з фактичного виводу тестів цього запуску, а не з наперед записаного числа.
          const gemeten = { geslaagd: 0, mislukt: 0 };
          const perTest = new Map(); for (const r of readFileSync(e.RUNNER_TEMP + '/eenheidstests.log', 'utf8').matchAll(/^(\d+)\/(\d+) geslaagd \(([^)\n]+)\)/gm)) perTest.set(r[3], [Number(r[1]), Number(r[2])]); for (const [g, n] of perTest.values()) { gemeten.geslaagd += g; gemeten.mislukt += n - g; } const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + ' ' + g + '/' + n).join('; ');
          if (!gemeten.geslaagd || gemeten.mislukt) throw Error('Немає виміряних результатів тестів або є невдалі перевірки — випуск зупинено.');
