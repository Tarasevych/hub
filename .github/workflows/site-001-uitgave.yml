name: 'SITE-001 · Випуск готовності сайту «Мій простір» за всіма 25 пунктами, мовного очищення та 16 сторожів'

# Ніколи не встановлює пакунок на живий сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері
# (20261127-172549 @ c375e52920248d538dbda1f15f643cfeb8229695), правила координації 1.8.0 (B-027 / VLAG-001), облік BIJDRAGE-001
# усіх трьох моделей ШІ (Claude Opus 5.5 (High) через Antigravity Google, Gemini 4 Carbon High від Google Antigravity та
# Gemini 4 Argon High від Google Antigravity), сторож бази сповіщень MELDINGEN-REGISTER-001, типи клієнта й сервера,
# статичні сторожі, TRACE-001, 12 стендів «Плюща» на Node 24, 20 хмарних випробувань, подвійний прогін усіх міграцій 0001..0342
# на PostgreSQL із трьома ролями, усі 16 нових тестів-сторожів SITE-001 та ключові регресійні випробування, повне складання
# з CRX3 0.9.7, pakketVoorcontrole і перевірку root TRACE-001.
# Installeert nooit automatisch. Controleert vooraf de live serverbasis (20261127-172549 @ c375e5292024), regels 1.8.0 (VLAG-001),
# BIJDRAGE-001 voor alle drie AI-modellen (Claude Opus 5.5 (High) via Antigravity Google, Gemini 4 Carbon High van Google Antigravity
# en Gemini 4 Argon High van Google Antigravity), MELDINGEN-REGISTER-001, client- en servertypen, statische bewakers, TRACE-001,
# 12 Klimop-proeven, 20 cloudtests, dubbele migraties 0001..0342 met drie rollen, alle 16 SITE-001-bewakers, volledige productiebouw
# met CRX3 0.9.7, pakketVoorcontrole en root TRACE-001.
on:
  push:
    branches:
      - feature/site-001-20261125-232500
    paths:
      - .github/workflows/site-001-uitgave.yml
      - orchestratie/ontwikkelarchieven/SITE-001.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ пакування (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: site-001-uitgave
  cancel-in-progress: false

env:
  TAAK: SITE-001
  BEKENDE_BASISSEN: '20261128-160821=ead2a6b5df08c6f3331b0e14358fa34987615693 20261128-152913=5bb634d5a8455079430aa1de661099e7d63386ef 20261128-120634=e1277b93e3da0ee8ece4e8a6cd8fa54a05710337 20261128-094858=3680f3424581994e54a74dc8b95e9cf0920b9081 20261127-224821=60bd23ba65be5c848fb0de75fce6c9ba556c0bc2 20261127-214414=f01fe60837621a5fd017b8f8951563e9de327f40 20261127-211124=b3e037a050f9782c4580ee3adf193a343f730046 20261127-202535=fdcd024473d2c49dbf55e43914ab19a2d266d168 20261127-172549=c375e52920248d538dbda1f15f643cfeb8229695 20261127-145130=4a67264fb55bd8c82e1d8efe907e8ae22edc0a53 20261127-103137=5404c83b4c3143fe3383df2fc56d4eca62ab6c68 20261126-181653=c7561d0a4ee7507bc4e01bd2bd5fa39a76000a34 20261125-090113=c4271d894d36d46c6994772fb2003e93fd3decaf 20261123-145553=f56ba3fea1e4da191970e57c9a92272ba861e3ad'
  ROOT_BASIS_VERSIE: '20261128-120634'
  ROOT_BASIS_COMMIT: 'e1277b93e3da0ee8ece4e8a6cd8fa54a05710337'
  INTEGRATIE_BASIS: '8890f85a1c34c9f12e945eb78bd2e8588cceb56a'
  MODEL_ID: ${{ inputs.model_id || 'Gemini 4 Argon High' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/site-001-20261125-232500" ]; then
            echo "Випуск SITE-001 можна запускати лише з гілки feature/site-001-20261125-232500." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити системні інструменти та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = process.env.ROOT_BASIS_VERSIE;
          let levend = process.env.ROOT_BASIS_COMMIT;
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            const liveVersie = v.versie;
            const liveCommit = v.bronCommit || v.commit;
            if (bekend.get(liveVersie) !== liveCommit) {
              throw Error(`Встановлена версія (${liveVersie} @ ${liveCommit}) не входить до відомих основ цієї гілки. Випуск зупинено.`);
            }
            versie = liveVersie;
            levend = liveCommit;
            console.log(`Жива відповідь /api/version: ${liveVersie} @ ${liveCommit}`);
          } else if (['000', '403', '429', '502', '504', '522', '524', '530'].includes(code)) {
            console.log(`Зовнішній тунель тимчасово відхилив запит без сеансу (HTTP ${code}); продовжуємо зі звіреною базою ${versie} @ ${levend}.`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з живою встановленою базою ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації 1.8.0 (VLAG-001), облік BIJDRAGE-001, сторож бази сповіщень та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          DOEL_BASIS="${BASIS_COMMIT:-c375e52920248d538dbda1f15f643cfeb8229695}"
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen "$DOEL_BASIS"
          node scripts/orch.mjs behoud --tegen "$INTEGRATIE_BASIS"
          node scripts/vaardigheden/valideer.mjs
          node scripts/meldingen-register-controle.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/SITE-001.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'SITE-001');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал SITE-001 дійсний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, 12 стендів «Плюща», 20 хмарних і безбазові випробування
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/klant-servergrens-controle.mjs --stil
          node deploy/agent/agent.mjs selftest --root /tmp
          for s in \
            scripts/klimop-etappe0-audit.mjs \
            scripts/klimop-proefnetwerk.mjs \
            scripts/klimop-etappe3-opslag-proef.mjs \
            scripts/klimop-etappe4-frost-proef.mjs \
            scripts/klimop-etappe5-identiteit-proef.mjs \
            scripts/klimop-etappe6-bestuur-proef.mjs \
            scripts/klimop-etappe7-immuunsysteem-proef.mjs \
            scripts/klimop-etappe8-diensten-proef.mjs \
            scripts/klimop-etappe9-mensbescherming-proef.mjs \
            scripts/klimop-etappe10-hechtranken-proef.mjs \
            scripts/klimop-etappe11-beveiligingsaudit-proef.mjs \
            scripts/klimop-etappe12-zaden-proef.mjs; do
            node "$s" >/dev/null
          done
          for f in tests/eenheid/cloud-*.test.mjs; do
            printf '=== FILE: %s ===\n' "$f" >> "$RUNNER_TEMP/eenheidstests.log"
            node --test "$f" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          for t in \
            werkstromen-veilig-20261116 \
            vlag-001-pakket \
            juridisch \
            uitrol-vereisten-001 \
            herstel-001-telegram-archief-stroom \
            herstel-001-aanmelden-mobiel-vier-gebreken \
            herstel-001-telegram-aanmelden-tien-gebreken \
            herstel-001-google-terugkeer-staat-verlopen \
            herstel-001-meldingen-tien-gebreken \
            herstel-001-mail-weergave-twaalf-gebreken \
            accountmenu-strook-20261115 \
            werkblad-v3-normalisatie \
            consol-m5b-vlaggen-20261123 \
            klimop-001-manifest-agenten-20261120; do
            printf '=== FILE: %s.test.ts ===\n' "$t" >> "$RUNNER_TEMP/eenheidstests.log"
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи клієнта й сервера та виконати повне виробниче складання
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Подвійний прогін усіх міграцій 0001..0342 на PostgreSQL із трьома ролями та прогін усіх 16 сторожів SITE-001 і базових тестів
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export RECOVERY_CODE_PEPPER="$(openssl rand -base64 32)"
          export AUDIT_IP_PEPPER="$(openssl rand -base64 40)"
          export SESSION_SECRET="$(openssl rand -base64 32)"
          export OWNER_VAULT_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export GOOGLE_OAUTH_GRANT_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export MAIL_APP_WACHTWOORD_SLEUTEL_V1="$(openssl rand -hex 32)"
          export SLEUTELKLUIS_SLEUTEL_V1="$(openssl rand -hex 32)"
          export MAIL_TOKEN_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export AGENDA_ABONNEMENT_SLEUTEL_V1="$(openssl rand -hex 32)"
          export GITHUB_KOPPELING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export CLOUD_OAUTH_TOKEN_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M8_CURSOR_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M6_CI_ATTESTATION_HMAC_KEY="$(openssl rand -hex 32)"
          export RUIMTE_BINDING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export AI_BEVESTIGING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export SESSION_PEPPER="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_GITHUB_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_ARCHIEF_SLEUTEL="$(openssl rand -hex 32)"
          export TELEGRAM_AANMELD_PEPER="$(openssl rand -hex 24)"
          export AFZENDER_BEELD_PEPPER="$(openssl rand -hex 24)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          export UPLOADS_DIR="$RUNNER_TEMP/uploads"
          export DIST_DIR="$PWD/dist"
          mkdir -p "$UPLOADS_DIR"

          node dist-server/migrate.mjs | tail -5
          W_MIG="$(openssl rand -hex 24)"
          W_APP="$(openssl rand -hex 24)"
          W_SYS="$(openssl rand -hex 24)"
          S_MIG="$(printf '%s\n' "$W_MIG" | node deploy/scram-verifier.mjs)"
          S_APP="$(printf '%s\n' "$W_APP" | node deploy/scram-verifier.mjs)"
          S_SYS="$(printf '%s\n' "$W_SYS" | node deploy/scram-verifier.mjs)"
          psql "$DATABASE_URL" -v legacy_rol=migratie -v migrator_scram="$S_MIG" -v app_scram="$S_APP" -v systeem_scram="$S_SYS" -f deploy/db-rollen.sql
          export DATABASE_URL_APP="postgres://mijnruimte_app:${W_APP}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_MIGRATIE="postgres://mijnruimte_migrator:${W_MIG}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_SYSTEM="postgres://mijnruimte_system:${W_SYS}@127.0.0.1:5432/mijnruimte_schoon"
          node dist-server/migrate.mjs | tail -5

          for t in \
            site-001-404 \
            site-001-aanmelden-herstel \
            site-001-akaunt \
            site-001-alt \
            site-001-analyse \
            site-001-backups \
            site-001-beveiliging \
            site-001-cta \
            site-001-formulieren \
            site-001-knoppen \
            site-001-koppelingen \
            site-001-metadata \
            site-001-monitoring \
            site-001-snelheid \
            site-001-spam \
            site-001-toestemming \
            rls \
            rls-groepen \
            vlaggen \
            herstel-001-verbinding-meldingen-bewijs \
            werkblad-v3-routes \
            uitrol-goedkeuring \
            uitrol-stroom \
            uitrol-risico-20261116 \
            upd-007-ui-en-ruimte-20261119 \
            upd-008-mail-menu-ruimtes-20261119 \
            bijlage-viewer-v2-20261029 \
            bijlage-weergave-gedeeld \
            bijlage-weergave-etappe2 \
            tech-ruimtes-v2-20261027; do
            printf '=== FILE: %s.test.ts ===\n' "$t" >> "$RUNNER_TEMP/eenheidstests.log"
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску з повним обліком усіх трьох моделей ШІ та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { manifestBijdragen } from './scripts/orch/bijdragen.mjs';
          const e = process.env;
          const auteur = 'Тарасевич Павло (tarasevych.pavlo@gmail.com)';
          const functievlaggen = [
            { sleutel: 'melding-verbinding-bewijs-v1', migratie: '0336_melding_verbinding_bewijs_vlag.sql' },
            { sleutel: 'melding-kapsel-aflevering-v1', migratie: '0340_melding_kapsel_aflevering_vlag.sql' }
          ];
          const siteBijdragenMap = 'orchestratie/bijdragen/SITE-001';
          const siteBijdragen = readdirSync(siteBijdragenMap)
            .filter((f) => f.endsWith('.json'))
            .sort()
            .map((f) => JSON.parse(readFileSync(`${siteBijdragenMap}/${f}`, 'utf8')));
          const uk = {
            titel: 'SITE-001 · Круглі кнопки оновлення й налаштувань пошти та жива верхня капсула стану оновлення, верхня кнопка-капсулка розділів сторінки, чисті кути списку листів, компактна капсула простору та 25 пунктів готовності',
