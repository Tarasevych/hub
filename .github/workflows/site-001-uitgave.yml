ень v2, капсулка й поле пошуку, надсилання пошти, збереження пошти/вкладень, згода на реп’яшки, перемикач просторів та пакування)." \
            --samenvatting-nl "Uitgave SITE-001 boven op geinstalleerde basis ${BASIS_VERSIE} (${BASIS_COMMIT:0:12}): zuiver ronde ververs- en instellingenknoppen (.mail-top-refresh, .mail-top-settings — 40×40 / 44×44 px met aspect-ratio: 1/1; border-radius: 50%), doorlopende rotatie van de verversknop en live bovenste statuscapsule .mail-ververs-kapsel met verzoekfasen, groene voltooiing met vinkje, rode foutstatus en bescherming tegen herhaald klikken (site-001-snelheid 36/36), bovenste plaatsing van de capsuleknop voor pagina-onderdelen (MaquetteAnkerRail / .mq-anker-onderbalk) tussen de menuknop (☰) en de zoekknop (🔍) op alle subdomeinen, zuivere afgeronde hoeken van het bovenste bericht in de berichtenlijst zonder witte driehoekjes en een enkele linkerstreep op ongelezen berichten, compacte enkelregelige meldingscapsule van de technische ruimte .rw-dok-melding met kroniekopslag, uitdoving na 4 s en laag onder het zijmenu, compact venster «Toegang bevestigen» (19/19), normalisatie van meerkolomstabellen in HTML-berichten op mobiel, afzenderbadges en classificatie van officiele domeinen (AFZENDER_REGELS_VERSIE = 4), onderscheid tussen gelezen en ongelezen berichten, enkele bijlageweergave «Compact paneel v2», capsuleknop voor e-mailonderdelen en adaptief zoekveld, achtergrondverzending met meldingsbox, behoud van e-mail/bijlagen zonder herladen, eenmalige cookietoestemming (32/32), stabiele ruimtewissel, alle 25 gereedheidspunten, taalzuivering in 285 bestanden en 16 bewakers. Uitvoerders: Claude Opus 5.5 (High) via Antigravity Google (p. 1–11, 13–19); Gemini 4 Carbon High van Google Antigravity (taalzuivering, p. 12, 20–25 en 20261127-103137); Gemini 4 Argon High van Google Antigravity (ronde knoppen en ververscapsule, bovenste onderdeelscapsule, hoeken berichtenlijst, meldingscapsule technische ruimte, bevestigingsvenster, meerkolomstabellen, afzendermarkering, gelezen/ongelezen berichten, enkele bijlageweergave v2, capsuleknop en zoekveld, verzending, behoud e-mail/bijlagen, cookietoestemming, ruimtewissel en verpakking)." \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-antigravity-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Перевірити UITROL-MANIFEST.json, ONTWIKKELARCHIEF.json, UITROL-BASIS та пофайлову попередню перевірку pakketVoorcontrole
        shell: bash
        run: |
          set -euo pipefail
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/UITROL-MANIFEST.json" > "$RUNNER_TEMP/manifest-in-archief.json"
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/ONTWIKKELARCHIEF.json" > "$RUNNER_TEMP/archief-in-archief.json"
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/UITROL-BASIS" > "$RUNNER_TEMP/basis-in-archief.txt"
          grep -q "^versie=${BASIS_VERSIE}$" "$RUNNER_TEMP/basis-in-archief.txt"
          grep -q "^commit=${BASIS_COMMIT}$" "$RUNNER_TEMP/basis-in-archief.txt"
          mkdir -p "$RUNNER_TEMP/geinstalleerd-boom" "$PWD/.tmp-controle"
          git archive "$BASIS_COMMIT" | tar -x -C "$RUNNER_TEMP/geinstalleerd-boom"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { valideerManifest } from './shared/uitrol-manifest.ts';
          import { leesOntwikkelArchief } from './shared/ontwikkelarchief.ts';
          const e = process.env;
          const { manifest, fouten } = valideerManifest(readFileSync(e.RUNNER_TEMP + '/manifest-in-archief.json', 'utf8'), e.VERSIE);
          if (fouten.length || !manifest) {
            for (const f of fouten) console.error('::error::UITROL-MANIFEST.json · ' + (f.veld || '') + ': ' + (f.uk || JSON.stringify(f)));
            throw Error('Маніфест в архіві не проходить перевірку встановлювача.');
          }
          const aiModellen = manifest.deelnemers.filter((d) => d.soort === 'ai').map((d) => `${d.model?.id} (${d.platform})`);
          console.log('Учасники ШІ в UITROL-MANIFEST.json:', aiModellen.join(' · '));
          if (aiModellen.length < 3) throw Error('У маніфесті мають бути зазначені всі три моделі ШІ.');
          if (!manifest.bijdragen || manifest.bijdragen.length < 13) throw Error('У маніфесті мають бути присутні всі 13 записів внесків SITE-001.');
          const ar = leesOntwikkelArchief(readFileSync(e.RUNNER_TEMP + '/archief-in-archief.json', 'utf8'), e.VERSIE, e.GITHUB_SHA);
          if (ar.fouten.length || !ar.ref) {
            throw Error('ONTWIKKELARCHIEF.json в архіві не пройшов перевірку: ' + ar.fouten.join(', '));
          }
          console.log('UITROL-MANIFEST.json і ONTWIKKELARCHIEF.json в архіві: 0 помилок, усі три моделі та 13 записів bijdragen присутні');
          JS
          npx esbuild backend/uitrol-vereisten.ts --bundle --platform=node --format=esm --packages=external --outfile="$PWD/.tmp-controle/ver.mjs" --log-level=error
          npx esbuild src/platform/tar-lezen.ts --bundle --platform=node --format=esm --packages=external --outfile="$PWD/.tmp-controle/tar.mjs" --log-level=error
          npx esbuild src/uitrol/vereisten-client.ts --bundle --platform=node --format=esm --packages=external --outfile="$PWD/.tmp-controle/vc-client.mjs" --log-level=error
          node --input-type=module - "$PWD/.tmp-controle" "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "$BASIS_VERSIE" "$BASIS_COMMIT" <<'JS'
          import { readFileSync } from 'node:fs';
          const [dir, pakketPad, basisVersie, basisCommit] = process.argv.slice(2);
          const { leesPakket } = await import(dir + '/tar.mjs');
          const { archiefBeschrijving } = await import(dir + '/vc-client.mjs');
          const { vereistenBeoordelen } = await import(dir + '/ver.mjs');
          const buf = readFileSync(pakketPad);
          const { info, sha256 } = await leesPakket(new Blob([buf]));
          if (info.problemen.length || !info.basis || info.basis.versie !== basisVersie || info.basis.commit !== basisCommit) {
            throw Error('Оглядачева перевірка виявила невідповідність: ' + JSON.stringify({ problemen: info.problemen, basis: info.basis }));
          }
          const besch = archiefBeschrijving(info, { name: pakketPad.split('/').pop(), size: buf.length }, 50);
          const ant = await vereistenBeoordelen({ ...besch, sha256, ontwikkelArchief: info.ontwikkelArchief }, {
            actief: () => ({ versie: basisVersie, commit: basisCommit }),
            toegepast: async () => new Set(info.migraties.map((m) => m.naam)),
            pg: async () => ({ tekst: '18.6', melding: null }),
            lopendeInstallatie: async () => false,
            vrijeSchijf: async () => 30 * 1024 ** 3,
            rootLeeftijdSec: async () => 15,
            passkeyKlaar: async () => true,
            proefBeschikbaar: async () => true,
            archiefOnline: async () => ({ ok: true, code: 'OK', reden: '' }),
          });
          console.log('Перевірка «Обрати файл» проти встановленої версії:', { ok: ant.ok, fouten: ant.vereisten.filter((x) => x.niveau === 'fout').map((x) => x.id) });
          if (!ant.ok) throw Error('Перевірка вимог заблокувала архів.');
          JS
          npx esbuild backend/uitrol-voorcontrole.ts --bundle --platform=node --format=esm --packages=external --outfile="$PWD/.tmp-controle/voorcontrole.mjs" --log-level=warning
          cat > "$PWD/.tmp-controle/voorcontrole-draai.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const [mod, pakket, versie, actief, geinstalleerdPad, dossierPad] = process.argv.slice(2);
          const { pakketVoorcontrole } = await import(mod);
          const dossier = JSON.parse(readFileSync(dossierPad, 'utf8'));
          const { resultaat, meta } = await pakketVoorcontrole(pakket, {
            versie,
            actieveVersie: actief,
            geinstalleerd: geinstalleerdPad,
            archiefControle: async () => ({
              ok: true,
              code: 'OK',
              reden: 'offline vooraf · онлайн-перевірка після публікації',
              risicoUitleg: dossier.risicoUitleg ?? []
            })
          });
          for (const c of resultaat.controles) console.log(`${c.niveau.padEnd(12)} ${c.id}: ${c.uk}${c.details?.length ? ' — ' + c.details.slice(0, 6).join('; ') : ''}`);
          console.log(`fouten=${resultaat.fouten} waarschuwingen=${resultaat.waarschuwingen} commit=${meta.commit} agent=${meta.agent}`);
          if (!resultaat.ok || resultaat.fouten) process.exit(1);
          JS
          node "$PWD/.tmp-controle/voorcontrole-draai.mjs" "$PWD/.tmp-controle/voorcontrole.mjs" "$PWD/uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "$VERSIE" "$BASIS_VERSIE" "$RUNNER_TEMP/geinstalleerd-boom" "$PWD/orchestratie/ontwikkelarchieven/SITE-001.json"
          rm -rf "$PWD/.tmp-controle"
      - name: Передати перевірені пакунки завданню оприлюднення · overdracht aan de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overdracht/uitvoer"
          cp -R uitvoer/. "$RUNNER_TEMP/overdracht/uitvoer/"
          cp "$RUNNER_TEMP/opis.md" "$RUNNER_TEMP/overdracht/opis.md"
          cp "$RUNNER_TEMP/archief-in-archief.json" "$RUNNER_TEMP/overdracht/ONTWIKKELARCHIEF.json"
          printf '%s\n' "$VERSIE" > "$RUNNER_TEMP/overdracht/VERSIE"
          printf '%s\n%s\n' "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/overdracht/BASIS"
      - name: Зберегти пакунки для завдання оприлюднення · artefact voor de publicatietaak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-001-overdracht
          path: ${{ runner.temp }}/overdracht/
          if-no-files-found: error
          retention-days: 7
  uitgave:
    name: Оприлюднення перевірених пакунків · publicatie van de gecontroleerde pakketten
    needs: controle-en-uitgave
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Отримати перевірені пакунки · gecontroleerde pakketten ophalen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-001-overdracht
          path: ${{ runner.temp }}/overdracht
      - name: Відновити пакунки й звірити контрольну суму
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(tr -d '\r\n' < "$RUNNER_TEMP/overdracht/VERSIE")"
          VERTROUWD=" ${BEKENDE_BASISSEN:-} "
          BASIS_VERSIE="$(sed -n 1p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          BASIS_COMMIT="$(sed -n 2p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          [[ "$VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Неправильні метадані випуску.' >&2; exit 1; }
          case "$VERTROUWD" in *" ${BASIS_VERSIE}=${BASIS_COMMIT} "*) ;; *) echo 'Основа поза довіреним переліком.' >&2; exit 1 ;; esac
          { echo "VERSIE=$VERSIE"; echo "BASIS_VERSIE=$BASIS_VERSIE"; echo "BASIS_COMMIT=$BASIS_COMMIT"; } >> "$GITHUB_ENV"
          mkdir -p uitvoer
          cp -R "$RUNNER_TEMP/overdracht/uitvoer/." uitvoer/
          cp "$RUNNER_TEMP/overdracht/opis.md" "$RUNNER_TEMP/opis.md"
          sha256sum --check "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Упевнитися, що такого випуску ще немає
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск із таким позначенням уже існує.' >&2
            exit 1
          fi
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/pered-vypuskom.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const bekend = new Map((process.env.BEKENDE_BASISSEN || '').trim().split(/\s+/).map((p) => p.split('=')));
          const code = process.env.HTTP_CODE || '000';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
            const liveVersie = v.versie;
            const liveCommit = v.bronCommit || v.commit;
            if (bekend.get(liveVersie) !== liveCommit) {
              throw Error(`Робочий сервер оновився під час перевірок (${liveVersie} @ ${liveCommit}). Оприлюднення зупинено.`);
            }
            console.log(`Повторна звірка /api/version: ${liveVersie} @ ${liveCommit} (у довіреному переліку; UITROL-BASIS=${process.env.BASIS_VERSIE})`);
          } else if (!['000', '403', '429', '502', '504', '522', '524', '530'].includes(code)) {
            throw Error(`Неочікувана відповідь під час повторної звірки сервера: HTTP ${code}`);
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-antigravity-overdracht.zip" \
            --target "$GITHUB_SHA" --title "SITE-001 · Випуск готовності сайту «Мій простір» за всіма 25 пунктами, мовного очищення та 16 сторожів · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || (archief.digest && archief.digest !== 'sha256:' + som)) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Перевірка TRACE-001 самим сценарієм встановлювача після публікації
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'sudo rm -rf /etc/mijn-ruimte' EXIT
          sudo install -d -m 0700 -o root -g root /etc/mijn-ruimte
          printf '%s\n' "$GH_TOKEN" | sudo tee /etc/mijn-ruimte/github-token >/dev/null
          sudo chown root:root /etc/mijn-ruimte/github-token
          sudo chmod 0600 /etc/mijn-ruimte/github-token
          mkdir -p "$RUNNER_TEMP/download"
          gh release download "$VERSIE" --repo "$GITHUB_REPOSITORY" --pattern "mijn-ruimte-${VERSIE}.tar.gz" --dir "$RUNNER_TEMP/download"
          cmp "$RUNNER_TEMP/download/mijn-ruimte-${VERSIE}.tar.gz" "uitvoer/mijn-ruimte-${VERSIE}.tar.gz"
          awk 'f && /^PY$/ {exit} f {print} /^  ARCHIEF_UITKOMST=.*<<.PY./ {f=1}' deploy/uitrol/mijn-ruimte-uitrol.sh > "$RUNNER_TEMP/root-trace.py"
          grep -q "releases/tags/{versie}" "$RUNNER_TEMP/root-trace.py"
          UITKOMST="$(sudo timeout 55 python3 "$RUNNER_TEMP/root-trace.py" "$RUNNER_TEMP/overdracht/ONTWIKKELARCHIEF.json" "$GITHUB_SHA" "$VERSIE" "$RUNNER_TEMP/download/mijn-ruimte-${VERSIE}.tar.gz")"
          echo "root TRACE-001: $UITKOMST"
          test "$UITKOMST" = "OK"
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
