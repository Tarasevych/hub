name: MAILBG-001 · узгоджений випуск живого тла пошти

# Ніколи не встановлює пакет. Перед оприлюдненням звіряє сервер, джерело й контрольну суму.
# Installeert niets. De huidige installatie, herkomst en controlesom worden vooraf gecontroleerd.
on:
  push:
    branches:
      - 'release/mailbg-001-samenvoegen-20261109-215500'
    paths:
      - '.github/workflows/mailbg-001-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/MAILBG-001.json'
      - 'src/CanoniekOmlijsting.tsx'
      - 'src/mail/MailAchtergrond.tsx'

permissions:
  contents: write

concurrency:
  group: mailbg-001-uitgave
  cancel-in-progress: true

env:
  TAAK: MAILBG-001
  BASIS_VERSIE: '20261109-165754'
  BASIS_COMMIT: '2905262640ea379abaf14caa879b6acee3f4b6eb'
  MODEL_ID: 'gpt-6'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Джерела
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Відновити назву гілки
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити справжню встановлену основу
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://mail.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error('Встановлена версія змінилася. Випуск зупинено, потрібне нове узгодження.');
          }
          JS
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor 6ebc0e5ffae1bdeeef12ffd2f2fca3caf54f618a HEAD
      - name: Перевірити правила та походження
        run: |
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief
      - name: Перевірити пошту й способи входу
        run: |
          node scripts/eenheidstests.mjs mail-achtergrond-001.test.ts
          node scripts/eenheidstests.mjs mail-orbit-001
          node scripts/eenheidstests.mjs apparaat-bevestiging-20261109.test.ts
          node scripts/eenheidstests.mjs telegram-aanmelden-20261109.test.ts
          node scripts/eenheidstests.mjs aanmeld-plaatsing-20261109.test.ts
      - name: Перевірити типи та скласти застосунок
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Перевірити міграції та двопристроєвий вхід
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node scripts/eenheidstests.mjs apparaat-bevestiging-stroom-20261109.test.ts
      - name: Упевнитися, що перевірки не змінили джерел
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Створити опис випуску
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Рухоме тло пошти зі збільшувальною лінзою',
            samenvatting: 'Спільне рухоме тло входу до пошти та сторінки облікових записів. Права кнопка перемикає збільшення, а панель налаштувань дає змогу обрати вигляд, рух, густину та кольори. У випуск включено всі зміни, що вже працювали на сервері.',
            wijzigingen: ['Три способи оформлення тла: малі емблеми служб, кольорові крапки й м’яке сяйво.', 'Збільшення правою кнопкою миші поза кнопками й полями.', 'Збереження вибору користувача та зменшення навантаження на смартфонах.', 'Збережено підтвердження входу з іншого пристрою, Telegram і перевірки встановлення.'],
            fixes: ['Усунуто конфлікт у CanoniekOmlijsting.tsx зі збереженням обох можливостей.'],
            beperkingen: ['Не завершено перевірку на фізичному смартфоні з дотиковим керуванням.', 'Встановлення потребує окремого підтвердження власника.'],
            instructies: 'Після оприлюднення завантажити архів через сторінку керування оновленнями та підтвердити встановлення ключем доступу.'
          };
          const nl = {
            titel: 'Bewegende e-mailachtergrond met vergrootlens',
            samenvatting: 'Eén bewegende achtergrond voor aanmelden bij e-mail en voor de accountpagina. Rechtermuisklik schakelt de vergrootlens in en uit; in de instellingen kiest de gebruiker de stijl, beweging, dichtheid en kleuren. Alle reeds geïnstalleerde wijzigingen blijven behouden.',
            wijzigingen: ['Drie achtergronden: kleine dienstemblemen, gekleurde punten en zachte gloed.', 'Vergrootlens via rechtermuisklik buiten knoppen en invoervelden.', 'Bewaren van voorkeuren en beperkte belasting op telefoons.', 'Bevestiging vanaf een ander apparaat, Telegram en installatiecontroles blijven behouden.'],
            fixes: ['Het samenvoegconflict in CanoniekOmlijsting.tsx is met behoud van beide functies opgelost.'],
            beperkingen: ['Niet op een fysieke telefoon met aanraakbediening gecontroleerd.', 'Installatie vereist een afzonderlijke toestemming van de eigenaar.'],
            instructies: 'Na publicatie het archief via het beheer van updates aanbieden en de installatie met de toegangssleutel bevestigen.'
          };
          const m = {
            schema: 1, versie: e.VERSIE, aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur, zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              { soort: 'ai', naam: 'codex', platform: 'ChatGPT', tool: 'Codex', model: { id: e.MODEL_ID, versie: null, bron: 'omgeving' }, rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken'] }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          const tests = {
            geslaagd: 80, mislukt: 0, falend: [],
            uitleg: {
              uk: 'Щонайменше 13 перевірок тла, 52 перевірки входу з іншого пристрою та 15 перевірок наявного поштового вибору. Також перевірено типи, складання, правила, повторні міграції й двопристроєвий перебіг на випробувальній базі.',
              nl: 'Minstens 13 achtergrondcontroles, 52 controles voor bevestiging vanaf een ander apparaat en 15 controles van de bestaande e-mailkeuze. Ook typen, bouw, regels, herhaalde migraties en de stroom op een proefdatabank zijn gecontroleerd.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie: e.BASIS_VERSIE, bronCommit: e.BASIS_COMMIT, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
          JS
      - name: Створити та перевірити архіви
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent codex --platform ChatGPT --model-id "$MODEL_ID" \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk 'Живе тло входу до пошти й облікових записів: лінза, налаштування та збереження встановлених можливостей.' \
            --samenvatting-nl 'Bewegende achtergrond voor aanmelden en e-mailaccounts, met vergrootlens, instellingen en behoud van geïnstalleerde functies.' \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-codex-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
          printf 'MAILBG-001 · Живе тло пошти з лінзою та налаштуваннями, зі збереженням установлених можливостей. Встановлення лише після окремого підтвердження.\nФіксація змін: %s\nОснова: %s @ %s\n' "$GITHUB_SHA" "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/opis.md"
      - name: Знову звірити робочий сайт
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://mail.tarasevych.com/api/version' > "$RUNNER_TEMP/pered-vypuskom.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error('Робочий сайт оновився під час перевірок. Випуск зупинено.');
          }
          JS
      - name: Оприлюднити випуск без встановлення
        id: publicatie
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-codex-overdracht.zip" \
            --target "$GITHUB_SHA" --title "MAILBG-001 · живе тло пошти · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати непридатний випуск
        if: failure() && steps.publicatie.outcome == 'success'
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
      - name: Зберегти результати перевірок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailbg-001-controle
          path: uitvoer/
          if-no-files-found: ignore
