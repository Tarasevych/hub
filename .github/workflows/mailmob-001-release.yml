name: MAILMOB-001 · mobile mail and 12h Passkey release
on:
  push:
    branches:
      - feature/mailmob-001-20261104-073200
permissions:
  contents: read
concurrency:
  group: mailmob-001-release
  cancel-in-progress: false
jobs:
  test-build-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Register exactly our task through canonical ORCH
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          if ! test -f orchestratie/taken/MAILMOB-001.json; then
            node scripts/orch.mjs taak-start --id MAILMOB-001 --agent codex \
              --basis b20a5b25cb7b640dd636c86bce7ed139a8225fbd \
              --tak feature/mailmob-001-20261104-073200 \
              --omschrijving 'Мобільна пошта та діагностика 12-годинного Passkey'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add orchestratie/taken/MAILMOB-001.json
          fi
      - name: Register exactly our task through canonical ORCH — lokaal vastleggen (zonder sleutel; push in de publicatietaak) · локальна фіксація (без ключа)
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): alleen lokaal vastleggen; de publicatietaak controleert en pusht deze commit.
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -m 'MAILMOB-001: registreer taak met orch [skip ci]'
          fi
      - name: Register exactly our task through canonical ORCH — controle na het vastleggen · перевірка після фіксації
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak MAILMOB-001 --fase start
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate canonical button index if affected
        shell: bash
        run: |
          set -euo pipefail
          node scripts/zoek-ui-catalogus.mjs
          if ! git diff --quiet -- shared/zoek-ui-knoppen.generated.ts; then
            git add shared/zoek-ui-knoppen.generated.ts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Regenerate canonical button index if affected — lokaal vastleggen (zonder sleutel; push in de publicatietaak) · локальна фіксація (без ключа)
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): alleen lokaal vastleggen; de publicatietaak controleert en pusht deze commit.
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -m 'MAILMOB-001: update canonieke UI-catalogus [skip ci]'
          fi
      - name: Verify tests, TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uitvoer
          node scripts/eenheidstests.mjs mailmob-001 | tee uitvoer/mailmob-001-tests.log
          node scripts/eenheidstests.mjs mail-orbit-001 | tee -a uitvoer/mailmob-001-tests.log
          node scripts/eenheidstests.mjs stap-op-onthouden-20261020 | tee uitvoer/mailmob-001-database.log
          npx tsc --noEmit -p tsconfig.json
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=5120 npm run build
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak MAILMOB-001 --fase overdracht
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Commit verified evidence to development journal
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const pad='orchestratie/ontwikkelarchieven/MAILMOB-001.json';
          const j=JSON.parse(readFileSync(pad,'utf8'));
          const txt=readFileSync('uitvoer/mailmob-001-tests.log','utf8');
          const geslaagd=(txt.match(/^OK\s/gm)||[]).length;
          const mislukt=(txt.match(/^FOUT\s/gm)||[]).length;
          if(geslaagd<15||mislukt)throw Error('MAILMOB-001 unit results missing or failed');
          j.controles.push({status:'bevestigd',
            resultaat:'CI: '+geslaagd+'/'+geslaagd+' controlepunten in MAILMOB-001 + MAILORBIT-001; TypeScript client en server plus build geslaagd. Database-test draait alleen indien DATABASE_URL aanwezig.',
            bewijzen:['https://github.com/Tarasevych/hub/actions/runs/'+process.env.GITHUB_RUN_ID]});
          j.tijdlijn.push({volgorde:Math.max(0,...j.tijdlijn.map((x)=>Number(x.volgorde)||0))+1,stap:'GitHub CI перевірив контроль ORCH, unit-тести UI та Passkey, TypeScript і production build; фактичні результати внесені у комічений журнал.',bewijzen:['https://github.com/Tarasevych/hub/actions/runs/'+process.env.GITHUB_RUN_ID]});
          writeFileSync(pad,JSON.stringify(j,null,2)+'\n');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestratie/ontwikkelarchieven/MAILMOB-001.json
      - name: Commit verified evidence to development journal — lokaal vastleggen (zonder sleutel; push in de publicatietaak) · локальна фіксація (без ключа)
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): alleen lokaal vastleggen; de publicatietaak controleert en pusht deze commit.
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -m 'MAILMOB-001: leg gevalideerde CI-bewijzen vast [skip ci]'
          fi
      - name: Commit verified evidence to development journal — controle na het vastleggen · перевірка після фіксації
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak MAILMOB-001 --fase overdracht
      - name: Verify currently installed base before packaging (read-only)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 --retry 2 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/mijn-ruimte-production.json"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const actual=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/mijn-ruimte-production.json','utf8'));
          const commit='a643431743eb1e7e64947bf747018aac55d69750';
          const versie='20261103-211554';
          if(actual.commit!==commit||actual.versie!==versie){
            console.error('BASIS_VEROUDERD: live installation moved; stop, rebase and update the verified base', {versie:actual.versie,commit:String(actual.commit||'').slice(0,12)});
            process.exit(1);
          }
          // Temporary CI-only installed-state proof, never committed or pushed; orch pakket uses it as UITROL-BASIS.
          writeFileSync('orchestratie/geinstalleerd.json',JSON.stringify({versie,bronCommit:commit,bron:'geverifieerd_productie_api'},null,2)+'\n');
          console.log('Installed basis independently confirmed:',versie,commit.slice(0,12));
          JS
      - name: Prepare verified bilingual manifest and test results
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const versie=process.env.RELEASE_VERSION;
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const texts={
            uk:{titel:'Мобільна пошта та перевірене Passkey-запам’ятовування',
              samenvatting:'Жива орбіта конвертів, адаптивні кнопки й вікна підключення на телефоні та узгоджене із сервером 12-годинне підтвердження.',
              wijzigingen:['Живий мобільний вибір сервісів на справжній орбіті з доступними кнопками','Нижня панель реального OAuth/IMAP підключення й компактний Passkey-діалог','Єдина таблиця маршрутів Step-up на клієнті та сервері'],
              fixes:['Кнопка «Не питати знову» не з’являється для заборонених або невідомих дій','За незбережених 12 годин користувач отримує видиме попередження'],
              beperkingen:['Незавершені поштові сервіси не рекламуються як доступні','Реальний Google/Microsoft OAuth і фізичний Passkey в CI не перевірялися'],
              instructies:'Перевірте на Android браузері. Встановлення тільки за окремим Passkey-рішенням власника.'},
            nl:{titel:'Mobiele e-mail en eerlijk Passkey-onthouden',
              samenvatting:'Levende mobiele e-mailbaan met aanraakbare dienstknoppen en echte koppelvensters, plus een serverconsistent 12-uurs-step-upbeleid.',
              wijzigingen:['Levende mobiele envelopbaan en aanraakbare dienstknoppen','Onderpaneel voor echte OAuth/IMAP-koppeling en compact Passkey-venster','Eén routebeleid voor browser en server'],
              fixes:['Geen misleidend twaalfuurs-vinkje voor onbekende of verboden acties','Zichtbare waarschuwing als het bewaren voor twaalf uur niet lukt'],
              beperkingen:['Niet-afgeronde maildiensten krijgen geen valse koppelknoop','Echte Google/Microsoft OAuth en fysieke Passkey niet in CI getest'],
              instructies:'Controleer eerst de Android-ervaring. Installeren alleen met een aparte Passkey-beslissing van de eigenaar.'}
          };
          const manifest={schema:1,versie,aangemaakt:new Date().toISOString(),
            herkomst:'git: feature/mailmob-001-20261104-073200@'+sha+' (basis 20261103-211554 a643431743eb1e7e64947bf747018aac55d69750)',
            auteur:'eigenaar',zonderAi:false,
            deelnemers:[{soort:'mens',naam:'eigenaar',rollen:['auteur','controle']},
              {soort:'ai',naam:'ChatGPT',platform:'ChatGPT/Codex',tool:'GitHub connector en GitHub Actions',
                model:{id:'gpt-6',versie:null,bron:'omgeving'},rollen:['ontwikkeling','testen','verpakken']}],
            beschrijving:texts};
          writeFileSync('uitvoer/MAILMOB-001-UITROL-MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');
          const log=readFileSync('uitvoer/mailmob-001-tests.log','utf8');
          const geslaagd=(log.match(/^OK\s/gm)||[]).length,mislukt=(log.match(/^FOUT\s/gm)||[]).length;
          if(geslaagd<15||mislukt)throw Error('Missing / failing test checks');
          const dbLog=readFileSync('uitvoer/mailmob-001-database.log','utf8');
          const dbOvergeslagen=dbLog.includes('OVERGESLAGEN');
          const result={geslaagd,mislukt,falend:[],uitleg:{
            uk:geslaagd+' одиничних перевірок MAILMOB і MAILORBIT успішні, TypeScript та збірка у CI. '+(dbOvergeslagen?'Регресійна база даних у CI відсутня — тест із БД пропущений.':'Перевірка бази даних виконувалась.'),
            nl:geslaagd+' MAILMOB- en MAILORBIT-controles geslaagd, plus TypeScript en build. '+(dbOvergeslagen?'Databasetest overgeslagen in CI: geen testdatabase.':'Databasetest uitgevoerd.')}};
          writeFileSync('uitvoer/MAILMOB-001-TESTRESULTATEN.json',JSON.stringify(result,null,2)+'\n');
          JS
      - name: Create ORCH package and verify its contents
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket \
            --taak MAILMOB-001 --auteur 'eigenaar' --agent codex \
            --versie "$RELEASE_VERSION" \
            --manifest "$PWD/uitvoer/MAILMOB-001-UITROL-MANIFEST.json" \
            --testresultaten "$PWD/uitvoer/MAILMOB-001-TESTRESULTATEN.json" \
            --samenvatting-uk 'Мобільна орбіта пошти, доступні OAuth/IMAP вікна та безпечне 12-годинне Passkey.' \
            --samenvatting-nl 'Mobiele e-mailbaan, echte OAuth/IMAP-vensters en veilige Passkey-bevestiging.' \
            --uit uitvoer
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-$RELEASE_VERSION-codex-overdracht.zip"
          tar --gzip --list --file "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" | grep 'ONTWIKKELARCHIEF.json'
          (cd uitvoer && sha256sum "mijn-ruimte-$RELEASE_VERSION.tar.gz" > "mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256")
          (cd uitvoer && sha256sum -c "mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256")
          echo "RELEASE_SHA=$(sha256sum "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Keep verified handover for download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mijn-ruimte-mailmob-001-unsigned
          path: |
            uitvoer/mijn-ruimte-*.tar.gz
            uitvoer/mijn-ruimte-*.tar.gz.sha256
            uitvoer/mijn-ruimte-*.voorstel.json
            uitvoer/mijn-ruimte-*-overdracht.zip
            uitvoer/MAILMOB-001-UITROL-MANIFEST.json
            uitvoer/MAILMOB-001-TESTRESULTATEN.json
            uitvoer/mailmob-001-tests.log
          if-no-files-found: error
          retention-days: 30
      - name: End-of-run summary
        shell: bash
        run: |
          echo "Task MAILMOB-001 · version $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Source $RELEASE_COMMIT · SHA256 $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned GitHub prerelease only: no production changes, no merging." >> "$GITHUB_STEP_SUMMARY"
      - name: Дані для задачі публікації · gegevens voor de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): deze taak heeft geen schrijfrecht. Wat gepubliceerd moet worden, gaat als artefact naar de publicatietaak:
          # de lokale commits (git-bundel bovenop GITHUB_SHA), de verwachte HEAD, de pakketgegevens en de pakketbestanden.
          # Ця задача не має права запису: зміни й пакет передаються артефактом задачі публікації, яка все перевіряє сама.
          P="$RUNNER_TEMP/publicatie"
          mkdir -p "$P/uitvoer"
          git rev-parse HEAD > "$P/HEAD"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git -c core.hooksPath=/dev/null bundle create "$P/wijzigingen.bundle" HEAD "^$GITHUB_SHA"
          fi
          : > "$P/vars"
          printf '%s=%s\n' RELEASE_VERSION "$RELEASE_VERSION" >> "$P/vars"
          cp uitvoer/mijn-ruimte-"$RELEASE_VERSION"* "$P/uitvoer/"
      - name: Передати дані задачі публікації · gegevens aan de publicatietaak doorgeven
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mailmob-001-release-publicatie
          path: ${{ runner.temp }}/publicatie/
          if-no-files-found: error
          retention-days: 7

  publicatie:
    name: Публікація лише з перевірених даних (git і gh, з ключем) · publicatie uit gecontroleerde gegevens (git en gh, met sleutel)
    needs: test-build-prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Вихідна фіксація без збереженого ключа · broncommit zonder bewaarde sleutel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Дані із задачі складання · gegevens uit de bouwtaak
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mailmob-001-release-publicatie
          path: ${{ runner.temp }}/publicatie
      - name: Перевірити передані дані · overgedragen gegevens controleren
        shell: bash
        run: |
          set -euo pipefail
          # SEC-002 (g01-7): de bouwtaak draaide npm, tests en eigen scripts — wat ze doorgeeft is NIET vertrouwd. Alleen aanvaarden:
          #  - commits bovenop GITHUB_SHA, zonder samenvoegingen, die uitsluitend de verwachte bestanden wijzigen (gewone bestanden);
          #  - pakketgegevens met een vaste vorm; de SHA-256 wordt hier opnieuw berekend.
          # Приймаються лише очікувані файли поверх GITHUB_SHA і дані випуску суворого вигляду; SHA-256 обчислюється тут заново.
          P="$RUNNER_TEMP/publicatie"
          TOEGESTAAN='orchestratie/taken/MAILMOB-001.json shared/zoek-ui-knoppen.generated.ts orchestratie/ontwikkelarchieven/MAILMOB-001.json'
          DOEL="$GITHUB_SHA"
          if [ -e "$P/wijzigingen.bundle" ]; then
            test -n "$TOEGESTAAN" || { echo 'Задача складання передала зміни, хоча цей процес їх не очікує — зупинено. · Onverwachte commits van de bouwtaak — gestopt.' >&2; exit 1; }
            git -c core.hooksPath=/dev/null fetch --quiet --no-tags "$P/wijzigingen.bundle" "+HEAD:refs/sec002/publicatie"
            DOEL="$(git rev-parse --verify 'refs/sec002/publicatie^{commit}')"
            git merge-base --is-ancestor "$GITHUB_SHA" "$DOEL" || { echo 'Зміни не лежать поверх GITHUB_SHA — зупинено. · De commits liggen niet bovenop GITHUB_SHA — gestopt.' >&2; exit 1; }
            test -z "$(git rev-list --merges "$GITHUB_SHA..$DOEL")" || { echo 'Злиття в переданих змінах — зупинено. · Samenvoeging in de overgedragen commits — gestopt.' >&2; exit 1; }
            git diff --name-only --no-renames -z "$GITHUB_SHA" "$DOEL" | while IFS= read -r -d '' PAD; do
              case " $TOEGESTAAN " in *" $PAD "*) ;; *) echo "Неочікуваний файл у переданих змінах · onverwacht bestand in de overgedragen commits: $PAD" >&2; exit 1 ;; esac
              MODUS="$(git ls-tree "$DOEL" -- "$PAD" | cut -d' ' -f1)"
              [ -z "$MODUS" ] || [ "$MODUS" = 100644 ] || { echo "Не звичайний файл · geen gewoon bestand: $PAD ($MODUS)" >&2; exit 1; }
            done
          fi
          [ "$(tr -d '\r\n' < "$P/HEAD")" = "$DOEL" ] || { echo 'Передана HEAD не збігається зі змінами — зупинено. · De overgedragen HEAD klopt niet — gestopt.' >&2; exit 1; }
          echo "RELEASE_COMMIT=$DOEL" >> "$GITHUB_ENV"
          V=''
          while IFS='=' read -r SLEUTEL WAARDE; do
            [ -n "$SLEUTEL" ] || continue
            case "$SLEUTEL" in
              RELEASE_VERSION|VERSIE|UITGAVE_VERSIE|LIVE_VERSIE) [[ "$WAARDE" =~ ^[0-9]{8}-[0-9]{6}$ ]] ;;
              LIVE_COMMIT) [[ "$WAARDE" =~ ^[0-9a-f]{40}$ ]] ;;
              *) false ;;
            esac || { echo "Недійсні дані випуску · ongeldige pakketgegevens: $SLEUTEL" >&2; exit 1; }
            case "$SLEUTEL" in RELEASE_VERSION|VERSIE|UITGAVE_VERSIE) V="$WAARDE" ;; esac
            echo "$SLEUTEL=$WAARDE" >> "$GITHUB_ENV"
          done < "$P/vars"
          if [ -n "$V" ]; then
            mkdir -p uitvoer
            cp -R "$P/uitvoer/." uitvoer/
            RELEASE_SHA="$(sha256sum "uitvoer/mijn-ruimte-$V.tar.gz" | cut -d' ' -f1)"
            if [ -f "uitvoer/mijn-ruimte-$V.tar.gz.sha256" ]; then
              [ "$(cut -d' ' -f1 < "uitvoer/mijn-ruimte-$V.tar.gz.sha256")" = "$RELEASE_SHA" ] || { echo 'Контрольна сума архіву не збігається — зупинено. · Controlesom van het archief klopt niet — gestopt.' >&2; exit 1; }
            fi
            echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Відправити перевірені зміни гілки (лише git, з ключем) · gecontroleerde wijzigingen pushen (alleen git, met sleutel)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RELEASE_COMMIT:refs/heads/feature/mailmob-001-20261104-073200"
          fi
      - name: Publish immutable unsigned GitHub prerelease without deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-$RELEASE_VERSION-codex-overdracht.zip" \
            --target "$RELEASE_COMMIT" --prerelease --latest=false \
            --title "MAILMOB-001 · $RELEASE_VERSION (unsigned)" \
            --notes "MOBILEMAIL + Passkey remember: verified in GitHub Actions. Source: $RELEASE_COMMIT. Installed basis: 20261103-211554 / a643431743eb1e7e64947bf747018aac55d69750. SHA-256: $RELEASE_SHA. The owner must separately approve integration and Passkey installation."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq '.assets[] | select(.name | endswith(".tar.gz")) | .digest' > "$RUNNER_TEMP/github-asset-digest.txt"
          test "$(cat "$RUNNER_TEMP/github-asset-digest.txt")" = "sha256:$RELEASE_SHA"
