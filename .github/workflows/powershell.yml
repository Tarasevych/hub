# Статичний аналіз сценаріїв PowerShell (*.ps1) за допомогою PSScriptAnalyzer.

name: PSScriptAnalyzer

on:
  push:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]
  pull_request:
    branches: [ "voornaamst", "integratie", "feature/consolidatie-*" ]
  schedule:
    - cron: '32 18 * * 1'

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код сховища
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Запустити PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .\
          recurse: true
          includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText"'
          output: results.sarif

      - name: Передати звіт SARIF до GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
