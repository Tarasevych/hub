            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          const logTekst = readFileSync(e.RUNNER_TEMP + '/eenheidstests.log', 'utf8');
          const gemeten = { geslaagd: 0, mislukt: 0 };
          const perTest = new Map();
          for (const r of logTekst.matchAll(/^(\d+)\/(\d+) geslaagd \(([^\n]+)\)$/gm)) {
            perTest.set(r[3], [Number(r[1]), Number(r[2])]);
          }
          for (const r of logTekst.matchAll(/^([a-zA-Z0-9_-]+):\s+(\d+)\/(\d+) geslaagd/gm)) {
            perTest.set(r[1], [Number(r[2]), Number(r[3])]);
          }
          const nodeOk = (logTekst.match(/^✔ /gm) || []).length;
          if (nodeOk > 0) perTest.set('verbindingen-centrum-20261029', [nodeOk, nodeOk]);
          for (const [g, n] of perTest.values()) {
            gemeten.geslaagd += g;
            gemeten.mislukt += n - g;
          }
          const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + ' ' + g + '/' + n).join('; ');
          if (!gemeten.geslaagd || gemeten.mislukt) {
            throw Error(`Немає виміряних результатів випробувань або є невдалі перевірки (${gemeten.geslaagd}/${gemeten.mislukt}) — випуск зупинено.`);
          }
          const tests = {
            geslaagd: gemeten.geslaagd,
            mislukt: gemeten.mislukt,
            falend: [],
            uitleg: {
              uk: 'Успішно пройдено правила координації, свіжість основи та перевірку походження TRACE-001, статичні перевірки карти файлів, довідок, пошукового каталогу, сценаріїв і розміщення, самоперевірку ПК-агента, перевірку типів клієнта та сервера, повне виробниче складання, подвійний прогін усіх міграцій на чистій базі PostgreSQL 16 та 101 модульне випробування (81 безбазове включно з maquette-mobiel-prestatie, menu-snelheid і vast-kader + TRACE-001 + 19 БД-тестів). Виміряно в цьому запуску: ' + gemetenLijst + '.',
              nl: 'Geslaagd: coördinatieregels, versheid van de basis en herkomstcontrole TRACE-001, statische controles van bestandskaart, hulpteksten, zoekcatalogus, scripts en plaatsing, pc-agent zelftest, typecontrole van client en server, volledige productiebouw, dubbele uitvoering van alle migraties op PostgreSQL 16 en 101 eenheidstests (81 zonder DB inclusief maquette-mobiel-prestatie, menu-snelheid en vast-kader + TRACE-001 + 19 databasetests). Gemeten in deze uitvoering: ' + gemetenLijst + '.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          const opis = [
            `GEMINI-003 · Швидкодія режиму «Макет» на смартфонах, усунення падіння пошти та миттєві переходи між піддоменами · ${e.VERSIE}`,
            '',
            uk.samenvatting,
            '',
            ...uk.wijzigingen.map((x) => `- ${x}`),
            '',
            'Виправлення та замір у Chromium (390×844, DPR=3):',
            ...uk.fixes.map((x) => `- ${x}`),
            '',
            uk.instructies,
            '',
            '---',
            '',
            nl.samenvatting,
            '',
            nl.instructies,
            '',
            `Фіксація змін: ${e.GITHUB_SHA}`,
            `Інтеграційна основа: ${e.INTEGRATIE_BASIS}`,
            `Встановлена основа сервера: ${e.BASIS_VERSIE} @ ${e.BASIS_COMMIT}`,
            ''
          ].join('\n');
          writeFileSync(e.RUNNER_TEMP + '/opis.md', opis);
          JS
      - name: Скласти та перевірити пакунки випуску й передачі
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent gemini --platform 'Google Antigravity' --tool 'Antigravity IDE' \
            --model-id "$MODEL_ID" --model-bron auteur \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk "Швидкодія режиму «Макет» на смартфонах, усунення падіння пошти та миттєві переходи між піддоменами (GEMINI-003) поверх встановленої основи 20261115-044530." \
            --samenvatting-nl "Mobiele snelheid van het Maquette-ontwerp, herstel van e-mailuitval en directe domeinovergangen (GEMINI-003) boven op basis 20261115-044530." \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Перевірити UITROL-MANIFEST.json і ONTWIKKELARCHIEF.json усередині архіву валідаторами інсталятора
        shell: bash
        run: |
          set -euo pipefail
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/UITROL-MANIFEST.json" > "$RUNNER_TEMP/manifest-in-archief.json"
          tar -xzOf "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" "mijn-ruimte-${VERSIE}/ONTWIKKELARCHIEF.json" > "$RUNNER_TEMP/archief-in-archief.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { valideerManifest } from './shared/uitrol-manifest.ts';
          import { leesOntwikkelArchief } from './shared/ontwikkelarchief.ts';
          const e = process.env;
          const ruw = readFileSync(e.RUNNER_TEMP + '/manifest-in-archief.json', 'utf8');
          const { manifest, fouten } = valideerManifest(ruw, e.VERSIE);
          if (fouten.length || !manifest) {
            for (const f of fouten) console.error('::error::UITROL-MANIFEST.json · ' + (f.veld || '') + ': ' + (f.uk || JSON.stringify(f)));
            throw Error('Маніфест в архіві не проходить перевірку інсталятора — випуск зупинено.');
          }
          if (!manifest.aangemaakt || !manifest.herkomst || manifest.herkomst.length < 5) throw Error('Немає aangemaakt/herkomst у маніфесті.');
          const ai = manifest.deelnemers.filter((d) => d.soort === 'ai');
          if (!ai.length || ai.some((d) => !d.model || !d.model.id)) throw Error('У маніфесті немає моделі ШІ.');
          const ar = leesOntwikkelArchief(readFileSync(e.RUNNER_TEMP + '/archief-in-archief.json', 'utf8'), e.VERSIE, e.GITHUB_SHA);
          if (ar.fouten.length || !ar.ref) {
            throw Error('ONTWIKKELARCHIEF.json в архіві не пройшов перевірку: ' + ar.fouten.join(', '));
          }
          console.log('UITROL-MANIFEST.json і ONTWIKKELARCHIEF.json в архіві: 0 помилок · модель ' + ai[0].model.id);
          JS
      - name: Передати перевірені пакунки завданню оприлюднення · overdracht aan de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overdracht/uitvoer"
          cp -R uitvoer/. "$RUNNER_TEMP/overdracht/uitvoer/"
          cp "$RUNNER_TEMP/opis.md" "$RUNNER_TEMP/overdracht/opis.md"
          printf '%s\n' "$VERSIE" > "$RUNNER_TEMP/overdracht/VERSIE"
          printf '%s\n%s\n' "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/overdracht/BASIS"
      - name: Зберегти пакунки для завдання оприлюднення · artefact voor de publicatietaak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-003-overdracht
          path: ${{ runner.temp }}/overdracht/
          if-no-files-found: error
          retention-days: 7
      - name: Зберегти пакунки перевірки у сховищі виконання
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-003-controle
          path: uitvoer/
          if-no-files-found: ignore
  uitgave:
    name: Оприлюднення перевірених пакунків · publicatie van de gecontroleerde pakketten
    needs: controle-en-uitgave
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Отримати перевірені пакунки · gecontroleerde pakketten ophalen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gemini-003-overdracht
          path: ${{ runner.temp }}/overdracht
      - name: Відновити пакунки й звірити контрольну суму · pakketten terugzetten en controlesom vergelijken
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(tr -d '\r\n' < "$RUNNER_TEMP/overdracht/VERSIE")"
          VERTROUWD=" ${TOEGESTANE_BASES:-} ${BEKENDE_BASISSEN:-} ${BASIS_VERSIE:+${BASIS_COMMIT:+${BASIS_VERSIE}=${BASIS_COMMIT}}} "
          BASIS_VERSIE="$(sed -n 1p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          BASIS_COMMIT="$(sed -n 2p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          [[ "$VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Передані дані випуску мають неправильний вигляд — оприлюднення зупинено.' >&2; exit 1; }
          case "$VERTROUWD" in *" ${BASIS_VERSIE}=${BASIS_COMMIT} "*) ;; *) echo 'Основа з артефакту складання не входить до довірених значень цього процесу — оприлюднення зупинено.' >&2; exit 1 ;; esac
          { echo "VERSIE=$VERSIE"; echo "BASIS_VERSIE=$BASIS_VERSIE"; echo "BASIS_COMMIT=$BASIS_COMMIT"; } >> "$GITHUB_ENV"
          mkdir -p uitvoer
          cp -R "$RUNNER_TEMP/overdracht/uitvoer/." uitvoer/
          cp "$RUNNER_TEMP/overdracht/opis.md" "$RUNNER_TEMP/opis.md"
          sha256sum --check "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Упевнитися, що такого випуску ще немає · deze uitgave mag nog niet bestaan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/pered-vypuskom.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const code = process.env.HTTP_CODE || '000';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
            if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
              throw Error('Робочий сервер оновився під час перевірок. Оприлюднення зупинено.');
            }
          } else if (code !== '530' && code !== '502' && code !== '504' && code !== '000') {
            throw Error(`Неочікувана відповідь під час повторної звірки сервера: HTTP ${code}`);
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip" \
            --target "$GITHUB_SHA" --title "GEMINI-003 · Швидкодія режиму «Макет» на смартфонах і усунення падіння пошти · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
