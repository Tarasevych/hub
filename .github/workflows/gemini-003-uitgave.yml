            ],
            fixes: [
              'Усунуто помилку TypeError: Cannot read properties of undefined (reading \'minimum\') у MailFunctioneelWeergave.tsx через безпечний початковий стан INITIAL_BOOTSTRAP та захищені звертання до notificationPreference і metrics.',
              'Зменшено затримки налаштувань облікового запису (id.tarasevych.com/account) на смартфоні 390×844 у Chromium: перерахунок стилів скорочено з 16.887 с до 2.302 с (−86.4%), загальний час завдань — з 18.231 с до 3.35 с (−81.6%), кількість компонувань — з 380 до 68 (−82.1%), максимальне одиничне зависання головного потоку — з 8245 мс до 308 мс (−96.3%).'
            ],
            beperkingen: [
              'Автоматичне встановлення на робочий сервер вимкнене за вимогами власника й політики платформи: пакунок призначено виключно для перевіреного встановлення поверх 20261115-044530 із ключем доступу.',
