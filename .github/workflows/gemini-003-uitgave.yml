              'Прискорено перемальовування та прокрутку макета на смартфонах: у maquette-motor.ts і MaquetteAnkerRail.tsx запроваджено запам’ятовування ширини, WeakMap-буфер меж та rAF-пакетування ResizeObserver і scroll; у concepten.ts і zichtbaar-voorladen.ts спостерігачі також згруповано у requestAnimationFrame.',
