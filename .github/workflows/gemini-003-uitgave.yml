name: GEMINI-003 · Швидкодія режиму «Макет» на смартфонах, усунення падіння пошти та миттєві переходи між піддоменами

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері (20261115-044530),
# правила координації, типи, статичні контракти, 81 безбазове випробування, TRACE-001, подвійний прогін міграцій та 19 БД-тестів на PostgreSQL 16,
# повне складання, маніфест інсталятора та SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, typen, 81 eenheidstests zonder DB,
# TRACE-001, dubbele migraties en 19 databasetests tegen PostgreSQL 16, volledige bouw, manifest en SHA-256.
on:
  # Надсилання цього файла лише реєструє процес на гілці; складання починається через workflow_dispatch із точним model_id.
  push:
    branches:
      - fix/maquette-mobiel-prestatie-20261115-055004
    paths:
      - .github/workflows/gemini-003-uitgave.yml
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ, що виконала роботу (для UITROL-MANIFEST.json)'
        required: true
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-003-uitgave
  cancel-in-progress: false

env:
  TAAK: GEMINI-003
  # Жива встановлена основа на сервері — 20261115-044530 (GEMINI-002 @ dfdb7356703e0ace554a07f76cd48a43ed8b1aab).
  BEKENDE_BASISSEN: '20261115-044530=dfdb7356703e0ace554a07f76cd48a43ed8b1aab'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: ${{ inputs.model_id || vars.GEMINI_003_MODEL_ID }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "fix/maquette-mobiel-prestatie-20261115-055004" ]; then
            echo "Випуск GEMINI-003 можна запускати лише з гілки fix/maquette-mobiel-prestatie-20261115-055004." >&2
            exit 1
          fi
          if [ -z "${MODEL_ID:-}" ]; then
            echo "Не задано model_id для UITROL-MANIFEST.json." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://mcp.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            throw Error(`orchestratie/geinstalleerd.json (${gi.versie} @ ${gi.bronCommit}) не збігається з основою (${versie} @ ${levend}).`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента та 81 безбазове модульне випробування
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          node deploy/agent/agent.mjs selftest --root /tmp
          for t in \
            maquette-mobiel-prestatie \
            maquette-001-kern \
            menu-snelheid \
            vast-kader \
            meldingen-ecosysteem-kern \
            meldingen-ecosysteem-ui \
            melding-positie \
            mededeling-ontdubbelen \
            meldingen-status-20261030 \
            meldingen-uitleg-20261030 \
            meldingen-integ-20261103 \
            meldingen-mobiel-20261021 \
            meldingen-v2-20261029 \
            identiteit-account-ui \
            identiteit-atelier \
            identiteit-maquette \
            identiteit-015-vormgeving-toegang \
            ui-paneel-gebruikers-audit-gemini-001 \
            hulp-vraagtekens \
            mobiel-cascade-20261105 \
            mobiel-geometrie-20261021 \
            klassiek-009a-sleutelpoort \
            plaatsing-20261025 \
            uitrol-manifest \
            uitrol-voorcontrole \
            uitrol-pakket-maken \
            uitrol-codes \
            uitrol-tijden \
            uitrol-vereisten-001 \
            contrast-knoppen-logos-20261021 \
            sec-002-afwerking-b-20261112 \
            telegram-aanmelden-20261109 \
            apparaat-bevestiging-20261109 \
            zoek-ui-tabblad-20261105 \
            zoek-ui-bereik-20261105 \
            zoek-ui-sectie-20261105 \
            zoek-diepe-link-20261105 \
            zoek-route-tabblad-20261105 \
            zoek-menu-20261103 \
            zoek-in-menu-20261024 \
            integraties-catalogus-v2-20261029 \
            thema \
            klassiek-001-kern \
            klassiek-002a-werkruimte \
            klassiek-002c-panelen \
            klassiek-007a-huis-kern \
            klassiek-008a-mcp-kern-uitrol \
            klassiek-010a-beheer-kern \
            accountmenu-v2-20261029 \
            accountmenu-v3 \
            uitrol-weergave-v2 \
            ai-hub \
            ai-werkruimte-20261019 \
            ai-doorverwijzing-ui004 \
            audit-filters \
            ui-audit-g \
            dock-snelmenu-20261029 \
            strook-menu \
            menu-per-account-20261019 \
            menu-per-profiel-20261019 \
            menu-taal-prapor-20261103 \
            aanmelden-integ-20261103 \
            huis-001-maquette-20261112 \
            huis-001-oude-fouten-20261110 \
            toegankelijk-mail-20261021 \
            mail-geminimaliseerd-20261025 \
            mailmob-001 \
            mailpolish-001 \
            mailfix-001 \
            cloud-vnext-ui-20261029 \
            cloud-001-ui-contract \
            afstemming-ui-20261030 \
            afstemming-zvirka-ui-20261030 \
            verbindingen-centrum-20261029 \
            browser-extensie \
            extensie-offscreen-20261106 \
            extensie-profielen \
            orch-kern-20261031 \
            orch-pakket-20261031 \
            orch-uitrol-basis-20261031 \
            orch-beoordeling-20261031; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи та скласти застосунок
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Усі міграції на чистій базі PostgreSQL 16 (двічі) та 19 БД-тестів
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export DATABASE_URL_SYSTEM="$DATABASE_URL"
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs | tail -3
          # Повторний прогін нічого не змінює. · Tweede keer: niets te doen.
          node dist-server/migrate.mjs | tail -1
          for t in \
            tech-bundels \
            tech-bundels-ruimtes-v2 \
            afstemming-kern-20261030 \
            telegram-venster-20261114 \
            telegram-aanmelden-stroom-20261109 \
            telegram-inlog-apparaat-20261112 \
            apparaat-bevestiging-stroom-20261109 \
            aanmeld-koppel-20261030 \
            aanmeld-ui-20261030 \
            kluis-apparaat-20261114 \
            melding-soorten \
            meldingen-sferen-20261022 \
            ruimte-meldingen-20261020 \
            menu-meldingen \
            identiteit-015-profiel-blokken \
            migraties-pg16-20261021 \
            beheer-journaal \
            gebruiker-audit-2026-10-19 \
            sec-002-g10i-20261112; do
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'GEMINI-003 · Швидкодія режиму «Макет» на смартфонах, усунення падіння пошти та миттєві переходи між піддоменами',
            samenvatting: 'Виправлення критичного падіння пошти та причин зависання режиму «Макет» на смартфонах і повільних переходів між піддоменами поверх встановленої основи 20261115-044530: безпечний початковий стан INITIAL_BOOTSTRAP у MailFunctioneelWeergave.tsx, спільний rAF-спостерігач перекривних шарів та атрибутів у src/maquette-kern/laag-waarnemer.ts для всіх піддоменів і пошти, ліниве завантаження макета IdentiteitMaquette, UnifiedServiceApp та панелей центру сповіщень через Suspense, запам’ятовування меж і групування оновлень у requestAnimationFrame, винесення перевірок змаху з touchstart у touchend, прискорення спекулятивних переходів між піддоменами (preconnect + прогрів 8 посилань на сенсорах) і вимкнення важких backdrop-filter та плавної прокрутки на малих екранах.',
            wijzigingen: [
              'Впроваджено спільний модуль спостерігачів src/maquette-kern/laag-waarnemer.ts (abonneerOpenLaag та abonneerElementAttributen), який об’єднує мутації DOM у requestAnimationFrame та усуває некеровані спостерігачі на всіх 10 піддоменах і в GoogleMailWerkruimte.tsx.',
