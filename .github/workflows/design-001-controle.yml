name: DESIGN-001 · build en visuele controle
on:
  push:
    branches: [feature/design-001-20261105-140000]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Controleer regels, types en relevante eenheidstests
        run: |
          mkdir -p rapporten
          node scripts/orch.mjs controleer
          npm run typecheck:server
          node scripts/eenheidstests.mjs orch-kern
          node scripts/eenheidstests.mjs werkblad-canvas-kern
      - name: Bouw de toepassing
        run: NODE_OPTIONS=--max-old-space-size=5120 npm run build
  visueel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Zoek een beschikbare browser
        id: browser
        shell: bash
        run: |
          for kandidaat in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$kandidaat" > /dev/null; then
              echo "path=$(command -v "$kandidaat")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          npx playwright install chromium
      - name: Controleer echte werkbladcomponenten in lichte en donkere thema's
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uitvoer/design-001
          npx vite --host 127.0.0.1 --port 4179 > uitvoer/design-001/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for poging in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4179/tests/visueel/design-001-voorbeeld.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/visueel/design-001-controle.mjs
          echo DESIGN_PHONE_BEGIN
          base64 uitvoer/design-001/telefoon-licht.png
          echo DESIGN_PHONE_END
          echo DESIGN_DESKTOP_BEGIN
          base64 uitvoer/design-001/computer-donker.png
          echo DESIGN_DESKTOP_END
      - name: Toon Vite-logboek bij een fout
        if: failure()
        run: cat uitvoer/design-001/vite.log || true
      - name: Bewaar beelden en logboek
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DESIGN-001-visueel
          path: uitvoer/design-001/
          retention-days: 14
          if-no-files-found: warn
