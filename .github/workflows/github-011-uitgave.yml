name: GITHUB-011 · виправлення зворотного виклику OAuth та однонатискового підключення GitHub при закритому сховищі ключів

# Ніколи не встановлює пакунок на сервер. Перед оприлюдненням звіряє живу встановлену основу (20261112-024707), макет HUIS-001, типи, міграції й контрольну суму.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis (20261112-024707), maquette HUIS-001, typen, migraties en controlesom.
on:
  push:
    branches:
      - 'fix/github-011-oauth-sleutelkluis-20261112-032000'
    paths:
      - '.github/workflows/github-011-uitgave.yml'
      - 'orchestratie/ontwikkelarchieven/GITHUB-011.json'
      - 'orchestratie/taken/GITHUB-011.json'
      - 'shared/**'
      - 'backend/**'
      - 'src/**'
      - 'tests/eenheid/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-011-uitgave
  cancel-in-progress: true

env:
  TAAK: GITHUB-011
  BASIS_VERSIE: '20261112-024707'
  BASIS_COMMIT: 'f9db50747048f7dc7a6937fff65b0ae4c1058f72'
  INTEGRATIE_BASIS: '3219123ea8b00f27460922ae075ee3c7f32cecda'
  MODEL_ID: 'gemini-2.5-pro'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Встановити залежності
        run: npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/versie.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error(`Встановлена версія змінилася (${v.versie} @ ${v.bronCommit || v.commit}). Випуск зупинено для нового узгодження.`);
          }
          JS
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
      - name: Перевірити правила координації та журнал походження
        run: |
          set -o pipefail
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Виконати модульні перевірки GitHub, макета «Живий дім», меню та розміщення
        run: |
          set -o pipefail
          node scripts/plaatsing-controle.mjs
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/huis-maquette.mjs --controle
          node scripts/eenheidstests.mjs github-011-oauth-sleutelkluis.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-volledige-werkruimte.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-oauth-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-koppelkaart-20261019.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-platform.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs huis-001-maquette-20261112.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs huis-001-oude-fouten-20261110.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs routes.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs plaatsing-20261025.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs zoek-ui-tabblad-20261105.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs hulpmiddelen-tweetalig-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити типи та скласти застосунок разом із макетом
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
          test -s dist/huis-maquette/index.html
          test -s dist/huis-maquette/maquette.css
          test -s dist/huis-maquette/maquette.js
      - name: Перевірити подвійне застосування міграцій і наскрізні тести з PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon'
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(head -c32 /dev/urandom | base64)"
          export RECOVERY_CODE_PEPPER="$(head -c32 /dev/urandom | base64)"
          export AUDIT_IP_PEPPER="$(head -c40 /dev/urandom | base64)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          node dist-server/migrate.mjs
          node dist-server/migrate.mjs
          node scripts/eenheidstests.mjs github-011-oauth-sleutelkluis.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs github-oauth-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs site-hulpmiddelen.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs ruimte-bord-github-20261020.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs huis-vnext-20261028.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Упевнитися в незмінності робочого дерева
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Павло Тарасевич (tarasevych.pavlo@gmail.com)';
          const uk = {
            titel: 'Виправлення зворотного виклику OAuth та однонатискового підключення GitHub при закритому сховищі ключів',
            samenvatting: 'Точкове оновлення розділу https://github.tarasevych.com/ на основі встановленого проміжного випуску 20261112-024707 (із повним збереженням макета «Живий дім» HUIS-001 та середовища GITHUB-010): усунено серверний збій 500 на зворотному виклику OAuth при закритому в пам’яті сервера особистому сховищі ключів, узгоджено передачу простору (приватний / технічний), додано підтримку користувацьких маркерів застосунку GitHub App із порожнім полем scope та пряму кнопку розблокування сховища ключів на сторінці підключення.',
            wijzigingen: [
              'Попередня перевірка стану особистого сховища ключів (isKoppelingKluisGesloten) на старті входу через OAuth, однонатискового підключення та входу за кодом пристрою: якщо ключ шифрування закритий у пам’яті сервера після оновлення чи нового сеансу, сервер одразу повертає зрозумілий стан SLEUTELKLUIS_GESLOTEN (423) ще до переходу на GitHub.',
              'Пряма кнопка «Відкрити сховище ключів» у картці підключення GitHub (KoppelKaart), панелі швидкого підключення в один натиск (EenklikKoppelPaneel) та на головному екрані розділу, що веде безпосередньо до розділу «Способи входу → Шифрування» піддомену id поточного домену.',
              'Чесне відображення стану SLEUTELKLUIS_GESLOTEN у ghStatus та ghKoppeling, коли збережене підключення вже існує, але особисте сховище ключів тимчасово закрите в пам’яті сервера.'
            ],
            fixes: [
              'Усунено неперехоплений виняток SleutelkluisFout(SLEUTELKLUIS_GESLOTEN) на маршрутах зворотного виклику GET /api/owner/github/oauth/callback та GET /api/owner/github/eenklik/callback, який раніше спричиняв відповідь {"error":"Internal server error"} (HTTP 500); тепер оглядач завжди отримує безпечне перенаправлення на /accounts?github=SLEUTELKLUIS_GESLOTEN без витоку одноразових кодів.',
              'Виправлено передачу вибраного простору (prive / technisch) до всіх викликів oauthApp, appSleutel, appInstallaties та appRepos під час підключення, оновлення маркерів і відключення.',
              'Виправлено перевірку прав scopeVoldoet для користувацьких маркерів застосунку GitHub App (Iv1… / Iv23… / ghu_…), де GitHub повертає порожній рядок scope та параметр iss=https://github.com/login/oauth.'
            ],
            beperkingen: [
              'Якщо особисте шифрування даних увімкнене, після перезапуску сервера особистий ключ не зберігається на диску й відкривається користувачем через ключ доступу або код відновлення.',
              'Встановлення випуску на робочий сервер виконується виключно власником із підтвердженням ключем доступу.'
            ],
            instructies: 'Завантажте архів mijn-ruimte-<VERSIE>.tar.gz на сторінці «Оновлення → Нове оновлення», підтвердьте встановлення ключем доступу, за потреби відкрийте особисте сховище ключів на сторінці «Способи входу → Шифрування» та перевірте підключення на https://github.tarasevych.com/accounts.'
          };
          const nl = {
            titel: 'Herstel van GitHub OAuth-terugkeer en éénkliks koppeling bij een gesloten sleutelkluis',
            samenvatting: 'Gerichte bijwerking van https://github.tarasevych.com/ boven op de geïnstalleerde tussenuitgave 20261112-024707 (met volledig behoud van HUIS-001 «Живий дім» en GITHUB-010): verhelpt de 500-serverfout op de OAuth-terugkeerroute wanneer de persoonlijke sleutelkluis in het servergeheugen gesloten is, geeft de gekozen ruimte (privé / technisch) overal consequent door, ondersteunt gebruikerstokens van een GitHub App met lege scope en voegt een directe ontgrendelknop voor de sleutelkluis toe.',
            wijzigingen: [
              'Voorafgaande controle op een gesloten persoonlijke sleutelkluis (isKoppelingKluisGesloten) bij het starten van OAuth, éénkliks koppeling en apparaatcode: wanneer de sleutel na een herstart of nieuwe sessie dicht staat, meldt de server direct SLEUTELKLUIS_GESLOTEN (423) vóórdat de browser naar GitHub vertrekt.',
              'Directe knop «Sleutelkluis ontgrendelen» op de GitHub-koppelkaart (KoppelKaart), het éénkliks paneel (EenklikKoppelPaneel) en het hoofdscherm naar «Aanmeldmethoden → Versleuteling» op het id-subdomein van de eigen installatie.',
              'Eerlijke status SLEUTELKLUIS_GESLOTEN in ghStatus en ghKoppeling wanneer er al een bewaarde koppeling bestaat maar de persoonlijke sleutelkluis gesloten is.'
            ],
            fixes: [
              'Onopgevangen SleutelkluisFout(SLEUTELKLUIS_GESLOTEN) op GET /api/owner/github/oauth/callback en GET /api/owner/github/eenklik/callback verholpen waardoor voorheen {"error":"Internal server error"} (HTTP 500) verscheen; de browser krijgt nu altijd een veilige omleiding naar /accounts?github=SLEUTELKLUIS_GESLOTEN zonder lekkende codes.',
              'Doorgifte van de actieve ruimte (prive / technisch) hersteld in alle aanroepen van oauthApp, appSleutel, appInstallaties en appRepos bij koppelen, vernieuwen en ontkoppelen.',
              'Rechtencontrole scopeVoldoet uitgebreid voor gebruikerstokens van een GitHub App (Iv1… / Iv23… / ghu_…) waarbij GitHub een lege scope-waarde en iss=https://github.com/login/oauth terugstuurt.'
            ],
            beperkingen: [
              'Wanneer persoonlijke gegevensversleuteling aanstaat, blijft de sleutel na een serverherstart gesloten totdat de eigenaar deze ontgrendelt met toegangssleutel of herstelcode.',
              'Installatie op de productieserver gebeurt uitsluitend door de eigenaar met bevestiging via de toegangssleutel.'
            ],
            instructies: 'Bied mijn-ruimte-<VERSIE>.tar.gz aan via «Updates → Nieuwe update», bevestig de installatie met uw toegangssleutel, ontgrendel zo nodig eerst de sleutelkluis via «Aanmeldmethoden → Versleuteling» en voltooi het koppelen op https://github.tarasevych.com/accounts.'
          };
          const m = {
            schema: 1,
            versie: e.VERSIE,
            aangemaakt: new Date().toISOString(),
            herkomst: `git: commit ${e.GITHUB_SHA} (integratie ${e.INTEGRATIE_BASIS}, basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,
            auteur,
            zonderAi: false,
            deelnemers: [
              { soort: 'mens', naam: auteur, rollen: ['auteur'] },
              {
                soort: 'ai',
                naam: 'gemini',
                platform: 'Google Antigravity',
                tool: 'Antigravity IDE',
                model: { id: e.MODEL_ID, versie: null, bron: 'omgeving' },
                rollen: ['ontwikkeling', 'controle', 'testen', 'verpakken']
              }
            ],
            beschrijving: { uk, nl }
          };
          writeFileSync(e.RUNNER_TEMP + '/UITROL-MANIFEST.json', JSON.stringify(m, null, 2) + '\n');
          // SEC-002: cijfers uit de echte uitvoer van scripts/eenheidstests.mjs («N/M geslaagd (…)» per testbestand), geen letterlijke getallen.
          // Кількість перевірок береться з фактичного виводу тестів цього запуску, а не з наперед записаного числа.
          const gemeten = { geslaagd: 0, mislukt: 0 };
          const perTest = new Map(); for (const r of readFileSync(e.RUNNER_TEMP + '/eenheidstests.log', 'utf8').matchAll(/^(\d+)\/(\d+) geslaagd \(([^)\n]+)\)/gm)) perTest.set(r[3], [Number(r[1]), Number(r[2])]); for (const [g, n] of perTest.values()) { gemeten.geslaagd += g; gemeten.mislukt += n - g; } const gemetenLijst = [...perTest].map(([b, [g, n]]) => b + ' ' + g + '/' + n).join('; ');
          if (!gemeten.geslaagd || gemeten.mislukt) throw Error('Немає виміряних результатів тестів або є невдалі перевірки — випуск зупинено.');
          const tests = {
            geslaagd: gemeten.geslaagd,
            mislukt: gemeten.mislukt,
            falend: [],
            uitleg: {
              uk: 'Успішно пройдено будівельні перевірки розміщення, пошукового каталогу та інтерактивного макета HUIS-001 (/huis-maquette/), модульні й наскрізні перевірки з PostgreSQL 16 для github-011-oauth-sleutelkluis, github-oauth-20261020, github-koppelkaart-20261019, github-volledige-werkruimte, github-platform, huis-001-maquette-20261112, huis-001-oude-fouten-20261110, huis-vnext-20261028, routes, plaatsing-20261025, zoek-ui-tabblad-20261105, hulpmiddelen-tweetalig-20261020, site-hulpmiddelen, ruimte-bord-github-20261020 і походження TRACE-001, перевірку типів клієнта та сервера, повне виробниче складання застосунку разом із dist/huis-maquette/ та подвійне застосування всіх міграцій на чистій базі PostgreSQL 16.' + ' Виміряно в цьому запуску — файл тестів і пройдено з усього: ' + gemetenLijst + '.',
              nl: 'Bouwcontroles van plaatsing, de UI-zoekcatalogus en de interactieve maquette HUIS-001 (/huis-maquette/) zijn geslaagd, evenals de eenheids- en PostgreSQL 16-integratietests voor github-011-oauth-sleutelkluis, github-oauth-20261020, github-koppelkaart-20261019, github-volledige-werkruimte, github-platform, huis-001-maquette-20261112, huis-001-oude-fouten-20261110, huis-vnext-20261028, routes, plaatsing-20261025, zoek-ui-tabblad-20261105, hulpmiddelen-tweetalig-20261020, site-hulpmiddelen, ruimte-bord-github-20261020 en herkomst TRACE-001, plus typecontrole van client en server, volledige productiebouw inclusief dist/huis-maquette/ en dubbele uitvoering van alle migraties op een schone PostgreSQL 16-databank.' + ' Gemeten in deze uitvoering — testbestand en geslaagd van totaal: ' + gemetenLijst + '.'
            }
          };
          writeFileSync(e.RUNNER_TEMP + '/TESTRESULTATEN.json', JSON.stringify(tests, null, 2) + '\n');
          writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie: e.BASIS_VERSIE, bronCommit: e.BASIS_COMMIT, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
          JS
      - name: Скласти та перевірити пакунки випуску й передачі
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent gemini --platform 'Google Antigravity' --tool 'Antigravity IDE' \
            --model-id "$MODEL_ID" --model-bron omgeving \
            --versie "$VERSIE" --uit uitvoer \
            --samenvatting-uk 'Виправлення зворотного виклику OAuth та однонатискового підключення GitHub при закритому сховищі ключів на основі версії 20261112-024707.' \
            --samenvatting-nl 'Herstel van GitHub OAuth-terugkeer en éénkliks koppeling bij een gesloten sleutelkluis boven op versie 20261112-024707.' \
            --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
          printf 'GITHUB-011 · Виправлення зворотного виклику OAuth та однонатискового підключення GitHub (https://github.tarasevych.com/) на основі живої версії 20261112-024707 (із повним збереженням HUIS-001 та GITHUB-010): усунено помилку 500 на зворотному виклику при закритому сховищі ключів (SLEUTELKLUIS_GESLOTEN), узгоджено передачу простору (prive / technisch), додано підтримку користувацьких маркерів застосунку GitHub App із порожнім полем scope та пряму кнопку розблокування сховища ключів. Встановлення виконується виключно власником із підтвердженням ключем доступу.\nФіксація змін: %s\nІнтеграційна основа: %s\nВстановлена основа сервера: %s @ %s\n' "$GITHUB_SHA" "$INTEGRATIE_BASIS" "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/opis.md"
      - name: Передати перевірені пакунки завданню оприлюднення · overdracht aan de publicatietaak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overdracht/uitvoer"
          cp -R uitvoer/. "$RUNNER_TEMP/overdracht/uitvoer/"
          cp "$RUNNER_TEMP/opis.md" "$RUNNER_TEMP/overdracht/opis.md"
          printf '%s\n' "$VERSIE" > "$RUNNER_TEMP/overdracht/VERSIE"
          printf '%s\n%s\n' "$BASIS_VERSIE" "$BASIS_COMMIT" > "$RUNNER_TEMP/overdracht/BASIS"
      - name: Зберегти пакунки для завдання оприлюднення · artefact voor de publicatietaak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-011-overdracht
          path: ${{ runner.temp }}/overdracht/
          if-no-files-found: error
          retention-days: 7
      - name: Зберегти пакунки перевірки у сховищі виконання
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-011-controle
          path: uitvoer/
          if-no-files-found: ignore
  uitgave:
    # SEC-002: єдине завдання з правом запису у сховище. Воно нічого не встановлює через npm, не збирає й не тестує:
    # отримує вже перевірені пакунки як артефакт, звіряє контрольну суму й лише тоді оприлюднює випуск.
    # Enige taak met schrijfrecht. Installeert, bouwt en test niets: haalt de gecontroleerde pakketten als artefact op en publiceert.
    name: Оприлюднення перевірених пакунків · publicatie van de gecontroleerde pakketten
    needs: controle-en-uitgave
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Отримати перевірені пакунки · gecontroleerde pakketten ophalen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-011-overdracht
          path: ${{ runner.temp }}/overdracht
      - name: Відновити пакунки й звірити контрольну суму · pakketten terugzetten en controlesom vergelijken
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(tr -d '\r\n' < "$RUNNER_TEMP/overdracht/VERSIE")"
          # SEC-002 (g01-3): de basis komt uit het artefact van de bouwtaak (zonder schrijfrecht, maar met npm en tests) — alleen aanvaarden
          # als ze in de vertrouwde env van deze werkstroom staat (vaste basis of lijst van toegestane bases).
          VERTROUWD=" ${TOEGESTANE_BASES:-} ${BEKENDE_BASISSEN:-} ${BASIS_VERSIE:+${BASIS_VERSIE}=${BASIS_COMMIT:-}} "
          BASIS_VERSIE="$(sed -n 1p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          BASIS_COMMIT="$(sed -n 2p "$RUNNER_TEMP/overdracht/BASIS" | tr -d '\r')"
          [[ "$VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_VERSIE" =~ ^[0-9]{8}-[0-9]{6}$ && "$BASIS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Передані дані випуску мають неправильний вигляд — оприлюднення зупинено.' >&2; exit 1; }
          case "$VERTROUWD" in *" ${BASIS_VERSIE}=${BASIS_COMMIT} "*) ;; *) echo 'Основа з артефакту збірки не входить до довірених значень цього процесу — оприлюднення зупинено. · De basis uit het bouwartefact staat niet in de vertrouwde waarden van deze werkstroom — publicatie gestopt.' >&2; exit 1 ;; esac
          { echo "VERSIE=$VERSIE"; echo "BASIS_VERSIE=$BASIS_VERSIE"; echo "BASIS_COMMIT=$BASIS_COMMIT"; } >> "$GITHUB_ENV"
          mkdir -p uitvoer
          cp -R "$RUNNER_TEMP/overdracht/uitvoer/." uitvoer/
          cp "$RUNNER_TEMP/overdracht/opis.md" "$RUNNER_TEMP/opis.md"
          sha256sum --check "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
      - name: Упевнитися, що такого випуску ще немає · deze uitgave mag nog niet bestaan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Випуск з таким позначенням уже існує.' >&2
            exit 1
          fi
      - name: Повторно звірити живу встановлену версію перед оприлюдненням
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/pered-vypuskom.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pered-vypuskom.json', 'utf8'));
          if (v.versie !== process.env.BASIS_VERSIE || (v.bronCommit || v.commit) !== process.env.BASIS_COMMIT) {
            throw Error('Робочий сервер оновився під час перевірок. Оприлюднення зупинено.');
          }
          JS
      - name: Оприлюднити випуск на GitHub без встановлення на сервер
        id: publicatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-gemini-overdracht.zip" \
            --target "$GITHUB_SHA" --title "GITHUB-011 · виправлення зворотного виклику OAuth та сховища ключів GitHub · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/uitgave.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const e = process.env;
          const pad = `uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const som = createHash('sha256').update(readFileSync(pad)).digest('hex');
          const uitgave = JSON.parse(readFileSync(e.RUNNER_TEMP + '/uitgave.json', 'utf8'));
          const archief = uitgave.assets.find(a => a.name === `mijn-ruimte-${e.VERSIE}.tar.gz`);
          if (uitgave.draft || !archief || archief.state !== 'uploaded' || archief.digest !== 'sha256:' + som) {
            throw Error('Оприлюднений архів не збігається за контрольною сумою SHA-256.');
          }
          console.log(`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.VERSIE}/mijn-ruimte-${e.VERSIE}.tar.gz`);
          JS
      - name: Приховати незавершений випуск у разі збою перевірки
        if: failure() && steps.publicatie.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
