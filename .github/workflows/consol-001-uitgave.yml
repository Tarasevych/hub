            scripts/klimop-etappe11-beveiligingsaudit-proef.mjs \
            scripts/klimop-etappe12-zaden-proef.mjs; do
            node "$s" >/dev/null
          done
          for f in \
            tests/eenheid/cloud-delen-m3.test.mjs \
            tests/eenheid/cloud-m10-integration-safety.test.mjs \
            tests/eenheid/cloud-m11-voorbeeld.test.mjs \
            tests/eenheid/cloud-m3-gate.test.mjs \
            tests/eenheid/cloud-m5-aanbieder-golf.test.mjs \
            tests/eenheid/cloud-m6-beleid-bewaker.test.mjs \
            tests/eenheid/cloud-m6-bestuur.test.mjs \
