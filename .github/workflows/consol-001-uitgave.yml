name: 'CONSOL-001 · Зведене консолідоване оновлення «Мій простір»: гілки №208 і №211, укріплення безпеки, 18 груп можливостей та 58 прапорців (міграція 0335)'

# Ніколи не встановлює пакунок на живий сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері
# (20261122-171856 @ c85e5d73f104 та попередні предки), правила координації 1.8.0 (B-027 / VLAG-001), сторож бази сповіщень
# MELDINGEN-REGISTER-001, типи клієнта й сервера, статичні контракти, TRACE-001, 20 хмарних випробувань, 12 стендів «Плюща»,
# 181 безбазове і 13 післяскладальних випробувань, подвійний прогін усіх міграцій 0001..0335 на PostgreSQL 16 із трьома ролями,
# усі базові й 250 наскрізних випробувань із базою даних та Хроміумом, повне складання, автоматично підписаний CRX3 0.9.7,
# двокрокову перевірку 28 нових прапорців у маніфесті встановлювача та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels 1.8.0 (B-027 / VLAG-001),
# het meldingenregister MELDINGEN-REGISTER-001, client- en servertypen, statische contracten, TRACE-001, cloud-tests,
# 12 Klimop-proefopstellingen, 181 eenheidstests vóór en 13 na de bouw, dubbele migraties 0001..0335 en alle database- en
# eind-tot-eind-tests met drie rollen en Chromium op PostgreSQL 16, volledige bouw, ondertekende CRX3 0.9.7, 28 nieuwe vlaggen en SHA-256.
on:
  push:
    branches:
      - feature/consolidatie-001-20261122-203500
    paths:
      - .github/workflows/consol-001-uitgave.yml
      - orchestratie/ontwikkelarchieven/CONSOL-001.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: consol-001-uitgave
  cancel-in-progress: false

env:
  TAAK: CONSOL-001
  # Жива встановлена основа на сервері — KLANT-001 (20261122-171856 @ c85e5d73f104f555021c6a896ffecb70256588d3);
  # також підтримуються безпосередні предки MELDPANEEL-003, MELDPANEEL-002, KLIMOP-023, UPD-013 та UPD-012.
  BEKENDE_BASISSEN: '20261120-093715=318ad56136008cafdde193e11c5bfe638d5a6ce6 20261120-141041=ba289fa919c66765b6fc5565d340976994261c05 20261122-082021=55291902d45bda6431471c5a94bc9f4eed93b8ed 20261122-122237=6be83c131bc13e6defc006784781393c3cdd0945 20261122-154750=625314e5d045f81d13564e68c16b1074ef71c381 20261122-171856=c85e5d73f104f555021c6a896ffecb70256588d3'
  INTEGRATIE_BASIS: '95fda93a7084c102d1c682fbb9a83a83d49f9259'
  MODEL_ID: ${{ inputs.model_id || vars.CONSOL_001_MODEL_ID || 'Gemini 3.1 Pro' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/consolidatie-001-20261122-203500" ]; then
            echo "Випуск CONSOL-001 можна запускати лише з гілки feature/consolidatie-001-20261122-203500." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js і перевірити системні інструменти
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити наявність обов’язкових інструментів середовища та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (['000', '403', '429', '502', '504', '522', '524', '530'].includes(code)) {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Зовнішній тунель або мережевий екран тимчасово відхилив запит без сеансу (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з живою основою ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації 1.8.0 (VLAG-001), сторож бази сповіщень та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          DOEL_BASIS="${BASIS_COMMIT:-c85e5d73f104f555021c6a896ffecb70256588d3}"
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen "$DOEL_BASIS"
          node scripts/vaardigheden/valideer.mjs
          node scripts/meldingen-register-controle.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/CONSOL-001.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'CONSOL-001');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал CONSOL-001 дійсний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента, 12 стендів «Плюща», 20 хмарних і 181 безбазове модульне випробування
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/klant-servergrens-controle.mjs --stil
          node deploy/agent/agent.mjs selftest --root /tmp
          for s in \
            scripts/klimop-etappe0-audit.mjs \
            scripts/klimop-proefnetwerk.mjs \
            scripts/klimop-etappe3-opslag-proef.mjs \
            scripts/klimop-etappe4-frost-proef.mjs \
            scripts/klimop-etappe5-identiteit-proef.mjs \
            scripts/klimop-etappe6-bestuur-proef.mjs \
