            for (const r of inhoud.matchAll(/^([a-zA-Z0-9_-]+):\s+(\d+)\/(\d+) geslaagd/gm)) perTest.set(r[1], [Number(r[2]), Number(r[3])]);
            for (const r of inhoud.matchAll(/^([a-zA-Z0-9_-]+):\s+(\d+)\/(\d+) OK/gm)) perTest.set(r[1], [Number(r[2]), Number(r[3])]);
