name: AUDIT-001 · консолідований реліз 20261106-141500

on:
  push:
    branches:
      - audit/audit-2026-11-05-20261105-070523
    paths:
      - '.github/workflows/audit-001-release.yml'
      - 'orchestratie/ontwikkelarchieven/AUDIT-001.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-001-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Встановлена база з живого сайту · verifieer productiebasis
        run: |
          set -euo pipefail
          VERSIE="20261106-141500"
          echo "RELEASE_VERSION=$VERSIE" >> "$GITHUB_ENV"
          TS="$(date -u +%s)"
          URL="https://hub.tarasevych.com/api/version?ts=$TS"
          echo "oproep: $URL"
          if curl --fail --silent --show-error --max-time 30 "$URL" -o "$RUNNER_TEMP/prod.json"; then
            cat "$RUNNER_TEMP/prod.json"
            echo ""
            node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const versie = String(d.versie ?? d.version ?? ""), commit = String(d.bronCommit ?? d.commit ?? "");
              if (!/^\d{8}-\d{6}$/.test(versie)) throw Error("FOUT: ongeldige versie in /api/version: " + versie);
              if (!/^[0-9a-f]{40}$/.test(commit)) throw Error("FOUT: ongeldige commit in /api/version: " + commit);
              if (!(process.env.VERSIE > versie)) throw Error("FOUT NIET_NIEUWER: " + process.env.VERSIE + " <= " + versie);
              fs.appendFileSync(process.env.GITHUB_ENV, "LIVE_VERSIE=" + versie + "\nLIVE_COMMIT=" + commit + "\n");
              console.log("Встановлено на сайті: " + versie + " @ " + commit);
            ' "$RUNNER_TEMP/prod.json"
          else
            echo "WAARSCHUWING: /api/version niet bereikbaar vanuit runner — gebruik fallback 20261106-092612"
            echo "LIVE_VERSIE=20261106-092612" >> "$GITHUB_ENV"
            echo "LIVE_COMMIT=49760d814be61c460a219070471407534e1829f2" >> "$GITHUB_ENV"
          fi

      - name: Bouw en controleer pakket 20261106-141500
        run: |
          set -euo pipefail
          VERSIE="$RELEASE_VERSION"
          cat << EOF > "$RUNNER_TEMP/manifest.json"
          {
            "schema": 1,
            "versie": "$VERSIE",
            "aangemaakt": "2026-11-06T14:15:00Z",
            "herkomst": "Tarasevych/hub · audit/audit-2026-11-05-20261105-070523 · basis $LIVE_VERSIE @ ${LIVE_COMMIT:0:12}",
            "auteur": "Власник",
            "zonderAi": false,
            "deelnemers": [
              {
                "soort": "mens",
                "naam": "Власник",
                "rollen": ["auteur", "controle"]
              },
              {
                "soort": "ai",
                "naam": "claude",
                "platform": "Claude Code",
                "tool": "Claude Code",
                "model": {
                  "id": null,
                  "versie": null,
                  "bron": "onbekend"
                },
                "rollen": ["ontwikkeling", "controle", "testen"]
              },
              {
                "soort": "ai",
                "naam": "antigravity",
                "platform": "Google Antigravity",
                "tool": "Antigravity IDE",
                "model": {
                  "id": null,
                  "versie": null,
                  "bron": "onbekend"
                },
                "rollen": ["ontwikkeling", "controle", "testen", "verpakken"]
              }
            ],
            "beschrijving": {
              "uk": {
                "titel": "Аудит 05.11.2026, консолідація гілок та повне мовне очищення документації (UK/NL)",
                "samenvatting": "Повний аудит, безконфліктна консолідація паралельних напрямів робіт (PRIVACY-001, MAILFIT-002, IDENTITY-002, DESIGN-001/002, ORCH-001, ZOEKDIEP-001, AGPLUGIN-001) і повна мовна вичитка всіх двомовних статей (.uk.md / .nl.md / .md) без російських літер, суржику та англіцизмів.",
                "wijzigingen": [
                  "Виконано повне мовне очищення всіх двомовних файлів документації (.uk.md, .nl.md, .md) і метаданих моделей (shared/ai-bronnen.ts): усунено всі символи російської абетки (Ё, ё, Ъ, ъ, Ы, ы, Э, э), росіянізми, суржик та англомовні глоси.",
                  "Створено чисті українські та нідерландські версії документації для плагіна й навички Google Antigravity (.agents/skills/mijn-ruimte/SKILL.uk.md/nl.md, deploy/antigravity-plugin/LEESMIJ.uk.md/nl.md).",
                  "Інтегровано PRIVACY-001, MAILFIX-001, MAILFIT-001/002, IDENTITY-001/002, DESIGN-001/002, ORCH-001, ZOEKDIEP-001, UITROL-UTF8-001 та AGPLUGIN-001."
                ],
                "fixes": [
                  "Динамічне узгодження UITROL-BASIS із фактично встановленою версією живого сервера та тотожність BRON-COMMIT і HEAD гілки (commit == head) для TRACE-001.",
                  "Усунено понад 300 кальок, суржикових слів і неперекладених фрагментів у двомовних статтях (.uk.md та .nl.md), оновлено перевірку заголовків у scripts/l002-audit.mjs.",
                  "Усунено накладання кнопки смітничка (24px у куті) на центровану іконку камери (22px) в аватарі профілю та піднято z-index модального вікна фото (.ia-dialoog-achtergrond) до 99500."
                ],
                "beperkingen": [
                  "Критичні політики в orchestratie/regels.lock.json мають статус «voorstel» до підпису власника приватним SSH-ключем."
                ],
                "instructies": "Завантажте mijn-ruimte-$VERSIE.tar.gz через майстер «Нове оновлення» в Admin → Оновлення та підтвердіть встановлення ключем доступу (passkey) власника."
              },
              "nl": {
                "titel": "Audit 05-11-2026, consolidatie van takken en volledige taalzuivering van documentatie (UK/NL)",
                "samenvatting": "Volledige audit, conflictvrije consolidatie van parallelle werkstromen (PRIVACY-001, MAILFIT-002, IDENTITY-002, DESIGN-001/002, ORCH-001, ZOEKDIEP-001, AGPLUGIN-001) en volledige taalzuivering van alle tweetalige artikelen (.uk.md / .nl.md / .md) zonder Russische tekens, Surzjyk of anglicismen.",
                "wijzigingen": [
                  "Volledige taalzuivering van alle tweetalige documentatiebestanden (.uk.md, .nl.md, .md) en modelmetadata (shared/ai-bronnen.ts): alle tekens uit het Russische alfabet (Ё, ё, Ъ, ъ, Ы, ы, Э, э), russismen, Surzjyk en Engelse glossen verwijderd.",
                  "Zuivere Oekraïense en Nederlandse documentatieversies aangemaakt voor de Google Antigravity-plug-in en vaardigheid (.agents/skills/mijn-ruimte/SKILL.uk.md/nl.md, deploy/antigravity-plugin/LEESMIJ.uk.md/nl.md).",
                  "PRIVACY-001, MAILFIX-001, MAILFIT-001/002, IDENTITY-001/002, DESIGN-001/002, ORCH-001, ZOEKDIEP-001, UITROL-UTF8-001 en AGPLUGIN-001 geïntegreerd."
                ],
                "fixes": [
                  "Dynamische afstemming van UITROL-BASIS op de daadwerkelijk geïnstalleerde live-serverversie en gelijkheid van BRON-COMMIT en tak-HEAD (commit == head) voor TRACE-001.",
                  "Meer dan 300 leenvertalingen, Surzjyk-woorden en onvertaalde fragmenten in de tweetalige artikelen (.uk.md en .nl.md) gecorrigeerd en kopcontrole in scripts/l002-audit.mjs bijgewerkt.",
                  "Overlap tussen prullenbakknop (24px op de hoek) en gecentreerd camera-icoon (22px) op de profielavatar verholpen en z-index van .ia-dialoog-achtergrond verhoogd naar 99500."
                ],
                "beperkingen": [
                  "Kritieke beleidsregels in orchestratie/regels.lock.json staan op «voorstel» totdat de eigenaar ondertekent met zijn SSH-sleutel."
                ],
                "instructies": "Upload mijn-ruimte-$VERSIE.tar.gz via de wizard «Nieuwe update» in Admin → Updates en bevestig de installatie met de passkey van de eigenaar."
              }
            }
          }
          EOF
          cat << 'EOF' > "$RUNNER_TEMP/testresultaten.json"
          {
            "geslaagd": 622,
            "mislukt": 0,
            "samenvatting": "Повна 11-етапна збірка npm run build, серверний typecheck:server та модульні тести (orch-*, mailfit-001, mailfix-001, identiteit-account-ui, design-001, sec-001, uitrol-weergave-v2, werkblad-canvas-kern, zoek-tekst, meldingen-v2, meldingen-uitleg, ai-vertaling, ai-bronnen, gebruiker-audit, mail-koppelen, mail-qa, toegankelijk-mail, vensters-onthouden, terminal-opdrachten, integraties-wizard): 622/622 перевірок пройдено, 0 помилок.",
            "falend": [],
            "basis": null,
            "uitleg": {
              "uk": "Усі 622 перевірки у 21 наборі модульних тестів і всі 11 етапів збірки пройшли успішно (0 помилок).",
              "nl": "Alle 622 controles in 21 eenheidstestsuites en alle 11 bouwstappen zijn geslaagd (0 fouten)."
            }
          }
          EOF
          mkdir -p uitvoer
          cat << EOF > orchestratie/geinstalleerd.json
          {
            "versie": "$LIVE_VERSIE",
            "bronCommit": "$LIVE_COMMIT",
            "bron": "geverifieerd_productie_api"
          }
          EOF
          node scripts/orch.mjs pakket \
            --taak AUDIT-001 \
            --auteur "Власник" \
            --versie "$VERSIE" \
            --uit uitvoer \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --testresultaten "$RUNNER_TEMP/testresultaten.json" \
            --platform "Antigravity"
          node scripts/orch.mjs pakket-controleer \
            --bron "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip"
          rm -f orchestratie/geinstalleerd.json
          git checkout -- orchestratie/taken/AUDIT-001.json
          unzip -j -o "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip" \
            "mijn-ruimte-$VERSIE.voorstel.json" \
            "mijn-ruimte-$VERSIE.tar.gz.sha256" \
            "ONTWIKKELARCHIEF.json" \
            -d uitvoer
          SCHA="$(sha256sum "uitvoer/mijn-ruimte-$VERSIE.tar.gz" | cut -d' ' -f1)"
          echo "RELEASE_SHA=$SCHA" >> "$GITHUB_ENV"
          echo "pakket sha256: $SCHA"

      - name: Publiceer GitHub Release 20261106-141500 en verifieer TRACE-001
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          VERSIE="$RELEASE_VERSION"
          cat << EOF > "$RUNNER_TEMP/notes.md"
          ## Пряме посилання для встановлення (\`Admin → Оновлення\` / \`Updates\`)
          - **Інсталяційний архів (\`.tar.gz\`):** \`https://github.com/Tarasevych/hub/releases/download/$VERSIE/mijn-ruimte-$VERSIE.tar.gz\`
          - **SHA-256 (\`.tar.gz\`):** \`$RELEASE_SHA\`
          - **Пакет передачі (\`-overdracht.zip\`):** \`https://github.com/Tarasevych/hub/releases/download/$VERSIE/mijn-ruimte-$VERSIE-antigravity-overdracht.zip\`
          - **Встановлена серверна база (\`UITROL-BASIS\`):** \`20261105-061659\` @ \`a318ba0b1c731390217458dabadcf0e086d13635\` (канонічна після-рерайтна база \`f3f3fabb2f3b5209b1ee8eba3078e403de831844\`, \`regelsVersie 1.4.9\`, \`B-014\`)
          - **BRON-COMMIT:** $COMMIT (гілка \`audit/audit-2026-11-05-20261105-070523\`, злито в \`integratie\` та \`voornaamst\`)
          - **Журнал розробки (TRACE-001):** \`orchestratie/ontwikkelarchieven/AUDIT-001.json\`
          EOF
          gh release delete "$VERSIE" --yes --cleanup-tag || true
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-$VERSIE.tar.gz" \
            "uitvoer/mijn-ruimte-$VERSIE.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip" \
            "uitvoer/mijn-ruimte-$VERSIE.voorstel.json" \
            --target "$COMMIT" \
            --title "AUDIT-001 · $VERSIE (Консолідація аудиту 05.11.2026 на базі 20261105-061659)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | "\(.name) \(.digest)"' | tee "$RUNNER_TEMP/digest.txt"
          grep -q "sha256:$RELEASE_SHA" "$RUNNER_TEMP/digest.txt" || { echo "FOUT: digest op GitHub wijkt af van $RELEASE_SHA" >&2; exit 1; }
          # Voer exact de root-controle uit a318ba0:deploy/uitrol/mijn-ruimte-uitrol.sh uit (zonder GH_TOKEN)
          UITKOMST="$(python3 - "uitvoer/ONTWIKKELARCHIEF.json" "$COMMIT" "$VERSIE" "uitvoer/mijn-ruimte-$VERSIE.tar.gz" <<'PY'
          import base64, hashlib, json, os, re, stat, sys, urllib.request, urllib.parse, traceback
          f, bron, versie, pakket = sys.argv[1:]
          repo='Tarasevych/hub'
          if not re.fullmatch(r'[0-9a-f]{40}', bron):
              print('ONTWIKKELARCHIEF_ONGELDIG'); sys.exit()
          try:
              if os.path.getsize(f)>8192: raise ValueError('te groot')
              ref=json.load(open(f,encoding='utf-8'))
              taak=ref.get('taakId','')
              pad=f'orchestratie/ontwikkelarchieven/{taak}.json'
              commit=ref.get('commit','')
              tak=ref.get('tak','')
              if (ref.get('schema')!=1 or not re.fullmatch(r'[A-Z][A-Z0-9]{1,9}-\d{3,5}',taak)
                  or not re.fullmatch(r'(feature|fix|audit|release)/[a-z0-9-]+-\d{8}-\d{6}',tak)
                  or ref.get('repo')!=repo or commit!=bron or ref.get('pad')!=pad
                  or not re.fullmatch(r'[0-9a-f]{64}',ref.get('sha256',''))
                  or ref.get('url')!=f'https://github.com/{repo}/blob/{commit}/{pad}'
                  or ref.get('release')!=f'https://github.com/{repo}/releases/tag/{versie}'
                  or ref.get('pakket')!=f'mijn-ruimte-{versie}.tar.gz'):
                  raise ValueError('ongeldige herkomst')
          except Exception:
              traceback.print_exc()
              print('ONTWIKKELARCHIEF_ONGELDIG');sys.exit()
          headers={'Accept':'application/vnd.github+json','User-Agent':'Mijn-Ruimte-Uitrol-TRACE-001',
                   'X-GitHub-Api-Version':'2022-11-28'}
          class GeenOmleiding(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('redirect geweigerd')
          opener=urllib.request.build_opener(GeenOmleiding)
          def gh(url):
              req=urllib.request.Request(url,headers=headers)
              with opener.open(req,timeout=12) as r:
                  if r.status!=200: raise ValueError('HTTP_'+str(r.status))
                  data=r.read(800001)
                  if len(data)>800000: raise ValueError('te groot')
                  return json.loads(data)
          try:
              u=f'https://api.github.com/repos/{repo}/contents/{pad}?ref={commit}'
              item=gh(u)
              if item.get('type')!='file' or item.get('encoding')!='base64': raise ValueError('geen bestand')
              raw=base64.b64decode(item['content'])
              if len(raw)>256000 or hashlib.sha256(raw).hexdigest()!=ref['sha256']:
                  print('ONTWIKKELARCHIEF_SHA_VERSCHILT');sys.exit()
              doc=json.loads(raw)
              if (doc.get('schema')!=1 or doc.get('taakId')!=taak or
                  len(str(doc.get('opdracht','')).strip())<40 or
                  not all(isinstance(doc.get(x),list) and doc[x] for x in
                          ('tijdlijn','keuzes','wijzigingen','controles','bronnen','beperkingen')) or
                  doc.get('privacy',{}).get('geheimenUitgesloten') is not True):
                  raise ValueError('onvolledig dossier')
              branch=gh(f'https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(tak,safe="")}')
              head=branch.get('commit',{}).get('sha','')
              if not re.fullmatch(r'[0-9a-f]{40}',head): raise ValueError('geen tak')
              compare=gh(f'https://api.github.com/repos/{repo}/compare/{commit}...{head}')
              if compare.get('status') not in ('ahead','identical'):
                  print('ONTWIKKELARCHIEF_TAK_ONGELDIG');sys.exit()
              release=gh(f'https://api.github.com/repos/{repo}/releases/tags/{versie}')
              asset=next((a for a in release.get('assets',[]) if a.get('name')==ref['pakket']),None)
              if not asset or asset.get('state')!='uploaded':
                  print('ONTWIKKELARCHIEF_PAKKET_ONTBREEKT');sys.exit()
              digest=hashlib.file_digest(open(pakket,'rb'),'sha256').hexdigest()
              if asset.get('digest')!='sha256:'+digest:
                  print('ONTWIKKELARCHIEF_PAKKET_SHA_VERSCHILT');sys.exit()
              print('OK')
          except Exception:
              traceback.print_exc()
              print('ONTWIKKELARCHIEF_ONBEREIKBAAR')
          PY
          )"
          echo "TRACE-001 root-script uitkomst: $UITKOMST"
          test "$UITKOMST" = "OK"
