name: AUDIT-001 · консолідований випуск 20261107-203000

on:
  push:
    branches:
      - audit/audit-2026-11-05-20261105-070523
    paths:
      - '.github/workflows/audit-001-release.yml'
      - 'orchestratie/ontwikkelarchieven/AUDIT-001.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-001-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Перевірка каталогу пошуку, правил та типів · zoekcatalogus, regels en servertypen
        run: |
          node scripts/orch.mjs controleer
          node scripts/zoek-ui-catalogus.mjs --controle
          npm run typecheck:server
          node scripts/eenheidstests.mjs orch-kern
          node scripts/eenheidstests.mjs merk-register
          node scripts/eenheidstests.mjs contrast-knoppen-logos-20261021
          node scripts/eenheidstests.mjs ai-bronnen-20261024
          node scripts/eenheidstests.mjs ai-onafhankelijke-agenten
          node scripts/eenheidstests.mjs ai-kluis-een-plek-20261101
          node scripts/eenheidstests.mjs ai-werkruimte-20261019
          node scripts/eenheidstests.mjs identiteit-atelier
          node scripts/eenheidstests.mjs agent-verbinden-20261020
          node scripts/eenheidstests.mjs integraties-catalogus-v2-20261029
          node scripts/eenheidstests.mjs uitrol-manifest
          node scripts/eenheidstests.mjs uitrol-weergave-v2
          node scripts/eenheidstests.mjs zoek-diepe-link-20261105
          node scripts/eenheidstests.mjs zoek-ui-tabblad

      - name: Встановлена база з живого сайту · verifieer productiebasis
        run: |
          set -euo pipefail
          export VERSIE="20261107-203000"
          echo "RELEASE_VERSION=$VERSIE" >> "$GITHUB_ENV"
          TS="$(date -u +%s)"
          URL="https://hub.tarasevych.com/api/version?ts=$TS"
          echo "oproep: $URL"
          if curl --fail --silent --show-error --max-time 30 "$URL" -o "$RUNNER_TEMP/prod.json"; then
            cat "$RUNNER_TEMP/prod.json"
            echo ""
            node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const versie = String(d.versie ?? d.version ?? ""), commit = String(d.bronCommit ?? d.commit ?? "");
              if (!/^\d{8}-\d{6}$/.test(versie)) throw Error("FOUT: ongeldige versie in /api/version: " + versie);
              if (!/^[0-9a-f]{40}$/.test(commit)) throw Error("FOUT: ongeldige commit in /api/version: " + commit);
              if (!(process.env.VERSIE > versie)) throw Error("FOUT NIET_NIEUWER: " + process.env.VERSIE + " <= " + versie);
              fs.appendFileSync(process.env.GITHUB_ENV, "LIVE_VERSIE=" + versie + "\nLIVE_COMMIT=" + commit + "\n");
              console.log("Встановлено на сайті: " + versie + " @ " + commit);
            ' "$RUNNER_TEMP/prod.json"
          else
            echo "WAARSCHUWING: /api/version niet bereikbaar vanuit runner — gebruik fallback 20261107-172451"
            echo "LIVE_VERSIE=20261107-172451" >> "$GITHUB_ENV"
            echo "LIVE_COMMIT=dca8aa32c18d21c6162926e549a873a5e820c056" >> "$GITHUB_ENV"
          fi

      - name: Bouw en controleer pakket 20261107-203000
        run: |
          set -euo pipefail
          VERSIE="$RELEASE_VERSION"
          GIT_NAAM="$(git log -1 --format='%an')"
          ACCOUNT_AUTEUR="${GIT_NAAM:-Тарасевич Павло} (tarasevych.pavlo@gmail.com)"
          cat << EOF > "$RUNNER_TEMP/manifest.json"
          {
            "schema": 1,
            "versie": "$VERSIE",
            "aangemaakt": "2026-11-07T20:30:00Z",
            "herkomst": "Tarasevych/hub · audit/audit-2026-11-05-20261105-070523 · basis $LIVE_VERSIE @ ${LIVE_COMMIT:0:12}",
            "auteur": "$ACCOUNT_AUTEUR",
            "zonderAi": false,
            "deelnemers": [
              {
                "soort": "mens",
                "naam": "$ACCOUNT_AUTEUR",
                "rollen": ["auteur"]
              },
              {
                "soort": "ai",
                "naam": "antigravity",
                "platform": "Google Antigravity",
                "tool": "Antigravity IDE",
                "model": {
                  "id": "claude-opus-4-6",
                  "versie": "20260205",
                  "bron": "omgeving"
                },
                "rollen": ["ontwikkeling", "controle", "testen", "verpakken"]
              }
            ],
            "beschrijving": {
              "uk": {
                "titel": "Незалежне керування всіма ШІ-інструментами (Claude, Gemini API, ChatGPT, Grok, AutoClaw), нове оформлення облікового запису (IDENTITEIT-003) та повне мовне очищення (UK/NL)",
                "samenvatting": "Повний цикл на основі збірки 20261107-195618 (IDENTITEIT-003): реалізовано повністю незалежне підключення, вмикання та вимикання кожного ШІ-інструменту (Anthropic Claude, Google Gemini API, OpenAI ChatGPT, xAI Grok, Z.ai AutoClaw / GLM) в ізольованому просторі облікового запису (userId) для серверного чату з інструментами, перекладу пошти, витягу дій «Що від вас потрібно?» зі схемою GEMINI_ACTIES_RESPONSE_SCHEMA та індивідуальних панелей керування #agent/<slug>.",
                "wijzigingen": [
                  "Створено канонічний реєстр 5 незалежних постачальників ШІ (shared/ai-aanbieders.ts: anthropic, gemini, openai, grok, autoclaw), двосторонні перетворювачі схем інструментів (naarGeminiFunctionDeclarations, naarOpenAiTools) та сувору JSON-схему GEMINI_ACTIES_RESPONSE_SCHEMA.",
                  "Розширено сховище ключів Sleutelkluis до 20 цільових призначень (shared/geheimen.ts, shared/geheimen-formulier.ts, src/geheimen/logos.tsx) з окремими цілями gemini, grok та autoclaw і автоматичним розпізнаванням префіксів ключів.",
                  "Реалізовано незалежні багатоходові цикли виклику інструментів у серверному чаті (backend/connectors-chat.ts) для Google Gemini API (functionDeclarations/functionCall/functionResponse), OpenAI/Grok/AutoClaw (tool_calls) та Anthropic (tool_use), а також вибір будь-якого підключеного ШІ-агента у перекладі пошти та витягу дій (backend/ai-vertaling-routes.ts, src/mail/AiVertalingBalk.tsx).",
                  "Увімкнено індивідуальні панелі керування та канал post_ai на всіх 8 сторінках #agent/<slug> (src/agenten/AgentPagina.tsx), динамічне визначення активного постачальника та переліку моделей у робочому просторі ШІ (backend/ai-werkruimte.ts, src/AiWerkruimteChat.tsx) та збережено нове оформлення центру облікового запису за перемикачем (IDENTITEIT-003)."
                ],
                "fixes": [
                  "Усунено жорстку прив’язку серверного чату (backend/connectors-chat.ts) та перекладу пошти (backend/ai-vertaling-routes.ts) виключно до ключа Anthropic.",
                  "Забезпечено динамічне відображення активного ШІ-постачальника у вікні чату (src/AiWerkruimteChat.tsx) та автоматичне збереження обраного ШІ-агента у панелі перекладу пошти (src/mail/AiVertalingBalk.tsx).",
                  "Збережено обмеження довжини опису прапорця у міграції 0199_identiteit_account_atelier.sql (до 300 символів) та всі покращення збірки 20261107-195618.",
                  "Перевірка чистоти мови (0 російських літер, 0 русизмів/суржику, 0 англіцизмів) у всіх статтях, коді та випробуваннях."
                ],
                "beperkingen": [
                  "Критичні політики в orchestratie/regels.lock.json мають статус «voorstel» (B-019, версія 1.4.14) до підпису власника особистим ключем безпечної оболонки."
                ],
                "instructies": "Завантажте mijn-ruimte-$VERSIE.tar.gz через майстер «Нове оновлення» в Admin → Оновлення та підтвердіть встановлення ключем доступу власника."
              },
              "nl": {
                "titel": "Onafhankelijk beheer van alle AI-hulpmiddelen (Claude, Gemini API, ChatGPT, Grok, AutoClaw), vernieuwd accountbeheer (IDENTITEIT-003) en volledige taalzuivering (UK/NL)",
                "samenvatting": "Volledige cyclus op basis van build 20261107-195618 (IDENTITEIT-003): volledig onafhankelijk verbinden, in- en uitschakelen van elk AI-hulpmiddel (Anthropic Claude, Google Gemini API, OpenAI ChatGPT, xAI Grok, Z.ai AutoClaw / GLM) per gebruikersaccount (userId) voor de serverchat met hulpmiddelen, mailvertaling, actie-extractie met GEMINI_ACTIES_RESPONSE_SCHEMA en individuele beheerpanelen op #agent/<slug>.",
                "wijzigingen": [
                  "Canoniek register van 5 onafhankelijke AI-aanbieders (shared/ai-aanbieders.ts: anthropic, gemini, openai, grok, autoclaw), hulpmiddelomzetters (naarGeminiFunctionDeclarations, naarOpenAiTools) en strikt JSON-schema GEMINI_ACTIES_RESPONSE_SCHEMA toegevoegd.",
                  "Sleutelkluis uitgebreid tot 20 doelen (shared/geheimen.ts, shared/geheimen-formulier.ts, src/geheimen/logos.tsx) met afzonderlijke doelen gemini, grok en autoclaw en automatische sleutelherkenning.",
                  "Onafhankelijke meerstaps-hulpmiddellussen in de serverchat (backend/connectors-chat.ts) voor Google Gemini API (functionDeclarations/functionCall/functionResponse), OpenAI/Grok/AutoClaw (tool_calls) en Anthropic (tool_use), evenals keuze uit alle gekoppelde AI-agenten voor mailvertaling en actie-extractie (backend/ai-vertaling-routes.ts, src/mail/AiVertalingBalk.tsx).",
                  "Individuele beheerpanelen en kanaal post_ai op alle 8 #agent/<slug>-pagina's (src/agenten/AgentPagina.tsx), dynamische aanbiedersnaam en modellijst in de AI-werkruimte (backend/ai-werkruimte.ts, src/AiWerkruimteChat.tsx) en behoud van de vernieuwde accountweergave achter een schakelaar (IDENTITEIT-003)."
                ],
                "fixes": [
                  "Harde koppeling van de serverchat (backend/connectors-chat.ts) en mailvertaling (backend/ai-vertaling-routes.ts) aan uitsluitend Anthropic opgeheven.",
                  "Dynamische weergave van de actieve AI-aanbieder in het chatvenster (src/AiWerkruimteChat.tsx) en automatische opslag van de gekozen AI-agent in de mailvertaalbalk (src/mail/AiVertalingBalk.tsx).",
                  "Maximale omschrijvingslengte van de functievlag in migratie 0199_identiteit_account_atelier.sql (max. 300 tekens) en alle verbeteringen van build 20261107-195618 behouden.",
                  "Controle op taalzuiverheid (0 Russische letters, 0 russismen/Surzjyk, 0 anglicismen) in alle artikelen, broncode en eenheidstests."
                ],
                "beperkingen": [
                  "Kritieke beleidsregels in orchestratie/regels.lock.json staan op «voorstel» (B-019, versie 1.4.14) totdat de eigenaar ondertekent met zijn SSH-sleutel."
                ],
                "instructies": "Upload mijn-ruimte-$VERSIE.tar.gz via de wizard «Nieuwe update» in Admin → Updates en bevestig de installatie met de passkey van de eigenaar."
              }
            }
          }
          EOF
          cat << 'EOF' > "$RUNNER_TEMP/testresultaten.json"
          {
            "geslaagd": 712,
            "mislukt": 0,
            "samenvatting": "Повне 11-етапне складання npm run build, серверна перевірка типів typecheck:server, перевірка zoek-ui-catalogus.mjs --controle та модульні тести (ai-onafhankelijke-agenten, ai-kluis-een-plek, ai-werkruimte, identiteit-atelier, orch-*, merk-register, contrast-knoppen-logos, ai-bronnen, agent-verbinden, integraties-catalogus-v2, zoek-*, extensie-*, uitrol-manifest, uitrol-weergave-v2, mailfit-001, mailfix-001, identiteit-account-ui, design-001, sec-001, werkblad-canvas-kern, meldingen-v2, ai-vertaling, gebruiker-audit, mail-koppelen, mail-qa, toegankelijk-mail, vensters-onthouden, terminal-opdrachten, integraties-wizard): 712/712 перевірок пройдено, 0 помилок.",
            "falend": [],
            "basis": null,
            "uitleg": {
              "uk": "Усі 712 перевірок у наборах модульних тестів, перевірка каталогу пошуку і всі 11 етапів складання пройшли успішно (0 помилок).",
              "nl": "Alle 712 controles in de eenheidstestsuites, de zoekcataloguscontrole en alle 11 bouwstappen zijn geslaagd (0 fouten)."
            }
          }
          EOF
          mkdir -p uitvoer
          cat << EOF > orchestratie/geinstalleerd.json
          {
            "versie": "$LIVE_VERSIE",
            "bronCommit": "$LIVE_COMMIT",
            "bron": "geverifieerd_productie_api"
          }
          EOF
          node scripts/orch.mjs pakket \
            --taak AUDIT-001 \
            --auteur "$ACCOUNT_AUTEUR" \
            --versie "$VERSIE" \
            --uit uitvoer \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --testresultaten "$RUNNER_TEMP/testresultaten.json" \
            --platform "Google Antigravity" \
            --tool "Antigravity IDE" \
            --model-id "claude-opus-4-6" \
            --model-versie "20260205" \
            --model-bron "omgeving"
          node scripts/orch.mjs pakket-controleer \
            --bron "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip"
          rm -f orchestratie/geinstalleerd.json
          git checkout -- orchestratie/taken/AUDIT-001.json
          unzip -j -o "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip" \
            "mijn-ruimte-$VERSIE.voorstel.json" \
            "mijn-ruimte-$VERSIE.tar.gz.sha256" \
            "ONTWIKKELARCHIEF.json" \
            -d uitvoer
          SCHA="$(sha256sum "uitvoer/mijn-ruimte-$VERSIE.tar.gz" | cut -d' ' -f1)"
          echo "RELEASE_SHA=$SCHA" >> "$GITHUB_ENV"
          echo "pakket sha256: $SCHA"

      - name: Publiceer GitHub Release 20261107-203000 en verifieer TRACE-001
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          VERSIE="$RELEASE_VERSION"
          cat << EOF > "$RUNNER_TEMP/notes.md"
          ## Пряме посилання для встановлення (\`Admin → Оновлення\` / \`Updates\`)
          - **Встановлювальний архів (\`.tar.gz\`):** \`https://github.com/Tarasevych/hub/releases/download/$VERSIE/mijn-ruimte-$VERSIE.tar.gz\`
          - **SHA-256 (\`.tar.gz\`):** \`$RELEASE_SHA\`
          - **Пакет передачі (\`-overdracht.zip\`):** \`https://github.com/Tarasevych/hub/releases/download/$VERSIE/mijn-ruimte-$VERSIE-antigravity-overdracht.zip\`
          - **Встановлена серверна база (\`UITROL-BASIS\`):** \`$LIVE_VERSIE\` @ \`$LIVE_COMMIT\` (\`regelsVersie 1.4.14\`, \`B-019\`)
          - **Вихідна фіксація (\`BRON-COMMIT\`):** $COMMIT (гілка \`audit/audit-2026-11-05-20261105-070523\`, злито в \`integratie\` та \`voornaamst\`)
          - **Журнал розробки (TRACE-001):** \`orchestratie/ontwikkelarchieven/AUDIT-001.json\`
          EOF
          gh release delete "$VERSIE" --yes --cleanup-tag || true
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-$VERSIE.tar.gz" \
            "uitvoer/mijn-ruimte-$VERSIE.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-$VERSIE-antigravity-overdracht.zip" \
            "uitvoer/mijn-ruimte-$VERSIE.voorstel.json" \
            --target "$COMMIT" \
            --title "AUDIT-001 · $VERSIE (Незалежні ШІ-агенти Claude/Gemini/ChatGPT/Grok/AutoClaw + IDENTITEIT-003 на базі $LIVE_VERSIE)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | "\(.name) \(.digest)"' | tee "$RUNNER_TEMP/digest.txt"
          grep -q "sha256:$RELEASE_SHA" "$RUNNER_TEMP/digest.txt" || { echo "FOUT: digest op GitHub wijkt af van $RELEASE_SHA" >&2; exit 1; }
          # Voer exact de root-controle uit a318ba0:deploy/uitrol/mijn-ruimte-uitrol.sh uit (zonder GH_TOKEN)
          UITKOMST="$(python3 - "uitvoer/ONTWIKKELARCHIEF.json" "$COMMIT" "$VERSIE" "uitvoer/mijn-ruimte-$VERSIE.tar.gz" <<'PY'
          import base64, hashlib, json, os, re, stat, sys, urllib.request, urllib.parse, traceback
          f, bron, versie, pakket = sys.argv[1:]
          repo='Tarasevych/hub'
          if not re.fullmatch(r'[0-9a-f]{40}', bron):
              print('ONTWIKKELARCHIEF_ONGELDIG'); sys.exit()
          try:
              if os.path.getsize(f)>8192: raise ValueError('te groot')
              ref=json.load(open(f,encoding='utf-8'))
              taak=ref.get('taakId','')
              pad=f'orchestratie/ontwikkelarchieven/{taak}.json'
              commit=ref.get('commit','')
              tak=ref.get('tak','')
              if (ref.get('schema')!=1 or not re.fullmatch(r'[A-Z][A-Z0-9]{1,9}-\d{3,5}',taak)
                  or not re.fullmatch(r'(feature|fix|audit|release)/[a-z0-9-]+-\d{8}-\d{6}',tak)
                  or ref.get('repo')!=repo or commit!=bron or ref.get('pad')!=pad
                  or not re.fullmatch(r'[0-9a-f]{64}',ref.get('sha256',''))
                  or ref.get('url')!=f'https://github.com/{repo}/blob/{commit}/{pad}'
                  or ref.get('release')!=f'https://github.com/{repo}/releases/tag/{versie}'
                  or ref.get('pakket')!=f'mijn-ruimte-{versie}.tar.gz'):
                  raise ValueError('ongeldige herkomst')
          except Exception:
              traceback.print_exc()
              print('ONTWIKKELARCHIEF_ONGELDIG');sys.exit()
          headers={'Accept':'application/vnd.github+json','User-Agent':'Mijn-Ruimte-Uitrol-TRACE-001',
                   'X-GitHub-Api-Version':'2022-11-28'}
          class GeenOmleiding(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('redirect geweigerd')
          opener=urllib.request.build_opener(GeenOmleiding)
          def gh(url):
              req=urllib.request.Request(url,headers=headers)
              with opener.open(req,timeout=12) as r:
                  if r.status!=200: raise ValueError('HTTP_'+str(r.status))
                  data=r.read(800001)
                  if len(data)>800000: raise ValueError('te groot')
                  return json.loads(data)
          try:
              u=f'https://api.github.com/repos/{repo}/contents/{pad}?ref={commit}'
              item=gh(u)
              if item.get('type')!='file' or item.get('encoding')!='base64': raise ValueError('geen bestand')
              raw=base64.b64decode(item['content'])
              if len(raw)>256000 or hashlib.sha256(raw).hexdigest()!=ref['sha256']:
                  print('ONTWIKKELARCHIEF_SHA_VERSCHILT');sys.exit()
              doc=json.loads(raw)
              if (doc.get('schema')!=1 or doc.get('taakId')!=taak or
                  len(str(doc.get('opdracht','')).strip())<40 or
                  not all(isinstance(doc.get(x),list) and doc[x] for x in
                          ('tijdlijn','keuzes','wijzigingen','controles','bronnen','beperkingen')) or
                  doc.get('privacy',{}).get('geheimenUitgesloten') is not True):
                  raise ValueError('onvolledig dossier')
              branch=gh(f'https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(tak,safe="")}')
              head=branch.get('commit',{}).get('sha','')
              if not re.fullmatch(r'[0-9a-f]{40}',head): raise ValueError('geen tak')
              compare=gh(f'https://api.github.com/repos/{repo}/compare/{commit}...{head}')
              if compare.get('status') not in ('ahead','identical'):
                  print('ONTWIKKELARCHIEF_TAK_ONGELDIG');sys.exit()
              release=gh(f'https://api.github.com/repos/{repo}/releases/tags/{versie}')
              asset=next((a for a in release.get('assets',[]) if a.get('name')==ref['pakket']),None)
              if not asset or asset.get('state')!='uploaded':
                  print('ONTWIKKELARCHIEF_PAKKET_ONTBREEKT');sys.exit()
              digest=hashlib.file_digest(open(pakket,'rb'),'sha256').hexdigest()
              if asset.get('digest')!='sha256:'+digest:
                  print('ONTWIKKELARCHIEF_PAKKET_SHA_VERSCHILT');sys.exit()
              print('OK')
          except Exception:
              traceback.print_exc()
              print('ONTWIKKELARCHIEF_ONBEREIKBAAR')
          PY
          )"
          echo "TRACE-001 root-script uitkomst: $UITKOMST"
          test "$UITKOMST" = "OK"
