name: 'HERSTEL-001 · Повний зведений випуск «Мій простір»: потокове Telegram-архівування, CONSOL-001, решта UITROLBOT-001, капсули сповіщень, живий фон у меню та «Живий простір»'

# Ніколи не встановлює пакунок на живий сервер автоматично. Перед оприлюдненням звіряє основу root на сервері
# (20261123-145553 @ f56ba3fea1e4; при тимчасовому відкаті /api/version на 20261122-171856), правила координації 1.8.0 (B-027 / VLAG-001),
# сторож бази сповіщень MELDINGEN-REGISTER-001, типи клієнта й сервера, статичні контракти, TRACE-001, 12 стендів «Плюща» на Node 24,
# 20 хмарних випробувань, подвійний прогін усіх міграцій 0001..0341 на PostgreSQL 16 із трьома ролями, ключові регресійні та
# HERSTEL-001/UITROLBOT-001 випробування (включно з потоковим тестом Telegram на 48 МБ), повне складання з CRX3 0.9.7, реєстр 30 прапорців VLAG-001, pakketVoorcontrole та перевірку root TRACE-001.
# Installeert nooit automatisch. Controleert vooraf de root-basis (20261123-145553 @ f56ba3fea1e4), coördinatieregels 1.8.0 (B-027 / VLAG-001),
# MELDINGEN-REGISTER-001, client- en servertypen, statische contracten, TRACE-001, 12 Klimop-proeven op Node 24, 20 cloudtests,
# dubbele migraties 0001..0341 op PostgreSQL 16 met drie rollen, stroomgebaseerde Telegram-test van 48 MB, volledige bouw met CRX3 0.9.7, 30 vlaggen, pakketVoorcontrole en root TRACE-001.
on:
  push:
    branches:
      - fix/herstel-001-consol-nazorg-20261123-172600
    paths:
      - .github/workflows/herstel-001-uitgave.yml
      - orchestratie/ontwikkelarchieven/HERSTEL-001.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: herstel-001-uitgave
  cancel-in-progress: false

env:
  TAAK: HERSTEL-001
  # Фактична найвища встановлена база root на сервері ($WERK_ROOT/laatste-versie та laatste-commit): CONSOL-001 (20261123-145553 @ f56ba3fea1e4);
  # якщо /api/version тимчасово повертає відкочений процес 20261122-171856, дозволяємо це, але UITROL-BASIS завжди береться від 20261123-145553.
  BEKENDE_BASISSEN: '20261122-171856=c85e5d73f104f555021c6a896ffecb70256588d3 20261123-145553=f56ba3fea1e4da191970e57c9a92272ba861e3ad 20261125-090113=c4271d894d36d46c6994772fb2003e93fd3decaf'
  ROOT_BASIS_VERSIE: '20261123-145553'
  ROOT_BASIS_COMMIT: 'f56ba3fea1e4da191970e57c9a92272ba861e3ad'
  INTEGRATIE_BASIS: '8890f85a1c34c9f12e945eb78bd2e8588cceb56a'
  MODEL_ID: ${{ inputs.model_id || 'Gemini 3.1 Pro' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "fix/herstel-001-consol-nazorg-20261123-172600" ]; then
            echo "Випуск HERSTEL-001 можна запускати лише з гілки fix/herstel-001-consol-nazorg-20261123-172600." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити системні інструменти та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            const liveVersie = v.versie;
            const liveCommit = v.bronCommit || v.commit;
            if (bekend.get(liveVersie) !== liveCommit) {
              throw Error(`Встановлена версія (${liveVersie} @ ${liveCommit}) не входить до відомих основ цієї гілки. Випуск зупинено.`);
            }
            console.log(`Жива відповідь /api/version: ${liveVersie} @ ${liveCommit}`);
          } else if (['000', '403', '429', '502', '504', '522', '524', '530'].includes(code)) {
            console.log(`Зовнішній тунель тимчасово відхилив запит без сеансу (HTTP ${code}); продовжуємо зі звіреною базою root.`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const versie = process.env.ROOT_BASIS_VERSIE;
          const levend = process.env.ROOT_BASIS_COMMIT;
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_root_basis' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з базою root ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації 1.8.0 (VLAG-001), сторож бази сповіщень та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          DOEL_BASIS="${BASIS_COMMIT:-f56ba3fea1e4da191970e57c9a92272ba861e3ad}"
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen "$DOEL_BASIS"
          node scripts/vaardigheden/valideer.mjs
          node scripts/meldingen-register-controle.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/HERSTEL-001.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'HERSTEL-001');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал HERSTEL-001 дійсний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, 12 стендів «Плюща», 20 хмарних і ключові безбазові випробування
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/klant-servergrens-controle.mjs --stil
          node deploy/agent/agent.mjs selftest --root /tmp
          for s in \
            scripts/klimop-etappe0-audit.mjs \
            scripts/klimop-proefnetwerk.mjs \
            scripts/klimop-etappe3-opslag-proef.mjs \
            scripts/klimop-etappe4-frost-proef.mjs \
            scripts/klimop-etappe5-identiteit-proef.mjs \
            scripts/klimop-etappe6-bestuur-proef.mjs \
            scripts/klimop-etappe7-immuunsysteem-proef.mjs \
            scripts/klimop-etappe8-diensten-proef.mjs \
            scripts/klimop-etappe9-mensbescherming-proef.mjs \
            scripts/klimop-etappe10-hechtranken-proef.mjs \
            scripts/klimop-etappe11-beveiligingsaudit-proef.mjs \
            scripts/klimop-etappe12-zaden-proef.mjs; do
            node "$s" >/dev/null
          done
          for f in tests/eenheid/cloud-*.test.mjs; do
            printf '=== FILE: %s ===\n' "$f" >> "$RUNNER_TEMP/eenheidstests.log"
            node --test "$f" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          for t in \
            herstel-001-aanmelden-mobiel-vier-gebreken \
            herstel-001-telegram-aanmelden-tien-gebreken \
            herstel-001-google-terugkeer-staat-verlopen \
            herstel-001-meldingen-tien-gebreken \
            herstel-001-mail-weergave-twaalf-gebreken \
            uitrolbot-uitleg-20261122 \
            herstel-001-telegram-archief-stroom \
            uitrol-vereisten-001 \
            vlag-001-pakket \
            herstel-001-kapsel-aflevering \
            herstel-001-laad-kapsel \
            herstel-001-menu-bellen-mobiel \
            herstel-001-puls-icoon-knoppen \
            herstel-001-tech-poort-maquette \
            herstel-001-telegram-storm-en-lang-schermafbeelding \
            herstel-001-crm-subdomein-en-route \
            meldpaneel-002-aandachtspuls-20261122 \
            meldpaneel-003-thema-ruimte-register-20261122 \
            accountmenu-v3 \
            accountmenu-strook-20261115 \
            levende-achtergrond-20261115 \
            kleuren-001-zone \
            werkblad-v3-normalisatie \
            werkblad-indeling-20261022 \
            werkblad-plekken-20261028 \
            werkblad-register-20261027 \
            consol-m5b-vlaggen-20261123 \
            bijlage-weergave-gedeeld \
            bijlage-weergave-etappe2 \
            klantrelatie-integratie-20261122 \
            klimop-001-manifest-agenten-20261120 \
            klimop-022-sluit-audit003-restbevindingen-20261121; do
            printf '=== FILE: %s.test.ts ===\n' "$t" >> "$RUNNER_TEMP/eenheidstests.log"
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
      - name: Перевірити типи клієнта й сервера та виконати повне виробниче складання
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Подвійний прогін усіх міграцій 0001..0341 на PostgreSQL 16 із трьома ролями та базові випробування
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          export DATABASE_URL=postgres://migratie:migratie@127.0.0.1:5432/mijnruimte_schoon
          export MIGRATIONS_DIR="$PWD/migrations"
          export TOTP_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export RECOVERY_CODE_PEPPER="$(openssl rand -base64 32)"
          export AUDIT_IP_PEPPER="$(openssl rand -base64 40)"
          export SESSION_SECRET="$(openssl rand -base64 32)"
          export OWNER_VAULT_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export GOOGLE_OAUTH_GRANT_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export MAIL_APP_WACHTWOORD_SLEUTEL_V1="$(openssl rand -hex 32)"
          export SLEUTELKLUIS_SLEUTEL_V1="$(openssl rand -hex 32)"
          export MAIL_TOKEN_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export AGENDA_ABONNEMENT_SLEUTEL_V1="$(openssl rand -hex 32)"
          export GITHUB_KOPPELING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export CLOUD_OAUTH_TOKEN_ENCRYPTION_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M8_CURSOR_KEY_V1="$(openssl rand -hex 32)"
          export CLOUD_M6_CI_ATTESTATION_HMAC_KEY="$(openssl rand -hex 32)"
          export RUIMTE_BINDING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export AI_BEVESTIGING_SLEUTEL_V1="$(openssl rand -hex 32)"
          export SESSION_PEPPER="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_GITHUB_WEBHOOK_GEHEIM="$(openssl rand -hex 24)"
          export UITROL_TELEGRAM_ARCHIEF_SLEUTEL="$(openssl rand -hex 32)"
          export TELEGRAM_AANMELD_PEPER="$(openssl rand -hex 24)"
          export AFZENDER_BEELD_PEPPER="$(openssl rand -hex 24)"
          export OWNER_EMAIL='eigenaar@example.invalid'
          export UPLOADS_DIR="$RUNNER_TEMP/uploads"
          export DIST_DIR="$PWD/dist"
          mkdir -p "$UPLOADS_DIR"

          node dist-server/migrate.mjs | tail -5
          W_MIG="$(openssl rand -hex 24)"
          W_APP="$(openssl rand -hex 24)"
          W_SYS="$(openssl rand -hex 24)"
          S_MIG="$(printf '%s\n' "$W_MIG" | node deploy/scram-verifier.mjs)"
          S_APP="$(printf '%s\n' "$W_APP" | node deploy/scram-verifier.mjs)"
          S_SYS="$(printf '%s\n' "$W_SYS" | node deploy/scram-verifier.mjs)"
          psql "$DATABASE_URL" -v legacy_rol=migratie -v migrator_scram="$S_MIG" -v app_scram="$S_APP" -v systeem_scram="$S_SYS" -f deploy/db-rollen.sql
          export DATABASE_URL_APP="postgres://mijnruimte_app:${W_APP}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_MIGRATIE="postgres://mijnruimte_migrator:${W_MIG}@127.0.0.1:5432/mijnruimte_schoon"
          export DATABASE_URL_SYSTEM="postgres://mijnruimte_system:${W_SYS}@127.0.0.1:5432/mijnruimte_schoon"
          node dist-server/migrate.mjs | tail -5

          for t in \
            rls \
            rls-groepen \
            vlaggen \
            herstel-001-verbinding-meldingen-bewijs \
            werkblad-v3-routes \
            uitrol-telegram-en-github-ontvangen-20261115 \
            uitrol-goedkeuring \
            uitrol-stroom \
            uitrol-risico-20261116 \
            bijlage-weergave-voltooiing-20261122 \
            verdeelde-opslag-rls-0311; do
            printf '=== FILE: %s.test.ts ===\n' "$t" >> "$RUNNER_TEMP/eenheidstests.log"
            node scripts/eenheidstests.mjs "$t.test.ts" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          git diff --exit-code
          git diff --cached --exit-code
      - name: Сформувати двомовний опис випуску, реєстр 30 прапорців VLAG-001 та підсумок перевірок
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          VERSIE="$VERSIE" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const e = process.env;
          const auteur = 'Тарасевич Павло (tarasevych.pavlo@gmail.com)';
          const functievlaggen = [
            { sleutel: 'lezer-fout-blijft-open-v1', migratie: '0308_posta_lezer_vlaggen.sql' },
            { sleutel: 'mail-tekst-utf8-terugval-v1', migratie: '0308_posta_lezer_vlaggen.sql' },
            { sleutel: 'maquette-zwevend-rail-verbergen-v1', migratie: '0308_posta_lezer_vlaggen.sql' },
            { sleutel: 'posta-vensters-herstel-v1', migratie: '0309_posta_vensters_herstel.sql' },
            { sleutel: 'bijlage-weergave-gedeeld-v1', migratie: '0310_bijlage_weergave_gedeeld.sql' },
            { sleutel: 'klantrelatiebeheer-v1', migratie: '0312_klantrelatiebeheer_rls_en_vlag.sql' },
            { sleutel: 'mail-dienstbruggen-v1', migratie: '0313_mail_bruggen_vlag.sql' },
            { sleutel: 'agenda-koppelingen-v1', migratie: '0315_agenda_koppelingen_vlag.sql' },
            { sleutel: 'notities-agenda-brug-v1', migratie: '0316_notities_agenda_brug.sql' },
            { sleutel: 'cloud-m4-koppelingen-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m5-catalogus-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m6-beheer-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m8-mappen-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m10-beheer-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m10-omgeving-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-m11-voorbeeld-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'cloud-webdav-v1', migratie: '0317_cloud_bruggen_vlag.sql' },
            { sleutel: 'foto-google-drive-v1', migratie: '0318_foto_dienst_afwerking.sql' },
            { sleutel: 'werkblad-snelkoppelingen-v1', migratie: '0319_werkblad_snelkoppelingen.sql' },
            { sleutel: 'social-overzicht-v1', migratie: '0320_social_overzicht_vlag.sql' },
            { sleutel: 'aanmeldmethoden-kaart-v2', migratie: '0321_aanmeldmethoden_kaart_v2_vlag.sql' },
            { sleutel: 'telegram-aanmeld-maket-v1', migratie: '0321_aanmeldmethoden_kaart_v2_vlag.sql' },
            { sleutel: 'integraties-adapter-opslaan-v1', migratie: '0324_integratie_adapter_koppeling.sql' },
            { sleutel: 'afstemming-volledig-v1', migratie: '0325_afstemming_volledig_vlag.sql' },
            { sleutel: 'ai-chat-apparaatkeuze-v1', migratie: '0326_ai_chat_apparaatkeuze_vlag.sql' },
            { sleutel: 'api-platform-lees-v1', migratie: '0327_api_platform_lees_scopes_vlag.sql' },
            { sleutel: 'mcp-bronnen-live-v1', migratie: '0328_mcp_bronnen_live_vlag.sql' },
            { sleutel: 'uitrol-telegram-koppeling-v1', migratie: '0329_uitrol_telegram_koppeling_vlag.sql' },
            { sleutel: 'melding-verbinding-bewijs-v1', migratie: '0336_melding_verbinding_bewijs_vlag.sql' },
            { sleutel: 'melding-kapsel-aflevering-v1', migratie: '0340_melding_kapsel_aflevering_vlag.sql' }
          ];
          const uk = {
