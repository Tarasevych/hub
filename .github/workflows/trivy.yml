# Перевірка залежностей та налаштувань файлової системи за допомогою Trivy (режим fs без Docker).

name: trivy

on:
  push:
    branches: [ "voornaamst" ]
  pull_request:
    branches: [ "voornaamst" ]
  schedule:
    - cron: '26 19 * * 4'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: Trivy fs
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код сховища
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Запустити сканер Trivy для файлової системи
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          scanners: 'vuln,misconfig,secret'

      - name: Передати результати Trivy до GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
