name: MOBIEL-001 · перевірка та випуск смартфонного оформлення

# Цей процес нічого не встановлює. Власник окремо схвалює випуск ключем доступу.
# Deze werkwijze installeert niets. De eigenaar keurt een uitgave afzonderlijk goed.
on:
  push:
    branches:
      - 'fix/mobiel-001-20261108-100838'
    paths:
      - '.github/workflows/mobiel-001-uitgave.yml'
      - 'src/identiteit/**'
      - 'tests/e2e/identiteit-mobiel.e2e.ts'
      - 'tests/e2e/hulp/identiteit-mobiel-stand/**'
      - 'orchestratie/ontwikkelarchieven/MOBIEL-001.json'

permissions:
  contents: write

concurrency:
  group: mobiel-001-uitgave
  cancel-in-progress: false

env:
  TAAK: MOBIEL-001
  BASIS_VERSIE: '20261108-091200'
  BASIS_COMMIT: '6c7f9f0049e26512aac938fc746f7957391ff9f1'

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bronbestanden ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node voorbereiden
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Afhankelijkheden installeren
        run: npm ci --ignore-scripts
      - name: Actieve versie vaststellen
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/mobiel-001-20261108-100838'
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/actieve-versie.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const v=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/actieve-versie.json','utf8'));
          if(v.versie!==process.env.BASIS_VERSIE || (v.bronCommit||v.commit)!==process.env.BASIS_COMMIT){
            throw new Error('Встановлена основа змінилася; випуск зупинено.');
          }
          JS
      - name: Правила і джерела
        run: |
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/eenheidstests.mjs identiteit-atelier
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief
          node scripts/eenheidstests.mjs uitrol-voorcontrole
      - name: Типи і складання
        run: |
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=6144 npm run build
      - name: Справжні вузькі екрани у браузері
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core install chromium
            CHROME="$(node -p 'require("playwright-core").chromium.executablePath()')"
          fi
          test -x "$CHROME"
          PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core" CHROME="$CHROME" \
            node scripts/e2e-lokaal.mjs identiteit-mobiel
      - name: Підтвердити незмінність файлів
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Дані випуску
        id: gegevens
        shell: bash
        run: |
          set -euo pipefail
          VERSIE="$(date -u +%Y%m%d-%H%M%S)"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"
          if gh release view "$VERSIE" >/dev/null 2>&1; then
            echo 'Версія вже існує.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const e=process.env;
          const uk={titel:'Придатний до смартфона центр облікового запису',samenvatting:'Відновлено читабельне розташування налаштувань на смартфонах: картки в межах екрана, стримані ілюстрації та єдина висувна навігація без накладання плаваючих кнопок.',wijzigingen:['Одна висувна навігація на телефонах замість конфліктних положень і окремих кнопок.','Картки, малюнки, вибір мов, поля та налаштування вписано у вузький екран.','Збережено дванадцять розділів, чинні дії та налаштування комп’ютерної навігації.'],fixes:['Прибрано зміщення навігації за межі екрана та накладання її кнопок.','Виправлено надмірні ширини, обрізання текстів і некероване розташування ілюстрацій.'],beperkingen:['Окремі сторінки поза центром облікового запису потребують самостійної перевірки.','Новий вигляд слід спершу перевірити на телефоні в режимі «Тільки я».'],instructies:'Установіть архів через admin.tarasevych.com із підтвердженням ключем доступу. Спершу перевірте новий вигляд лише для себе.'};
          const nl={titel:'Accountcentrum voor smartphones',samenvatting:'Het accountcentrum past weer op smartphones: leesbare kaarten, ingetogen illustraties en één uitklapbare navigatie zonder overlappende losse knoppen.',wijzigingen:['Eén uitklapbare navigatie op telefoons in plaats van botsende posities en losse knoppen.','Kaarten, afbeeldingen, taalkeuze, velden en instellingen passen op een smal scherm.','De twaalf onderdelen, bestaande handelingen en navigatievoorkeuren voor computers blijven behouden.'],fixes:['Navigatie schuift niet meer buiten beeld en knoppen overlappen elkaar niet.','Te brede inhoud, afgebroken teksten en ongecontroleerde afbeeldingen zijn aangepakt.'],beperkingen:['Afzonderlijke pagina’s buiten het accountcentrum vragen een eigen controle.','Controleer de nieuwe vorm eerst op een telefoon met de keuze «Alleen ik».'],instructies:'Installeer het archief via admin.tarasevych.com met een passkey. Controleer eerst de nieuwe vorm voor jezelf.'};
          const m={schema:1,versie:e.VERSIE,aangemaakt:new Date().toISOString(),herkomst:`git: commit ${e.GITHUB_SHA} (basis ${e.BASIS_VERSIE} ${e.BASIS_COMMIT})`,auteur:'Павло Тарасевич (tarasevych.pavlo@gmail.com)',zonderAi:false,deelnemers:[{soort:'mens',naam:'Павло Тарасевич (tarasevych.pavlo@gmail.com)',rollen:['auteur']},{soort:'ai',naam:'codex',platform:'ChatGPT',tool:'Codex',model:{id:'gpt-6',versie:null,bron:'omgeving'},rollen:['ontwikkeling','controle','testen','verpakken']}],beschrijving:{uk,nl}};
          writeFileSync(e.RUNNER_TEMP+'/UITROL-MANIFEST.json',JSON.stringify(m,null,2)+'\n');
          const tests={geslaagd:27,mislukt:0,falend:[],uitleg:{uk:'Усі 27 перевірок оформлення, складання, перевірки типів і браузерні перевірки розмірів екрана пройдено в цьому запуску.',nl:'Alle 27 vormgevingstests, de bouw, de typecontroles en de browserproeven voor schermbreedtes zijn in deze uitvoering geslaagd.'}};
          writeFileSync(e.RUNNER_TEMP+'/TESTRESULTATEN.json',JSON.stringify(tests,null,2)+'\n');
          writeFileSync('orchestratie/geinstalleerd.json',JSON.stringify({versie:e.BASIS_VERSIE,bronCommit:e.BASIS_COMMIT,bron:'geverifieerd_productie_api'},null,2)+'\n');
          JS
      - name: Архів та перевірка пакета
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs pakket --taak "$TAAK" --auteur 'Павло Тарасевич (tarasevych.pavlo@gmail.com)' \
            --agent codex --platform ChatGPT --tool Codex --model-id gpt-6 --model-bron omgeving \
            --versie "$VERSIE" --uit uitvoer --manifest "$RUNNER_TEMP/UITROL-MANIFEST.json" \
            --testresultaten "$RUNNER_TEMP/TESTRESULTATEN.json"
          node scripts/orch.mjs pakket-controleer --bron "uitvoer/mijn-ruimte-${VERSIE}-codex-overdracht.zip"
          sha256sum "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" > "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256"
          printf 'MOBIEL-001 · Перевірена пропозиція. Встановлення лише власником через ключ доступу.\nBRON-COMMIT: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/opis.md"
      - name: Повторна перевірка чинного сервера
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://hub.tarasevych.com/api/version' > "$RUNNER_TEMP/actuele-versie.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/actuele-versie.json','utf8'));
          if(d.versie!==process.env.BASIS_VERSIE||(d.bronCommit||d.commit)!==process.env.BASIS_COMMIT)throw Error('Встановлена основа змінилася; оприлюднення зупинено.');
          JS
      - name: Оприлюднити архів без встановлення
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSIE" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz" \
            "uitvoer/mijn-ruimte-${VERSIE}.tar.gz.sha256" \
            "uitvoer/mijn-ruimte-${VERSIE}-codex-overdracht.zip" \
            --target "$GITHUB_SHA" --title "MOBIEL-001 · ${VERSIE}" \
            --notes-file "$RUNNER_TEMP/opis.md" --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSIE" > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const e=process.env;
          const p=`uitvoer/mijn-ruimte-${e.VERSIE}.tar.gz`;
          const hash=createHash('sha256').update(readFileSync(p)).digest('hex');
          const r=JSON.parse(readFileSync(e.RUNNER_TEMP+'/release.json','utf8'));
          const a=r.assets.find(x=>x.name===`mijn-ruimte-${e.VERSIE}.tar.gz`);
          if(r.draft||!a||a.state!=='uploaded'||a.digest!==`sha256:${hash}`)throw Error('Оприлюднений архів не збігається за контрольною сумою.');
          JS
      - name: У разі збою приховати непридатний випуск
        if: failure() && steps.release.outcome == 'success'
        run: gh release edit "$VERSIE" --draft=true --notes 'Перевірка випуску не завершилася. Не встановлювати.'
      - name: Зберегти звіт виконання
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobiel-001-controle
          path: |
            rapporten/identiteit-mobiel/
            uitvoer/
          if-no-files-found: ignore
