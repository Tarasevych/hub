            tests/eenheid/cloud-m9-directory.test.mjs \
            tests/eenheid/cloud-m9-upload.test.mjs \
            tests/eenheid/cloud-migratie-volgorde.test.mjs \
            tests/eenheid/cloud-overdracht-m2.test.mjs \
            tests/eenheid/cloud-overdracht-m3.test.mjs \
            tests/eenheid/cloud-verbinding-m4.test.mjs \
            tests/eenheid/cloud-versies-m3.test.mjs; do
            printf '=== FILE: %s ===\n' "$f" >> "$RUNNER_TEMP/eenheidstests.log"
            node --test "$f" 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
          done
          for t in \
            aanmeld-ui-20261030 \
            aanmelden-integ-20261103 \
            accent-001-tint-transparantie \
            account-wissen-20261026 \
            accountmenu-strook-20261115 \
            accountmenu-v2-20261029 \
