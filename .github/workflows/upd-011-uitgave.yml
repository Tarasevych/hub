name: 'UPD-011 · Картки Telegram із фото ініціатора, 1-екранні вікна, персональні ключі 3F, вибіркове відкликання та правила 1.4.18'

# Ніколи не встановлює пакунок на сервер автоматично. Перед оприлюдненням звіряє живу встановлену основу на сервері
# (20261119-184102 @ 68c90588, 20261119-170438 @ 5ad4afb1 або 20261119-143136 @ 4a279ae4),
# правила координації, типи клієнта й сервера, статичні контракти, TRACE-001, 20 хмарних тестів, 155 безбазових і 13 післяскладальних випробувань,
# подвійний прогін усіх міграцій (включно з 0304_uitrol_3f_sleutels_en_terugdraai.sql) на PostgreSQL 16 із трьома ролями та 120 випробувань із базою даних і Хроміумом,
# повне складання, автоматично підписаний CRX3 0.9.7, маніфест встановлювача та контрольну суму SHA-256.
# Installeert nooit automatisch. Controleert vooraf de geïnstalleerde basis, coördinatieregels, client- en servertypen, statische contracten, TRACE-001,
# cloud-tests, eenheidstests vóór en na de bouw, dubbele migraties (incl. 0304) en databasetests met drie rollen en Chromium tegen PostgreSQL 16,
# volledige bouw, ondertekende CRX3 0.9.7, manifest en SHA-256.
on:
  push:
    branches:
      - feature/upd-011-telegram-3f-terugdraai-20261120-074000
    paths:
      - .github/workflows/upd-011-uitgave.yml
      - orchestratie/ontwikkelarchieven/UPD-011.json
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Ідентифікатор моделі ШІ (необов’язково)'
        required: false
        type: string
      model_versie:
        description: 'Версія моделі (необов’язково)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upd-011-uitgave
  cancel-in-progress: false

env:
  TAAK: UPD-011
  # Жива встановлена основа на сервері — UPD-009 (20261119-184102 @ 68c90588203d792cf25431d6849a57c2732dfecc);
  # також підтримуються предки UPD-008 (20261119-170438 @ 5ad4afb1e7f4a286333d7283539220be141f5704) та UPD-007 (20261119-143136 @ 4a279ae445d5f7f7d77627854b833c1c7fde5c68).
  BEKENDE_BASISSEN: '20261119-170438=5ad4afb1e7f4a286333d7283539220be141f5704 20261119-184102=68c90588203d792cf25431d6849a57c2732dfecc 20261120-003537=9e610a43fab5e10bbf4ff0b379d325896b7487dd'
  INTEGRATIE_BASIS: 'b6b963646a27946288036c246f06c953697dcfed'
  MODEL_ID: ${{ inputs.model_id || vars.UPD_011_MODEL_ID || 'Gemini 3.1 Pro (Google Antigravity)' }}
  MODEL_VERSIE: ${{ inputs.model_versie || '' }}

jobs:
  controle-en-uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Отримати вихідні коди сховища
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Дозволити запуск лише з гілки завдання · alleen vanaf de taaktak
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/upd-011-telegram-3f-terugdraai-20261120-074000" ]; then
            echo "Випуск UPD-011 можна запускати лише з гілки feature/upd-011-telegram-3f-terugdraai-20261120-074000." >&2
            exit 1
          fi
      - name: Відновити назву гілки завдання
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Підготувати середовище Node.js і перевірити системні інструменти
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Перевірити наявність обов’язкових інструментів середовища та встановити залежності
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts
      - name: Звірити живу встановлену основу на сервері
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          for poging in 1 2 3 4; do
            HTTP_CODE="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/versie.json" -w '%{http_code}' 'https://hub.tarasevych.com/api/version' || echo '000')"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
          HTTP_CODE="$HTTP_CODE" node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const bekendLijst = process.env.BEKENDE_BASISSEN.trim().split(/\s+/).map((p) => p.split('='));
          const bekend = new Map(bekendLijst);
          const code = process.env.HTTP_CODE || '000';
          let versie = '';
          let levend = '';
          if (code === '200') {
            const v = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/versie.json', 'utf8'));
            versie = v.versie;
            levend = v.bronCommit || v.commit;
            if (bekend.get(versie) !== levend) {
              throw Error(`Встановлена версія (${versie} @ ${levend}) не входить до відомих основ цієї гілки. Випуск зупинено для нового узгодження.`);
            }
            console.log(`Жива основа випуску з сервера: ${versie} @ ${levend}`);
          } else if (code === '530' || code === '502' || code === '504' || code === '000') {
            [versie, levend] = bekendLijst[bekendLijst.length - 1];
            console.log(`Тунель тимчасово недоступний (HTTP ${code}); використано попередньо звірену основу ${versie} @ ${levend}`);
          } else {
            throw Error(`Неочікувана відповідь під час перевірки основи сервера: HTTP ${code}`);
          }
          const gi = JSON.parse(readFileSync('orchestratie/geinstalleerd.json', 'utf8'));
          if (gi.versie !== versie || gi.bronCommit !== levend) {
            writeFileSync('orchestratie/geinstalleerd.json', JSON.stringify({ versie, bronCommit: levend, bron: 'geverifieerd_productie_api' }, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_ENV, 'GI_AANGEPAST=1\n');
            console.log(`orchestratie/geinstalleerd.json узгоджено з живою основою ${versie} @ ${levend}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `BASIS_VERSIE=${versie}\nBASIS_COMMIT=${levend}\n`);
          JS
          BASIS_COMMIT="$(grep '^BASIS_COMMIT=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2)"
          git merge-base --is-ancestor "$BASIS_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATIE_BASIS" HEAD
          if grep -q '^GI_AANGEPAST=1' "$GITHUB_ENV"; then git update-index --skip-worktree orchestratie/geinstalleerd.json; fi
      - name: Перевірити правила координації та журнал походження TRACE-001
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          node scripts/orch.mjs controleer
          node scripts/orch.mjs versheid --taak "$TAAK" --fase overdracht
          node scripts/orch.mjs behoud --tegen 9e610a43fab5e10bbf4ff0b379d325896b7487dd
          node scripts/vaardigheden/valideer.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import { leesRisicoUitleg, valideerOntwikkelDossier } from './shared/ontwikkelarchief.ts';
            const d = JSON.parse(fs.readFileSync('orchestratie/ontwikkelarchieven/UPD-011.json', 'utf8'));
            const f = valideerOntwikkelDossier(d, 'UPD-011');
            if (f.length) throw Error(f.join(', '));
            const r = leesRisicoUitleg(d);
            if (r.fouten.length) throw Error(r.fouten.join(', '));
            if (d.privacy?.geheimenUitgesloten !== true) throw Error('privacy.geheimenUitgesloten ≠ true');
            console.log('Журнал UPD-011 валідний; пояснень ризику:', r.uitleg.length);"
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"
      - name: Перевірити статичні правила, самоперевірку ПК-агента, 20 хмарних тестів і 155 безбазових модульних випробувань
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node deploy/agent/agent.mjs selftest --root /tmp
          for f in \
            tests/eenheid/cloud-delen-m3.test.mjs \
            tests/eenheid/cloud-m10-integration-safety.test.mjs \
            tests/eenheid/cloud-m11-voorbeeld.test.mjs \
            tests/eenheid/cloud-m3-gate.test.mjs \
            tests/eenheid/cloud-m5-aanbieder-golf.test.mjs \
            tests/eenheid/cloud-m6-beleid-bewaker.test.mjs \
            tests/eenheid/cloud-m6-bestuur.test.mjs \
            tests/eenheid/cloud-m7-beleid.test.mjs \
            tests/eenheid/cloud-m7-crypto.test.mjs \
