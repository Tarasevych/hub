          done
      - name: Перевірити типи, скласти застосунок і перевірити 13 післяскладальних випробувань
        shell: bash
        run: |
          set -euo pipefail
          unset BASIS_VERSIE BASIS_COMMIT
          npx tsc --noEmit
          npm run typecheck:server
          NODE_OPTIONS=--max-old-space-size=2560 npm run build
          test -s dist/index.html
          test -s dist/huis-maquette/index.html
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const ev = JSON.parse(readFileSync("dist/downloads/extension-version.json", "utf8"));
            if (ev.version !== "0.9.7") throw Error("Очікувалася версія розширення 0.9.7, отримано: " + ev.version);
            if (!ev.crx || !ev.crx.sha256 || ev.crxStatus !== "actueel") throw Error("Відсутній або неактуальний підписаний CRX3 у dist/downloads/extension-version.json");
            console.log("extension-version.json:", ev.version, "CRX:", ev.crx.extensionId, ev.crx.sha256.slice(0, 12));'
          export DIST_DIR="$PWD/dist"
          for t in \
            bestandskaart-20261024 \
            browser-extensie \
            extensie-debugger-markering-20261019 \
