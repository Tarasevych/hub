      - name: 'Перевірити відсутність несподіваних пропусків і чистоту робочого дерева · Afwezigheid van onverwachte overslagen en schone werkboom'
        shell: bash
        run: |
          set -euo pipefail
          ONVERWACHT="$(grep -nE '^OVERGESLAGEN\b|\bOVERGESLAGEN\b.*:|overgeslagen:' "$RUNNER_TEMP/eenheidstests.log" | grep -vE 'OVERGESLAGEN afstemming-kern:|root-script-proef overgeslagen: PROEF_PG_URL niet gezet|werkblad-v3-routes|9 build-controle|\[pakketgegevens\] ongeldige UITROL_GEB_EXTRA-json overgeslagen:' || true)"
          if [ -n "$ONVERWACHT" ]; then
            echo "Виявлено несподівані пропуски у випробуваннях:" >&2
            printf '%s\n' "$ONVERWACHT" >&2
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
