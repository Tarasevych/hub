name: 'Інтеграційна перевірка та зведена звірка · Integratie- en consolidatiecontrole'

# Універсальний перевірковий конвеєр для гілки integratie та гілок зведеного оновлення.
# Ніколи не оприлюднює випусків і не має прав запису: перевіряє правила координації, навички, Абсолютний мовний закон,
# типи клієнта й сервера, усі 14 сторожів повного складання, 12 стендів «Плюща», 20 хмарних випробувань, безбазові,
# післяскладальні та базові випробування на PostgreSQL 16 із трьома ролями й подвійним прогоном міграцій.
# Universele controlewerkstroom voor integratie en consolidatietakken (uitsluitend leesrechten, zonder automatische uitgave).

on:
  push:
    branches:
      - integratie
      - 'feature/consolidatie-*'
      - 'functie/consolidatie-*'
  pull_request:
    branches:
      - integratie
      - 'feature/consolidatie-*'
      - 'functie/consolidatie-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integratie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integratie-controle:
    name: 'Повна перевірка правил, типів, складання, стендів «Плюща» та випробувань із PostgreSQL 16 · Volledige integratiecontrole'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migratie
          POSTGRES_PASSWORD: migratie
          POSTGRES_DB: mijnruimte_schoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migratie -d mijnruimte_schoon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: 'Отримати вихідні коди сховища · Broncode ophalen'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Підготувати середовище Node.js 24 · Node.js 24 inrichten'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: 'Перевірити системні засоби та встановити залежності без сценаріїв · Hulpmiddelen en pakketten zonder scripts'
        shell: bash
        run: |
          set -euo pipefail
          for cmd in python3 ssh-keygen zip unzip flock psql openssl; do
            command -v "$cmd" >/dev/null || { echo "Відсутній обов’язковий інструмент: $cmd" >&2; exit 1; }
          done
          npm ci --ignore-scripts

      - name: 'Перевірити правила координації, навички, базу сповіщень та Абсолютний мовний закон · Regels, vaardigheden, meldingsregister en taalwet'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orch.mjs controleer
          node scripts/vaardigheden/valideer.mjs
          node scripts/meldingen-register-controle.mjs
          if git rev-parse --verify origin/integratie >/dev/null 2>&1; then
            TAAL_BASIS="$(git merge-base origin/integratie HEAD)"
            VERBODEN_REGELS="$(git diff -I -U0 "$TAAL_BASIS"..HEAD -- . ':!tests/' | grep -E '^\+[^+]' | grep -P '[\x{0401}\x{0451}\x{042A}\x{044A}\x{042B}\x{044B}\x{042D}\x{044D}]' || true)"
            if [ -n "$VERBODEN_REGELS" ]; then
              echo "Виявлено заборонені позаабеткові кириличні літери в доданих рядках:" >&2
              printf '%s\n' "$VERBODEN_REGELS" >&2
              exit 1
            fi
          fi
          printf '=== FILE: trace-001-ontwikkelarchief.test.ts ===\n' >> "$RUNNER_TEMP/eenheidstests.log"
          node scripts/eenheidstests.mjs trace-001-ontwikkelarchief.test.ts 2>&1 | tee -a "$RUNNER_TEMP/eenheidstests.log"

      - name: 'Перевірити статичні сторожі, 12 стендів «Плюща», 20 хмарних та безбазові модульні випробування · Statische bewakers, Klimop-proeven en eenheidstests zonder databank'
        shell: bash
        run: |
          set -euo pipefail
          find deploy -name '*.sh' -exec bash -n {} +
          node scripts/kaart-controle.mjs --stil
          node scripts/plaatsing-controle.mjs --stil
          node scripts/l002-audit.mjs
          node scripts/hulp-vraagtekens-controle.mjs --stil
          node scripts/kleur-contrast-controle.mjs --stil
          node scripts/mail-slimme-inbox-audit.mjs
          node scripts/keten-controle.mjs --zonder-audit
          node scripts/zoek-ui-catalogus.mjs --controle
          node scripts/klant-servergrens-controle.mjs --stil
          node deploy/agent/agent.mjs selftest --root /tmp
          for s in \
            scripts/klimop-etappe0-audit.mjs \
            scripts/klimop-proefnetwerk.mjs \
            scripts/klimop-etappe3-opslag-proef.mjs \
            scripts/klimop-etappe4-frost-proef.mjs \
            scripts/klimop-etappe5-identiteit-proef.mjs \
            scripts/klimop-etappe6-bestuur-proef.mjs \
            scripts/klimop-etappe7-immuunsysteem-proef.mjs \
            scripts/klimop-etappe8-diensten-proef.mjs \
            scripts/klimop-etappe9-mensbescherming-proef.mjs \
            scripts/klimop-etappe10-hechtranken-proef.mjs \
            scripts/klimop-etappe11-beveiligingsaudit-proef.mjs \
            scripts/klimop-etappe12-zaden-proef.mjs; do
            node "$s" >/dev/null
          done
          for f in \
            tests/eenheid/cloud-delen-m3.test.mjs \
            tests/eenheid/cloud-m10-integration-safety.test.mjs \
            tests/eenheid/cloud-m11-voorbeeld.test.mjs \
            tests/eenheid/cloud-m3-gate.test.mjs \
            tests/eenheid/cloud-m5-aanbieder-golf.test.mjs \
            tests/eenheid/cloud-m6-beleid-bewaker.test.mjs \
            tests/eenheid/cloud-m6-bestuur.test.mjs \
            tests/eenheid/cloud-m7-beleid.test.mjs \
            tests/eenheid/cloud-m7-crypto.test.mjs \
            tests/eenheid/cloud-m7-transfer.test.mjs \
            tests/eenheid/cloud-m8-verenigd.test.mjs \
