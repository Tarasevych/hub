<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MAILFIX-001 · Повна сторінка Поштові акаунти</title>
  <style>
    /* html:root (0,1,1) i.p.v. :root: de .tsx laadt src/ontwerp/tokens.css, dat later komt; deze paginawaarden winnen. */
    html:root{color-scheme:light;--panel:#fff;--papier:#fff;--surface:#f8fafb;--surface2:#f1f5f6;--text:#16343a;--muted:#60767c;--line:#dce7e7;--accent:#08736e;--text-on-accent:#fff;--shadow:#183d3e;--focus:#0a827a;--ruimte-2:8px;--ruimte-3:12px;--ruimte-4:16px;--ruimte-5:24px;--tik-hoogte:44px;--straal-m:12px;--straal-l:14px;--schaduw-2:0 7px 23px #153d3d20}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:#f5f7f8}
    .mailfix-shell{max-width:1100px;margin:auto;padding:0 14px 25px}
    .mailfix-head{display:flex;align-items:center;gap:12px;padding:15px 2px 20px;color:var(--accent);font-size:14px;font-weight:750}
    .mailfix-head span{font-size:11px;color:var(--muted);font-weight:550}
    @media(max-width:620px){.mailfix-shell{padding:0 10px 25px}.mailfix-head{padding:12px 3px 14px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Identieke canonical runtime als in de echte hoofdpagina, vóór de React-imports. -->
  <script src="/canonical-service.js"></script>
  <script type="module" src="/tests/visueel/mailfix-voorbeeld.tsx"></script>
</body>
</html>
